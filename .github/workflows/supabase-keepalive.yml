name: Supabase keep-alive

# Supabase pauses free projects after a week without activity. One small
# read a day keeps it awake. If the project is paused anyway, this
# workflow fails and GitHub tells you by e-mail.
on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch:       # "Run workflow" button, to test by hand

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Read one row of the items table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Without secrets, take the URL and anon key from config.js: they
          # are already there, public by design.
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL=$(sed -n "s/.*SUPABASE_URL: *'\([^']*\)'.*/\1/p" config.js | head -n 1)
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            SUPABASE_ANON_KEY=$(sed -n "s/.*SUPABASE_ANON_KEY: *'\([^']*\)'.*/\1/p" config.js | head -n 1)
          fi
          # config.js not filled in yet (a fresh fork): nothing to keep awake.
          case "$SUPABASE_URL" in
            ''|*YOUR-PROJECT*)
              echo "config.js is not filled in yet: skipping."
              exit 0 ;;
          esac
          # Same tolerance as the site: URL pasted with /rest/v1 or a trailing /.
          SUPABASE_URL=${SUPABASE_URL%/}
          SUPABASE_URL=${SUPABASE_URL%/rest/v1}

          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 \
            "$SUPABASE_URL/rest/v1/items?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
          echo "Supabase answered: the project stays active."
