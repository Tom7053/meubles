<!-- Windows ne sait pas dessiner les drapeaux en emoji (il écrit « DK » à la
     place) : on lui prête alors ceux de Twemoji, utilisés seulement pour les
     drapeaux. iPhone, Android et Mac gardent leurs propres drapeaux. -->
<script>
  (function () {
    try {
      var c = document.createElement('canvas');
      c.width = c.height = 1;
      var ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.textBaseline = 'top';
      ctx.font = '100px "Twemoji Mozilla","Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif';
      ctx.scale(0.01, 0.01);
      // Un emoji en couleur garde ses couleurs quelle que soit l'encre ;
      // des lettres de remplacement, elles, prennent la couleur de l'encre.
      var colour = function (text) {
        var pixel = function (ink) {
          ctx.clearRect(0, 0, 100, 100);
          ctx.fillStyle = ink;
          ctx.fillText(text, 0, 0);
          return ctx.getImageData(0, 0, 1, 1).data.join(',');
        };
        var black = pixel('#000');
        return black === pixel('#fff') && black.indexOf('0,0,0,') !== 0;
      };
      if (colour('😊') && !colour('🇩🇰')) {
        var style = document.createElement('style');
        style.textContent = '@font-face { font-family: "Twemoji Country Flags";' +
          ' unicode-range: U+1F1E6-1F1FF; font-display: swap;' +
          ' src: url("https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1.8/dist/TwemojiCountryFlags.woff2") format("woff2"); }';
        document.head.appendChild(style);
      }
    } catch (e) { /* pas de canvas : tant pis pour les drapeaux */ }
  })();
</script>

<body class="bg-white text-slate-900">

<script type="text/babel" data-presets="react">
/* =====================================================================
   Vente de meubles — application complète (React sans build)
   Boutique et espace vendeur en anglais ou en français (onglet Réglages),
   données sur Supabase.
   ===================================================================== */

const { useState, useEffect, useLayoutEffect, useRef, useCallback, useContext, createContext } = React;

/* ------------------------------ langues ----------------------------- */
// La boutique et l'espace vendeur ont chacun leur langue, anglais ou
// français, choisie dans l'onglet Réglages (colonnes shop_lang et
// admin_lang de settings, migration-langue.sql). Chaque texte est écrit
// sur place dans les deux langues, l'anglais d'abord :
//   t('Book a viewing', 'Réserver une visite')
// Un composant parle la langue de son côté du site (LangContext) ;
// ShopLangContext donne en plus à l'espace vendeur la langue des acheteurs,
// celle des titres, des descriptions et de l'affiche.
const LANGS = ['en', 'fr'];
const cleanLang = (value, fallback) => (LANGS.includes(value) ? value : fallback);

function makeT(lang) {
  const t = (en, fr) => (lang === 'fr' ? fr : en);
  t.lang = lang;
  t.locale = lang === 'fr' ? 'fr-FR' : 'en-GB';
  return t;
}

const LangContext = createContext('en');
const ShopLangContext = createContext('en');
const useT = () => makeT(useContext(LangContext));
const useShopLang = () => useContext(ShopLangContext);

// La langue de l'espace vendeur est aussi gardée dans ce navigateur :
// l'écran de connexion la connaît avant que les réglages arrivent, et le
// choix marche même avant migration-langue.sql.
const ADMIN_LANG_KEY = 'meubles-langue-vendeur';

const configured =
  window.CONFIG.SUPABASE_URL.indexOf('TON-PROJET') === -1 &&
  window.CONFIG.SUPABASE_ANON_KEY.indexOf('COLLE-ICI') === -1;

// On accepte aussi l'URL copiée avec /rest/v1 au bout : la bibliothèque
// ajoute les chemins toute seule et n'accepte que la racine du projet.
const SUPABASE_URL = window.CONFIG.SUPABASE_URL
  .trim()
  .replace(/\/(rest|auth|storage|realtime)\/v1\/?$/, '')
  .replace(/\/+$/, '');

// Le lien « mot de passe oublié » reçu par e-mail revient sur cette page avec
// #access_token=…&type=recovery (ou #error=… s'il a expiré). On le lit avant
// que Supabase ne nettoie l'adresse.
const START_HASH = new URLSearchParams(window.location.hash.replace(/^#/, ''));
const FROM_RESET_LINK = START_HASH.get('type') === 'recovery';
const RESET_LINK_FAILED = !!START_HASH.get('error_description');
// …/meubles/#vendeur ouvre directement l'espace vendeur (à mettre en favori).
const START_IN_ADMIN = FROM_RESET_LINK || RESET_LINK_FAILED || /^#(vendeur|admin)$/.test(window.location.hash);
// Là où le lien de réinitialisation doit ramener : cette page-ci.
const SITE_URL = window.location.origin + window.location.pathname;

const sb = configured
  ? window.supabase.createClient(SUPABASE_URL, window.CONFIG.SUPABASE_ANON_KEY.trim())
  : null;

console.log('[meubles] fichier unique — Supabase :', SUPABASE_URL);

const DAYS = {
  en: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'],
  fr: ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'],
};
const LINK_PRESETS = ['Facebook Marketplace', 'DBA', 'Leboncoin', 'Vinted'];
const FALLBACK_SLOTS = ['09:00', '10:00', '11:00', '12:00', '14:00', '15:00', '16:00', '17:00', '18:00'];

const DEFAULT_SETTINGS = {
  id: 1,
  address: 'Alfavej 510, 13',
  payment: 'Revolut or cash',
  weekdays: [true, true, true, true, true, true, false],
  slots: FALLBACK_SLOTS,
  blocked: [],
};

/* ---------------------------- objectif ----------------------------- */
// Somme que la vente doit rapporter, en couronnes.
const SALES_GOAL = 3000;

// Les prix sont saisis librement (« 450 kr », « 1.200 », « 1 200,50 »).
// On en extrait un nombre pour pouvoir les additionner.
function priceValue(raw) {
  if (!raw) return 0;
  const cleaned = String(raw)
    .replace(/[^\d.,]/g, '')
    .replace(/[.,](?=\d{3}(\D|$))/g, '')
    .replace(',', '.');
  const n = parseFloat(cleaned);
  return isFinite(n) ? n : 0;
}

const fmtKr = (n) => `${Math.round(n).toLocaleString('da-DK')} kr`;

// Un prix s'affiche toujours suivi de « kr », qu'on l'ait tapé avec ou
// sans : « 450 », « 450kr » et « 450 DKK » donnent tous « 450 kr ».
function withKr(raw) {
  const p = String(raw || '').trim()
    .replace(/^(kr\.?|dkk)\s*/i, '')
    .replace(/\s*(kr\.?|dkk|kroner|,-)$/i, '')
    .trim();
  if (!p) return '';
  return /\d/.test(p) ? `${p} kr` : p;
}

// Le prix vu par les acheteurs : sans prix, c'est gratuit.
const showPrice = (raw, lang) => withKr(raw) || (lang === 'fr' ? 'Gratuit' : 'Free');

/* ------------------------- plusieurs exemplaires -------------------- */
// Un meuble peut exister en plusieurs exemplaires identiques (2 lits) :
// `quantity` est le nombre mis en vente, `sold_qty` combien sont partis.
// Un meuble passé « vendu » d'un coup compte comme entièrement vendu.
// Avant migration-quantite.sql les colonnes n'existent pas : 1 exemplaire.
const totalQty = (item) => Math.max(1, parseInt(item.quantity, 10) || 1);
const soldQty = (item) =>
  item.status === 'sold' ? totalQty(item) : Math.min(totalQty(item), parseInt(item.sold_qty, 10) || 0);
const leftQty = (item) => totalQty(item) - soldQty(item);

// Prix réellement obtenus, un par exemplaire vendu, dans l'ordre des ventes
// (colonne sale_prices, migration-prix-vente.sql).
const salePrices = (item) =>
  (Array.isArray(item.sale_prices) ? item.sale_prices : []).slice(0, soldQty(item)).map(Number);
// Ce que le meuble a rapporté : les prix notés, et le prix affiché pour les
// exemplaires vendus sans prix noté (avant la mise à jour).
const soldAmount = (item) => {
  const noted = salePrices(item);
  return noted.reduce((a, b) => a + b, 0) + (soldQty(item) - noted.length) * priceValue(item.price);
};

// Prix pour `count` exemplaires : « 900 kr », ou le prix tel quel s'il
// n'y a pas de nombre dedans (gratuit…).
const priceFor = (raw, count, lang) =>
  count > 1 && priceValue(raw) > 0 ? fmtKr(priceValue(raw) * count) : showPrice(raw, lang);

/* --------------------------- meubles réservés ----------------------- */
// Un rendez-vous retient le meuble (ou les exemplaires demandés) : il quitte
// la boutique jusqu'à ce que le vendeur note « vendu » ou « invendu ».
// Avant migration-reservation.sql la colonne outcome n'existe pas : rien
// n'est retenu.
const isPending = (b) => 'outcome' in b && b.status !== 'declined' && !b.outcome;

// Exemplaires promis à quelqu'un qui a pris rendez-vous ailleurs
// (Marketplace, DBA…), notés « réservé » par le vendeur : ils quittent la
// boutique jusqu'à « Vendu » ou « Annuler la réservation ». Colonne
// reserved_qty, migration-lots.sql ; avant, rien n'est réservé.
const reservedQty = (item) => Math.min(leftQty(item), Math.max(0, parseInt(item.reserved_qty, 10) || 0));

// Exemplaires retenus, par meuble. Les acheteurs ne lisent pas les
// rendez-vous : la vue booked_items ne leur donne que ces totaux.
async function fetchHeld() {
  const { data, error } = await sb.from('booked_items').select('item_id, qty');
  return error || !data ? {} : Object.fromEntries(data.map((r) => [r.item_id, r.qty]));
}

// Les lots, ou null tant que migration-lots.sql n'a pas été lancé.
async function fetchBundles() {
  const { data, error } = await sb.from('bundles').select('*').order('created_at', { ascending: false });
  return error ? null : data || [];
}

/* ------------------------------- panier ----------------------------- */
// L'acheteur met plusieurs meubles de côté, puis prend UN rendez-vous pour
// tous ou me laisse son numéro à leur sujet. Le panier reste dans ce
// navigateur et ne réserve rien : [{ id, count }].
const CART_KEY = 'meubles-panier';

function loadCart() {
  try {
    const saved = JSON.parse(localStorage.getItem(CART_KEY));
    if (!Array.isArray(saved)) return [];
    return saved.filter((e) => e && e.id != null)
      .map((e) => ({ id: e.id, count: Math.max(1, parseInt(e.count, 10) || 1) }));
  } catch { return []; }
}

function saveCart(cart) {
  try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch { /* navigation privée */ }
}

// Prix de plusieurs meubles ensemble : « 1.250 kr », ou « Free ».
const linesTotal = (lines) => lines.reduce((sum, l) => sum + priceValue(l.item.price) * l.count, 0);
const showTotal = (lines, lang) => (linesTotal(lines) > 0 ? fmtKr(linesTotal(lines)) : showPrice('', lang));
const countAll = (lines) => lines.reduce((sum, l) => sum + l.count, 0);

// Relie les lignes d'un même rendez-vous (bookings.cart_id, migration-panier.sql).
function newCartId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(b);
  else b.forEach((_, i) => { b[i] = Math.floor(Math.random() * 256); });
  b[6] = (b[6] & 15) | 64;
  b[8] = (b[8] & 63) | 128;
  const h = Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

/* -------------------------------- lots ------------------------------ */
// Plusieurs meubles déjà en vente, vendus ensemble avec une remise (table
// bundles, migration-lots.sql) : { id, title, items: [{ id, count }],
// discount } où discount est en %. Les meubles restent aussi en vente un
// par un ; le lot quitte la boutique dès que l'un d'eux n'est plus libre.
const MAX_DISCOUNT = 90;
const bundleEntries = (bundle) => (Array.isArray(bundle && bundle.items) ? bundle.items : [])
  .filter((e) => e && e.id != null)
  .map((e) => ({ id: e.id, count: Math.max(1, parseInt(e.count, 10) || 1) }));
const cleanDiscount = (raw) => Math.max(0, Math.min(MAX_DISCOUNT, parseInt(raw, 10) || 0));
// Un montant après remise, sans arrondi : les ventes notées gardent le
// prix exact, l'affichage arrondit à la couronne.
const afterDiscount = (amount, pct) => (amount * (100 - cleanDiscount(pct))) / 100;
// Prix d'un lot : ce que coûteraient ses meubles un par un, et le prix du lot.
const bundlePrices = (lines, pct) => {
  const full = linesTotal(lines);
  const price = Math.round(afterDiscount(full, pct));
  return { full, price, saved: Math.round(full) - price };
};
// Le titre proposé : « Lit + Matelas », « 4 × Chaise ».
const autoBundleTitle = (lines) =>
  lines.map((l) => `${l.count > 1 ? `${l.count} × ` : ''}${l.item.title}`).join(' + ');

/* ---------------------------- fin de vente -------------------------- */
// Dernier jour où l'on peut prendre rendez-vous. Après, tout est parti :
// les calendriers s'arrêtent là et on ne peut pas aller au mois suivant.
const LAST_DAY = '2026-11-30';
const LAST_MONTH = LAST_DAY.slice(0, 7); // '2026-11'

/* ---------------------------- paiement ------------------------------ */
// Choix obligatoire à la réservation : l'acheteur annonce comment il paiera.
// `id` est ce qui part en base, `en` et `fr` s'affichent selon la langue
// de l'écran. L'affiche a sa propre liste (posterPayDefault).
// Un moyen `retired` n'est plus proposé mais reste lisible sur les anciens
// rendez-vous. Tout nouvel `id` doit aussi être accepté par la base
// (migration-paiement.sql).
const PAYMENT_METHODS = [
  { id: 'revolut', en: 'Revolut instant transfer', fr: 'Virement instantané Revolut' },
  { id: 'cash', en: 'Cash', fr: 'Espèces' },
  { id: 'mobilepay', en: 'MobilePay', fr: 'MobilePay', retired: true },
];
const paymentLabel = (id, lang) => {

/* ------------------------------ dates ------------------------------ */
const pad = (n) => String(n).padStart(2, '0');
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => toKey(new Date());
// '2026-11' pour l'année/mois affichés par un calendrier
const cursorKey = ({ y, m }) => `${y}-${pad(m + 1)}`;

function keyToDate(key) {
  const [y, m, d] = String(key).slice(0, 10).split('-').map(Number);
  return new Date(y, m - 1, d);
}

function fmtDate(key, locale) {
  if (!key) return '';
  return keyToDate(key).toLocaleDateString(locale, {
    weekday: 'long', day: 'numeric', month: 'long',
  });
}

// 'Thu 23 Oct' par défaut, ou le morceau demandé ({ weekday: 'short' }…),
// en anglais ou dans la langue de `locale` (« jeu. 23 oct. »).
const fmtShort = (key, opts, locale) =>
  keyToDate(key).toLocaleDateString(locale || 'en-GB', opts || { weekday: 'short', day: 'numeric', month: 'short' });

function monthDays(year, month) {
  const offset = (new Date(year, month, 1).getDay() + 6) % 7; // lundi = 0
  const total = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= total; d++) cells.push(new Date(year, month, d));
  return cells;
}

/* ------------------------------ image ------------------------------ */
function resizeImage(file, max = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('image'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('file'));
    reader.readAsDataURL(file);
  });
}

// Photos en plus de la couverture (table item_photos, migration-photos.sql).
// Elles ne viennent pas avec la liste, trop lourdes pour un téléphone : on
// les charge à l'ouverture de la galerie, une fois par meuble.
const MAX_PHOTOS = 8;
const extraPhotoCache = new Map();

async function fetchExtraPhotos(itemId, fresh) {
  if (!fresh && extraPhotoCache.has(itemId)) return extraPhotoCache.get(itemId);
  const { data, error } = await sb.from('item_photos').select('photos').eq('item_id', itemId).maybeSingle();
  if (error) throw error;
  const photos = data && Array.isArray(data.photos) ? data.photos : [];
  extraPhotoCache.set(itemId, photos);
  return photos;

/* ------------------------ photos à télécharger ----------------------- */
// Pour reposter un meuble ailleurs (Marketplace, DBA…) : ses photos en
// fichiers, nommés d'après le titre (oak-desk-1.jpg, oak-desk-2.jpg…).
const fileSlug = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'meuble';

// Toutes les photos d'un meuble, la couverture d'abord, en fichiers.
async function itemPhotoFiles(item, manyPhotos, name = fileSlug(item.title)) {
  const extras = manyPhotos ? await fetchExtraPhotos(item.id, true) : [];
  const sources = [item.image, ...extras].filter(Boolean);
  return Promise.all(sources.map(async (src, i) => {
    const blob = await (await fetch(src)).blob();
    const ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
    return new File([blob], `${name}-${i + 1}.${ext}`, { type: blob.type || 'image/jpeg' });
  }));
}

// Un .zip sans compression : les photos sont déjà en JPEG, les recompresser
// ne gagnerait rien. Assez pour s'éviter une bibliothèque de plus.
// files : [{ path, file }], path peut contenir un dossier (« oak-desk/… »).
const CRC_TABLE = Array.from({ length: 256 }, (_, n) => {
  let c = n;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
  return c >>> 0;
});

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

async function makeZip(files) {
  const now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const local = [];
  const central = [];
  let offset = 0;
  for (const { path, file } of files) {
    const data = new Uint8Array(await file.arrayBuffer());
    const name = new TextEncoder().encode(path);
    const crc = crc32(data);
    // En-tête commun aux deux répertoires : version 2.0, noms en UTF-8,
    // pas de compression, date, CRC, tailles, longueur du nom.
    const fields = (view, at) => {
      view.setUint16(at, 20, true);
      view.setUint16(at + 2, 0x0800, true);
      view.setUint16(at + 4, 0, true);
      view.setUint16(at + 6, time, true);
      view.setUint16(at + 8, date, true);
      view.setUint32(at + 10, crc, true);
      view.setUint32(at + 14, data.length, true);
      view.setUint32(at + 18, data.length, true);
      view.setUint16(at + 22, name.length, true);
    };
    const head = new DataView(new ArrayBuffer(30));
    head.setUint32(0, 0x04034b50, true);
    fields(head, 4);
    local.push(head, name, data);
    const entry = new DataView(new ArrayBuffer(46));
    entry.setUint32(0, 0x02014b50, true);
    entry.setUint16(4, 20, true);
    fields(entry, 6);
    entry.setUint32(42, offset, true);
    central.push(entry, name);
    offset += 30 + name.length + data.length;
  }
  const size = central.reduce((n, part) => n + part.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, size, true);
  end.setUint32(16, offset, true);
  return new Blob([...local, ...central, end], { type: 'application/zip' });
}

function saveFile(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ---------------------------- statistiques -------------------------- */
// Compteur maison, sans cookie ni outil extérieur : la boutique ajoute une
// ligne dans la table visits (migration-stats.sql) pour chaque visite et
// chaque meuble regardé, une seule fois par session (onglet ouvert). Le
// vendeur et les essais en local ne comptent pas.
const STATS_KEY = 'meubles-stats';
// Posé sur un appareil où le vendeur s'est connecté une fois : ses
// visites de la boutique ne comptent plus, même déconnecté.
const SELLER_DEVICE_KEY = 'meubles-appareil-vendeur';
let tracker = null; // { session, sent } quand on compte, null sinon

function saveTracker() {
  try { sessionStorage.setItem(STATS_KEY, JSON.stringify(tracker)); } catch { /* navigation privée */ }
}

function track(kind, itemId, extra) {
  if (!tracker) return;
  const key = `${kind} ${itemId || ''}`;
  if (tracker.sent.includes(key)) return;
  tracker.sent.push(key);
  saveTracker();
  sb.from('visits')
    .insert({ kind, session: tracker.session, item_id: itemId || null, ...extra })
    // Table absente (migration-stats.sql pas lancé) : on arrête de compter.
    .then(({ error }) => { if (error) tracker = null; });
}

// Une visite. Le QR code de l'affiche mène à l'adresse nue du site : une
// arrivée sur téléphone, sans site d'origine et sans rien après l'adresse,
// compte comme un scan. C'est une estimation : taper l'adresse à la main
// sur son téléphone compte aussi.
function startStats() {
  if (!sb || location.protocol === 'file:' || /^(localhost|127\.|192\.168\.)/.test(location.hostname)) return;
  try { if (localStorage.getItem(SELLER_DEVICE_KEY)) return; } catch { /* navigation privée */ }
  try { tracker = JSON.parse(sessionStorage.getItem(STATS_KEY)); } catch { tracker = null; }
  if (!tracker) {
    const session = window.crypto && crypto.randomUUID ? crypto.randomUUID()
      : `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 12)}`;
    tracker = { session, sent: [] };
  }
  let source = null;
  try { source = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, '') : null; } catch { /* lien illisible */ }
  if (source === location.hostname) source = null;
  const mobile = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  track('visit', null, { source, mobile, qr: !source && mobile && !location.search && !location.hash });
}

// Le vendeur vient de se connecter : on arrête de compter, on efface ce
// qui est déjà parti pour cette session (visite, meubles regardés) et on
// note l'appareil pour ne plus jamais le compter.
function forgetSellerVisit() {
  try { localStorage.setItem(SELLER_DEVICE_KEY, '1'); } catch { /* navigation privée */ }
  let session = tracker && tracker.session;
  if (!session) {
    try { session = (JSON.parse(sessionStorage.getItem(STATS_KEY)) || {}).session; } catch { /* rien */ }
  }
  tracker = null;
  try { sessionStorage.removeItem(STATS_KEY); } catch { /* navigation privée */ }
  if (session) sb.from('visits').delete().eq('session', session).then(() => {});
}

// Autres noms sous lesquels on cherche un pays dans la liste.
const COUNTRY_ALIASES = {
  GB: 'uk england scotland wales great britain', US: 'usa america', NL: 'holland',
  CZ: 'czech republic', KR: 'korea', KP: 'korea', CI: 'ivory coast', TR: 'turkiye',
  CD: 'drc', MK: 'macedonia', SZ: 'swaziland', AE: 'uae dubai', DK: 'danmark',
  DE: 'deutschland', ES: 'espana', SE: 'sverige', NO: 'norge', CH: 'schweiz suisse',
};

// Sans accents ni majuscules : « cote » trouve « Côte d'Ivoire ».
const fold = (s) => String(s).normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();

// Le drapeau, c'est le code du pays écrit en « lettres régionales ».
const flagOf = (iso) => String.fromCodePoint(...[...iso].map((ch) => 0x1f1e6 + ch.charCodeAt(0) - 65));

// Les noms des pays en français (« Allemagne ») viennent du navigateur ;
// à défaut, le nom anglais. On cherche un pays dans les deux langues.
const FR_REGIONS = (() => {
  try { return new Intl.DisplayNames(['fr'], { type: 'region' }); } catch { return null; }
})();
function frenchName(iso, name) {
  try {
    const fr = FR_REGIONS && FR_REGIONS.of(iso);
    return fr && fr !== iso ? fr : name;
  } catch { return name; }
}

const COUNTRIES = COUNTRY_LINES.trim().split('\n').map((line) => {
  const [, iso, dial, name] = line.match(/^(\S+) (\d+) (.+)$/);
  const fr = frenchName(iso, name);
  return { iso, dial, name, fr, flag: flagOf(iso), search: fold(`${name} ${fr} ${iso} ${COUNTRY_ALIASES[iso] || ''}`) };
}).sort((a, b) => a.name.localeCompare(b.name, 'en'));
const COUNTRIES_FR = [...COUNTRIES].sort((a, b) => a.fr.localeCompare(b.fr, 'fr'));
const countriesIn = (lang) => (lang === 'fr' ? COUNTRIES_FR : COUNTRIES);
const countryName = (c, lang) => (lang === 'fr' ? c.fr : c.name);

const COUNTRY_BY_ISO = {};
const COUNTRY_BY_DIAL = {};
COUNTRIES.forEach((c) => {
  COUNTRY_BY_ISO[c.iso] = c;
  if (!COUNTRY_BY_DIAL[c.dial] || c.iso === 'US' || c.iso === 'RU') COUNTRY_BY_DIAL[c.dial] = c;
});

// « 1876 » s'écrit « 1 876 » : c'est un +1, suivi du préfixe de l'île.
const dialText = (c) => (c.dial.length === 4 ? `1 ${c.dial.slice(1)}` : c.dial);

// Le pays d'un numéro international, d'après ses premiers chiffres.
// `preferred` l'emporte quand il partage l'indicatif (Canada pour un +1).
function countryOfDigits(digits, preferred) {
  for (let n = Math.min(4, digits.length); n >= 1; n--) {
    const c = COUNTRY_BY_DIAL[digits.slice(0, n)];
    if (c) return preferred && preferred.dial === c.dial ? preferred : c;
  }
  return null;
}

// Retire les n premiers chiffres d'un texte, en gardant la suite telle quelle.
function dropDigits(s, n) {
  let i = 0;
  while (i < s.length && n > 0) {
    if (/\d/.test(s[i])) n--;
    i++;
  }
  return s.slice(i).replace(/^\D+/, '');
}

// Ces pays gardent le 0 du début après l'indicatif (+39 06… à Rome).
const KEEP_ZERO = ['IT', 'SM', 'CI'];

// La partie du numéro après l'indicatif, propre : les espaces de l'acheteur
// sont gardés, le 0 national retiré (06 12… en France devient 6 12…), et un
// numéro danois s'écrit par paires.
function nationalOf(c, s) {
  let t = String(s).replace(/\D+/g, ' ').trim();
  if (!KEEP_ZERO.includes(c.iso)) t = t.replace(/^0\s*/, '');
  if (c.iso === 'DK') {
    let d = t.replace(/\D/g, '');
    if (d.length === 10 && d.startsWith('45')) d = d.slice(2);
    if (d.length === 8) return d.replace(/(\d\d)(?=\d)/g, '$1 ');
  }
  return t;
}

// Ce qu'a tapé l'acheteur, avec le pays choisi. S'il a tapé lui-même un
// indicatif (« +33… », « 0033… », ou un numéro rempli par le téléphone),
// c'est celui-là qui compte : `typedCode`, et `rest` le numéro sans lui.
function parsePhone(iso, raw) {
  const picked = COUNTRY_BY_ISO[iso] || COUNTRY_BY_ISO.DK;
  const s = String(raw || '').trim();
  const intl = s.match(/^(?:\+|00)(.*)$/);
  if (!intl) return { country: picked, typedCode: false, rest: s, national: nationalOf(picked, s) };
  const country = countryOfDigits(intl[1].replace(/\D/g, ''), picked);
  const rest = country ? dropDigits(intl[1], country.dial.length) : '';
  return { country, typedCode: true, rest, national: country ? nationalOf(country, rest) : '' };
}

const fullPhone = (p) => `+${dialText(p.country)} ${p.national}`;

// Message d'erreur dans la langue de `t`, ou '' si le numéro tient debout.
function phoneProblem(p, t) {
  const digits = p.national.replace(/\D/g, '');
  if (!p.country) return t('Please check the country code.', 'Vérifiez l’indicatif du pays.');
  if (!digits) return t('Please enter your phone number.', 'Entrez votre numéro de téléphone.');
  if (p.country.iso === 'DK' && digits.length !== 8) return t('A Danish number has 8 digits.', 'Un numéro danois a 8 chiffres.');
  const min = p.country.dial.length >= 3 ? 4 : 6;
  if (digits.length < min || digits.length + p.country.dial.length > 15) {
    return t('Please enter a valid phone number.', 'Entrez un numéro de téléphone valide.');
  }
  return '';
}

// Un numéro enregistré, prêt à afficher côté vendeur : avec son indicatif,
// le drapeau du pays et le lien pour appeler. Les rendez-vous pris avant
// le choix du pays n'ont pas d'indicatif : 8 chiffres, c'est un numéro danois.
function phoneInfo(raw) {
  const s = String(raw || '').trim().replace(/\s+/g, ' ');
  const d = s.replace(/\D/g, '');
  let text = s;
  if (s.startsWith('00')) text = `+${s.slice(2).trim()}`;
  else if (!s.startsWith('+') && d.length === 8) text = `+45 ${d.replace(/(\d\d)(?=\d)/g, '$1 ')}`;
  const intl = text.startsWith('+') ? text.replace(/\D/g, '') : '';
  return {
    text,
    country: intl ? countryOfDigits(intl) : null,
    href: `tel:${intl ? `+${intl}` : d}`,
  };
}

                className={`rounded-lg text-sm border ${compact ? 'px-3 py-1.5' : 'px-4 py-2'} ${

function SlotEditor({ value, onChange, pushToast, compact }) {
  const t = useT();
  const [draft, setDraft] = useState('');
  const slots = value || [];

  const add = () => {
    if (!/^\d{2}:\d{2}$/.test(draft)) return pushToast(t('Pick a valid time.', 'Choisis une heure valide.'));
    if (slots.includes(draft)) return pushToast(t('This time slot already exists.', 'Ce créneau existe déjà.'));
    onChange([...slots, draft].sort());
    setDraft('');
  };

  return (
    <div>
      <div className="flex flex-wrap gap-2">
        {slots.map((s) => (
          <span key={s} className={`inline-flex items-center gap-2 border border-blue-200 bg-blue-50 text-blue-800 rounded-lg text-sm ${compact ? 'px-2.5 py-1' : 'px-3 py-1.5'}`}>
            {s}
            <button type="button" onClick={() => onChange(slots.filter((x) => x !== s))}
                    className="text-blue-400 hover:text-red-600" aria-label={t(`Remove ${s}`, `Retirer ${s}`)}>
              <Icon name="x" className="w-3.5 h-3.5" />
            </button>
          </span>
        ))}
        {slots.length === 0 && (
          <span className="text-sm text-slate-400">{t('No time slots: nobody can book.', 'Aucun créneau : personne ne peut réserver.')}</span>
        )}
      </div>
      <div className="mt-3 flex gap-2">
        <input type="time" value={draft} onChange={(e) => setDraft(e.target.value)}
               className="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white" />
        <button type="button" onClick={add}
                className="inline-flex items-center gap-1.5 border border-slate-200 bg-white rounded-lg px-3 py-2 text-sm hover:border-blue-400 hover:text-blue-700">
          <Icon name="plus" className="w-4 h-4" /> {t('Add time slot', 'Ajouter le créneau')}
        </button>
      </div>
    </div>
  );
}

/* ---- horaires réellement applicables à un meuble donné ------------- */
function scheduleFor(item, settings) {
  const custom = item.custom_schedule;
  const weekdays = (custom && Array.isArray(item.weekdays) ? item.weekdays : settings.weekdays) || DEFAULT_SETTINGS.weekdays;
  const slots = (custom && Array.isArray(item.slots) && item.slots.length ? item.slots : settings.slots) || FALLBACK_SLOTS;
  const from = item.available_from ? String(item.available_from).slice(0, 10) : null;
  const itemUntil = item.available_to ? String(item.available_to).slice(0, 10) : null;
  // Rien au-delà du dernier jour de vente, même si l'annonce dit plus tard.
  const until = itemUntil && itemUntil < LAST_DAY ? itemUntil : LAST_DAY;
  const start = from && from > todayKey() ? from : todayKey();
  return { weekdays, slots, from, until, start, closed: new Set(settings.blocked || []) };
}

// Créneaux d'un jour : [{ time, free }]. Aujourd'hui, les heures passées disparaissent.
function slotsFor(k, plan, taken) {
  const now = new Date();
  const nowHM = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  return plan.slots
    .filter((s) => k !== todayKey() || s > nowHM)
    .map((s) => ({ time: s, free: !taken.has(`${k} ${s}`) }));
}

// Jours proposés à l'acheteur : ouverts, et avec au moins un créneau libre.
function bookableDays(plan, taken) {
  const out = [];
  for (let d = keyToDate(plan.start); toKey(d) <= plan.until; d.setDate(d.getDate() + 1)) {
    const k = toKey(d);
    if (!plan.weekdays[(d.getDay() + 6) % 7] || plan.closed.has(k)) continue;
    if (slotsFor(k, plan, taken).some((s) => s.free)) out.push(k);
  }
  return out;
}

// Plusieurs meubles pris au même rendez-vous : seuls restent les jours et
// les heures où chacun d'eux peut partir.
function scheduleForAll(list, settings) {
  const plans = list.map((item) => scheduleFor(item, settings));
  if (plans.length < 2) return plans[0] || scheduleFor({}, settings);
  const [first] = plans;
  return {
    ...first,
    weekdays: first.weekdays.map((_, i) => plans.every((p) => p.weekdays[i])),
    slots: first.slots.filter((s) => plans.every((p) => p.slots.includes(s))),
    start: plans.reduce((m, p) => (p.start > m ? p.start : m), first.start),
    until: plans.reduce((m, p) => (p.until < m ? p.until : m), first.until),
  };
}
