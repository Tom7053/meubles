// Les prix sont saisis librement (« 450 kr », « 1.200 », « 1 200,50 »).

function priceValue(raw) {
  if (!raw) return 0;
  const cleaned = String(raw)
    .replace(/[^\d.,]/g, '')
    .replace(/[.,](?=\d{3}(\D|$))/g, '')
    .replace(',', '.');
  const n = parseFloat(cleaned);

const fmtKr = (n) => `${Math.round(n).toLocaleString('da-DK')} kr`;

// Un prix s'affiche toujours suivi de « kr », qu'on l'ait tapé avec ou
// sans : « 450 », « 450kr » et « 450 DKK » donnent tous « 450 kr ».
function withKr(raw) {
  const p = String(raw || '').trim()
    .replace(/^(kr\.?|dkk)\s*/i, '')
    .replace(/\s*(kr\.?|dkk|kroner|,-)$/i, '')
    .trim();
  if (!p) return '';
  return /\d/.test(p) ? `${p} kr` : p;
}

const totalQty = (item) => Math.max(1, parseInt(item.quantity, 10) || 1);

  item.status === 'sold' ? totalQty(item) : Math.min(totalQty(item), parseInt(item.sold_qty, 10) || 0);
const leftQty = (item) => totalQty(item) - soldQty(item);

/* ------------------------------ dates ------------------------------ */
const pad = (n) => String(n).padStart(2, '0');
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

function keyToDate(key) {
  const [y, m, d] = String(key).slice(0, 10).split('-').map(Number);
  return new Date(y, m - 1, d);
}

function fmtDate(key, locale) {
  if (!key) return '';
  return keyToDate(key).toLocaleDateString(locale, {
    weekday: 'long', day: 'numeric', month: 'long',

}

// 'Thu 23 Oct' par défaut, ou le morceau demandé ({ weekday: 'short' }…)

function monthDays(year, month) {
  const offset = (new Date(year, month, 1).getDay() + 6) % 7; // lundi = 0
  const total = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= total; d++) cells.push(new Date(year, month, d));
  return cells;
}

/* ------------------------------ image ------------------------------ */
function resizeImage(file, max = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('image'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('file'));
    reader.readAsDataURL(file);
  });
}

function SlotEditor({ value, onChange, pushToast, compact }) {
  const [draft, setDraft] = useState('');
  const slots = value || [];

/* ---- horaires réellement applicables à un meuble donné ------------- */
function scheduleFor(item, settings) {
  const custom = item.custom_schedule;
  const weekdays = (custom && Array.isArray(item.weekdays) ? item.weekdays : settings.weekdays) || DEFAULT_SETTINGS.weekdays;
  const slots = (custom && Array.isArray(item.slots) && item.slots.length ? item.slots : settings.slots) || FALLBACK_SLOTS;
  const from = item.available_from ? String(item.available_from).slice(0, 10) : null;
  const itemUntil = item.available_to ? String(item.available_to).slice(0, 10) : null;
  // Rien au-delà du dernier jour de vente, même si l'annonce dit plus tard.
  const until = itemUntil && itemUntil < LAST_DAY ? itemUntil : LAST_DAY;
  const start = from && from > todayKey() ? from : todayKey();
  return { weekdays, slots, from, until, start, closed: new Set(settings.blocked || []) };
}

// Créneaux d'un jour : [{ time, free }]. Aujourd'hui, les heures passées disparaissent.
function slotsFor(k, plan, taken) {
  const now = new Date();
  const nowHM = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  return plan.slots
    .filter((s) => k !== todayKey() || s > nowHM)
    .map((s) => ({ time: s, free: !taken.has(`${k} ${s}`) }));
}

// Jours proposés à l'acheteur : ouverts, et avec au moins un créneau libre.
function bookableDays(plan, taken) {
  const out = [];
  for (let d = keyToDate(plan.start); toKey(d) <= plan.until; d.setDate(d.getDate() + 1)) {
    const k = toKey(d);
    if (!plan.weekdays[(d.getDay() + 6) % 7] || plan.closed.has(k)) continue;
    if (slotsFor(k, plan, taken).some((s) => s.free)) out.push(k);
  }
  return out;
}

function App() {
  const [route, setRoute] = useState(START_IN_ADMIN ? 'admin' : 'shop');
  const [session, setSession] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [recovering, setRecovering] = useState(FROM_RESET_LINK);
  const [linkProblem, setLinkProblem] = useState(RESET_LINK_FAILED);
  const [items, setItems] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [busy, setBusy] = useState([]);
  const [bookings, setBookings] = useState([]);
  const [ready, setReady] = useState(false);
  const [loadFailed, setLoadFailed] = useState(false);
  const [toasts, setToasts] = useState([]);

  const pushToast = useCallback((text, tone) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, text, tone }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 6000);
  }, []);

  /* ---- session ---- */
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => {
      setSession(data.session);
      // Revenu par le lien mais sans session : il a expiré ou déjà servi.
      if (FROM_RESET_LINK && !data.session) {
        setRecovering(false);
        setLinkProblem(true);
      }
      setAuthReady(true);
    });
    const { data } = sb.auth.onAuthStateChange((event, s) => {
      setSession(s);
      if (s) setLinkProblem(false);
      if (event === 'PASSWORD_RECOVERY') {
        setRecovering(true);
        setRoute('admin');
      }
    });
    return () => data.subscription.unsubscribe();
  }, []);

  // #vendeur tapé à la main dans l'adresse, page déjà ouverte.
  useEffect(() => {
    const onHash = () => { if (/^#(vendeur|admin)$/.test(window.location.hash)) setRoute('admin'); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // L'adresse suit l'écran : …/#vendeur se met en favori, la boutique reste propre.
  const goAdmin = () => {
    setRoute('admin');
    window.history.replaceState(null, '', '#vendeur');
    window.scrollTo(0, 0);
  };
  const goShop = () => {
    setRoute('shop');
    window.history.replaceState(null, '', window.location.pathname + window.location.search);
    window.scrollTo(0, 0);
  };

  /* ---- données publiques ---- */
  const loadPublic = useCallback(async () => {
    if (!sb) return setReady(true);
    const [it, st, bs] = await Promise.all([
      sb.from('items').select('*').order('created_at', { ascending: false }),
      sb.from('settings').select('*').eq('id', 1).maybeSingle(),
      sb.from('busy_slots').select('day, slot'),
    ]);
    if (it.data) setItems(it.data);
    if (st.data) setSettings({ ...DEFAULT_SETTINGS, ...st.data });
    if (bs.data) setBusy(bs.data);
    setLoadFailed(!!it.error);
    setReady(true);
  }, []);

  const loadBookings = useCallback(async () => {
    if (!sb || !session) return;
    const { data } = await sb.from('bookings').select('*').order('day').order('slot');
    if (data) setBookings(data);
  }, [session]);

  useEffect(() => { loadPublic(); }, [loadPublic]);
  useEffect(() => { loadBookings(); }, [loadBookings]);

  /* ---- alerte temps réel sur les nouveaux rendez-vous ---- */
  useEffect(() => {
    if (!sb || !session) return;
    const channel = sb
      .channel('bookings-feed')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings' }, (payload) => {
        const b = payload.new;
        setBookings((prev) => (prev.some((x) => x.id === b.id) ? prev : [...prev, b]));
        setBusy((prev) => [...prev, { day: b.day, slot: b.slot }]);
        pushToast(`Nouveau rendez-vous — ${b.first_name}${b.quantity > 1 ? ` (${b.quantity} × ${b.item_title})` : ''}, ${fmtDate(b.day, 'fr-FR')} à ${b.slot}`, 'new');
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [session, pushToast]);

  const newCount = bookings.filter((b) => b.status === 'new').length;

  if (!configured) {
    return (
      <div className="max-w-xl mx-auto px-5 py-24">
        <h1 className="display text-2xl font-bold">Configuration à terminer</h1>
        <p className="mt-3 text-slate-600 leading-relaxed">
          Ouvre <code className="bg-blue-50 px-1.5 py-0.5 rounded">index.html</code> et remplace
          les deux valeurs de <code className="bg-blue-50 px-1.5 py-0.5 rounded">window.CONFIG</code>{' '}
          par l’URL et la clé anon de ton projet Supabase, puis recharge la page.
        </p>
      </div>
    );
  }

  return (
    <div className="min-h-screen">
      {route === 'shop' ? (
        <Shop
          items={items}
          settings={settings}
          busy={busy}
          ready={ready}
          loadFailed={loadFailed}
          onRetry={() => { setReady(false); loadPublic(); }}
          onAdmin={goAdmin}
          onBooked={(row) => setBusy((prev) => [...prev, { day: row.day, slot: row.slot }])}
        />
      ) : (
        <Admin
          session={session}
          authReady={authReady}
          recovering={recovering}
          linkProblem={linkProblem}
          onRecovered={() => {
            setRecovering(false);
            pushToast('Nouveau mot de passe enregistré.');
          }}
          items={items}
          setItems={setItems}
          bookings={bookings}
          setBookings={setBookings}
          settings={settings}
          setSettings={setSettings}
          newCount={newCount}
          reload={() => { loadPublic(); loadBookings(); }}
          pushToast={pushToast}
          onShop={goShop}
        />
      )}

      <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 w-80 max-w-[calc(100vw-2rem)] print:hidden">
        {toasts.map((t) => (
          <div key={t.id}
               className={`rounded-lg px-4 py-3 text-sm shadow-lg border flex items-start gap-2 ${
                 t.tone === 'new' ? 'bg-blue-700 text-white border-blue-800'
                                  : 'bg-white text-slate-800 border-slate-200'}`}>
            <Icon name="bell" className="w-4 h-4 mt-0.5 shrink-0" />
            <span>{t.text}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

const PRIMARY_BTN = 'w-full inline-flex items-center justify-center gap-2 font-semibold text-white rounded-xl py-3.5 '

// Tant qu'une fenêtre est ouverte (réservation, photo) : la page derrière
// ne défile plus et la touche Échap la ferme.
function useOverlay(onClose) {
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') closeRef.current(); };
    window.addEventListener('keydown', onKey);
    return () => {
      document.body.style.overflow = prev;
      window.removeEventListener('keydown', onKey);
    };
  }, []);
}

function PickupMap({ address }) {

                src={`https://maps.google.com/maps?q=${q}&z=15&output=embed`} />

      <a href={`https://www.google.com/maps/dir/?api=1&destination=${q}`} target="_blank" rel="noreferrer"

        <Icon name="pin" className="w-4 h-4" /> Get directions
      </a>

function BookingSheet({ item, busy, settings, onClose, onTaken }) {
  const plan = scheduleFor(item, settings);
  const taken = new Set(busy.map((b) => `${String(b.day).slice(0, 10)} ${b.slot}`));
  const days = bookableDays(plan, taken);

  const [step, setStep] = useState(1);
  // Le premier jour libre est déjà choisi : les heures s'affichent tout de suite.
  const [day, setDay] = useState(() => days[0] || null);
  const [slot, setSlot] = useState(null);
  const [firstName, setFirstName] = useState('');
  const [phone, setPhone] = useState('');
  const [payment, setPayment] = useState('');
  // Plusieurs exemplaires en vente : l'acheteur dit combien il en prend.
  const left = leftQty(item);
  const [count, setCount] = useState(1);
  const [error, setError] = useState('');
  const [sending, setSending] = useState(false);
  const [done, setDone] = useState(null);
  const bodyRef = useRef(null);
  const timesRef = useRef(null);
  useOverlay(onClose);

  const times = day ? slotsFor(day, plan, taken) : [];
  const tKey = todayKey();
  const tomorrow = (() => { const t = new Date(); t.setDate(t.getDate() + 1); return toKey(t); })();

  // Chaque nouvel écran repart du haut.
  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = 0; }, [step, done]);

  const pickDay = (k) => {
    setDay(k);
    setSlot(null);
    setError('');
    if (timesRef.current) timesRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  const backToTimes = (message) => {
    setSlot(null);
    setStep(1);
    setError(message || '');
  };

  const submit = async () => {
    if (firstName.trim().length < 2) return setError('Please enter your first name.');
    if (phone.replace(/\D/g, '').length < 6) return setError('Please enter a valid phone number.');
    if (!payment) return setError('Please choose how you will pay.');
    if (taken.has(`${day} ${slot}`)) return backToTimes('Sorry, that time was just taken. Please pick another one.');
    setError('');
    setSending(true);
    const row = {
      item_id: item.id,
      item_title: item.title,
      first_name: firstName.trim(),
      phone: phone.trim(),
      payment,
      day,
      slot,
      status: 'new',
      // Envoyé seulement s'il sert : la réservation marche même si
      // migration-quantite.sql n'a pas encore été lancé.
      ...(count > 1 ? { quantity: count } : {}),
    };
    const { error: err } = await sb.from('bookings').insert(row);
    setSending(false);
    // 23505 = quelqu'un d'autre a réservé ce créneau entre-temps.
    if (err && err.code === '23505') {
      onTaken(row);
      return backToTimes('Sorry, someone just took that time. Please pick another one.');
    }
    if (err) return setError('Something went wrong. Please try again.');
    onTaken(row);
    setDone(row);
  };

  const dayChip = (k) => {
    const on = k === day;
    const sub = on ? 'text-blue-100' : 'text-slate-500';
    return (
      <button key={k} onClick={() => pickDay(k)} aria-pressed={on}
              className={`snap-start shrink-0 w-[4.75rem] rounded-xl border py-2.5 text-center ${
                on ? 'bg-blue-700 border-blue-700 text-white'
                   : 'bg-white border-slate-200 text-slate-800 hover:border-blue-400'}`}>
        <span className={`block text-xs font-medium ${sub}`}>
          {k === tKey ? 'Today' : k === tomorrow ? 'Tomorrow' : fmtShort(k, { weekday: 'short' })}
        </span>
        <span className="block text-xl font-bold leading-tight">{keyToDate(k).getDate()}</span>
        <span className={`block text-xs ${sub}`}>{fmtShort(k, { month: 'short' })}</span>
      </button>
    );
  };

  const stepOne = (
    <div>
      <h3 className="font-semibold text-lg">Which day can you come?</h3>
      {days.length === 0 ? (
        <p className="mt-3 rounded-xl bg-slate-50 border border-slate-200 px-4 py-6 text-center text-slate-600">
          Sorry, there are no free times left for this item.
        </p>
      ) : (
        <>
          <div className="mt-3 -mx-5 px-5 scroll-px-5 flex gap-2 overflow-x-auto snap-x no-scrollbar pb-1 sm:mx-0 sm:px-0 sm:flex-wrap sm:overflow-visible">
            {days.map(dayChip)}
          </div>
          {days.length > 4 && <p className="mt-1.5 text-xs text-slate-400 sm:hidden">Swipe for more days →</p>}
        </>
      )}

      {day && (
        <div ref={timesRef} className="mt-7 scroll-mt-4">
          <h3 className="font-semibold text-lg">What time?</h3>
          <p className="text-sm text-slate-500">{fmtDate(day, 'en-GB')}</p>
          <div className="mt-3 grid grid-cols-3 sm:grid-cols-4 gap-2">
            {times.map(({ time, free }) => {
              const on = slot === time;
              return (
                <button key={time} disabled={!free} aria-pressed={on}
                        onClick={() => { setSlot(time); setError(''); }}
                        className={`py-3 rounded-xl border text-base font-semibold ${
                          !free ? 'border-slate-100 text-slate-300 line-through cursor-not-allowed'
                                : on ? 'bg-blue-700 border-blue-700 text-white'
                                     : 'bg-white border-slate-200 text-slate-800 hover:border-blue-400'}`}>
                  {time}
                </button>
              );
            })}

function authErrorMessage(err) {
  const m = String((err && err.message) || '').toLowerCase();
  if (m.includes('email not confirmed'))
    return 'Le compte existe mais n’est pas confirmé. Dans Supabase : Authentication > Users, ouvre l’utilisateur et confirme-le, ou supprime-le et recrée-le en cochant « Auto Confirm User ».';
  if (m.includes('invalid login credentials'))
    return 'E-mail ou mot de passe incorrect. C’est le mot de passe du compte créé dans Authentication > Users, pas celui de la base. Oublié ? Utilise le lien juste en dessous.';
  if (m.includes('failed to fetch') || m.includes('networkerror') || m.includes('load failed'))
    return 'Supabase est injoignable. Si la boutique n’affiche plus aucun meuble non plus, le projet est sûrement en pause : sur supabase.com, ouvre le projet et clique sur « Restore project ».';
  if (m.includes('api key') || m.includes('apikey') || m.includes('jwt'))
    return 'Clé anon invalide. Recopie-la depuis Project Settings > Data API.';
  // Le service d'e-mail intégré de Supabase n'écrit qu'aux membres de l'équipe du projet.
  if (m.includes('not authorized'))
    return 'Supabase refuse d’envoyer l’e-mail à cette adresse : son service gratuit n’écrit qu’aux membres de ton organisation Supabase. Change plutôt le mot de passe avec reset-mot-de-passe.sql.';
  if (m.includes('email rate limit'))
    return 'Supabase a atteint sa limite d’e-mails (quelques-uns par heure en gratuit). Réessaie plus tard, ou change le mot de passe avec reset-mot-de-passe.sql.';
  if (m.includes('security purposes'))
    return 'Un lien vient déjà de partir. Attends une minute avant d’en redemander un.';
  if (m.includes('rate') || m.includes('too many'))
    return 'Trop de tentatives. Attends une minute avant de réessayer.';
  if (m.includes('disabled') || m.includes('not enabled'))
    return 'La connexion par e-mail est désactivée. Active-la dans Authentication > Sign In / Providers > Email.';
  return 'Connexion impossible.';
}

function passwordErrorMessage(err) {
  const m = String((err && err.message) || '').toLowerCase();
  if (m.includes('different from the old'))
    return 'C’est déjà ton mot de passe actuel. Choisis-en un autre.';
  if (m.includes('at least') || m.includes('weak') || m.includes('short'))
    return 'Mot de passe trop faible. Mets-en un plus long.';
  if (m.includes('session') || m.includes('expired'))
    return 'Le lien a expiré. Reviens à la connexion et redemande un lien.';
  return authErrorMessage(err);
}

function Login({ onShop, linkProblem }) {
  // 'login' → connexion, 'forgot' → demander un lien, 'sent' → lien envoyé
  const [mode, setMode] = useState(linkProblem ? 'forgot' : 'login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState(linkProblem
    ? 'Ce lien a expiré ou a déjà servi. Demande un nouveau lien ci-dessous.' : '');
  const [detail, setDetail] = useState('');
  const [busy, setBusy] = useState(false);

  const cleanEmail = email.trim().toLowerCase();
  const go = (m) => { setMode(m); setError(''); setDetail(''); };
  const fail = (err) => { setError(authErrorMessage(err)); setDetail((err && err.message) || ''); };

  const signIn = async (e) => {
    e.preventDefault();
    setError('');
    setDetail('');
    if (!cleanEmail || !password) return setError('Entre ton e-mail et ton mot de passe.');
    setBusy(true);
    const { error: err } = await sb.auth.signInWithPassword({ email: cleanEmail, password });
    setBusy(false);
    if (err) fail(err);
  };

  // Supabase envoie un e-mail dont le lien ramène sur SITE_URL, connecté,
  // avec #type=recovery : l'écran NewPassword prend alors le relais.
  const sendLink = async (e) => {
    e.preventDefault();
    setError('');
    setDetail('');
    if (!/^\S+@\S+\.\S+$/.test(cleanEmail)) return setError('Entre l’adresse e-mail du compte vendeur.');
    setBusy(true);
    const { error: err } = await sb.auth.resetPasswordForEmail(cleanEmail, { redirectTo: SITE_URL });
    setBusy(false);
    if (err) return fail(err);
    setMode('sent');
  };

  const footer = (
    <button onClick={onShop} className="mt-6 inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-blue-700">
      <Icon name="store" className="w-4 h-4" /> Retour à la boutique
    </button>
  );

  const emailField = (
    <label className="block">
      <span className="text-sm font-medium text-slate-700">E-mail</span>
      <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
             autoComplete="username" autoCapitalize="none" spellCheck={false}
             className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-3" />
    </label>
  );

  if (mode === 'sent') {
    return (
      <AuthCard icon="mail" title="Regarde tes e-mails" footer={footer}
                text={<>Si <strong className="text-slate-700">{cleanEmail}</strong> est l’adresse du compte vendeur,
                  un e-mail vient de partir. Ouvre le lien qu’il contient : il te ramène ici pour choisir
                  un nouveau mot de passe.</>}>
        <ul className="mt-4 text-sm text-slate-600 space-y-1.5 list-disc pl-5">
          <li>Regarde aussi dans les spams.</li>
          <li>Le lien ne marche qu’une seule fois.</li>
          <li>Rien au bout de 5 minutes ? Change le mot de passe directement dans Supabase
              avec <code className="bg-blue-50 px-1 rounded">reset-mot-de-passe.sql</code>.</li>
        </ul>
        <button onClick={() => go('login')} className={`mt-6 ${PRIMARY_BTN}`}>Retour à la connexion</button>
      </AuthCard>
    );
  }

  if (mode === 'forgot') {
    return (
      <AuthCard icon="key" title="Mot de passe oublié" footer={footer}
                text="Entre l’e-mail du compte vendeur, tu vas recevoir un lien pour choisir un nouveau mot de passe.">
        <form onSubmit={sendLink} className="mt-6 space-y-4" noValidate>
          {emailField}
          <ErrorBox error={error} detail={detail} />
          <button type="submit" disabled={busy} className={PRIMARY_BTN}>
            {busy ? 'Envoi…' : 'Recevoir le lien'}
          </button>
        </form>
        <button onClick={() => go('login')} className="mt-4 inline-flex items-center gap-1 text-sm font-medium text-blue-700 hover:underline">
          <Icon name="left" className="w-4 h-4" /> Je m’en souviens finalement
        </button>
      </AuthCard>
    );
  }

  return (
    <AuthCard icon="lock" title="Espace vendeur" footer={footer}
              text="Connecte-toi pour gérer les annonces, les rendez-vous et le planning.">
      <form onSubmit={signIn} className="mt-6 space-y-4" noValidate>
        {emailField}
        <PasswordField label="Mot de passe" value={password} onChange={setPassword} autoComplete="current-password" />
        <ErrorBox error={error} detail={detail} />
        <button type="submit" disabled={busy} className={PRIMARY_BTN}>
          {busy ? 'Connexion…' : 'Se connecter'}
        </button>
      </form>
      <button onClick={() => go('forgot')} className="mt-4 text-sm font-medium text-blue-700 hover:underline">
        Mot de passe oublié ?
      </button>
    </AuthCard>
  );
}

function NewPassword({ email, onDone }) {
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [detail, setDetail] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    setDetail('');
    if (password.length < 6) return setError('Choisis au moins 6 caractères.');
    setBusy(true);
    const { error: err } = await sb.auth.updateUser({ password });
    setBusy(false);
    if (err) {
      setError(passwordErrorMessage(err));
      setDetail(err.message || '');
      return;
    }
    onDone();
  };

  return (
    <AuthCard icon="key" title="Nouveau mot de passe"
              text={email ? <>Pour le compte <strong className="text-slate-700">{email}</strong>.</> : null}>
      <form onSubmit={submit} className="mt-6 space-y-4" noValidate>
        {/* aide le gestionnaire de mots de passe du téléphone à l'enregistrer */}
        {email && <input type="email" value={email} autoComplete="username" readOnly hidden />}
        <PasswordField label="Choisis un nouveau mot de passe" value={password} onChange={setPassword}
                       autoComplete="new-password" />
        <ErrorBox error={error} detail={detail} />
        <button type="submit" disabled={busy} className={PRIMARY_BTN}>
          {busy ? 'Enregistrement…' : 'Enregistrer et continuer'}
        </button>
      </form>
    </AuthCard>
  );
}

// le texte. Rien de tout ça n'est enregistré, seule la description l'est.
const KINDS = [
  { fr: 'Bureau', en: 'desk' },
  { fr: 'Table', en: 'table' },
  { fr: 'Table basse', en: 'coffee table' },
  { fr: 'Table de chevet', en: 'bedside table' },
  { fr: 'Chaise', en: 'chair' },
  { fr: 'Chaise de bureau', en: 'office chair' },
  { fr: 'Fauteuil', en: 'armchair' },
  { fr: 'Canapé', en: 'sofa' },
  { fr: 'Lit', en: 'bed' },
  { fr: 'Matelas', en: 'mattress' },
  { fr: 'Armoire', en: 'wardrobe' },
  { fr: 'Commode', en: 'chest of drawers' },
  { fr: 'Étagère', en: 'shelf' },
  { fr: 'Bibliothèque', en: 'bookcase' },
  { fr: 'Meuble TV', en: 'TV stand' },
  { fr: 'Télé', en: 'TV' },
  { fr: 'Lampe', en: 'lamp' },
  { fr: 'Miroir', en: 'mirror' },
  { fr: 'Tapis', en: 'rug' },
];

// `adj` quand le mot change devant le nom (« wooden desk » mais « in wood »).
const MATERIALS = [
  { fr: 'Bois', en: 'wood', adj: 'wooden' },
  { fr: 'Bois massif', en: 'solid wood' },
  { fr: 'Chêne', en: 'oak' },
  { fr: 'Pin', en: 'pine' },
  { fr: 'Bouleau', en: 'birch' },
  { fr: 'Métal', en: 'metal' },
  { fr: 'Verre', en: 'glass' },
  { fr: 'Plastique', en: 'plastic' },
  { fr: 'Tissu', en: 'fabric' },
  { fr: 'Velours', en: 'velvet' },
  { fr: 'Cuir', en: 'leather' },
  { fr: 'Simili-cuir', en: 'faux leather' },
  { fr: 'Rotin', en: 'rattan' },
];

const COLOURS = [
  { fr: 'Blanc', en: 'white' },
  { fr: 'Noir', en: 'black' },
  { fr: 'Gris', en: 'grey' },
  { fr: 'Beige', en: 'beige' },
  { fr: 'Marron', en: 'brown' },
  { fr: 'Bleu', en: 'blue' },
  { fr: 'Vert', en: 'green' },
  { fr: 'Rouge', en: 'red' },
  { fr: 'Jaune', en: 'yellow' },
  { fr: 'Rose', en: 'pink' },
];

// Chaque atout complète « It … ».
const FEATURES = [
  { fr: 'Beaucoup de rangement', en: 'has plenty of storage' },
  { fr: 'Tiroirs', en: 'has drawers' },
  { fr: 'Facile à démonter', en: 'is easy to take apart' },
  { fr: 'Pliable', en: 'folds away' },
  { fr: 'Réglable en hauteur', en: 'is height-adjustable' },
  { fr: 'Sur roulettes', en: 'is on wheels' },
  { fr: 'Léger', en: 'is light and easy to move' },
  { fr: 'Très confortable', en: 'is very comfortable' },
  { fr: 'Housse lavable', en: 'has a washable cover' },
  { fr: 'Marche parfaitement', en: 'works perfectly' },
];

// Chaque défaut complète « Please note: … ».
const FLAWS = [
  { fr: 'Petites rayures', en: 'a few small scratches' },
  { fr: 'Petite tache', en: 'a small stain' },
  { fr: 'Petit choc', en: 'a small dent' },
  { fr: 'Décoloré par le soleil', en: 'some sun fading' },
  { fr: 'Un peu bancal', en: 'a slight wobble' },
  { fr: 'Vis manquante', en: 'a missing screw' },
];

// Chaque mot complète « From a … home ».
const HOME = [
  { fr: 'Non-fumeur', en: 'smoke-free' },
  { fr: 'Sans animaux', en: 'pet-free' },
];

const emptyDetails = {
  kind: '', material: '', colour: '', brand: '', width: '', depth: '', height: '', tags: [],
};

const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
// « a », « a and b », « a, b and c »
const joinAnd = (list) =>
  list.length < 2 ? list.join('') : `${list.slice(0, -1).join(', ')} and ${list[list.length - 1]}`;

// Ex. : « White oak desk from IKEA. It measures 120 cm wide and 60 cm deep.
// It has drawers. In very good condition. Please note: a small stain. »
function describeItem(item, d) {
  const kind = KINDS.find((k) => k.en === d.kind);
  const material = MATERIALS.find((m) => m.en === d.material);
  const brand = d.brand.trim();
  const from = brand ? ` from ${brand}` : '';
  const picked = (list) => list.filter((o) => d.tags.includes(o.en)).map((o) => o.en);
  const sentences = [];

  if (kind) {
    const words = [d.colour, material && (material.adj || material.en), kind.en];
    sentences.push(`${cap(words.filter(Boolean).join(' '))}${from}.`);
  } else if ((item.title || '').trim() && (d.colour || material || brand)) {
    // Pas de type choisi : on part du titre de l'annonce.
    const look = [d.colour, material && material.en].filter(Boolean).join(' ');
    sentences.push(`${item.title.trim()}${look ? ` in ${look}` : ''}${from}.`);
  }

  const size = [['wide', d.width], ['deep', d.depth], ['high', d.height]]
    .map(([word, v]) => [word, String(v).replace(/[^\d.,]/g, '')])
    .filter(([, v]) => v)
    .map(([word, v]) => `${v} cm ${word}`);
  if (size.length) sentences.push(`It measures ${joinAnd(size)}.`);

  const features = picked(FEATURES);
  if (features.length) sentences.push(`It ${joinAnd(features)}.`);

  const condition = CONDITIONS.find((c) => c.en === item.condition);
  if (condition) sentences.push(condition.sentence);

  const flaws = picked(FLAWS);
  if (flaws.length) sentences.push(`Please note: ${joinAnd(flaws)}.`);

  const home = picked(HOME);
  if (home.length) sentences.push(`From a ${home.join(', ')} home.`);

  return sentences.join(' ');
}

const emptyForm = {
  id: null, title: '', price: '', condition: '', description: '',
  links: [], image: null, status: 'available', quantity: 1, sold_qty: 0,
  available_from: '', available_to: '', custom_schedule: false, weekdays: null, slots: null,
};

/* --------------------- objectif de vente (3000 kr) ------------------ */

function GoalProgress({ items }) {
  // Compté par exemplaire : 2 lits à 450 kr, c'est 900 kr et 2 meubles.
  const sum = (qty) => items.reduce((total, i) => total + priceValue(i.price) * qty(i), 0);
  const units = (qty) => items.reduce((total, i) => total + qty(i), 0);
  const soldCount = units(soldQty);
  const listedCount = units(leftQty);
  const soldTotal = sum(soldQty);
  const listedTotal = sum(leftQty);
  const missing = Math.max(0, SALES_GOAL - soldTotal);
  const pct = (n) => Math.min(100, (n / SALES_GOAL) * 100);
  const reached = soldTotal >= SALES_GOAL;

  const bar = (label, count, total, fill, track, note) => (
    <div>
      <div className="flex items-baseline justify-between gap-3 mb-1.5">
        <span className="text-sm text-slate-600">
          {label} <span className="text-slate-400">· {count} meuble{count > 1 ? 's' : ""}</span>
        </span>
        <span className="text-sm font-semibold tabular-nums">{fmtKr(total)}</span>
      </div>
      <div className={`h-3 rounded-full overflow-hidden ${track}`}>
        <div className={`h-full rounded-full ${fill} transition-all duration-500`}
             style={{ width: `${pct(total)}%` }} />
      </div>
      <p className="text-xs text-slate-500 mt-1.5">{note}</p>
    </div>
  );

  return (
    <section className="border border-blue-200 rounded-xl bg-blue-50 px-5 py-5 mb-8">
      <div className="flex items-baseline justify-between gap-3 flex-wrap mb-5">
        <h2 className="display font-bold text-lg">Objectif : {fmtKr(SALES_GOAL)}</h2>
        <span className={`text-sm font-semibold ${reached ? 'text-green-700' : 'text-blue-800'}`}>
          {reached ? 'Objectif atteint 🎉' : `Il manque ${fmtKr(missing)}`}
        </span>
      </div>

      <div className="space-y-5">
        {bar('Vendu', soldCount, soldTotal, 'bg-blue-700', 'bg-blue-100',
          `${Math.round(pct(soldTotal))} % de l’objectif`)}
        {bar('En vente', listedCount, listedTotal, 'bg-blue-400', 'bg-blue-100',
          listedTotal + soldTotal >= SALES_GOAL
            ? `Tout vendre rapporterait ${fmtKr(soldTotal + listedTotal)}, l’objectif est atteignable.`
            : `Même en vendant tout (${fmtKr(soldTotal + listedTotal)}), il manquerait ${fmtKr(SALES_GOAL - soldTotal - listedTotal)}.`)}
      </div>
    </section>
  );
}

function ItemsPanel({ items, setItems, pushToast }) {
  const [form, setForm] = useState(emptyForm);
  const [open, setOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  // Choix qui servent à écrire la description (type, couleur, défauts…).
  const [details, setDetails] = useState(emptyDetails);
  // Texte remplacé par « Réécrire », pour pouvoir revenir en arrière.
  const [beforeRewrite, setBeforeRewrite] = useState(null);
  const fileRef = useRef(null);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  // Le champ prix se tape sans « kr », il est rajouté à l'enregistrement.
  const openForm = (f) => {
    setForm({ ...f, price: withKr(f.price).replace(/ kr$/, '') });
    setDetails(emptyDetails);
    setBeforeRewrite(null);
    setOpen(true);
  };

  // Tant que la description n'a pas été retouchée à la main, elle suit les
  // choix du formulaire. Une fois retouchée, on n'y touche plus.
  const change = (nextForm, nextDetails) => {
    const follows = !(form.description || '').trim() || form.description === describeItem(form, details);
    setForm(follows ? { ...nextForm, description: describeItem(nextForm, nextDetails) } : nextForm);
    setDetails(nextDetails);
  };
  const setDetail = (k, v) => change(form, { ...details, [k]: v });
  const toggleTag = (en) => setDetail('tags',
    details.tags.includes(en) ? details.tags.filter((t) => t !== en) : [...details.tags, en]);

  const rewrite = () => {
    const text = describeItem(form, details);
    if (!text) return pushToast('Choisis d’abord le type de meuble, l’état ou une couleur.');
    if (form.description.trim() && form.description !== text) setBeforeRewrite(form.description);
    set('description', text);
  };

  const submit = async () => {
    if (!form.title.trim()) return pushToast('Il manque le titre de l’annonce.');
    setBusy(true);
    const quantity = Math.min(20, totalQty(form));
    // Nombre baissé sous ce qui est déjà vendu : tout est parti.
    const sold_qty = Math.min(quantity, soldQty(form));
    const payload = {
      title: form.title.trim(),
      price: withKr(form.price),
      condition: form.condition.trim(),
      description: form.description.trim(),
      links: (form.links || []).filter((l) => l.label.trim() && l.url.trim()),
      image: form.image,
      status: sold_qty >= quantity ? 'sold' : (form.status || 'available'),
      available_from: form.available_from || null,
      available_to: form.available_to || null,
      custom_schedule: !!form.custom_schedule,
      weekdays: form.custom_schedule ? (form.weekdays || DEFAULT_SETTINGS.weekdays) : null,
      slots: form.custom_schedule ? (form.slots || DEFAULT_SETTINGS.slots) : null,
    };
    // Avant migration-quantite.sql ces colonnes n'existent pas : on ne les
    // envoie que si la base les a déjà, ou s'il y a plusieurs exemplaires.
    if (quantity > 1 || items.some((i) => 'quantity' in i)) Object.assign(payload, { quantity, sold_qty });
    let res;
    if (form.id) res = await sb.from('items').update(payload).eq('id', form.id).select().single();
    else res = await sb.from('items').insert(payload).select().single();
    setBusy(false);
    // PGRST204 = colonne inconnue de la base.
    if (res.error && res.error.code === 'PGRST204') {
      return pushToast('Pour vendre plusieurs exemplaires, lance d’abord migration-quantite.sql dans Supabase (SQL Editor).');
    }
    if (res.error) return pushToast('Enregistrement impossible, réessaie.');
    setItems(form.id ? items.map((i) => (i.id === form.id ? res.data : i)) : [res.data, ...items]);
    setOpen(false);
    setForm(emptyForm);
    pushToast(form.id ? 'Annonce mise à jour.' : 'Annonce publiée.');
  };

  const remove = async (item) => {
    if (!window.confirm(`Supprimer « ${item.title} » ? Cette action est définitive.`)) return;
    const { error } = await sb.from('items').delete().eq('id', item.id);
    if (error) return pushToast('Suppression impossible.');
    setItems(items.filter((i) => i.id !== item.id));
    pushToast('Annonce supprimée.');
  };

  // Combien d'exemplaires sont partis. Tout vendu : l'annonce quitte la boutique.
  const setSold = async (item, n) => {
    const total = totalQty(item);
    const sold_qty = Math.max(0, Math.min(total, n));
    const status = sold_qty >= total ? 'sold' : 'available';
    // Sans migration-quantite.sql, seul le statut existe.
    const patch = 'sold_qty' in item ? { status, sold_qty } : { status };
    const { error } = await sb.from('items').update(patch).eq('id', item.id);
    if (error) return pushToast('Mise à jour impossible.');
    setItems(items.map((i) => (i.id === item.id ? { ...i, ...patch } : i)));
    if (status === 'sold') pushToast('Marquée comme vendue : retirée de la boutique.');
    else if (total > 1) pushToast(`Il en reste ${total - sold_qty} sur ${total} dans la boutique.`);
    else pushToast('Remise en vente.');
  };

  const onFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try { set('image', await resizeImage(file)); }
    catch { pushToast('Photo illisible, essaie une autre image.'); }
  };

  return (
    <div>
      <GoalProgress items={items} />

      <div className="flex items-center justify-between mb-5">
        <p className="text-slate-500 text-sm">{items.length} meuble{items.length > 1 ? 's' : ''} enregistré{items.length > 1 ? 's' : ''}</p>
        <button onClick={() => openForm(emptyForm)}
                className="inline-flex items-center gap-2 font-semibold bg-blue-700 hover:bg-blue-800 text-white rounded-lg px-4 py-2.5 text-sm">
          <Icon name="plus" className="w-4 h-4" /> Ajouter un meuble
        </button>
      </div>

      {open && (
        <div className="border border-blue-200 rounded-xl bg-blue-50 p-5 mb-8">
          <h2 className="display font-bold text-lg mb-4">{form.id ? 'Modifier l’annonce' : 'Nouvelle annonce'}</h2>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <label className="block col-span-2">
              <span className="text-sm text-slate-600">Titre</span>
              <input value={form.title} onChange={(e) => change({ ...form, title: e.target.value }, details)}
                     className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" placeholder="Bureau en chêne" />
            </label>
            <label className="block">
              <span className="text-sm text-slate-600">Prix</span>
              <span className="mt-1 flex items-center border border-slate-200 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-400">
                <input value={form.price} onChange={(e) => set('price', e.target.value)} inputMode="decimal"
                       className="w-full min-w-0 rounded-lg px-3 py-2 bg-transparent outline-none" placeholder="450" />
                <span className="pr-3 text-slate-500">kr</span>
              </span>
            </label>
            <label className="block">
              <span className="text-sm text-slate-600">Nombre</span>
              <input type="number" min="1" max="20" inputMode="numeric" value={form.quantity}
                     onChange={(e) => set('quantity', e.target.value)}
                     className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" />
            </label>
          </div>
          {totalQty(form) > 1 && (
            <p className="mt-1.5 text-xs text-slate-500">
              {totalQty(form)} exemplaires identiques, prix pour un : l’acheteur choisit combien il en prend.
              {soldQty(form) > 0 && (leftQty(form) > 0
                ? ` ${soldQty(form)} déjà vendu${soldQty(form) > 1 ? 's' : ''}, il en reste ${leftQty(form)}.`
                : ' Tous sont déjà vendus.')}
            </p>
          )}

          <label className="block mt-3">
            <span className="text-sm text-slate-600">État</span>
            <select value={form.condition || ''} onChange={(e) => change({ ...form, condition: e.target.value }, details)}
                    className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white">
              <option value="">Non précisé</option>
              {CONDITIONS.map((c) => <option key={c.en} value={c.en}>{c.fr} · « {c.en} »</option>)}
              {/* état tapé à la main avant le menu : on le garde tel quel */}
              {form.condition && !CONDITIONS.some((c) => c.en === form.condition) && (
                <option value={form.condition}>{form.condition}</option>
              )}
            </select>
          </label>

          <div className="mt-4">
            <span className="text-sm text-slate-600">Photo</span>
            <div className="mt-1 flex items-center gap-3">
              <button onClick={() => fileRef.current && fileRef.current.click()}
                      className="inline-flex items-center gap-2 border border-slate-200 bg-white rounded-lg px-3 py-2 text-sm hover:border-blue-400">
                <Icon name="image" className="w-4 h-4 text-blue-700" /> Choisir une image
              </button>
              <input ref={fileRef} type="file" accept="image/*" onChange={onFile} className="hidden" />
              {form.image && (
                <div className="flex items-center gap-2">
                  <img src={form.image} alt="" className="w-16 h-12 object-cover rounded border border-slate-200" />
                  <button onClick={() => set('image', null)} className="text-sm text-slate-500 hover:text-red-600">Retirer</button>
                </div>
              )}
            </div>
          </div>

          <div className="mt-5 border-t border-blue-200 pt-4">
            <span className="font-semibold text-sm">Pour écrire la description</span>
            <p className="text-xs text-slate-500 mt-0.5">
              Coche ce qui correspond, la description en anglais s’écrit toute seule en dessous.
            </p>

            <div className="mt-3 grid grid-cols-2 sm:grid-cols-3 gap-3">
              {[['kind', 'Type', KINDS, 'Autre (le titre)'], ['material', 'Matière', MATERIALS, '—'],
                ['colour', 'Couleur', COLOURS, '—']].map(([k, label, options, none]) => (
                <label key={k} className={`block ${k === 'kind' ? 'col-span-2 sm:col-span-1' : ''}`}>
                  <span className="text-sm text-slate-600">{label}</span>
                  <select value={details[k]} onChange={(e) => setDetail(k, e.target.value)}
                          className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white">
                    <option value="">{none}</option>
                    {options.map((o) => <option key={o.en} value={o.en}>{o.fr}</option>)}
                  </select>
                </label>
              ))}
            </div>

            <div className="mt-3 grid grid-cols-3 sm:grid-cols-4 gap-3">
              <label className="block col-span-3 sm:col-span-1">
                <span className="text-sm text-slate-600">Marque</span>
                <input value={details.brand} onChange={(e) => setDetail('brand', e.target.value)}
                       className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" placeholder="IKEA" />
              </label>
              {[['width', 'Largeur'], ['depth', 'Profondeur'], ['height', 'Hauteur']].map(([k, label]) => (
                <label key={k} className="block">
                  <span className="text-sm text-slate-600">{label}</span>
                  <span className="mt-1 flex items-center border border-slate-200 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-400">
                    <input value={details[k]} onChange={(e) => setDetail(k, e.target.value)} inputMode="decimal"
                           className="w-full min-w-0 rounded-lg px-3 py-2 bg-transparent outline-none" />
                    <span className="pr-3 text-slate-500 text-sm">cm</span>
                  </span>
                </label>
              ))}
            </div>

            {[['Atouts', FEATURES], ['Défauts à signaler', FLAWS], ['Chez toi', HOME]].map(([label, options]) => (
              <div key={label} className="mt-3">
                <span className="text-sm text-slate-600">{label}</span>
                <div className="mt-1 flex flex-wrap gap-2">
                  {options.map((o) => (
                    <button key={o.en} type="button" onClick={() => toggleTag(o.en)} aria-pressed={details.tags.includes(o.en)}
                            className={`rounded-lg text-sm border px-3 py-1.5 ${
                              details.tags.includes(o.en) ? 'bg-blue-700 border-blue-700 text-white'
                                                          : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}`}>
                      {o.fr}
                    </button>
                  ))}
                </div>
              </div>

            <div className="mt-4 flex items-end justify-between gap-3">
              <label htmlFor="item-description" className="text-sm text-slate-600">Description (affichée en anglais)</label>

                <Icon name="refresh" className="w-4 h-4" /> Réécrire
              </button>
            </div>
            <textarea id="item-description" value={form.description} onChange={(e) => set('description', e.target.value)}
                      rows={4} className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white"

              Tu peux retoucher le texte : il ne bougera plus tout seul. « Réécrire » repart de tes choix.
              {beforeRewrite != null && (
                <button type="button" onClick={() => { set('description', beforeRewrite); setBeforeRewrite(null); }}

              Laisse vide pour suivre le planning général. Utile quand tu peux te séparer

              </label>
              <label className="block">
                <span className="text-sm text-slate-600">Dernier jour possible</span>
                <input type="date" value={form.available_to || ''}

                  {[

function BookingsPanel({ bookings, setBookings, pushToast }) {
  const [filter, setFilter] = useState('all');

  const update = async (id, status) => {
    const { error } = await sb.from('bookings').update({ status }).eq('id', id);
    if (error) return pushToast('Mise à jour impossible.');
    setBookings(bookings.map((b) => (b.id === id ? { ...b, status } : b)));
    pushToast(status === 'confirmed' ? 'Rendez-vous confirmé.' : 'Rendez-vous refusé, le créneau est libéré.');
  };

  const remove = async (id) => {
    if (!window.confirm('Supprimer ce rendez-vous ?')) return;
    const { error } = await sb.from('bookings').delete().eq('id', id);
    if (error) return pushToast('Suppression impossible.');
    setBookings(bookings.filter((b) => b.id !== id));
  };

  const markAllSeen = async () => {
    const ids = bookings.filter((b) => b.status === 'new').map((b) => b.id);
    if (!ids.length) return;
    await sb.from('bookings').update({ status: 'seen' }).in('id', ids);
    setBookings(bookings.map((b) => (b.status === 'new' ? { ...b, status: 'seen' } : b)));
  };

  const sorted = [...bookings].sort((a, b) => `${a.day} ${a.slot}`.localeCompare(`${b.day} ${b.slot}`));
  const shown = filter === 'all' ? sorted : sorted.filter((b) => String(b.day).slice(0, 10) >= todayKey());
  const newOnes = bookings.filter((b) => b.status === 'new').length;

  const labels = {
    new: ['Nouveau', 'bg-blue-700 text-white'],
    seen: ['Vu', 'bg-slate-100 text-slate-600'],
    confirmed: ['Confirmé', 'bg-blue-50 text-blue-800'],
    declined: ['Refusé', 'bg-slate-100 text-slate-400'],
  };

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div className="flex gap-2">
          {[['all', 'Tous'], ['upcoming', 'À venir']].map(([id, label]) => (
            <button key={id} onClick={() => setFilter(id)}
                    className={`text-sm rounded-lg px-3 py-1.5 border ${
                      filter === id ? 'border-blue-700 text-blue-800 bg-blue-50' : 'border-slate-200 text-slate-600'}`}>
              {label}
            </button>
          ))}
        </div>
        {newOnes > 0 && (
          <button onClick={markAllSeen} className="text-sm text-blue-700 hover:underline">Marquer tout comme lu</button>
        )}
      </div>

      {shown.length === 0 ? (
        <div className="border border-dashed border-blue-200 rounded-xl px-6 py-12 text-center text-slate-600">
          Aucun rendez-vous pour l’instant. Les demandes arrivent ici dès qu’un acheteur réserve un créneau.
        </div>
      ) : (
        <ul className="space-y-3">
          {shown.map((b) => {
            const [label, cls] = labels[b.status] || labels.seen;
            return (
              <li key={b.id} className={`border rounded-xl px-4 py-4 ${b.status === 'new' ? 'border-blue-300 bg-blue-50' : 'border-slate-200'}`}>
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="inline-flex items-center gap-1.5 font-semibold">
                        <Icon name="user" className="w-4 h-4 text-blue-700" /> {b.first_name}
                      </span>
                      <span className={`text-xs rounded-full px-2 py-0.5 ${cls}`}>{label}</span>
                    </div>
                    <p className="mt-1.5 text-sm text-slate-600 flex flex-wrap items-center gap-x-4 gap-y-1">
                      <a href={`tel:${String(b.phone).replace(/\s/g, '')}`} className="inline-flex items-center gap-1.5 text-blue-700 hover:underline">
                        <Icon name="phone" className="w-3.5 h-3.5" /> {b.phone}
                      </a>
                      <span className="inline-flex items-center gap-1.5">
                        <Icon name="calendar" className="w-3.5 h-3.5" /> {fmtDate(b.day, 'fr-FR')}
                      </span>
                      <span className="inline-flex items-center gap-1.5">
                        <Icon name="clock" className="w-3.5 h-3.5" /> {b.slot}
                      </span>
                      {paymentLabel(b.payment, 'fr') && (
                        <span className="inline-flex items-center gap-1.5">
                          <Icon name="card" className="w-3.5 h-3.5" /> {paymentLabel(b.payment, 'fr')}
                        </span>
                      )}
                    </p>
                    <p className="mt-1 text-sm text-slate-500">
                      Pour : {b.quantity > 1 && <strong className="text-slate-800">{b.quantity} × </strong>}{b.item_title}
                    </p>
                  </div>

                  <div className="flex items-center gap-1">
                    {b.status !== 'confirmed' && (
                      <button onClick={() => update(b.id, 'confirmed')}
                              className="inline-flex items-center gap-1.5 text-sm bg-blue-700 hover:bg-blue-800 text-white rounded-lg px-3 py-1.5">
                        <Icon name="check" className="w-4 h-4" /> Confirmer
                      </button>
                    )}
                    {b.status !== 'declined' && (
                      <button onClick={() => update(b.id, 'declined')}
                              className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 text-slate-600 hover:border-slate-400">
                        Refuser
                      </button>
                    )}
                    <button onClick={() => remove(b.id)} className="p-2 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50" aria-label="Supprimer">
                      <Icon name="trash" className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
}

function PlanningPanel({ settings, setSettings, bookings, pushToast }) {
  const settingsJSON = JSON.stringify({ ...DEFAULT_SETTINGS, ...settings });
  const [draft, setDraft] = useState(JSON.parse(settingsJSON));
  const [saving, setSaving] = useState(false);
  const now = new Date();
  const [cursor, setCursor] = useState({ y: now.getFullYear(), m: now.getMonth() });

  useEffect(() => { setDraft(JSON.parse(settingsJSON)); }, [settingsJSON]);

  const dirty = JSON.stringify(draft) !== settingsJSON;
  const set = (k, v) => setDraft((d) => ({ ...d, [k]: v }));

  const busyDates = new Set(bookings.filter((b) => b.status !== 'declined').map((b) => String(b.day).slice(0, 10)));
  const blocked = new Set(draft.blocked || []);
  const cells = monthDays(cursor.y, cursor.m);
  const tKey = todayKey();

  const toggleClosed = (k) => set('blocked', blocked.has(k) ? draft.blocked.filter((x) => x !== k) : [...draft.blocked, k]);

  const submit = async () => {
    setSaving(true);
    const payload = {
      address: draft.address, payment: draft.payment,
      weekdays: draft.weekdays, slots: draft.slots, blocked: draft.blocked,
    };
    const { error } = await sb.from('settings').update(payload).eq('id', 1);
    setSaving(false);
    if (error) return pushToast('Enregistrement impossible.');
    setSettings({ ...DEFAULT_SETTINGS, ...payload, id: 1 });
    pushToast('Planning enregistré.');
  };

  return (
    <div className="space-y-8 pb-24">
      <div className="border border-blue-100 bg-blue-50 rounded-xl px-4 py-3 text-sm text-blue-900">
        Ce planning s’applique par défaut à tous les meubles. Un meuble peut avoir ses
        propres dates et horaires depuis l’onglet Annonces.
      </div>

      <section>
        <h2 className="display font-bold text-lg">Jours où tu peux recevoir</h2>
        <p className="text-sm text-slate-500 mt-0.5">Les jours décochés n’apparaissent pas dans le calendrier des acheteurs.</p>
        <div className="mt-3">
          <WeekdayPicker value={draft.weekdays} onChange={(w) => set('weekdays', w)} />
        </div>
      </section>

      <section>
        <h2 className="display font-bold text-lg">Créneaux proposés</h2>
        <p className="text-sm text-slate-500 mt-0.5">Un créneau déjà réservé se barre automatiquement chez l’acheteur.</p>
        <div className="mt-3">
          <SlotEditor value={draft.slots} onChange={(s) => set('slots', s)} pushToast={pushToast} />
        </div>
      </section>

      <section>
        <h2 className="display font-bold text-lg">Jours fermés</h2>
        <p className="text-sm text-slate-500 mt-0.5">Clique une date pour la fermer : vacances, examens, journée de déménagement.</p>
        <div className="mt-3 max-w-sm border border-slate-200 rounded-xl p-4">
          <div className="flex items-center justify-between mb-3">
            <button onClick={() => setCursor(({ y, m }) => (m === 0 ? { y: y - 1, m: 11 } : { y, m: m - 1 }))}
                    className="p-1.5 rounded hover:bg-blue-50 text-blue-700" aria-label="Mois précédent">
              <Icon name="left" className="w-5 h-5" />
            </button>
            <span className="font-semibold">
              {new Date(cursor.y, cursor.m, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}
            </span>
            <button onClick={() => setCursor(({ y, m }) => (m === 11 ? { y: y + 1, m: 0 } : { y, m: m + 1 }))}
                    disabled={cursorKey(cursor) >= LAST_MONTH}
                    className="p-1.5 rounded text-blue-700 enabled:hover:bg-blue-50 disabled:text-slate-200 disabled:cursor-not-allowed"
                    aria-label="Mois suivant">
              <Icon name="right" className="w-5 h-5" />
            </button>
          </div>
          <div className="grid grid-cols-7 gap-1 text-center text-xs text-slate-400 mb-1">
            {['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((d, i) => <div key={i} className="py-1">{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const k = toKey(d);
              const past = k < tKey || k > LAST_DAY; // avant aujourd'hui ou après la fin de la vente
              const off = blocked.has(k) || !draft.weekdays[(d.getDay() + 6) % 7];
              const hasRdv = busyDates.has(k);
              return (
                <button key={i} disabled={past} onClick={() => toggleClosed(k)}
                        title={k > LAST_DAY ? 'Après la fin de la vente'
                                            : hasRdv ? 'Un rendez-vous est déjà pris ce jour-là' : undefined}
                        className={`h-10 rounded-lg text-sm relative ${
                          past ? 'text-slate-200 cursor-not-allowed'
                               : off ? 'bg-slate-100 text-slate-400 line-through'
                                     : 'hover:bg-blue-50 text-slate-700'}`}>
                  {d.getDate()}
                  {hasRdv && !past && <span className="absolute bottom-1 left-1/2 -ml-0.5 w-1 h-1 rounded-full bg-blue-700" />}
                </button>
              );
            })}
          </div>
          <p className="mt-3 text-xs text-slate-500 flex items-center gap-1.5">
            <span className="w-1.5 h-1.5 rounded-full bg-blue-700 inline-block" />
            Un point bleu signale un rendez-vous déjà pris.
          </p>
        </div>
      </section>

      <section>
        <h2 className="display font-bold text-lg">Lieu de retrait et paiement</h2>
        <div className="mt-3 grid sm:grid-cols-2 gap-3 max-w-2xl">
          <label className="block">
            <span className="text-sm text-slate-600">Adresse affichée sur la carte</span>
            <input value={draft.address || ''} onChange={(e) => set('address', e.target.value)}
                   className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2" placeholder="Alfavej 510, 13" />
          </label>
          <label className="block">
            <span className="text-sm text-slate-600">Paiement (affiché en anglais)</span>
            <input value={draft.payment || ''} onChange={(e) => set('payment', e.target.value)}
                   className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2" placeholder="Revolut or cash" />
          </label>
        </div>
      </section>

      {dirty && (
        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-5 py-3">
          <div className="max-w-5xl mx-auto flex items-center justify-between gap-4">
            <span className="text-sm text-slate-600 inline-flex items-center gap-2">
              <Icon name="alert" className="w-4 h-4 text-blue-700" /> Modifications non enregistrées
            </span>
            <div className="flex gap-2">
              <button onClick={() => setDraft(JSON.parse(settingsJSON))} className="text-sm text-slate-600 hover:text-slate-900 px-3">
                Annuler
              </button>
              <button onClick={submit} disabled={saving}
                      className="font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg px-5 py-2.5 text-sm">
                {saving ? 'Enregistrement…' : 'Enregistrer le planning'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ------------------------------ affiche ----------------------------- */
// L'affiche A4 à imprimer, générée à partir des annonces : on coche les
// meubles qui y figurent avec leur prix, les autres sont cités en une ligne.
// Le choix, les textes retouchés et les paiements affichés restent
// enregistrés dans ce navigateur.

const POSTER_PICKS_KEY = 'meubles-affiche-choix';
const POSTER_TEXTS_KEY = 'meubles-affiche-textes';
const POSTER_PAY_KEY = 'meubles-affiche-paiements';
// Paiements en bas de l'affiche, en anglais comme le reste de l'affiche.
const POSTER_PAY_DEFAULT = ['Revolut', 'Cash'];
const POSTER_PAY_PRESETS = ['Revolut', 'Cash', 'MobilePay'];
const A4_PX = { w: 793.7, h: 1122.5 }; // 210 × 297 mm à 96 px par pouce

function readStored(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v == null ? fallback : v;
  } catch { return fallback; }
}

function writeStored(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* navigation privée */ }
}

// QR code en image, dessiné par qrcode.js dans un div jetable.
function useQrCode(text) {
  const [src, setSrc] = useState(null);
  useEffect(() => {
    if (!text || typeof QRCode === 'undefined') { setSrc(null); return; }
    try {
      const box = document.createElement('div');
      new QRCode(box, {
        text, width: 512, height: 512,
        colorDark: '#16307a', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
      const canvas = box.querySelector('canvas');
      setSrc(canvas ? canvas.toDataURL('image/png') : null);
    } catch { setSrc(null); }
  }, [text]);
  return src;
}

// Texte modifiable directement sur l'affiche ; `children` est le texte par
// défaut. La clé change après chaque modification : React recrée l'élément
// au lieu de se battre avec le contentEditable.
function PosterText({ as: Tag, field, texts, onSave, className, children }) {
  const value = texts[field] != null ? texts[field] : children;
  return (
    <Tag key={value} className={`pst-edit ${className || ''}`}
         contentEditable suppressContentEditableWarning spellCheck={false}
         onBlur={(e) => {
           const text = e.currentTarget.innerText.trim();
           onSave(field, text === children ? null : text);
         }}>
      {value}
    </Tag>
  );
}

// Liste des paiements de l'affiche : on retire, on ajoute un nom libre ou
// on remet en un clic un des moyens habituels.
function PosterPayEditor({ value, onChange }) {
  const [draft, setDraft] = useState('');
  const has = (name) => value.some((p) => p.toLowerCase() === name.toLowerCase());
  const add = (label) => {
    const name = label.trim();
    if (!name || has(name)) return setDraft('');
    onChange([...value, name]);
    setDraft('');
  };

  return (
    <section>
      <h2 className="display font-bold text-lg">Paiements sur l’affiche</h2>
      <p className="text-sm text-slate-500 mt-0.5">Écris-les en anglais, comme le reste de l’affiche.</p>
      <div className="mt-3 flex flex-wrap gap-2">
        {value.map((p) => (
          <span key={p} className="inline-flex items-center gap-2 border border-blue-200 bg-blue-50 text-blue-800 rounded-lg text-sm px-3 py-1.5">
            {p}
            <button type="button" onClick={() => onChange(value.filter((x) => x !== p))}
                    className="text-blue-400 hover:text-red-600" aria-label={`Retirer ${p}`}>
              <Icon name="x" className="w-3.5 h-3.5" />
            </button>
          </span>
        ))}
        {value.length === 0 && <span className="text-sm text-slate-400">Aucun : rien ne s’affiche sous l’adresse.</span>}
      </div>
      <form className="mt-3 flex gap-2" onSubmit={(e) => { e.preventDefault(); add(draft); }}>
        <input value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="Autre (ex. Card)"
               className="flex-1 min-w-0 border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white" />
        <button type="submit"
                className="inline-flex items-center gap-1.5 border border-slate-200 bg-white rounded-lg px-3 py-2 text-sm hover:border-blue-400 hover:text-blue-700">
          <Icon name="plus" className="w-4 h-4" /> Ajouter
        </button>
      </form>
      {POSTER_PAY_PRESETS.some((p) => !has(p)) && (
        <div className="mt-2 flex flex-wrap gap-2">
          {POSTER_PAY_PRESETS.filter((p) => !has(p)).map((p) => (
            <button key={p} type="button" onClick={() => add(p)}
                    className="text-xs border border-blue-200 text-blue-800 rounded-full px-3 py-1 hover:bg-blue-50">
              + {p}
            </button>
          ))}
        </div>
      )}
    </section>
  );
}

function PosterPanel({ items, settings }) {
  const available = items.filter((i) => i.status !== 'sold');
  const [picks, setPicks] = useState(() => readStored(POSTER_PICKS_KEY, null));
  const [texts, setTexts] = useState(() => readStored(POSTER_TEXTS_KEY, {}));
  const [pays, setPays] = useState(() => readStored(POSTER_PAY_KEY, POSTER_PAY_DEFAULT));
  const [link, setLink] = useState(SITE_URL);
  const [scale, setScale] = useState(0.5);
  const [overflow, setOverflow] = useState(false);
  const frameRef = useRef(null);
  const topRef = useRef(null);
  const qr = useQrCode(link.trim());

  // Rien d'enregistré encore : tous les meubles en vente sont cochés.
  const picked = new Set(picks || available.map((i) => i.id));
  const onPoster = available.filter((i) => picked.has(i.id));
  const others = available.filter((i) => !picked.has(i.id));
  // Plus il y a de meubles, plus la liste se resserre (puis passe sur deux colonnes).
  const density = onPoster.length > 10 ? 'is-compact is-cols' : onPoster.length > 6 ? 'is-compact' : '';
  const moreText = others.length
    ? `+ ${others.slice(0, 6).map((i) => i.title).join(', ')}${others.length > 6 ? '…' : ''}`
    : null;

  const savePicks = (ids) => { setPicks(ids); writeStored(POSTER_PICKS_KEY, ids); };
  const toggle = (id) => savePicks(picked.has(id) ? [...picked].filter((x) => x !== id) : [...picked, id]);
  const saveText = (field, value) => {
    const next = { ...texts };
    if (value == null) delete next[field];
    else next[field] = value;
    setTexts(next);
    writeStored(POSTER_TEXTS_KEY, next);
  };
  const resetTexts = () => { setTexts({}); writeStored(POSTER_TEXTS_KEY, {}); };
  const edit = { texts, onSave: saveText };
  const savePays = (list) => { setPays(list); writeStored(POSTER_PAY_KEY, list); };

  // L'aperçu est une vraie page A4, réduite pour tenir dans l'écran.
  useEffect(() => {
    const el = frameRef.current;
    if (!el || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => setScale(Math.min(1, el.clientWidth / A4_PX.w)));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // Prévient quand la liste ne tient plus sur la page.
  useEffect(() => {
    const el = topRef.current;
    if (!el) return;
    const check = () => setOverflow(el.scrollHeight > el.clientHeight + 2);
    check();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(check);
  });

  return (
    <div className="grid lg:grid-cols-[20rem_1fr] gap-8 items-start print:block">
      <div className="space-y-6 print:hidden">
        <section>
          <h2 className="display font-bold text-lg">Meubles sur l’affiche</h2>
          <p className="text-sm text-slate-500 mt-0.5">
            Coche ceux à afficher avec leur prix. Les autres sont cités en une ligne en dessous.
          </p>

          {available.length === 0 ? (
            <p className="mt-3 border border-dashed border-blue-200 rounded-xl px-4 py-6 text-sm text-center text-slate-600">
              Aucun meuble en vente pour l’instant. Ajoute-les dans l’onglet Annonces.
            </p>
          ) : (
            <>
              <div className="mt-3 flex items-center gap-4 text-sm">
                <button onClick={() => savePicks(available.map((i) => i.id))} className="text-blue-700 hover:underline">
                  Tout cocher
                </button>
                <button onClick={() => savePicks([])} className="text-blue-700 hover:underline">
                  Tout décocher
                </button>
                <span className="ml-auto text-slate-500">{onPoster.length} / {available.length}</span>
              </div>
              <ul className="mt-2 border border-slate-200 rounded-xl divide-y divide-slate-100 bg-white overflow-hidden">
                {available.map((item) => (
                  <li key={item.id}>
                    <label className="flex items-center gap-3 px-3 py-2.5 cursor-pointer hover:bg-blue-50">
                      <input type="checkbox" checked={picked.has(item.id)} onChange={() => toggle(item.id)}
                             className="w-5 h-5 accent-blue-700 shrink-0" />
                      <span className="w-10 h-10 rounded-lg bg-blue-50 overflow-hidden shrink-0 flex items-center justify-center">
                        {item.image ? <img src={item.image} alt="" className="w-full h-full object-cover" />
                                    : <Icon name="image" className="w-4 h-4 text-blue-200" />}
                      </span>
                      <span className="flex-1 min-w-0 text-sm font-medium truncate">
                        {item.title}{leftQty(item) > 1 && <span className="font-normal text-slate-500"> ×{leftQty(item)}</span>}
                      </span>
                      <span className="text-sm text-blue-700 whitespace-nowrap">{showPrice(item.price)}</span>
                    </label>
                  </li>
                ))}
              </ul>
              <p className="mt-2 text-xs text-slate-500">Les meubles vendus disparaissent tout seuls de l’affiche.</p>
            </>
          )}
        </section>

        <PosterPayEditor value={pays} onChange={savePays} />

        <label className="block">
          <span className="text-sm text-slate-600">Lien du QR code</span>
          <input type="url" value={link} onChange={(e) => setLink(e.target.value)}
                 className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
        </label>

        {overflow && (
          <div className="flex gap-2 border border-amber-200 bg-amber-50 rounded-xl px-3 py-2.5 text-sm text-amber-900">
            <Icon name="alert" className="w-4 h-4 mt-0.5 shrink-0" />
            L’affiche déborde : décoche un meuble ou raccourcis un texte.
          </div>
        )}

        <div>
          <button onClick={() => window.print()} disabled={onPoster.length === 0 && !moreText}
                  className="w-full inline-flex items-center justify-center gap-2 font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg py-3">
            Imprimer / Enregistrer en PDF
          </button>
          <p className="mt-2 text-xs text-slate-500 leading-relaxed">
            Clique sur un texte de l’affiche pour le modifier. À l’impression : format A4,
            marges « Aucune », « Graphiques d’arrière-plan » coché.
          </p>
          {Object.keys(texts).length > 0 && (
            <button onClick={resetTexts} className="mt-2 text-xs text-slate-500 hover:text-blue-700 underline">
              Remettre les textes d’origine
            </button>
          )}
        </div>
      </div>

      <div ref={frameRef} className="min-w-0">
        <div className="pst-frame mx-auto" style={{ width: A4_PX.w * scale, height: A4_PX.h * scale }}>
          <div className="pst-sheet" style={{ transform: `scale(${scale})` }}>
            <div className="pst-top" ref={topRef}>
              <p className="pst-eyebrow">
                <PosterText as="span" field="eyebrow" {...edit}>My internship ends on 20 November</PosterText>
              </p>
              <PosterText as="h1" field="title" className="pst-title" {...edit}>{'Everything\nmust go'}</PosterText>
              <PosterText as="p" field="lede" className="pst-lede" {...edit}>
                I am leaving Odense on 20 November and my whole flat is for sale. Everything is in very good shape and the prices are low, because it all has to find a new home before I fly out.
              </PosterText>

              {onPoster.length > 0 && (
                <ul className={`pst-list ${density}`}>
                  {onPoster.map((item) => (
                    <li key={item.id}>
                      <span className="pst-name">
                        {item.title}{leftQty(item) > 1 && <span className="pst-qty"> ×{leftQty(item)}</span>}
                      </span>
                      <span className="pst-dots" />
                      <span className="pst-price">
                        {showPrice(item.price)}
                        {leftQty(item) > 1 && priceValue(item.price) > 0 && <span className="pst-qty"> each</span>}
                      </span>
                    </li>
                  ))}
                </ul>
              )}
              {moreText && <p className="pst-more">{moreText}</p>}
            </div>

            <div className="pst-band">
              <div className="pst-qr">
                {qr ? <img src={qr} alt="" />
                    : <div className="pst-qr-empty">Mets le lien du site pour générer le QR code</div>}
              </div>
              <div>
                <PosterText as="h2" field="scan" {...edit}>{'Scan to see the full list\nand book a viewing'}</PosterText>
                <PosterText as="p" field="pickup" {...edit}>
                  {settings.address ? `Pickup at ${settings.address}` : 'Pickup only'}
                </PosterText>
                <PosterText as="p" field="confirm" {...edit}>I will message you to confirm the time</PosterText>
                {pays.length > 0 && (
                  <div className="pst-pay">
                    {pays.map((p) => <span key={p}>{p}</span>)}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
