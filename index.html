<script type="text/babel" data-presets="react">
/* =====================================================================
   Vente de meubles — application complète (React sans build)
   Boutique en anglais, espace vendeur en français, données sur Supabase.
   ===================================================================== */

const { useState, useEffect, useLayoutEffect, useRef, useCallback } = React;

const configured =
  window.CONFIG.SUPABASE_URL.indexOf('TON-PROJET') === -1 &&
  window.CONFIG.SUPABASE_ANON_KEY.indexOf('COLLE-ICI') === -1;

// On accepte aussi l'URL copiée avec /rest/v1 au bout : la bibliothèque
// ajoute les chemins toute seule et n'accepte que la racine du projet.
const SUPABASE_URL = window.CONFIG.SUPABASE_URL
  .trim()
  .replace(/\/(rest|auth|storage|realtime)\/v1\/?$/, '')
  .replace(/\/+$/, '');

// Le lien « mot de passe oublié » reçu par e-mail revient sur cette page avec
// #access_token=…&type=recovery (ou #error=… s'il a expiré). On le lit avant
// que Supabase ne nettoie l'adresse.
const START_HASH = new URLSearchParams(window.location.hash.replace(/^#/, ''));
const FROM_RESET_LINK = START_HASH.get('type') === 'recovery';
const RESET_LINK_FAILED = !!START_HASH.get('error_description');
// …/meubles/#vendeur ouvre directement l'espace vendeur (à mettre en favori).
const START_IN_ADMIN = FROM_RESET_LINK || RESET_LINK_FAILED || /^#(vendeur|admin)$/.test(window.location.hash);
// Là où le lien de réinitialisation doit ramener : cette page-ci.
const SITE_URL = window.location.origin + window.location.pathname;

const sb = configured
  ? window.supabase.createClient(SUPABASE_URL, window.CONFIG.SUPABASE_ANON_KEY.trim())
  : null;

console.log('[meubles] fichier unique — Supabase :', SUPABASE_URL);

const DAYS_FR = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const LINK_PRESETS = ['Facebook Marketplace', 'DBA', 'Leboncoin', 'Vinted'];
const FALLBACK_SLOTS = ['09:00', '10:00', '11:00', '12:00', '14:00', '15:00', '16:00', '17:00', '18:00'];

const DEFAULT_SETTINGS = {
  id: 1,
  address: 'Alfavej 510, 13',
  payment: 'Revolut or cash',
  weekdays: [true, true, true, true, true, true, false],
  slots: FALLBACK_SLOTS,
  blocked: [],
};

/* ---------------------------- objectif ----------------------------- */
// Somme que la vente doit rapporter, en couronnes.
const SALES_GOAL = 3000;

// Les prix sont saisis librement (« 450 kr », « 1.200 », « 1 200,50 »).
// On en extrait un nombre pour pouvoir les additionner.
function priceValue(raw) {
  if (!raw) return 0;
  const cleaned = String(raw)
    .replace(/[^\d.,]/g, '')
    .replace(/[.,](?=\d{3}(\D|$))/g, '')
    .replace(',', '.');
  const n = parseFloat(cleaned);
  return isFinite(n) ? n : 0;
}

const fmtKr = (n) => `${Math.round(n).toLocaleString('da-DK')} kr`;

// Un prix s'affiche toujours suivi de « kr », qu'on l'ait tapé avec ou
// sans : « 450 », « 450kr » et « 450 DKK » donnent tous « 450 kr ».
function withKr(raw) {
  const p = String(raw || '').trim()
    .replace(/^(kr\.?|dkk)\s*/i, '')
    .replace(/\s*(kr\.?|dkk|kroner|,-)$/i, '')
    .trim();
  if (!p) return '';
  return /\d/.test(p) ? `${p} kr` : p;
}

// Le prix vu par les acheteurs : sans prix, c'est gratuit.
const showPrice = (raw) => withKr(raw) || 'Free';

/* ------------------------- plusieurs exemplaires -------------------- */
// Un meuble peut exister en plusieurs exemplaires identiques (2 lits) :
// `quantity` est le nombre mis en vente, `sold_qty` combien sont partis.
// Un meuble passé « vendu » d'un coup compte comme entièrement vendu.
// Avant migration-quantite.sql les colonnes n'existent pas : 1 exemplaire.
const totalQty = (item) => Math.max(1, parseInt(item.quantity, 10) || 1);
const soldQty = (item) =>
  item.status === 'sold' ? totalQty(item) : Math.min(totalQty(item), parseInt(item.sold_qty, 10) || 0);
const leftQty = (item) => totalQty(item) - soldQty(item);

// Prix réellement obtenus, un par exemplaire vendu, dans l'ordre des ventes
// (colonne sale_prices, migration-prix-vente.sql).
const salePrices = (item) =>
  (Array.isArray(item.sale_prices) ? item.sale_prices : []).slice(0, soldQty(item)).map(Number);
// Ce que le meuble a rapporté : les prix notés, et le prix affiché pour les
// exemplaires vendus sans prix noté (avant la mise à jour).
const soldAmount = (item) => {
  const noted = salePrices(item);
  return noted.reduce((a, b) => a + b, 0) + (soldQty(item) - noted.length) * priceValue(item.price);
};

// Prix pour `count` exemplaires : « 900 kr », ou le prix tel quel s'il
// n'y a pas de nombre dedans (gratuit…).
const priceFor = (raw, count) =>
  count > 1 && priceValue(raw) > 0 ? fmtKr(priceValue(raw) * count) : showPrice(raw);

/* --------------------------- meubles réservés ----------------------- */
// Un rendez-vous retient le meuble (ou les exemplaires demandés) : il quitte
// la boutique jusqu'à ce que le vendeur note « vendu » ou « invendu ».
// Avant migration-reservation.sql la colonne outcome n'existe pas : rien
// n'est retenu.
const isPending = (b) => 'outcome' in b && b.status !== 'declined' && !b.outcome;

// Exemplaires retenus, par meuble. Les acheteurs ne lisent pas les
// rendez-vous : la vue booked_items ne leur donne que ces totaux.
async function fetchHeld() {
  const { data, error } = await sb.from('booked_items').select('item_id, qty');
  return error || !data ? {} : Object.fromEntries(data.map((r) => [r.item_id, r.qty]));
}

/* ---------------------------- fin de vente -------------------------- */
// Dernier jour où l'on peut prendre rendez-vous. Après, tout est parti :
// les calendriers s'arrêtent là et on ne peut pas aller au mois suivant.
const LAST_DAY = '2026-11-30';
const LAST_MONTH = LAST_DAY.slice(0, 7); // '2026-11'

/* ---------------------------- paiement ------------------------------ */
// Choix obligatoire à la réservation : l'acheteur annonce comment il paiera.
// `id` est ce qui part en base, `en` s'affiche dans la boutique (anglais),
// `fr` dans l'espace vendeur. L'affiche a sa propre liste (POSTER_PAY_DEFAULT).
// Un moyen `retired` n'est plus proposé mais reste lisible sur les anciens
// rendez-vous. Tout nouvel `id` doit aussi être accepté par la base
// (migration-paiement.sql).
const PAYMENT_METHODS = [
  { id: 'revolut', en: 'Revolut instant transfer', fr: 'Virement instantané Revolut' },
  { id: 'cash', en: 'Cash', fr: 'Espèces' },
  { id: 'mobilepay', en: 'MobilePay', fr: 'MobilePay', retired: true },
];
const paymentLabel = (id, lang) => {
  const m = PAYMENT_METHODS.find((p) => p.id === id);
  return m ? m[lang] : null;
};

/* ------------------------------ dates ------------------------------ */
const pad = (n) => String(n).padStart(2, '0');
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => toKey(new Date());
// '2026-11' pour l'année/mois affichés par un calendrier
const cursorKey = ({ y, m }) => `${y}-${pad(m + 1)}`;

function keyToDate(key) {
  const [y, m, d] = String(key).slice(0, 10).split('-').map(Number);
  return new Date(y, m - 1, d);
}

function fmtDate(key, locale) {
  if (!key) return '';
  return keyToDate(key).toLocaleDateString(locale, {
    weekday: 'long', day: 'numeric', month: 'long',
  });
}

// 'Thu 23 Oct' par défaut, ou le morceau demandé ({ weekday: 'short' }…)
const fmtShort = (key, opts) =>
  keyToDate(key).toLocaleDateString('en-GB', opts || { weekday: 'short', day: 'numeric', month: 'short' });

function monthDays(year, month) {
  const offset = (new Date(year, month, 1).getDay() + 6) % 7; // lundi = 0
  const total = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= total; d++) cells.push(new Date(year, month, d));
  return cells;
}

/* ------------------------------ image ------------------------------ */
function resizeImage(file, max = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('image'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('file'));
    reader.readAsDataURL(file);
  });
}

// Photos en plus de la couverture (table item_photos, migration-photos.sql).
// Elles ne viennent pas avec la liste, trop lourdes pour un téléphone : on
// les charge à l'ouverture de la galerie, une fois par meuble.
const MAX_PHOTOS = 8;
const extraPhotoCache = new Map();

async function fetchExtraPhotos(itemId, fresh) {
  if (!fresh && extraPhotoCache.has(itemId)) return extraPhotoCache.get(itemId);
  const { data, error } = await sb.from('item_photos').select('photos').eq('item_id', itemId).maybeSingle();
  if (error) throw error;
  const photos = data && Array.isArray(data.photos) ? data.photos : [];
  extraPhotoCache.set(itemId, photos);
  return photos;
}

/* ---------------------------- statistiques -------------------------- */
// Compteur maison, sans cookie ni outil extérieur : la boutique ajoute une
// ligne dans la table visits (migration-stats.sql) pour chaque visite et
// chaque meuble regardé, une seule fois par session (onglet ouvert). Le
// vendeur et les essais en local ne comptent pas.
const STATS_KEY = 'meubles-stats';
// Posé sur un appareil où le vendeur s'est connecté une fois : ses
// visites de la boutique ne comptent plus, même déconnecté.
const SELLER_DEVICE_KEY = 'meubles-appareil-vendeur';
let tracker = null; // { session, sent } quand on compte, null sinon

function saveTracker() {
  try { sessionStorage.setItem(STATS_KEY, JSON.stringify(tracker)); } catch { /* navigation privée */ }
}

function track(kind, itemId, extra) {
  if (!tracker) return;
  const key = `${kind} ${itemId || ''}`;
  if (tracker.sent.includes(key)) return;
  tracker.sent.push(key);
  saveTracker();
  sb.from('visits')
    .insert({ kind, session: tracker.session, item_id: itemId || null, ...extra })
    // Table absente (migration-stats.sql pas lancé) : on arrête de compter.
    .then(({ error }) => { if (error) tracker = null; });
}

// Une visite. Le QR code de l'affiche mène à l'adresse nue du site : une
// arrivée sur téléphone, sans site d'origine et sans rien après l'adresse,
// compte comme un scan. C'est une estimation : taper l'adresse à la main
// sur son téléphone compte aussi.
function startStats() {
  if (!sb || location.protocol === 'file:' || /^(localhost|127\.|192\.168\.)/.test(location.hostname)) return;
  try { if (localStorage.getItem(SELLER_DEVICE_KEY)) return; } catch { /* navigation privée */ }
  try { tracker = JSON.parse(sessionStorage.getItem(STATS_KEY)); } catch { tracker = null; }
  if (!tracker) {
    const session = window.crypto && crypto.randomUUID ? crypto.randomUUID()
      : `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 12)}`;
    tracker = { session, sent: [] };
  }
  let source = null;
  try { source = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, '') : null; } catch { /* lien illisible */ }
  if (source === location.hostname) source = null;
  const mobile = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  track('visit', null, { source, mobile, qr: !source && mobile && !location.search && !location.hash });
}

// Le vendeur vient de se connecter : on arrête de compter, on efface ce
// qui est déjà parti pour cette session (visite, meubles regardés) et on
// note l'appareil pour ne plus jamais le compter.
function forgetSellerVisit() {
  try { localStorage.setItem(SELLER_DEVICE_KEY, '1'); } catch { /* navigation privée */ }
  let session = tracker && tracker.session;
  if (!session) {
    try { session = (JSON.parse(sessionStorage.getItem(STATS_KEY)) || {}).session; } catch { /* rien */ }
  }
  tracker = null;
  try { sessionStorage.removeItem(STATS_KEY); } catch { /* navigation privée */ }
  if (session) sb.from('visits').delete().eq('session', session).then(() => {});
}

/* ------------------------------ icônes ----------------------------- */
const PATHS = {
  calendar: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
  clock: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',
  phone: 'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z',

function SlotEditor({ value, onChange, pushToast, compact }) {
  const [draft, setDraft] = useState('');
  const slots = value || [];

  const add = () => {
    if (!/^\d{2}:\d{2}$/.test(draft)) return pushToast('Choisis une heure valide.');
    if (slots.includes(draft)) return pushToast('Ce créneau existe déjà.');
    onChange([...slots, draft].sort());
    setDraft('');

  return (
    <div>
      <div className="flex flex-wrap gap-2">

/* ---- horaires réellement applicables à un meuble donné ------------- */
function scheduleFor(item, settings) {
  const custom = item.custom_schedule;
  const weekdays = (custom && Array.isArray(item.weekdays) ? item.weekdays : settings.weekdays) || DEFAULT_SETTINGS.weekdays;
  const slots = (custom && Array.isArray(item.slots) && item.slots.length ? item.slots : settings.slots) || FALLBACK_SLOTS;
  const from = item.available_from ? String(item.available_from).slice(0, 10) : null;
  const itemUntil = item.available_to ? String(item.available_to).slice(0, 10) : null;
  // Rien au-delà du dernier jour de vente, même si l'annonce dit plus tard.
  const until = itemUntil && itemUntil < LAST_DAY ? itemUntil : LAST_DAY;
  const start = from && from > todayKey() ? from : todayKey();
  return { weekdays, slots, from, until, start, closed: new Set(settings.blocked || []) };
}

// Créneaux d'un jour : [{ time, free }]. Aujourd'hui, les heures passées disparaissent.
function slotsFor(k, plan, taken) {
  const now = new Date();
  const nowHM = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  return plan.slots
    .filter((s) => k !== todayKey() || s > nowHM)
    .map((s) => ({ time: s, free: !taken.has(`${k} ${s}`) }));
}

// Jours proposés à l'acheteur : ouverts, et avec au moins un créneau libre.
function bookableDays(plan, taken) {
  const out = [];
  for (let d = keyToDate(plan.start); toKey(d) <= plan.until; d.setDate(d.getDate() + 1)) {
    const k = toKey(d);
    if (!plan.weekdays[(d.getDay() + 6) % 7] || plan.closed.has(k)) continue;
    if (slotsFor(k, plan, taken).some((s) => s.free)) out.push(k);
  }
  return out;
}

  const [manyPhotos, setManyPhotos] = useState(false);

  const pushToast = useCallback((text, tone) => {
    const id = Math.random().toString(36).slice(2);

    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 6000);
  }, []);

  /* ---- session ---- */
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => {
      setSession(data.session);
      // Revenu par le lien mais sans session : il a expiré ou déjà servi.
      if (FROM_RESET_LINK && !data.session) {
        setRecovering(false);
        setLinkProblem(true);
      }
      // Le vendeur connecté, ou arrivé par #vendeur, ne compte pas dans les stats.
      if (!data.session && !START_IN_ADMIN) startStats();
      setAuthReady(true);
    });
    const { data } = sb.auth.onAuthStateChange((event, s) => {
      setSession(s);
      if (s) {
        setLinkProblem(false);
        // Hors du rappel : Supabase bloque les requêtes lancées pendant celui-ci.
        setTimeout(forgetSellerVisit, 0);
      }
      if (event === 'PASSWORD_RECOVERY') {
        setRecovering(true);
        setRoute('admin');
      }
    });
    return () => data.subscription.unsubscribe();
  }, []);

  // #vendeur tapé à la main dans l'adresse, page déjà ouverte.
  useEffect(() => {
    const onHash = () => { if (/^#(vendeur|admin)$/.test(window.location.hash)) setRoute('admin'); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // L'adresse suit l'écran : …/#vendeur se met en favori, la boutique reste propre.
  const goAdmin = () => {
    setRoute('admin');
    window.history.replaceState(null, '', '#vendeur');
    window.scrollTo(0, 0);
  };
  const goShop = () => {
    // Le vendeur a pu noter des ventes entre-temps.
    refreshHeld();
    setRoute('shop');
    window.history.replaceState(null, '', window.location.pathname + window.location.search);
    window.scrollTo(0, 0);
  };

  /* ---- données publiques ---- */
  const loadPublic = useCallback(async () => {
    if (!sb) return setReady(true);
    const [it, st, bs, ph, hd] = await Promise.all([
      sb.from('items').select('*').order('created_at', { ascending: false }),
      sb.from('settings').select('*').eq('id', 1).maybeSingle(),
      sb.from('busy_slots').select('day, slot'),
      // Seulement les nombres, pas les photos.
      sb.from('item_photos').select('item_id, photo_count'),
      fetchHeld(),
    ]);
    if (it.data) setItems(it.data);
    if (st.data) setSettings({ ...DEFAULT_SETTINGS, ...st.data });
    if (bs.data) setBusy(bs.data);
    setHeld(hd);
    setManyPhotos(!ph.error);
    if (ph.data) setPhotoCounts(Object.fromEntries(ph.data.map((r) => [r.item_id, r.photo_count])));
    extraPhotoCache.clear();
    setLoadFailed(!!it.error);
    setReady(true);
  }, []);

  const refreshHeld = useCallback(async () => {
    if (sb) setHeld(await fetchHeld());
  }, []);

  const markBusy = (row) => setBusy((prev) => [...prev, { day: row.day, slot: row.slot }]);

  const loadBookings = useCallback(async () => {
    if (!sb || !session) return;
    const { data } = await sb.from('bookings').select('*').order('day').order('slot');
    if (data) setBookings(data);
  }, [session]);

  useEffect(() => { loadPublic(); }, [loadPublic]);
  useEffect(() => { loadBookings(); }, [loadBookings]);

  /* ---- alerte temps réel sur les nouveaux rendez-vous ---- */
  useEffect(() => {
    if (!sb || !session) return;
    const channel = sb
      .channel('bookings-feed')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings' }, (payload) => {
        const b = payload.new;
        setBookings((prev) => (prev.some((x) => x.id === b.id) ? prev : [...prev, b]));
        setBusy((prev) => [...prev, { day: b.day, slot: b.slot }]);
        pushToast(`Nouveau rendez-vous — ${b.first_name}${b.quantity > 1 ? ` (${b.quantity} × ${b.item_title})` : ''}, ${fmtDate(b.day, 'fr-FR')} à ${b.slot}`, 'new');
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [session, pushToast]);

  const newCount = bookings.filter((b) => b.status === 'new').length;

  if (!configured) {
    return (
      <div className="max-w-xl mx-auto px-5 py-24">
        <h1 className="display text-2xl font-bold">Configuration à terminer</h1>
        <p className="mt-3 text-slate-600 leading-relaxed">
          Ouvre <code className="bg-blue-50 px-1.5 py-0.5 rounded">index.html</code> et remplace
          les deux valeurs de <code className="bg-blue-50 px-1.5 py-0.5 rounded">window.CONFIG</code>{' '}
          par l’URL et la clé anon de ton projet Supabase, puis recharge la page.
        </p>
      </div>
    );
  }

  return (
    <div className="min-h-screen">
      {route === 'shop' ? (
        <Shop
          items={items}
          photoCounts={photoCounts}
          settings={settings}
          busy={busy}
          held={held}
          ready={ready}
          loadFailed={loadFailed}
          onRetry={() => { setReady(false); loadPublic(); }}
          onAdmin={goAdmin}
          onSlotTaken={markBusy}
          onBooked={(row) => {
            markBusy(row);
            // Le meuble quitte la liste tout de suite, sans recharger.
            setHeld((prev) => ({ ...prev, [row.item_id]: (prev[row.item_id] || 0) + (row.quantity || 1) }));
          }}
          onItemTaken={refreshHeld}
        />
      ) : (
        <Admin
          session={session}
          authReady={authReady}
          recovering={recovering}
          linkProblem={linkProblem}
          onRecovered={() => {
            setRecovering(false);
            pushToast('Nouveau mot de passe enregistré.');
          }}
          items={items}
          setItems={setItems}
          manyPhotos={manyPhotos}
          photoCounts={photoCounts}
          setPhotoCounts={setPhotoCounts}
          bookings={bookings}
          setBookings={setBookings}
          settings={settings}
          setSettings={setSettings}
          newCount={newCount}
          reload={() => { loadPublic(); loadBookings(); }}
          pushToast={pushToast}
          onShop={goShop}
        />
      )}

      <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 w-80 max-w-[calc(100vw-2rem)] print:hidden">
        {toasts.map((t) => (
          <div key={t.id}
               className={`rounded-lg px-4 py-3 text-sm shadow-lg border flex items-start gap-2 ${
                 t.tone === 'new' ? 'bg-blue-700 text-white border-blue-800'
                                  : 'bg-white text-slate-800 border-slate-200'}`}>
            <Icon name="bell" className="w-4 h-4 mt-0.5 shrink-0" />
            <span>{t.text}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// Pensée pour le téléphone : la plupart des acheteurs arrivent par le QR
// code de l'affiche. Une colonne, gros boutons, réservation en 2 étapes.

const PRIMARY_BTN = 'w-full inline-flex items-center justify-center gap-2 font-semibold text-white rounded-xl py-3.5 '
  + 'bg-blue-700 hover:bg-blue-800 active:bg-blue-900 disabled:bg-slate-200 disabled:text-slate-500 disabled:cursor-not-allowed';

// Recherche : chaque mot tapé doit commencer un mot du titre ou de la
// description, sans tenir compte des majuscules ni des accents. « table »
// ne trouve donc pas « comfortable », et « chairs » trouve « chair ».
const searchWords = (text) =>
  String(text || '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase()
    .split(/[^\p{L}\p{N}]+/u).filter(Boolean);

function matchesSearch(item, query) {
  const words = searchWords(`${item.title} ${item.description}`);
  return searchWords(query).every((q) => {
    const stem = q.replace(/e?s$/, '');
    return words.some((w) => w.startsWith(stem.length >= 2 ? stem : q));
  });
}

// Tant qu'une fenêtre est ouverte (réservation, photo) : la page derrière
// ne défile plus et la touche Échap la ferme.
function useOverlay(onClose) {
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') closeRef.current(); };
    window.addEventListener('keydown', onKey);
    return () => {
      document.body.style.overflow = prev;
      window.removeEventListener('keydown', onKey);
    };
  }, []);
}

            </button>
          </div>
        ) : available.length === 0 ? (
          <div className="border border-dashed border-blue-200 rounded-2xl bg-white px-6 py-14 text-center">
            <h3 className="display font-bold text-xl mb-1">Nothing listed right now</h3>
            <p className="text-slate-600">Check back soon — items are added as I pack up.</p>
          </div>
        ) : shown.length === 0 ? (
          <div className="border border-dashed border-blue-200 rounded-2xl bg-white px-6 py-14 text-center">
            <h3 className="display font-bold text-xl mb-1">Nothing matches “{query.trim()}”</h3>
            <p className="text-slate-600">Try another word, like table, chair or lamp.</p>
            <button onClick={() => setQuery('')}
                    className="mt-5 inline-flex items-center gap-2 font-semibold border border-blue-200 text-blue-800 rounded-xl px-5 py-3 hover:bg-blue-50">
              <Icon name="x" className="w-4 h-4" /> Clear search
            </button>
          </div>
        ) : (
          <ul className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
            {shown.map((item) => (
              <ItemCard key={item.id} item={item} left={freeQty(item)} photoTotal={photoTotal(item)}
                        onBook={() => { track('item_book', item.id); setBooking(item); }}
                        onPhoto={() => { track('item_photos', item.id); setPhoto(item); }} />
            ))}
          </ul>
        )}

        <PickupMap address={settings.address} />
      </main>

      <footer className="border-t border-slate-200 bg-white">
        <div className="max-w-5xl mx-auto px-5 py-6 flex flex-wrap items-center justify-between gap-3 text-sm text-slate-500">
          <span>Pickup only · {settings.payment}</span>
          <button onClick={onAdmin}
                  className="inline-flex items-center gap-1.5 text-slate-400 hover:text-blue-700">
            <Icon name="lock" className="w-3.5 h-3.5" /> Seller access
          </button>
        </div>
      </footer>

      {booking && (
        <BookingSheet
          item={booking}
          left={freeQty(booking)}
          busy={busy}
          settings={settings}
          onClose={() => setBooking(null)}
          onTaken={onSlotTaken}
          onBooked={onBooked}
          onItemTaken={onItemTaken}
        />
      )}
      {photo && (
        <PhotoViewer
          item={photo}
          total={photoTotal(photo)}
          onClose={() => setPhoto(null)}
          onBook={() => { track('item_book', photo.id); setPhoto(null); setBooking(photo); }}
        />
      )}
    </div>
  );
}

function ItemCard({ item, left, photoTotal, onBook, onPhoto }) {
  const links = Array.isArray(item.links) ? item.links : [];
  const from = item.available_from ? String(item.available_from).slice(0, 10) : null;
  const several = totalQty(item) > 1;
  // Les longues descriptions sont coupées à 5 lignes, « Read more » les déplie.
  const [expanded, setExpanded] = useState(false);
  const [clipped, setClipped] = useState(false);
  const descRef = useRef(null);
  useEffect(() => {
    const el = descRef.current;
    if (!el || expanded) return;
    const check = () => setClipped(el.scrollHeight > el.clientHeight + 1);
    check();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(check);
  }, [item.description, expanded]);

  // Stats : la fiche compte comme vue quand elle reste au moins une seconde
  // à moitié à l'écran.
  const cardRef = useRef(null);
  useEffect(() => {
    const el = cardRef.current;
    if (!el || typeof IntersectionObserver === 'undefined') return;
    let timer;
    const io = new IntersectionObserver(([entry]) => {
      clearTimeout(timer);
      if (entry.isIntersecting) timer = setTimeout(() => { track('item_seen', item.id); io.disconnect(); }, 1000);
    }, { threshold: 0.5 });
    io.observe(el);
    return () => { clearTimeout(timer); io.disconnect(); };
  }, [item.id]);

  return (
    <li ref={cardRef} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
      <div className="relative aspect-[4/3] bg-blue-50">
        {item.image ? (
          <button onClick={onPhoto} className="block w-full h-full"
                  aria-label={photoTotal > 1 ? `See the ${photoTotal} photos of ${item.title}` : `Bigger photo of ${item.title}`}>
            <img src={item.image} alt={item.title} className="w-full h-full object-cover" />
            {photoTotal > 1 && (
              <span className="absolute bottom-3 right-3 inline-flex items-center gap-1.5 text-xs font-semibold bg-black/60 text-white rounded-full px-3 py-1">
                <Icon name="image" className="w-3.5 h-3.5" /> {photoTotal} photos
              </span>
            )}
          </button>
        ) : (
          <div className="w-full h-full flex flex-col items-center justify-center gap-1 text-blue-300 text-sm">
            <Icon name="image" className="w-10 h-10" /> No photo
          </div>
        )}
        {from && from > todayKey() && (
          <span className="absolute top-3 left-3 inline-flex items-center gap-1.5 text-xs font-semibold bg-white text-blue-800 rounded-full px-3 py-1 shadow-sm">
            <Icon name="calendar" className="w-3.5 h-3.5" /> Available from {fmtShort(from, { day: 'numeric', month: 'short' })}
          </span>
        )}
      </div>

      <div className="p-4 sm:p-5 flex flex-col flex-1">
        <div className="flex items-start justify-between gap-3">
          <h3 className="display font-bold text-xl leading-snug">{item.title}</h3>
          <span className="shrink-0 text-right">
            <span className="block display font-bold text-xl text-blue-700 whitespace-nowrap">{showPrice(item.price)}</span>
            {several && priceValue(item.price) > 0 && <span className="block text-xs text-slate-500">each</span>}
          </span>
        </div>

        {(several || item.condition) && (
          <p className="mt-1 text-sm text-slate-500">
            {several && (
              <span className="font-semibold text-blue-800">
                {left > 1 ? `${left} available` : 'Last one left'}
              </span>
            )}
            {several && item.condition && ' · '}
            {item.condition && `Condition: ${item.condition}`}
          </p>
        )}

        {item.description && (
          <>
            <p ref={descRef} className={`mt-2 text-slate-700 leading-relaxed whitespace-pre-line ${expanded ? '' : 'line-clamp-5'}`}>
              {item.description}
            </p>
            {(clipped || expanded) && (
              <button onClick={() => setExpanded(!expanded)}
                      className="mt-1 self-start text-sm font-semibold text-blue-700 hover:underline">
                {expanded ? 'Show less' : 'Read more'}
              </button>
            )}
          </>
        )}

        {links.length > 0 && (
          <p className="mt-3 text-sm text-slate-500 flex flex-wrap items-center gap-x-3 gap-y-1">
            <span>Also on</span>
            {links.map((l, i) => (
              <a key={i} href={l.url} target="_blank" rel="noreferrer"
                 className="inline-flex items-center gap-1 text-blue-700 hover:underline">
                {l.label} <Icon name="external" className="w-3.5 h-3.5" />
              </a>
            ))}
          </p>
        )}

        <div className="mt-auto pt-4">
          <button onClick={onBook} className={PRIMARY_BTN}>
            <Icon name="calendar" className="w-5 h-5" /> Book a viewing
          </button>
        </div>
      </div>
    </li>
  );
}

// Galerie plein écran : on glisse du doigt d'une photo à l'autre (défilement
// natif aimanté), flèches et clavier sur ordinateur. La couverture s'affiche
// tout de suite, les autres arrivent dès qu'elles sont chargées.
function PhotoViewer({ item, total, onClose, onBook }) {
  useOverlay(onClose);
  const [photos, setPhotos] = useState(() =>
    [item.image, ...Array.from({ length: Math.max(0, total - 1) }, () => null)]);
  const [index, setIndex] = useState(0);
  const stripRef = useRef(null);

  useEffect(() => {
    if (total < 2) return;
    let alive = true;
    fetchExtraPhotos(item.id)
      .then((extras) => { if (alive) setPhotos([item.image, ...extras]); })
      .catch(() => { if (alive) setPhotos([item.image]); });
    return () => { alive = false; };
  }, [item.id]);

  const go = (i) => {
    const el = stripRef.current;
    const n = Math.max(0, Math.min(photos.length - 1, i));
    if (el) el.scrollTo({ left: n * el.clientWidth, behavior: 'smooth' });
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight') go(index + 1);
      if (e.key === 'ArrowLeft') go(index - 1);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  const stop = (e) => e.stopPropagation();
  const arrow = 'hidden sm:flex absolute top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 '
    + 'text-white items-center justify-center disabled:opacity-0';

  return (
    <div className="fixed inset-0 z-50 bg-black/90 flex flex-col" onClick={onClose}
         role="dialog" aria-modal="true" aria-label={item.title}>
      <div className="flex items-center justify-between gap-3 px-4 py-3 text-white">
        <p className="font-semibold truncate">{item.title}</p>
        <div className="flex items-center gap-3 shrink-0">
          {photos.length > 1 && <span className="text-sm text-white/70 tabular-nums">{index + 1} / {photos.length}</span>}
          <button onClick={onClose} className="p-2 rounded-full bg-white/10 hover:bg-white/20" aria-label="Close">
            <Icon name="x" className="w-6 h-6" />
          </button>
        </div>
      </div>
      <div className="relative flex-1 min-h-0">
        <div ref={stripRef} className="h-full flex overflow-x-auto snap-x snap-mandatory no-scrollbar"
             onScroll={(e) => setIndex(Math.round(e.currentTarget.scrollLeft / e.currentTarget.clientWidth))}>
          {photos.map((src, i) => (
            <div key={i} className="w-full h-full shrink-0 snap-center flex items-center justify-center p-2">
              {src ? (
                <img src={src} alt={`${item.title}, photo ${i + 1}`} onClick={stop}
                     className="max-w-full max-h-full object-contain" />
              ) : (
                <span className="w-10 h-10 rounded-full border-2 border-white/20 border-t-white animate-spin" aria-label="Loading" />
              )}
            </div>
          ))}
        </div>
        {photos.length > 1 && (
          <>
            <button onClick={(e) => { stop(e); go(index - 1); }} disabled={index === 0}
                    className={`${arrow} left-4`} aria-label="Previous photo">
              <Icon name="left" className="w-7 h-7" />
            </button>
            <button onClick={(e) => { stop(e); go(index + 1); }} disabled={index >= photos.length - 1}
                    className={`${arrow} right-4`} aria-label="Next photo">
              <Icon name="right" className="w-7 h-7" />
            </button>
          </>
        )}
      </div>
      {photos.length > 1 && (
        <div className="flex justify-center gap-1 pt-3" onClick={stop}>
          {photos.map((_, i) => (
            <button key={i} onClick={() => go(i)} className="p-1" aria-label={`Photo ${i + 1}`} aria-current={i === index}>
              <span className={`block w-2 h-2 rounded-full ${i === index ? 'bg-white' : 'bg-white/35'}`} />
            </button>
          ))}
        </div>
      )}
      <div className="p-4" onClick={stop}>
        <button onClick={onBook}
                className="w-full max-w-md mx-auto flex items-center justify-center gap-2 font-semibold bg-white text-blue-800 rounded-xl py-3.5">
          <Icon name="calendar" className="w-5 h-5" /> Book a viewing · {showPrice(item.price)}
        </button>
      </div>
    </div>
  );
}

function PickupMap({ address }) {
  if (!address) return null;
  const q = encodeURIComponent(address);
  return (
    <section id="where" className="mt-12 scroll-mt-4">
      <h2 className="display font-bold text-2xl">Where to pick up</h2>
      <p className="mt-1 text-slate-600 inline-flex items-center gap-2">
        <Icon name="pin" className="w-4 h-4 text-blue-700" /> {address}
      </p>
      <div className="mt-4 rounded-2xl overflow-hidden border border-slate-200 bg-blue-50 h-64 sm:h-72">
        <iframe title="Pickup location" className="w-full h-full" style={{ border: 0 }} loading="lazy"
                src={`https://maps.google.com/maps?q=${q}&z=15&output=embed`} />
      </div>
      <a href={`https://www.google.com/maps/dir/?api=1&destination=${q}`} target="_blank" rel="noreferrer"
         className="mt-3 w-full sm:w-auto inline-flex items-center justify-center gap-2 font-semibold bg-white border border-blue-200 text-blue-800 rounded-xl px-5 py-3 hover:bg-blue-50">
        <Icon name="pin" className="w-4 h-4" /> Get directions
      </a>
    </section>
  );
}

function BookingSheet({ item, left, busy, settings, onClose, onTaken, onBooked, onItemTaken }) {
  const plan = scheduleFor(item, settings);
  const taken = new Set(busy.map((b) => `${String(b.day).slice(0, 10)} ${b.slot}`));
  const days = bookableDays(plan, taken);

  const [step, setStep] = useState(1);
  // Le premier jour libre est déjà choisi : les heures s'affichent tout de suite.
  const [day, setDay] = useState(() => days[0] || null);
  const [slot, setSlot] = useState(null);
  const [firstName, setFirstName] = useState('');
  const [phone, setPhone] = useState('');
  const [payment, setPayment] = useState('');
  // Plusieurs exemplaires en vente : l'acheteur dit combien il en prend
  // (`left` : ceux qui ne sont ni vendus ni réservés).
  const [count, setCount] = useState(1);
  const [error, setError] = useState('');
  const [sending, setSending] = useState(false);
  const [done, setDone] = useState(null);
  // Quelqu'un d'autre vient de réserver le dernier exemplaire.
  const gone = !done && left < 1;
  const bodyRef = useRef(null);
  const timesRef = useRef(null);
  useOverlay(onClose);

  const times = day ? slotsFor(day, plan, taken) : [];
  const tKey = todayKey();
  const tomorrow = (() => { const t = new Date(); t.setDate(t.getDate() + 1); return toKey(t); })();

  // Chaque nouvel écran repart du haut.
  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = 0; }, [step, done]);

  const pickDay = (k) => {
    setDay(k);
    setSlot(null);
    setError('');
    if (timesRef.current) timesRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  const backToTimes = (message) => {
    setSlot(null);
    setStep(1);
    setError(message || '');
  };

  const submit = async () => {
    if (firstName.trim().length < 2) return setError('Please enter your first name.');
    if (phone.replace(/\D/g, '').length < 6) return setError('Please enter a valid phone number.');
    if (!payment) return setError('Please choose how you will pay.');
    if (taken.has(`${day} ${slot}`)) return backToTimes('Sorry, that time was just taken. Please pick another one.');
    setError('');
    setSending(true);
    const row = {
      item_id: item.id,
      item_title: item.title,
      first_name: firstName.trim(),
      phone: phone.trim(),
      payment,
      day,
      slot,
      status: 'new',
      // Envoyé seulement s'il sert : la réservation marche même si
      // migration-quantite.sql n'a pas encore été lancé.
      ...(count > 1 ? { quantity: count } : {}),
    };
    const { error: err } = await sb.from('bookings').insert(row);
    setSending(false);
    // 23505 = quelqu'un d'autre a réservé ce créneau entre-temps.
    if (err && err.code === '23505') {
      onTaken(row);
      return backToTimes('Sorry, someone just took that time. Please pick another one.');
    }
    // item_taken = quelqu'un d'autre vient de réserver ce meuble
    // (migration-reservation.sql). La liste est relue : s'il n'en reste
    // plus, la fenêtre le dit.
    if (err && err.message === 'item_taken') {
      setCount(1);
      onItemTaken();
      return setError('Sorry, someone else just booked this item.');
    }
    if (err) return setError('Something went wrong. Please try again.');
    onBooked(row);
    setDone(row);
  };

  const dayChip = (k) => {
    const on = k === day;
    const sub = on ? 'text-blue-100' : 'text-slate-500';
    return (
      <button key={k} onClick={() => pickDay(k)} aria-pressed={on}
              className={`snap-start shrink-0 w-[4.75rem] rounded-xl border py-2.5 text-center ${
                on ? 'bg-blue-700 border-blue-700 text-white'
                   : 'bg-white border-slate-200 text-slate-800 hover:border-blue-400'}`}>
        <span className={`block text-xs font-medium ${sub}`}>
          {k === tKey ? 'Today' : k === tomorrow ? 'Tomorrow' : fmtShort(k, { weekday: 'short' })}
        </span>
        <span className="block text-xl font-bold leading-tight">{keyToDate(k).getDate()}</span>
        <span className={`block text-xs ${sub}`}>{fmtShort(k, { month: 'short' })}</span>
      </button>
    );
  };

  const stepOne = (
    <div>
      <h3 className="font-semibold text-lg">Which day can you come?</h3>
      {days.length === 0 ? (
        <p className="mt-3 rounded-xl bg-slate-50 border border-slate-200 px-4 py-6 text-center text-slate-600">
          Sorry, there are no free times left for this item.
        </p>
      ) : (
        <>
          <div className="mt-3 -mx-5 px-5 scroll-px-5 flex gap-2 overflow-x-auto snap-x no-scrollbar pb-1 sm:mx-0 sm:px-0 sm:flex-wrap sm:overflow-visible">
            {days.map(dayChip)}
          </div>
          {days.length > 4 && <p className="mt-1.5 text-xs text-slate-400 sm:hidden">Swipe for more days →</p>}
        </>
      )}

      {day && (
        <div ref={timesRef} className="mt-7 scroll-mt-4">
          <h3 className="font-semibold text-lg">What time?</h3>
          <p className="text-sm text-slate-500">{fmtDate(day, 'en-GB')}</p>
          <div className="mt-3 grid grid-cols-3 sm:grid-cols-4 gap-2">
            {times.map(({ time, free }) => {
              const on = slot === time;
              return (
                <button key={time} disabled={!free} aria-pressed={on}
                        onClick={() => { setSlot(time); setError(''); }}
                        className={`py-3 rounded-xl border text-base font-semibold ${
                          !free ? 'border-slate-100 text-slate-300 line-through cursor-not-allowed'
                                : on ? 'bg-blue-700 border-blue-700 text-white'
                                     : 'bg-white border-slate-200 text-slate-800 hover:border-blue-400'}`}>
                  {time}
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );

  const field = 'mt-1.5 w-full border border-slate-300 rounded-xl px-4 py-3 text-base bg-white';
  const stepTwo = (
    <div>
      <button onClick={() => backToTimes()}
              className="w-full text-left rounded-xl bg-blue-50 border border-blue-100 px-4 py-3 flex items-center gap-3">
        <Icon name="calendar" className="w-5 h-5 text-blue-700 shrink-0" />
        <span className="flex-1 min-w-0">
          <span className="block font-semibold">{fmtShort(day)} at {slot}</span>
          {settings.address && <span className="block text-sm text-slate-600 truncate">Pickup at {settings.address}</span>}
        </span>
        <span className="text-sm font-semibold text-blue-700">Change</span>
      </button>

      {left > 1 && (
        <div className="mt-6">
          <span className="font-semibold">How many do you want?</span>
          <span className="block text-sm text-slate-500">{left} available · {showPrice(item.price)} each</span>
          <div className="mt-2 flex items-center gap-3">
            <button type="button" onClick={() => setCount(Math.max(1, count - 1))} disabled={count <= 1}
                    className="w-12 h-12 rounded-xl border border-slate-300 bg-white text-2xl font-semibold text-slate-700 disabled:border-slate-100 disabled:text-slate-300"
                    aria-label="One less">−</button>
            <span className="w-8 text-center text-2xl font-bold tabular-nums" aria-live="polite">{count}</span>
            <button type="button" onClick={() => setCount(Math.min(left, count + 1))} disabled={count >= left}
                    className="w-12 h-12 rounded-xl border border-slate-300 bg-white text-2xl font-semibold text-slate-700 disabled:border-slate-100 disabled:text-slate-300"
                    aria-label="One more">+</button>
            <span className="ml-auto font-semibold text-blue-700">{priceFor(item.price, count)}</span>
          </div>
        </div>
      )}

      <label className="block mt-6">
        <span className="font-semibold">Your first name</span>
        <input value={firstName} onChange={(e) => setFirstName(e.target.value)}
               autoComplete="given-name" className={field} placeholder="Marie" />
      </label>

      <label className="block mt-4">
        <span className="font-semibold">Your phone number</span>
        <span className="block text-sm text-slate-500">I will text you on it to confirm.</span>
        <input type="tel" value={phone} onChange={(e) => setPhone(e.target.value)}
               autoComplete="tel" className={field} placeholder="+45 12 34 56 78" />
      </label>

      <fieldset className="mt-6">
        <legend className="font-semibold">How will you pay?</legend>
        <span className="block text-sm text-slate-500">Nothing to pay now — you pay when you pick it up.</span>
        <div className="mt-2 grid gap-2" role="radiogroup">
          {PAYMENT_METHODS.filter((m) => !m.retired).map((m) => {
            const on = payment === m.id;
            return (
              <button key={m.id} role="radio" aria-checked={on}
                      onClick={() => { setPayment(m.id); setError(''); }}
                      className={`flex items-center gap-3 rounded-xl border px-4 py-3.5 text-left ${
                        on ? 'border-blue-700 bg-blue-50 ring-1 ring-blue-700' : 'border-slate-300 bg-white'}`}>
                <span className={`w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ${
                  on ? 'border-blue-700' : 'border-slate-300'}`}>
                  {on && <span className="w-2.5 h-2.5 rounded-full bg-blue-700" />}
                </span>
                <span className="font-medium">{m.en}</span>
              </button>
            );
          })}
        </div>
      </fieldset>
    </div>
  );

  const q = encodeURIComponent(settings.address || '');
  const doneView = done && (
    <div className="px-5 py-8">
      <div className="text-center">
        <div className="w-16 h-16 rounded-full bg-green-100 text-green-700 flex items-center justify-center mx-auto">
          <Icon name="check" className="w-8 h-8" />
        </div>
        <h3 className="display font-bold text-2xl mt-4">Thanks {done.first_name}!</h3>
        <p className="mt-2 text-slate-600 leading-relaxed">
          Your booking is sent. I will text you on{' '}
          <strong className="text-slate-900 whitespace-nowrap">{done.phone}</strong> to confirm.
        </p>
      </div>

      <ul className="mt-6 rounded-2xl border border-slate-200 divide-y divide-slate-100">
        <li className="flex items-start gap-3 px-4 py-3">
          <Icon name="calendar" className="w-5 h-5 text-blue-700 mt-0.5 shrink-0" />
          <span>
            <span className="block font-semibold">{fmtDate(done.day, 'en-GB')}</span>
            <span className="block text-sm text-slate-500">at {done.slot} · {count > 1 ? `${count} × ` : ''}{item.title}</span>
          </span>
        </li>
        {settings.address && (

function authErrorMessage(err) {
  const m = String((err && err.message) || '').toLowerCase();
  if (m.includes('email not confirmed'))
    return 'Le compte existe mais n’est pas confirmé. Dans Supabase : Authentication > Users, ouvre l’utilisateur et confirme-le, ou supprime-le et recrée-le en cochant « Auto Confirm User ».';
  if (m.includes('invalid login credentials'))
    return 'E-mail ou mot de passe incorrect. C’est le mot de passe du compte créé dans Authentication > Users, pas celui de la base. Oublié ? Utilise le lien juste en dessous.';
  if (m.includes('failed to fetch') || m.includes('networkerror') || m.includes('load failed'))
    return 'Supabase est injoignable. Si la boutique n’affiche plus aucun meuble non plus, le projet est sûrement en pause : sur supabase.com, ouvre le projet et clique sur « Restore project ».';
  if (m.includes('api key') || m.includes('apikey') || m.includes('jwt'))
    return 'Clé anon invalide. Recopie-la depuis Project Settings > Data API.';
  // Le service d'e-mail intégré de Supabase n'écrit qu'aux membres de l'équipe du projet.
  if (m.includes('not authorized'))
    return 'Supabase refuse d’envoyer l’e-mail à cette adresse : son service gratuit n’écrit qu’aux membres de ton organisation Supabase. Change plutôt le mot de passe avec reset-mot-de-passe.sql.';
  if (m.includes('email rate limit'))
    return 'Supabase a atteint sa limite d’e-mails (quelques-uns par heure en gratuit). Réessaie plus tard, ou change le mot de passe avec reset-mot-de-passe.sql.';
  if (m.includes('security purposes'))
    return 'Un lien vient déjà de partir. Attends une minute avant d’en redemander un.';
  if (m.includes('rate') || m.includes('too many'))
    return 'Trop de tentatives. Attends une minute avant de réessayer.';
  if (m.includes('disabled') || m.includes('not enabled'))
    return 'La connexion par e-mail est désactivée. Active-la dans Authentication > Sign In / Providers > Email.';
  return 'Connexion impossible.';
}

function passwordErrorMessage(err) {
  const m = String((err && err.message) || '').toLowerCase();
  if (m.includes('different from the old'))
    return 'C’est déjà ton mot de passe actuel. Choisis-en un autre.';
  if (m.includes('at least') || m.includes('weak') || m.includes('short'))
    return 'Mot de passe trop faible. Mets-en un plus long.';
  if (m.includes('session') || m.includes('expired'))
    return 'Le lien a expiré. Reviens à la connexion et redemande un lien.';
  return authErrorMessage(err);
}

function Login({ onShop, linkProblem }) {
  // 'login' → connexion, 'forgot' → demander un lien, 'sent' → lien envoyé
  const [mode, setMode] = useState(linkProblem ? 'forgot' : 'login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState(linkProblem
    ? 'Ce lien a expiré ou a déjà servi. Demande un nouveau lien ci-dessous.' : '');
  const [detail, setDetail] = useState('');
  const [busy, setBusy] = useState(false);

  const cleanEmail = email.trim().toLowerCase();
  const go = (m) => { setMode(m); setError(''); setDetail(''); };
  const fail = (err) => { setError(authErrorMessage(err)); setDetail((err && err.message) || ''); };

  const signIn = async (e) => {
    e.preventDefault();
    setError('');
    setDetail('');
    if (!cleanEmail || !password) return setError('Entre ton e-mail et ton mot de passe.');
    setBusy(true);
    const { error: err } = await sb.auth.signInWithPassword({ email: cleanEmail, password });
    setBusy(false);
    if (err) fail(err);
  };

  // Supabase envoie un e-mail dont le lien ramène sur SITE_URL, connecté,
  // avec #type=recovery : l'écran NewPassword prend alors le relais.
  const sendLink = async (e) => {
    e.preventDefault();
    setError('');
    setDetail('');
    if (!/^\S+@\S+\.\S+$/.test(cleanEmail)) return setError('Entre l’adresse e-mail du compte vendeur.');
    setBusy(true);
    const { error: err } = await sb.auth.resetPasswordForEmail(cleanEmail, { redirectTo: SITE_URL });
    setBusy(false);
    if (err) return fail(err);
    setMode('sent');
  };

  const footer = (
    <button onClick={onShop} className="mt-6 inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-blue-700">
      <Icon name="store" className="w-4 h-4" /> Retour à la boutique
    </button>
  );

  const emailField = (
    <label className="block">
      <span className="text-sm font-medium text-slate-700">E-mail</span>
      <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
             autoComplete="username" autoCapitalize="none" spellCheck={false}
             className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-3" />
    </label>
  );

  if (mode === 'sent') {
    return (
      <AuthCard icon="mail" title="Regarde tes e-mails" footer={footer}
                text={<>Si <strong className="text-slate-700">{cleanEmail}</strong> est l’adresse du compte vendeur,
                  un e-mail vient de partir. Ouvre le lien qu’il contient : il te ramène ici pour choisir
                  un nouveau mot de passe.</>}>
        <ul className="mt-4 text-sm text-slate-600 space-y-1.5 list-disc pl-5">
          <li>Regarde aussi dans les spams.</li>
          <li>Le lien ne marche qu’une seule fois.</li>
          <li>Rien au bout de 5 minutes ? Change le mot de passe directement dans Supabase
              avec <code className="bg-blue-50 px-1 rounded">reset-mot-de-passe.sql</code>.</li>
        </ul>
        <button onClick={() => go('login')} className={`mt-6 ${PRIMARY_BTN}`}>Retour à la connexion</button>
      </AuthCard>
    );
  }

  if (mode === 'forgot') {
    return (
      <AuthCard icon="key" title="Mot de passe oublié" footer={footer}
                text="Entre l’e-mail du compte vendeur, tu vas recevoir un lien pour choisir un nouveau mot de passe.">
        <form onSubmit={sendLink} className="mt-6 space-y-4" noValidate>
          {emailField}
          <ErrorBox error={error} detail={detail} />
          <button type="submit" disabled={busy} className={PRIMARY_BTN}>
            {busy ? 'Envoi…' : 'Recevoir le lien'}
          </button>
        </form>
        <button onClick={() => go('login')} className="mt-4 inline-flex items-center gap-1 text-sm font-medium text-blue-700 hover:underline">
          <Icon name="left" className="w-4 h-4" /> Je m’en souviens finalement
        </button>
      </AuthCard>
    );
  }

  return (
    <AuthCard icon="lock" title="Espace vendeur" footer={footer}
              text="Connecte-toi pour gérer les annonces, les rendez-vous et le planning.">
      <form onSubmit={signIn} className="mt-6 space-y-4" noValidate>
        {emailField}
        <PasswordField label="Mot de passe" value={password} onChange={setPassword} autoComplete="current-password" />
        <ErrorBox error={error} detail={detail} />
        <button type="submit" disabled={busy} className={PRIMARY_BTN}>
          {busy ? 'Connexion…' : 'Se connecter'}
        </button>
      </form>
      <button onClick={() => go('forgot')} className="mt-4 text-sm font-medium text-blue-700 hover:underline">
        Mot de passe oublié ?
      </button>
    </AuthCard>
  );
}

function NewPassword({ email, onDone }) {
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [detail, setDetail] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    setDetail('');
    if (password.length < 6) return setError('Choisis au moins 6 caractères.');
    setBusy(true);
    const { error: err } = await sb.auth.updateUser({ password });
    setBusy(false);
    if (err) {
      setError(passwordErrorMessage(err));
      setDetail(err.message || '');
      return;
    }
    onDone();
  };

  return (
    <AuthCard icon="key" title="Nouveau mot de passe"
              text={email ? <>Pour le compte <strong className="text-slate-700">{email}</strong>.</> : null}>
      <form onSubmit={submit} className="mt-6 space-y-4" noValidate>
        {/* aide le gestionnaire de mots de passe du téléphone à l'enregistrer */}
        {email && <input type="email" value={email} autoComplete="username" readOnly hidden />}
        <PasswordField label="Choisis un nouveau mot de passe" value={password} onChange={setPassword}
                       autoComplete="new-password" />
        <ErrorBox error={error} detail={detail} />
        <button type="submit" disabled={busy} className={PRIMARY_BTN}>
          {busy ? 'Enregistrement…' : 'Enregistrer et continuer'}
        </button>
      </form>
    </AuthCard>
  );
}

const MATERIALS = [
  { fr: 'Bois', en: 'wood', adj: 'wooden' },
  { fr: 'Bois massif', en: 'solid wood' },
  { fr: 'Chêne', en: 'oak' },
  { fr: 'Pin', en: 'pine' },
  { fr: 'Bouleau', en: 'birch' },
  { fr: 'Métal', en: 'metal' },
  { fr: 'Verre', en: 'glass' },
  { fr: 'Plastique', en: 'plastic' },
  { fr: 'Tissu', en: 'fabric' },
  { fr: 'Velours', en: 'velvet' },
  { fr: 'Cuir', en: 'leather' },
  { fr: 'Simili-cuir', en: 'faux leather' },
  { fr: 'Rotin', en: 'rattan' },
];

const COLOURS = [
  { fr: 'Blanc', en: 'white' },
  { fr: 'Noir', en: 'black' },
  { fr: 'Gris', en: 'grey' },
  { fr: 'Beige', en: 'beige' },
  { fr: 'Marron', en: 'brown' },
  { fr: 'Bleu', en: 'blue' },
  { fr: 'Vert', en: 'green' },
  { fr: 'Rouge', en: 'red' },
  { fr: 'Jaune', en: 'yellow' },
  { fr: 'Rose', en: 'pink' },
];

// Chaque atout complète « It … ». `for` : seulement pour ces types-là.
const FEATURES = [
  { fr: 'Beaucoup de rangement', en: 'has plenty of storage' },
  { fr: 'Tiroirs', en: 'has drawers' },
  { fr: 'Facile à démonter', en: 'is easy to take apart' },
  { fr: 'Pliable', en: 'folds away' },
  { fr: 'Réglable en hauteur', en: 'is height-adjustable' },
  { fr: 'Sur roulettes', en: 'is on wheels' },
  { fr: 'Léger', en: 'is light and easy to move' },
  { fr: 'Très confortable', en: 'is very comfortable' },
  { fr: 'Housse lavable', en: 'has a washable cover' },
  { fr: 'Marche parfaitement', en: 'works perfectly' },
  { fr: 'Extensible', en: 'extends for extra guests', for: ['table'] },
  { fr: 'Convertible en lit', en: 'turns into a bed', for: ['sofa'] },
  { fr: 'Avec le matelas', en: 'comes with the mattress', for: ['bed'] },
  { fr: 'Avec les coussins', en: 'comes with its cushions', for: ['sofa', 'armchair', 'chair'] },
  { fr: 'Avec la télécommande', en: 'comes with the remote', for: ['TV'] },
  { fr: 'Ampoule fournie', en: 'comes with a bulb', for: ['lamp', 'floor lamp'] },
];

// Chaque défaut complète « Please note: … » et « it has … ».
const FLAWS = [
  { fr: 'Petites rayures', en: 'a few small scratches' },
  { fr: 'Petite tache', en: 'a small stain' },
  { fr: 'Petit choc', en: 'a small dent' },
  { fr: 'Décoloré par le soleil', en: 'some sun fading' },
  { fr: 'Tissu un peu usé', en: 'some wear on the fabric' },
  { fr: 'Un peu bancal', en: 'a slight wobble' },
  { fr: 'Vis manquante', en: 'a missing screw' },
];

// Chaque mot complète « From a … home ».
const HOME = [
  { fr: 'Non-fumeur', en: 'smoke-free' },
  { fr: 'Sans animaux', en: 'pet-free' },
];

// Pour l'emporter : chaque choix est une phrase entière.
const PICKUP = [
  { fr: 'Rentre dans une voiture', en: 'It fits in a normal car.' },
  { fr: 'Déjà démonté', en: 'It is already taken apart, so it is easy to transport.' },
  { fr: 'Prévoir une camionnette', en: 'You will need a van or a big car to take it home.' },
  { fr: 'Je peux aider à porter', en: 'I can help you carry it to your car.' },
];

const emptyDetails = {
  kind: '', material: '', colour: '', brand: '', year: '', paid: '',
  width: '', depth: '', height: '', tags: [], version: 0,
};

// Numéro de tournure tiré au hasard pour une nouvelle annonce : deux
// meubles du même type ne reçoivent pas les mêmes phrases.
const newVersion = () => Math.floor(Math.random() * 100000);

// Choisit une des tournures, toujours la même pour un même numéro de
// version et une même place dans le texte (`slot`).
function pick(options, version, slot) {
  let h = Math.imul(version | 0, 0x9e3779b1);
  for (let i = 0; i < slot.length; i++) h = Math.imul(h ^ slot.charCodeAt(i), 0x01000193);
  h ^= h >>> 15;
  return options[(h >>> 0) % options.length];
}

const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const article = (word) => (/^[aeiou]/i.test(word) ? 'an' : 'a');
// « a », « a and b », « a, b and c »
const joinAnd = (list) =>
  list.length < 2 ? list.join('') : `${list.slice(0, -1).join(', ')} and ${list[list.length - 1]}`;
const fitsKind = (option, kind) => !option.for || option.for.includes(kind);

// Titre proposé tant qu'on n'en a pas tapé un : « IKEA oak desk ».
function suggestTitle(d) {
  const kind = KINDS.find((k) => k.en === d.kind);
  if (!kind) return '';
  const material = MATERIALS.find((m) => m.en === d.material);
  return cap([d.brand.trim(), material && (material.adj || material.en), kind.en].filter(Boolean).join(' '));
}

// Ex. : « A white oak desk from IKEA. Turns any corner into a home office.
// Size: 120 × 60 × 75 cm (W × D × H). Good to know: it has drawers. I paid
// 1.200 kr for it new, so you save 63%. Well looked after and in very good
// condition. Please note: a small stain. It fits in a normal car. »
function describeItem(item, d) {
  const kind = KINDS.find((k) => k.en === d.kind);
  const material = MATERIALS.find((m) => m.en === d.material);
  const brand = d.brand.trim();
  const from = brand ? ` from ${brand}` : '';
  const say = (options, slot) => pick(options, d.version, slot);
  const picked = (list) => list.filter((o) => d.tags.includes(o.en) && fitsKind(o, d.kind)).map((o) => o.en);
  const sentences = [];

  // Ce que c'est.
  const look = [d.colour, material && material.en].filter(Boolean).join(' ');
  if (kind && (look || brand)) {
    const thing = [d.colour, material && (material.adj || material.en), kind.en].filter(Boolean).join(' ');
    const openers = [`${cap(thing)}${from}.`, `${cap(article(thing))} ${thing}${from}.`];
    if (brand) openers.push(`${brand} ${thing}.`);
    if (look) openers.push(`${cap(kind.en)} in ${look}${from}.`);
    sentences.push(say(openers, 'open'));
  } else if (!kind && (item.title || '').trim() && (look || brand)) {
    // Pas de type choisi : on part du titre de l'annonce.
    sentences.push(`${item.title.trim()}${look ? ` in ${look}` : ''}${from}.`);
  }

  // À quoi il sert.
  if (kind) sentences.push(say(kind.uses, 'use'));

  const long = kind && kind.long;
  const sizes = [['wide', 'W', d.width], [long ? 'long' : 'deep', long ? 'L' : 'D', d.depth], ['high', 'H', d.height]]
    .map(([word, letter, v]) => ({ word, letter, v: String(v || '').replace(/[^\d.,]/g, '') }))
    .filter((s) => s.v);
  if (sizes.length) {
    const options = [`It measures ${joinAnd(sizes.map((s) => `${s.v} cm ${s.word}`))}.`];
    if (sizes.length > 1) {
      options.push(`Size: ${sizes.map((s) => s.v).join(' × ')} cm (${sizes.map((s) => s.letter).join(' × ')}).`);
    }
    sentences.push(say(options, 'size'));
  }

  const features = picked(FEATURES);
  if (features.length) {
    const list = joinAnd(features);
    sentences.push(say([`It ${list}.`, `Good to know: it ${list}.`, `Bonus: it ${list}.`], 'features'));
  }

  // L'âge et le prix neuf font voir la bonne affaire.
  const year = parseInt(d.year, 10);
  const thisYear = new Date().getFullYear();
  if (year >= 1950 && year <= thisYear) {
    sentences.push(year === thisYear
      ? say(['Bought this year.', 'I bought it earlier this year.'], 'year')
      : say([`Bought in ${year}.`, `I bought it in ${year}.`], 'year'));
  }
  const paid = priceValue(d.paid);
  const asking = priceValue(item.price);
  if (paid > 0) {
    const off = asking > 0 && asking < paid ? Math.round((1 - asking / paid) * 100) : 0;
    sentences.push(off >= 10
      ? say([`I paid ${fmtKr(paid)} for it new, so you save ${off}%.`,
             `It cost ${fmtKr(paid)} new: you pay ${off}% less.`], 'paid')
      : say([`It cost ${fmtKr(paid)} new.`, `I paid ${fmtKr(paid)} for it new.`], 'paid'));
  }

  const condition = CONDITIONS.find((c) => c.en === item.condition);
  if (condition) sentences.push(say(condition.sentences, 'condition'));

  const flaws = picked(FLAWS);
  if (flaws.length) {
    const list = joinAnd(flaws);
    sentences.push(say([`Please note: ${list}.`, `To be upfront, it has ${list}.`], 'flaws'));
  }

  const home = picked(HOME);
  if (home.length) {
    sentences.push(say([`From a ${home.join(', ')} home.`, `It comes from a ${joinAnd(home)} home.`], 'home'));
  }

  sentences.push(...picked(PICKUP));

  return sentences.join(' ');
}

function GoalProgress({ items }) {
  // Compté par exemplaire : 2 lits à 450 kr, c'est 900 kr et 2 meubles.
  // Le vendu compte ce qui a été vraiment encaissé (prix négociés compris).
  const sum = (qty) => items.reduce((total, i) => total + priceValue(i.price) * qty(i), 0);
  const units = (qty) => items.reduce((total, i) => total + qty(i), 0);
  const soldCount = units(soldQty);
  const listedCount = units(leftQty);
  const soldTotal = items.reduce((total, i) => total + soldAmount(i), 0);
  const listedTotal = sum(leftQty);
  // Écart avec les prix affichés des meubles vendus : négatif = remises.
  const haggled = soldTotal - sum(soldQty);
  const missing = Math.max(0, SALES_GOAL - soldTotal);
  const pct = (n) => Math.min(100, (n / SALES_GOAL) * 100);
  const reached = soldTotal >= SALES_GOAL;

  const bar = (label, count, total, fill, track, note) => (
    <div>
      <div className="flex items-baseline justify-between gap-3 mb-1.5">
        <span className="text-sm text-slate-600">
          {label} <span className="text-slate-400">· {count} meuble{count > 1 ? 's' : ""}</span>
        </span>
        <span className="text-sm font-semibold tabular-nums">{fmtKr(total)}</span>
      </div>
      <div className={`h-3 rounded-full overflow-hidden ${track}`}>
        <div className={`h-full rounded-full ${fill} transition-all duration-500`}
             style={{ width: `${pct(total)}%` }} />
      </div>
      <p className="text-xs text-slate-500 mt-1.5">{note}</p>
    </div>
  );

  return (
    <section className="border border-blue-200 rounded-xl bg-blue-50 px-5 py-5 mb-8">
      <div className="flex items-baseline justify-between gap-3 flex-wrap mb-5">
        <h2 className="display font-bold text-lg">Objectif : {fmtKr(SALES_GOAL)}</h2>
        <span className={`text-sm font-semibold ${reached ? 'text-green-700' : 'text-blue-800'}`}>
          {reached ? 'Objectif atteint 🎉' : `Il manque ${fmtKr(missing)}`}
        </span>
      </div>

      <div className="space-y-5">
        {bar('Vendu', soldCount, soldTotal, 'bg-blue-700', 'bg-blue-100',
          `${Math.round(pct(soldTotal))} % de l’objectif${Math.round(haggled)
            ? ` · ${haggled < 0 ? '−' : '+'}${fmtKr(Math.abs(haggled))} par rapport aux prix affichés (négociations)`
            : ''}`)}
        {bar('En vente', listedCount, listedTotal, 'bg-blue-400', 'bg-blue-100',
          listedTotal + soldTotal >= SALES_GOAL
            ? `Tout vendre rapporterait ${fmtKr(soldTotal + listedTotal)}, l’objectif est atteignable.`
            : `Même en vendant tout (${fmtKr(soldTotal + listedTotal)}), il manquerait ${fmtKr(SALES_GOAL - soldTotal - listedTotal)}.`)}
      </div>
    </section>
  );
}

// Photos d'une annonce. La première est la couverture : c'est elle qu'on
// voit dans la liste, sur l'affiche et à la réservation.
function PhotosEditor({ photos, onChange, state, manyPhotos, pushToast }) {
  const fileRef = useRef(null);
  const [adding, setAdding] = useState(false);
  const locked = adding || state === 'loading';

  const onFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = ''; // pour pouvoir reprendre la même photo après l'avoir retirée
    if (!files.length) return;
    const room = MAX_PHOTOS - photos.length;
    if (files.length > room) pushToast(`${MAX_PHOTOS} photos maximum par meuble.`);
    setAdding(true);
    const added = [];
    for (const file of files.slice(0, Math.max(0, room))) {
      try { added.push(await resizeImage(file)); }

    setAdding(false);
    onChange([...photos, ...added]);
  };
  const toFront = (i) => onChange([photos[i], ...photos.filter((_, j) => j !== i)]);
  const remove = (i) => onChange(photos.filter((_, j) => j !== i));

  return (
    <div className="mt-4">

      <span className="text-xs text-slate-500"> · la première sert de couverture, {MAX_PHOTOS} au plus</span>
      <div className="mt-1 flex flex-wrap gap-2">
        {photos.map((src, i) => (
          <div key={i} className="relative w-24 h-20 rounded-lg overflow-hidden border border-slate-200 bg-white">
            <img src={src} alt="" className="w-full h-full object-cover" />
            {i === 0 ? (
              <span className="absolute bottom-0 inset-x-0 bg-blue-700/90 text-white text-[11px] font-semibold text-center py-0.5">
                Couverture
              </span>
            ) : (
              <button type="button" onClick={() => toFront(i)} disabled={locked}
                      className="absolute bottom-0 inset-x-0 bg-black/55 hover:bg-blue-700/90 text-white text-[11px] font-semibold py-0.5">
                Mettre en 1re
              </button>
            )}
            <button type="button" onClick={() => remove(i)} disabled={locked} aria-label="Retirer la photo"
                    className="absolute top-1 right-1 w-6 h-6 rounded-full bg-white/90 shadow text-slate-600 hover:text-red-600 flex items-center justify-center">
              <Icon name="x" className="w-3.5 h-3.5" />

            Chargement…

      {!manyPhotos && photos.length > 1 && (
        <p className="mt-2 text-xs text-amber-900 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
          Seule la couverture sera enregistrée tant que <code>migration-photos.sql</code> n’a pas été

      {state === 'failed' && (

          Les autres photos de ce meuble n’ont pas pu être chargées : elles restent telles quelles.
        </p>
      )}
    </div>
  );
}

// Ce qu'il faut écrire dans `items` quand `n` exemplaires sont vendus.
// `prices` : prix en kr de ceux qui viennent de partir, un par exemplaire
// (le prix affiché pour ceux qui manquent). Tout vendu : l'annonce quitte
// la boutique. null si un prix négocié ne peut pas être gardé, faute
// d'avoir lancé migration-prix-vente.sql.
function soldPatch(item, n, prices = []) {
  const total = totalQty(item);
  const sold_qty = Math.max(0, Math.min(total, n));
  const status = sold_qty >= total ? 'sold' : 'available';
  // Sans migration-quantite.sql, seul le statut existe.
  const patch = 'sold_qty' in item ? { status, sold_qty } : { status };
  // Des exemplaires en plus : leurs prix s'ajoutent ; en moins : les
  // derniers prix notés s'en vont.
  const listed = priceValue(item.price);
  const added = sold_qty - soldQty(item);
  if ('sale_prices' in item) {
    const noted = salePrices(item);
    patch.sale_prices = added > 0
      ? [...noted, ...Array.from({ length: added }, (_, i) => (i < prices.length ? prices[i] : listed))]
      : noted.slice(0, sold_qty);
  } else if (prices.some((p) => p !== listed)) return null;
  return patch;
}

// Au moment de marquer un meuble (ou un exemplaire) vendu : au prix
// affiché, ou au prix obtenu après négociation. `count` exemplaires
// partent ensemble (rendez-vous pour 2 lits) : le montant est pour tous.
// `onConfirm` reçoit le montant en kr et renvoie true si la vente est
// enregistrée.
function SalePrompt({ item, count = 1, onConfirm, onCancel }) {
  const listed = priceValue(item.price) * count;
  const canHaggle = 'sale_prices' in item;
  const [other, setOther] = useState(false);
  const [price, setPrice] = useState('');
  const [busy, setBusy] = useState(false);
  const valid = !other || /\d/.test(price);

  const submit = async (e) => {
    e.preventDefault();
    if (!valid) return;
    setBusy(true);
    const done = await onConfirm(other ? priceValue(price) : listed);
    setBusy(false);
    if (done) onCancel();
  };

  return (
    <form onSubmit={submit} className="mt-3 border border-blue-200 bg-blue-50 rounded-xl px-4 py-3 text-sm">
      <p className="font-semibold">
        {count > 1 ? `Les ${count} sont vendus à quel prix ?`
          : totalQty(item) > 1 ? 'Cet exemplaire est vendu à quel prix ?' : 'Vendu à quel prix ?'}
      </p>
      <label className="mt-2 flex items-center gap-2 cursor-pointer">
        <input type="radio" checked={!other} onChange={() => setOther(false)} className="w-4 h-4 accent-blue-700" />
        <span>
          Au prix affiché : <strong>{count > 1 && listed > 0 ? fmtKr(listed) : withKr(item.price) || 'gratuit'}</strong>
          {count > 1 && listed > 0 && <span className="text-slate-500"> ({count} × {withKr(item.price)})</span>}
        </span>
      </label>
      <div className={`mt-2 flex flex-wrap items-center gap-2 ${canHaggle ? '' : 'text-slate-400'}`}>
        <label className={`flex items-center gap-2 ${canHaggle ? 'cursor-pointer' : ''}`}>
          <input type="radio" checked={other} disabled={!canHaggle} onChange={() => setOther(true)}
                 className="w-4 h-4 accent-blue-700" />
          {count > 1 ? 'À un autre montant, en tout (négocié)' : 'À un autre prix (négocié)'}
        </label>
        <span className="flex items-center border border-slate-200 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-400">
          <input value={price} disabled={!canHaggle} onFocus={() => setOther(true)}
                 onChange={(e) => { setPrice(e.target.value); setOther(true); }}
                 inputMode="decimal" placeholder={listed ? String(listed) : '0'} aria-label="Prix de vente négocié"
                 className="w-20 rounded-lg px-2 py-1.5 bg-transparent outline-none" />
          <span className="pr-2 text-slate-500">kr</span>
        </span>
      </div>
      {!canHaggle && (
        <p className="mt-1 text-xs text-slate-500">
          Pour noter un autre prix, lance d’abord <code className="bg-white px-1 rounded">migration-prix-vente.sql</code> dans Supabase.
        </p>
      )}
      <div className="mt-3 flex gap-2">
        <button type="submit" disabled={busy || !valid}
                className="font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg px-4 py-2">
          {busy ? 'Enregistrement…' : 'Confirmer la vente'}
        </button>
        <button type="button" onClick={onCancel} className="text-slate-600 hover:text-slate-900 px-3">Annuler</button>
      </div>
    </form>
  );
}

// Ligne de la liste vendeur : « vendu 400 kr (affiché 450 kr) », « 2 vendus 900 kr ».
function soldNote(item) {
  const n = soldQty(item);
  const got = soldAmount(item);
  const listed = priceValue(item.price) * n;
  if (!got && !listed) return n > 1 ? `${n} donnés` : 'donné';
  return `${n > 1 ? `${n} vendus` : 'vendu'} ${fmtKr(got)}${Math.round(got) !== Math.round(listed) ? ` (affiché ${fmtKr(listed)})` : ''}`;
}

// Sous un rendez-vous vendu : « Vendu 400 kr (affiché 450 kr) ».
function saleNote(b, item) {
  if (b.sale_price == null) return 'Vendu';
  const got = Number(b.sale_price);
  const listed = item ? priceValue(item.price) * (b.quantity || 1) : got;
  if (!got && !listed) return 'Donné';
  return `Vendu ${fmtKr(got)}${Math.round(got) !== Math.round(listed) ? ` (affiché ${fmtKr(listed)})` : ''}`;
}

// Pourquoi un meuble en vente n'est plus dans la boutique :
// « réservé par Marie, rdv le 02/11 à 14:00 ».
function heldNote(item, bookings) {
  const held = bookings.filter((b) => String(b.item_id) === String(item.id) && isPending(b));
  if (held.length > 1) return `réservé par ${held.map((b) => b.first_name).join(', ')}`;
  const b = held[0];
  if (!b) return null;
  const d = String(b.day);
  return `${b.quantity > 1 ? `${b.quantity} réservés` : 'réservé'} par ${b.first_name}, rdv le ${d.slice(8, 10)}/${d.slice(5, 7)} à ${b.slot}`;
}

  const [details, setDetails] = useState(emptyDetails);

  const [beforeRewrite, setBeforeRewrite] = useState(null);
