function App() {
  const [route, setRoute] = useState(START_IN_ADMIN ? 'admin' : 'shop');
  const [session, setSession] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [recovering, setRecovering] = useState(FROM_RESET_LINK);
  const [linkProblem, setLinkProblem] = useState(RESET_LINK_FAILED);
  const [items, setItems] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  // Les réglages sont lus : on connaît la langue de la boutique.
  const [settingsReady, setSettingsReady] = useState(false);
  const [adminLangSaved, setAdminLangSaved] = useState(() => {
    try { return cleanLang(localStorage.getItem(ADMIN_LANG_KEY), 'fr'); } catch { return 'fr'; }
  });
  const [busy, setBusy] = useState([]);
  // Exemplaires retenus par un rendez-vous, par meuble (fetchHeld).
  const [held, setHeld] = useState({});
  // Lots (migration-lots.sql) ; bundlesMissing tant que la table n'existe pas.
  const [bundles, setBundles] = useState([]);
  const [bundlesMissing, setBundlesMissing] = useState(false);
  const [bookings, setBookings] = useState([]);
  // Demandes de contact (migration-panier.sql) ; missing tant que la table
  // n'existe pas.
  const [messages, setMessages] = useState([]);
  const [messagesMissing, setMessagesMissing] = useState(false);
  const [ready, setReady] = useState(false);
  const [loadFailed, setLoadFailed] = useState(false);
  // Nombre de photos en plus de la couverture, par meuble.
  const [photoCounts, setPhotoCounts] = useState({});
  // false tant que migration-photos.sql n'a pas été lancé.
  const [manyPhotos, setManyPhotos] = useState(false);
  const [toasts, setToasts] = useState([]);

  const pushToast = useCallback((text, tone) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, text, tone }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 6000);
  }, []);

  /* ---- langues ---- */
  // Sans migration-langue.sql, les colonnes manquent : boutique en anglais,
  // espace vendeur dans la langue gardée par ce navigateur.
  const shopLang = cleanLang(settings.shop_lang, 'en');
  const adminLang = cleanLang(settings.admin_lang, adminLangSaved);
  const adminLangRef = useRef(adminLang);
  adminLangRef.current = adminLang;

  const keepAdminLang = (lang) => {
    setAdminLangSaved(lang);
    try { localStorage.setItem(ADMIN_LANG_KEY, lang); } catch { /* navigation privée */ }
  };
  // Choisie sur un autre appareil : ce navigateur la retient aussi.
  useEffect(() => { if (LANGS.includes(settings.admin_lang)) keepAdminLang(settings.admin_lang); }, [settings.admin_lang]);
  // Réglages : tout de suite à l'écran, la base suit (SettingsPanel).
  const setAdminLang = (lang) => {
    keepAdminLang(lang);
    if ('admin_lang' in settings) setSettings((s) => ({ ...s, admin_lang: lang }));
  };

  // La page parle la langue de l'écran affiché (lecteurs d'écran,
  // traduction automatique du navigateur).
  useEffect(() => {
    document.documentElement.lang = route === 'shop' ? shopLang : adminLang;
    document.title = shopLang === 'fr' ? 'Meubles à vendre — Odense' : 'Furniture for sale — Odense';
  }, [route, shopLang, adminLang]);

  /* ---- session ---- */
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => {
      setSession(data.session);
      // Revenu par le lien mais sans session : il a expiré ou déjà servi.
      if (FROM_RESET_LINK && !data.session) {
        setRecovering(false);
        setLinkProblem(true);
      }
      // Le vendeur connecté, ou arrivé par #vendeur, ne compte pas dans les stats.
      if (!data.session && !START_IN_ADMIN) startStats();
      setAuthReady(true);
    });
    const { data } = sb.auth.onAuthStateChange((event, s) => {
      setSession(s);
      if (s) {
        setLinkProblem(false);
        // Hors du rappel : Supabase bloque les requêtes lancées pendant celui-ci.
        setTimeout(forgetSellerVisit, 0);
      }
      if (event === 'PASSWORD_RECOVERY') {
        setRecovering(true);
        setRoute('admin');
      }
    });
    return () => data.subscription.unsubscribe();
  }, []);

  // #vendeur tapé à la main dans l'adresse, page déjà ouverte.
  useEffect(() => {
    const onHash = () => { if (/^#(vendeur|admin)$/.test(window.location.hash)) setRoute('admin'); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // L'adresse suit l'écran : …/#vendeur se met en favori, la boutique reste propre.
  const goAdmin = () => {
    setRoute('admin');
    window.history.replaceState(null, '', '#vendeur');
    window.scrollTo(0, 0);
  };
  const goShop = () => {
    // Le vendeur a pu noter des ventes entre-temps.
    refreshHeld();
    setRoute('shop');
    window.history.replaceState(null, '', window.location.pathname + window.location.search);
    window.scrollTo(0, 0);
  };

  /* ---- données publiques ---- */
  const loadPublic = useCallback(async () => {
    if (!sb) {
      setSettingsReady(true);
      return setReady(true);
    }
    // Les réglages sont tout petits : ils arrivent avant la liste (et ses
    // photos), et la boutique peut s'afficher dans sa langue sans attendre.
    const settingsLoad = sb.from('settings').select('*').eq('id', 1).maybeSingle()
      .then((st) => {
        if (st.data) setSettings({ ...DEFAULT_SETTINGS, ...st.data });
        setSettingsReady(true);
      }, () => setSettingsReady(true));
    const [it, , bs, ph, hd, bu] = await Promise.all([
      sb.from('items').select('*').order('created_at', { ascending: false }),
      settingsLoad,
      sb.from('busy_slots').select('day, slot'),
      // Seulement les nombres, pas les photos.
      sb.from('item_photos').select('item_id, photo_count'),
      fetchHeld(),
      fetchBundles(),
    ]);
    if (it.data) setItems(it.data);
    if (bs.data) setBusy(bs.data);
    setHeld(hd);
    setBundles(bu || []);
    setBundlesMissing(!bu);
    setManyPhotos(!ph.error);
    if (ph.data) setPhotoCounts(Object.fromEntries(ph.data.map((r) => [r.item_id, r.photo_count])));
    extraPhotoCache.clear();
    setLoadFailed(!!it.error);
    setReady(true);
  }, []);

  // Ce qui est encore libre : meubles retenus par un rendez-vous, et lots
  // (le vendeur a pu en changer un entre-temps).
  const refreshHeld = useCallback(async () => {
    if (!sb) return;
    const [hd, bu] = await Promise.all([fetchHeld(), fetchBundles()]);
    setHeld(hd);
    if (bu) setBundles(bu);
  }, []);

  const markBusy = (row) => setBusy((prev) => [...prev, { day: row.day, slot: row.slot }]);

  const loadBookings = useCallback(async () => {
    if (!sb || !session) return;
    const { data } = await sb.from('bookings').select('*').order('day').order('slot');
    if (data) setBookings(data);
  }, [session]);

  const loadMessages = useCallback(async () => {
    if (!sb || !session) return;
    const { data, error } = await sb.from('contact_requests').select('*').order('created_at', { ascending: false });
    setMessagesMissing(!!error);
    if (data) setMessages(data);
  }, [session]);

  useEffect(() => { loadPublic(); }, [loadPublic]);
  useEffect(() => { loadBookings(); }, [loadBookings]);
  useEffect(() => { loadMessages(); }, [loadMessages]);

  /* ---- alerte temps réel sur les nouveaux rendez-vous et messages ---- */
  // Les meubles d'un même panier arrivent ligne par ligne : on attend un
  // instant pour n'afficher qu'une alerte par rendez-vous.
  const cartAlerts = useRef({});
  useEffect(() => {
    if (!sb || !session) return;
    const channel = sb
      .channel('bookings-feed')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings' }, (payload) => {
        const b = payload.new;
        setBookings((prev) => (prev.some((x) => x.id === b.id) ? prev : [...prev, b]));
        setBusy((prev) => [...prev, { day: b.day, slot: b.slot }]);
        const tr = makeT(adminLangRef.current);
        const when = `${fmtDate(b.day, tr.locale)} ${tr('at', 'à')} ${b.slot}`;
        if (!b.cart_id) {
          const what = b.quantity > 1 ? ` (${b.quantity} × ${b.item_title})` : '';
          pushToast(tr(`New booking — ${b.first_name}${what}, ${when}`, `Nouveau rendez-vous — ${b.first_name}${what}, ${when}`), 'new');
          return;
        }
        const waiting = cartAlerts.current;
        if (waiting[b.cart_id]) { waiting[b.cart_id] += 1; return; }
        waiting[b.cart_id] = 1;
        setTimeout(() => {
          const n = waiting[b.cart_id];
          delete waiting[b.cart_id];
          const what = b.bundle_title ? tr(`bundle “${b.bundle_title}”`, `lot « ${b.bundle_title} »`)
            : tr(`${n} item${n > 1 ? 's' : ''}`, `${n} meuble${n > 1 ? 's' : ''}`);
          pushToast(tr(`New booking — ${b.first_name}, ${what}, ${when}`,
                       `Nouveau rendez-vous — ${b.first_name}, ${what}, ${when}`), 'new');
        }, 1500);
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'contact_requests' }, (payload) => {
        const m = payload.new;
        setMessages((prev) => (prev.some((x) => x.id === m.id) ? prev : [m, ...prev]));
        const tr = makeT(adminLangRef.current);
        const who = `${m.first_name}, ${phoneInfo(m.phone).text}`;
        pushToast(tr(`New message — ${who}`, `Nouveau message — ${who}`), 'new');
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [session, pushToast]);

  const newCount = bookings.filter((b) => b.status === 'new').length;
  const newMessages = messages.filter((m) => m.status === 'new').length;

  if (!configured) {
    return (
      <div className="max-w-xl mx-auto px-5 py-24">
        <h1 className="display text-2xl font-bold">Configuration à terminer</h1>
        <p className="mt-3 text-slate-600 leading-relaxed">
          Ouvre <code className="bg-blue-50 px-1.5 py-0.5 rounded">index.html</code> et remplace
          les deux valeurs de <code className="bg-blue-50 px-1.5 py-0.5 rounded">window.CONFIG</code>{' '}
          par l’URL et la clé anon de ton projet Supabase, puis recharge la page.
        </p>
      </div>
    );
  }

  return (
    <ShopLangContext.Provider value={shopLang}>
    <div className="min-h-screen">
      {route === 'shop' && !settingsReady ? (
        // Un instant, le temps de lire dans quelle langue est la boutique.
        <div className="min-h-screen bg-slate-50">
          <div className="bg-blue-800 h-64 sm:h-72" />
        </div>
      ) : route === 'shop' ? (
        <LangContext.Provider value={shopLang}>
        <Shop
          items={items}
          bundles={bundles}
          photoCounts={photoCounts}
          settings={settings}
          busy={busy}
          held={held}
          ready={ready}
          loadFailed={loadFailed}
          onRetry={() => { setReady(false); loadPublic(); }}
          onAdmin={goAdmin}
          onSlotTaken={markBusy}
          onBooked={(rows) => {
            markBusy(rows[0]);
            // Les meubles quittent la liste tout de suite, sans recharger.
            setHeld((prev) => {
              const next = { ...prev };
              rows.forEach((r) => { next[r.item_id] = (next[r.item_id] || 0) + (r.quantity || 1); });
              return next;
            });
          }}
          onItemTaken={refreshHeld}
        />
        </LangContext.Provider>
      ) : (
        <LangContext.Provider value={adminLang}>
        <Admin
          session={session}
          authReady={authReady}
          recovering={recovering}
          linkProblem={linkProblem}
          onRecovered={() => {
            setRecovering(false);
            pushToast(makeT(adminLang)('New password saved.', 'Nouveau mot de passe enregistré.'));
          }}
          items={items}
          setItems={setItems}
          bundles={bundles}
          setBundles={setBundles}
          bundlesMissing={bundlesMissing}
          manyPhotos={manyPhotos}
          photoCounts={photoCounts}
          setPhotoCounts={setPhotoCounts}
          bookings={bookings}
          setBookings={setBookings}
          messages={messages}
          setMessages={setMessages}
          messagesMissing={messagesMissing}
          settings={settings}
          setSettings={setSettings}
          shopLang={shopLang}
          adminLang={adminLang}
          onAdminLang={setAdminLang}
          newCount={newCount}
          newMessages={newMessages}
          reload={() => { loadPublic(); loadBookings(); loadMessages(); }}
          pushToast={pushToast}
          onShop={goShop}
        />
        </LangContext.Provider>
      )}

      <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 w-80 max-w-[calc(100vw-2rem)] print:hidden">
        {toasts.map((t) => (
          <div key={t.id}
               className={`rounded-lg px-4 py-3 text-sm shadow-lg border flex items-start gap-2 ${
                 t.tone === 'new' ? 'bg-blue-700 text-white border-blue-800'
                                  : 'bg-white text-slate-800 border-slate-200'}`}>
            <Icon name="bell" className="w-4 h-4 mt-0.5 shrink-0" />
            <span>{t.text}</span>
          </div>
        ))}
      </div>
    </div>
    </ShopLangContext.Provider>
  );
}

/* ===================== BOUTIQUE (EN anglais ou en français) =============== */
// Pensée pour le téléphone : la plupart des acheteurs arrivent par le QR
// code de l'affiche. Une colonne, gros boutons, réservation en 2 étapes.

const PRIMARY_BTN = 'w-full inline-flex items-center justify-center gap-2 font-semibold text-white rounded-xl py-3.5 '
  + 'bg-blue-700 hover:bg-blue-800 active:bg-blue-900 disabled:bg-slate-200 disabled:text-slate-500 disabled:cursor-not-allowed';

// Recherche : chaque mot tapé doit commencer un mot du titre ou de la
// description, sans tenir compte des majuscules ni des accents. « table »
// ne trouve donc pas « comfortable », et « chairs » trouve « chair ».
const searchWords = (text) =>
  String(text || '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase()
    .split(/[^\p{L}\p{N}]+/u).filter(Boolean);

function matchesSearch(item, query) {
  const words = searchWords(`${item.title} ${item.description}`);
  return searchWords(query).every((q) => {
    const stem = q.replace(/e?s$/, '');
    return words.some((w) => w.startsWith(stem.length >= 2 ? stem : q));
  });
}

// Mots-clés au-dessus de la liste. Chacun cherche dans le titre l'un de ses
// mots, au singulier ou au pluriel (« Sofa » trouve aussi « couch »), en
// anglais comme en français (sans accents) : les titres peuvent être dans
// l'une ou l'autre langue. Ceux qui ne trouvent aucun meuble en vente ne
// s'affichent pas.
const SEARCH_TAGS = [
  { id: 'tv', en: 'TV', fr: 'Télé', words: ['tv', 'television', 'tele'] },
  { id: 'table', en: 'Table', fr: 'Table', words: ['table'] },
  { id: 'chair', en: 'Chair', fr: 'Chaise', words: ['chair', 'armchair', 'stool', 'chaise', 'fauteuil', 'tabouret'] },
  { id: 'sofa', en: 'Sofa', fr: 'Canapé', words: ['sofa', 'couch', 'canape'] },
  { id: 'bed', en: 'Bed', fr: 'Lit', words: ['bed', 'lit'] },
  { id: 'mattress', en: 'Mattress', fr: 'Matelas', words: ['mattress', 'matelas'] },
  { id: 'desk', en: 'Desk', fr: 'Bureau', words: ['desk', 'bureau', 'bureaux'] },
  { id: 'lamp', en: 'Lamp', fr: 'Lampe', words: ['lamp', 'light', 'lampe', 'lampadaire', 'luminaire'] },
  { id: 'shelf', en: 'Shelf', fr: 'Étagère', words: ['shelf', 'shelves', 'bookcase', 'bookshelf', 'etagere', 'bibliotheque'] },
  { id: 'wardrobe', en: 'Wardrobe', fr: 'Armoire', words: ['wardrobe', 'closet', 'armoire', 'penderie'] },
  { id: 'drawers', en: 'Drawers', fr: 'Commode', words: ['drawer', 'dresser', 'commode', 'tiroir'] },
  { id: 'mirror', en: 'Mirror', fr: 'Miroir', words: ['mirror', 'miroir'] },
  { id: 'rug', en: 'Rug', fr: 'Tapis', words: ['rug', 'carpet', 'tapis'] },
  { id: 'kitchen', en: 'Kitchen', fr: 'Cuisine', words: ['kitchen', 'microwave', 'kettle', 'toaster', 'pan', 'cutlery', 'plate', 'fridge',
    'cuisine', 'micro', 'bouilloire', 'poele', 'casserole', 'couverts', 'assiette', 'frigo', 'refrigerateur'] },
  { id: 'bike', en: 'Bike', fr: 'Vélo', words: ['bike', 'bicycle', 'velo'] },
];

function matchesTag(item, tag) {
  const words = searchWords(item.title);
  return tag.words.some((t) => words.some((w) => w === t || w === `${t}s` || w === `${t}es`));
}

// Tant qu'une fenêtre est ouverte (réservation, photo) : la page derrière
// ne défile plus et la touche Échap la ferme.
function useOverlay(onClose) {
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') closeRef.current(); };
    window.addEventListener('keydown', onKey);
    return () => {
      document.body.style.overflow = prev;
      window.removeEventListener('keydown', onKey);
    };
  }, []);
}

function Shop({ items, bundles, photoCounts, settings, busy, held, ready, loadFailed, onRetry, onAdmin,
                onSlotTaken, onBooked, onItemTaken }) {
  const t = useT();
  // La fenêtre ouverte : { kind: 'cart' }, { kind: 'book', target }, ou
  // { kind: 'contact', target } ; target est un meuble, 'cart' pour tout
  // le panier, { bundle } pour un lot, ou null pour une question générale.
  const [sheet, setSheet] = useState(null);
  const [photo, setPhoto] = useState(null);
  // Exemplaires encore libres : ni vendus, ni retenus par un rendez-vous,
  // ni réservés hors boutique.
  const freeQty = (item) => Math.max(0, leftQty(item) - (held[item.id] || 0) - reservedQty(item));
  const available = items.filter((i) => i.status !== 'sold' && freeQty(i) > 0);
  const photoTotal = (item) => (item.image ? 1 + (photoCounts[item.id] || 0) : 0);

  /* ---- lots ---- */
  // Les meubles d'un lot tels qu'ils sont maintenant : [{ item, count, left }].
  // Un meuble supprimé donne une ligne vide (null).
  const bundleLines = (bundle) => bundleEntries(bundle).map((e) => {
    const item = items.find((i) => String(i.id) === String(e.id));
    return item ? { item, count: e.count, left: item.status === 'sold' ? 0 : freeQty(item) } : null;
  });
  // En boutique tant que chacun de ses meubles est libre, au moins 2 en tout.
  const bundleOpen = (lines) =>
    lines.length > 0 && lines.every((l) => l && l.left >= l.count) && countAll(lines) >= 2;
  const openBundles = (bundles || [])
    .map((bundle) => ({ bundle, lines: bundleLines(bundle) }))
    .filter((b) => bundleOpen(b.lines));

  /* ---- panier ---- */
  const [cart, setCart] = useState(loadCart);
  // Ce qui a dû sortir du panier (réservé par quelqu'un d'autre entre-temps).
  const [cartNotice, setCartNotice] = useState('');
  useEffect(() => saveCart(cart), [cart]);
  const findItem = (id) => items.find((i) => String(i.id) === String(id));
  const inCart = (item) => cart.some((e) => String(e.id) === String(item.id));
  const cartLines = cart
    .map((e) => { const item = findItem(e.id); return item && { item, count: e.count, left: freeQty(item) }; })
    .filter((l) => l && l.item.status !== 'sold' && l.left > 0);

  // Un meuble réservé ou vendu entre-temps sort du panier, et on ne garde
  // pas plus d'exemplaires qu'il n'en reste.
  useEffect(() => {
    if (!ready || loadFailed) return;
    const gone = [];
    const next = [];
    cart.forEach((e) => {
      const item = findItem(e.id);
      const left = item && item.status !== 'sold' ? freeQty(item) : 0;
      if (left < 1) { if (item) gone.push(item.title); return; }
      next.push(left < e.count ? { ...e, count: left } : e);
    });
    if (next.length === cart.length && next.every((e, i) => e === cart[i])) return;
    setCart(next);
    if (gone.length) {
      const many = gone.length > 1;
      setCartNotice(t(`${gone.join(', ')} ${many ? 'were' : 'was'} just booked by someone else and left your cart.`,
        `${gone.join(', ')} ${many ? 'viennent' : 'vient'} d’être réservé${many ? 's' : ''} par quelqu’un d’autre et ${many ? 'ont' : 'a'} quitté votre panier.`));
    }
  }, [ready, loadFailed, items, held]);

  const toggleCart = (item) => {
    setCartNotice('');
    if (inCart(item)) return setCart((c) => c.filter((e) => String(e.id) !== String(item.id)));
    track('item_book', item.id);
    setCart((c) => [...c, { id: item.id, count: 1 }]);
  };
  const setCartCount = (item, count) =>
    setCart((c) => c.map((e) => (String(e.id) === String(item.id) ? { ...e, count } : e)));

  // Les meubles d'une fenêtre : un seul, tout le panier, un lot, ou aucun.
  // Un meuble du lot supprimé entre-temps compte comme parti.
  const linesOf = (target) => (target === 'cart' ? cartLines
    : target && target.bundle ? bundleLines(target.bundle).map((l, i) => l || { item: { id: `gone-${i}`, title: '' }, count: 1, left: 0 })
    : target ? [{ item: target, count: 1, left: freeQty(target) }] : []);
  const bundleOf = (target) => (target && target.bundle ? target.bundle : null);

  // Prénom et numéro tapés une fois servent aux fenêtres suivantes (gardés
  // le temps de la visite seulement).
  const [buyer, setBuyer] = useState({ firstName: '', phone: '', country: 'DK' });

  const booked = (rows) => {
    // Le panier d'abord : ces meubles partent parce que c'est lui qui les a
    // réservés, pas besoin de lui dire qu'ils ont disparu.
    setCart((c) => c.filter((e) => !rows.some((r) => String(r.item_id) === String(e.id))));
    onBooked(rows);
  };
  const cartCount = countAll(cartLines);

  // Tri par prix, le plus cher d'abord par défaut. À prix égal, le plus
  // récent reste devant (ordre de chargement). Sans prix = gratuit = 0.
  // On filtre soit par mot-clé, soit par recherche tapée (la loupe), pas
  // les deux à la fois.
  const [query, setQuery] = useState('');
  const [tag, setTag] = useState(null);
  const [searchOpen, setSearchOpen] = useState(false);
  const [sort, setSort] = useState('desc');
  const activeTag = SEARCH_TAGS.find((tg) => tg.id === tag) || null;
  const tags = SEARCH_TAGS.filter((tg) => tg === activeTag || available.some((i) => matchesTag(i, tg)));
  const searching = activeTag !== null || query.trim() !== '';
  const matches = (i) => (activeTag ? matchesTag(i, activeTag) : matchesSearch(i, query));
  const shown = available
    .filter(matches)
    .sort((a, b) => (priceValue(b.price) - priceValue(a.price)) * (sort === 'asc' ? -1 : 1));
  // Un lot reste affiché pendant une recherche si l'un de ses meubles correspond.
  const shownBundles = openBundles.filter((b) => !searching || b.lines.some((l) => matches(l.item)));
  const bookBundle = (b) => {
    b.lines.forEach((l) => track('item_book', l.item.id));
    setSheet({ kind: 'book', target: { bundle: b.bundle } });
  };
  const clearSearch = () => { setQuery(''); setTag(null); setSearchOpen(false); };

  const steps = [
    [t('Pick items', 'Choisir'),
     t('Book one, or add several to your cart and book them together.',
       'Réservez-en un, ou ajoutez-en plusieurs au panier pour les réserver ensemble.')],
    [t('Book a time', 'Réserver'),
     t('Choose a day, leave your first name and number.', 'Choisissez un jour, laissez votre prénom et votre numéro.')],
    [t('Pick up & pay', 'Retirer et payer'),
     t(`I text you to confirm. Pay by ${settings.payment}.`, `Je vous écris pour confirmer. Paiement : ${settings.payment}.`)],
  ];
  const itemWord = (n) => t(`item${n > 1 ? 's' : ''}`, `meuble${n > 1 ? 's' : ''}`);

  return (
    <div className={`min-h-screen bg-slate-50 ${cartLines.length ? 'pb-24' : ''}`}>
      <header className="bg-blue-800 text-white">
        <div className="max-w-5xl mx-auto px-5 pt-9 pb-16 sm:pt-14 sm:pb-20">
          <p className="text-blue-200 text-sm font-medium">{t('Moving out of Odense on 20 November', 'Je quitte Odense le 20 novembre')}</p>
          <h1 className="display font-bold text-4xl sm:text-5xl leading-tight mt-1">{t('Furniture for sale', 'Meubles à vendre')}</h1>
          <p className="mt-3 text-blue-100 text-lg leading-relaxed max-w-xl">
            {t('My internship is ending, so everything has to go and prices are low.',
               'Mon stage se termine : tout doit partir, et les prix sont bas.')}
          </p>
          <div className="mt-5 flex flex-wrap gap-2 text-sm">
            {settings.address && (
              <a href="#where" className="inline-flex items-center gap-1.5 rounded-full bg-white/10 hover:bg-white/20 px-3 py-1.5">
                <Icon name="pin" className="w-4 h-4" /> {settings.address}
              </a>
            )}
            {settings.payment && (
              <span className="inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5">
                <Icon name="card" className="w-4 h-4" /> {settings.payment}
              </span>
            )}
            <button type="button" onClick={() => setSheet({ kind: 'contact', target: null })}
                    className="inline-flex items-center gap-1.5 rounded-full bg-white text-blue-800 font-semibold hover:bg-blue-50 px-3 py-1.5">
              <Icon name="message" className="w-4 h-4" /> {t('Questions? Leave your number', 'Une question ? Laissez votre numéro')}
            </button>
          </div>
        </div>
      </header>

      <div className="max-w-5xl mx-auto px-5 -mt-10 sm:-mt-12">
        <ol className="bg-white rounded-2xl border border-slate-200 shadow-sm grid grid-cols-3 divide-x divide-slate-100">
          {steps.map(([title, text], i) => (
            <li key={title} className="px-2 py-4 sm:p-5 text-center sm:text-left">
              <span className="w-8 h-8 rounded-full bg-blue-700 text-white font-bold inline-flex items-center justify-center">
                {i + 1}
              </span>
              <p className="mt-2 font-semibold text-sm sm:text-base leading-tight">{title}</p>
              <p className="hidden sm:block mt-1 text-sm text-slate-500 leading-snug">{text}</p>
            </li>
          ))}
        </ol>
      </div>

      <main className="max-w-5xl mx-auto px-5 pt-10 pb-12">
        <h2 className="display font-bold text-2xl mb-4">{t('What’s for sale', 'À vendre')}</h2>

        {ready && available.length > 0 && (
          <div className="mb-5">
            {searchOpen ? (
              <label className="relative block">
                <span className="sr-only">{t('Search', 'Rechercher')}</span>
                <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" />
                <input type="text" enterKeyHint="search" autoComplete="off" autoFocus value={query}
                       onChange={(e) => setQuery(e.target.value)}
                       onKeyDown={(e) => {
                         if (e.key === 'Enter') e.currentTarget.blur();
                         if (e.key === 'Escape') clearSearch();
                       }}
                       placeholder={t('Search', 'Rechercher')}
                       className="w-full border border-slate-300 rounded-full pl-10 pr-10 py-1.5 text-base bg-white" />
                <button type="button" onClick={clearSearch} aria-label={t('Close search', 'Fermer la recherche')}
                        className="absolute right-1 top-1/2 -translate-y-1/2 p-2 rounded-full text-slate-400 hover:text-slate-700">
                  <Icon name="x" className="w-4 h-4" />
                </button>
              </label>
            ) : (
              <div className="flex flex-wrap gap-2">
                <button type="button" onClick={() => { setTag(null); setSearchOpen(true); }} aria-label={t('Search', 'Rechercher')}
                        className="w-9 h-9 shrink-0 inline-flex items-center justify-center rounded-full border border-slate-200 bg-white text-slate-600 hover:border-blue-300 hover:text-blue-700">
                  <Icon name="search" className="w-4 h-4" />
                </button>
                {tags.map((tg) => {
                  const on = tg === activeTag;
                  return (
                    <button key={tg.id} type="button" aria-pressed={on}
                            onClick={() => setTag(on ? null : tg.id)}
                            className={'h-9 rounded-full border px-3.5 text-sm font-medium '
                              + (on ? 'bg-blue-700 border-blue-700 text-white'
                                    : 'bg-white border-slate-200 text-slate-700 hover:border-blue-300 hover:text-blue-700')}>
                      {tg[t.lang]}
                    </button>
                  );
                })}
              </div>
            )}
            <div className="mt-3 flex items-center justify-between gap-3">
              <span className="text-sm text-slate-500">
                {searching ? t(`${shown.length} of ${available.length}`, `${shown.length} sur ${available.length}`) : available.length}
                {' '}{itemWord(available.length)}
              </span>
              <label className="inline-flex items-center gap-2 text-sm text-slate-500">
                {t('Sort', 'Trier')}
                <select value={sort} onChange={(e) => setSort(e.target.value)}
                        className="border border-slate-200 rounded-lg px-2.5 py-1.5 text-base text-slate-800 bg-white">
                  <option value="desc">{t('Price: high to low', 'Prix décroissant')}</option>
                  <option value="asc">{t('Price: low to high', 'Prix croissant')}</option>
                </select>
              </label>
            </div>
          </div>
        )}

        {!ready ? (
          <ul className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3" aria-label={t('Loading', 'Chargement')}>
            {[0, 1].map((i) => (
              <li key={i} className="bg-white rounded-2xl border border-slate-200 overflow-hidden animate-pulse">
                <div className="aspect-[4/3] bg-slate-100" />
                <div className="p-4 space-y-3">
                  <div className="h-6 bg-slate-100 rounded w-2/3" />
                  <div className="h-4 bg-slate-100 rounded w-1/2" />
                  <div className="h-12 bg-slate-100 rounded-xl" />
                </div>
              </li>
            ))}
          </ul>
        ) : loadFailed && available.length === 0 ? (
          <div className="border border-dashed border-blue-200 rounded-2xl bg-white px-6 py-14 text-center">
            <h3 className="display font-bold text-xl mb-1">{t('Couldn’t load the list', 'Impossible de charger la liste')}</h3>
            <p className="text-slate-600">{t('Check your connection and try again in a moment.', 'Vérifiez votre connexion et réessayez dans un instant.')}</p>
            <button onClick={onRetry}
                    className="mt-5 inline-flex items-center gap-2 font-semibold border border-blue-200 text-blue-800 rounded-xl px-5 py-3 hover:bg-blue-50">
              <Icon name="refresh" className="w-4 h-4" /> {t('Try again', 'Réessayer')}
            </button>
          </div>
        ) : available.length === 0 ? (
          <div className="border border-dashed border-blue-200 rounded-2xl bg-white px-6 py-14 text-center">
            <h3 className="display font-bold text-xl mb-1">{t('Nothing listed right now', 'Rien en vente pour le moment')}</h3>
            <p className="text-slate-600">{t('Check back soon — items are added as I pack up.', 'Revenez bientôt : j’ajoute des meubles au fil des cartons.')}</p>
          </div>
        ) : shown.length === 0 ? (
          <div className="border border-dashed border-blue-200 rounded-2xl bg-white px-6 py-14 text-center">
            <h3 className="display font-bold text-xl mb-1">
              {t(`Nothing matches “${activeTag ? activeTag.en : query.trim()}”`, `Aucun résultat pour « ${activeTag ? activeTag.fr : query.trim()} »`)}
            </h3>
            <p className="text-slate-600">{t('Try another word, like table, chair or lamp.', 'Essayez un autre mot, comme table, chaise ou lampe.')}</p>
            <button onClick={clearSearch}
                    className="mt-5 inline-flex items-center gap-2 font-semibold border border-blue-200 text-blue-800 rounded-xl px-5 py-3 hover:bg-blue-50">
              <Icon name="x" className="w-4 h-4" /> {t('Clear search', 'Effacer la recherche')}
            </button>
          </div>
        ) : (
          <>
          {shownBundles.length > 0 && (
            <section className="mb-10" aria-labelledby="bundles-title">
              <h3 id="bundles-title" className="display font-bold text-xl">{t('Bundle deals', 'Lots à prix réduit')}</h3>
              <p className="text-sm text-slate-500 mb-4">
                {t('Take them together and pay less. Each item is also sold on its own below.',
                   'Prenez-les ensemble et payez moins cher. Chaque meuble est aussi vendu seul plus bas.')}
              </p>
              <ul className="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                {shownBundles.map((b) => (
                  <BundleCard key={b.bundle.id} bundle={b.bundle} lines={b.lines}
                              onBook={() => bookBundle(b)}
                              onAsk={() => setSheet({ kind: 'contact', target: { bundle: b.bundle } })}
                              onPhoto={(item) => { track('item_photos', item.id); setPhoto(item); }} />
                ))}
              </ul>
            </section>
          )}
          <ul className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
            {shown.map((item) => (
              <ItemCard key={item.id} item={item} left={freeQty(item)} photoTotal={photoTotal(item)}
                        inCart={inCart(item)}
                        onBook={() => { track('item_book', item.id); setSheet({ kind: 'book', target: item }); }}
                        onCart={() => toggleCart(item)}
                        onAsk={() => { track('item_book', item.id); setSheet({ kind: 'contact', target: item }); }}
                        onPhoto={() => { track('item_photos', item.id); setPhoto(item); }} />
            ))}
          </ul>
          </>
        )}

        <PickupMap address={settings.address} />
      </main>

      <footer className="border-t border-slate-200 bg-white">
        <div className="max-w-5xl mx-auto px-5 py-6 flex flex-wrap items-center justify-between gap-3 text-sm text-slate-500">
          <span>{t('Pickup only', 'Retrait sur place uniquement')} · {settings.payment}</span>
          <button onClick={() => setSheet({ kind: 'contact', target: null })}
                  className="inline-flex items-center gap-1.5 text-blue-700 font-medium hover:underline">
            <Icon name="message" className="w-3.5 h-3.5" /> {t('Contact me', 'Me contacter')}
          </button>
          <button onClick={onAdmin}
                  className="inline-flex items-center gap-1.5 text-slate-400 hover:text-blue-700">
            <Icon name="lock" className="w-3.5 h-3.5" /> {t('Seller access', 'Espace vendeur')}
          </button>
        </div>
      </footer>

      {cartLines.length > 0 && !sheet && !photo && (
        <div className="fixed inset-x-0 bottom-0 z-30 px-4 pb-4 pt-2 pointer-events-none">
          <button onClick={() => setSheet({ kind: 'cart' })}
                  className="pointer-events-auto w-full max-w-md mx-auto flex items-center gap-3 rounded-2xl bg-blue-900 hover:bg-blue-950 text-white pl-4 pr-3 py-3 shadow-xl shadow-blue-900/30">
            <span className="relative shrink-0">
              <Icon name="bag" className="w-6 h-6" />
              <span className="absolute -top-1.5 -right-2 min-w-[1.25rem] h-5 px-1 rounded-full bg-white text-blue-900 text-xs font-bold inline-flex items-center justify-center tabular-nums">
                {cartCount}
              </span>
            </span>
            <span className="flex-1 min-w-0 text-left pl-1">
              <span className="block font-semibold leading-tight">{t('Your cart', 'Votre panier')} · {cartCount} {itemWord(cartCount)}</span>
              <span className="block text-sm text-blue-200">
                {showTotal(cartLines, t.lang)} · {t('one visit for everything', 'une seule visite pour tout')}
              </span>
            </span>
            <span className="shrink-0 inline-flex items-center gap-1 font-semibold text-sm bg-white/15 rounded-xl px-3 py-2">
              {t('View', 'Voir')} <Icon name="right" className="w-4 h-4" />
            </span>
          </button>
        </div>
      )}

      {sheet && sheet.kind === 'cart' && (
        <CartSheet
          lines={cartLines}
          notice={cartNotice}
          busy={busy}
          settings={settings}
          onCount={setCartCount}
          onRemove={toggleCart}
          onClose={() => setSheet(null)}
          onBook={() => { setCartNotice(''); setSheet({ kind: 'book', target: 'cart' }); }}
          onContact={() => setSheet({ kind: 'contact', target: 'cart' })}
        />
      )}
      {sheet && sheet.kind === 'book' && (
        <BookingSheet
          lines={linesOf(sheet.target)}
          bundle={bundleOf(sheet.target)}
          busy={busy}
          settings={settings}
          buyer={buyer}
          onBuyer={setBuyer}
          onClose={() => setSheet(null)}
          onTaken={onSlotTaken}
          onBooked={booked}
          onItemTaken={onItemTaken}
          onContact={() => setSheet({ kind: 'contact', target: sheet.target })}
          onCart={sheet.target === 'cart' ? () => setSheet({ kind: 'cart' }) : null}
        />
      )}
      {sheet && sheet.kind === 'contact' && (
        <ContactSheet
          lines={linesOf(sheet.target).filter((l) => l.item.title)}
          bundle={bundleOf(sheet.target)}
          buyer={buyer}
          onBuyer={setBuyer}
          onClose={() => setSheet(null)}
          onBook={sheet.target ? () => setSheet({ kind: 'book', target: sheet.target }) : null}
        />
      )}
      {photo && (
        <PhotoViewer
          item={photo}
          total={photoTotal(photo)}
          onClose={() => setPhoto(null)}
          onBook={() => { track('item_book', photo.id); setPhoto(null); setSheet({ kind: 'book', target: photo }); }}
        />
      )}
    </div>
  );
}

const SECONDARY_BTN = 'w-full inline-flex items-center justify-center gap-1.5 font-semibold text-sm rounded-xl py-3 px-2 border whitespace-nowrap ';

function ItemCard({ item, left, photoTotal, inCart, onBook, onCart, onAsk, onPhoto }) {
  const t = useT();
  const links = Array.isArray(item.links) ? item.links : [];
  const from = item.available_from ? String(item.available_from).slice(0, 10) : null;
  const several = totalQty(item) > 1;
  // Les longues descriptions sont coupées à 5 lignes, « Read more » les déplie.
  const [expanded, setExpanded] = useState(false);
  const [clipped, setClipped] = useState(false);
  const descRef = useRef(null);
  useEffect(() => {
    const el = descRef.current;
    if (!el || expanded) return;
    const check = () => setClipped(el.scrollHeight > el.clientHeight + 1);
    check();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(check);
  }, [item.description, expanded]);

  // Stats : la fiche compte comme vue quand elle reste au moins une seconde
  // à moitié à l'écran.
  const cardRef = useRef(null);
  useEffect(() => {
    const el = cardRef.current;
    if (!el || typeof IntersectionObserver === 'undefined') return;
    let timer;
    const io = new IntersectionObserver(([entry]) => {
      clearTimeout(timer);
      if (entry.isIntersecting) timer = setTimeout(() => { track('item_seen', item.id); io.disconnect(); }, 1000);
    }, { threshold: 0.5 });
    io.observe(el);
    return () => { clearTimeout(timer); io.disconnect(); };
  }, [item.id]);

  return (
    <li ref={cardRef} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
      <div className="relative aspect-[4/3] bg-blue-50">
        {item.image ? (
          <button onClick={onPhoto} className="block w-full h-full"
                  aria-label={photoTotal > 1
                    ? t(`See the ${photoTotal} photos of ${item.title}`, `Voir les ${photoTotal} photos : ${item.title}`)
                    : t(`Bigger photo of ${item.title}`, `Agrandir la photo : ${item.title}`)}>
            <img src={item.image} alt={item.title} className="w-full h-full object-cover" />
            {photoTotal > 1 && (
              <span className="absolute bottom-3 right-3 inline-flex items-center gap-1.5 text-xs font-semibold bg-black/60 text-white rounded-full px-3 py-1">
                <Icon name="image" className="w-3.5 h-3.5" /> {photoTotal} photos
              </span>
            )}
          </button>
        ) : (
          <div className="w-full h-full flex flex-col items-center justify-center gap-1 text-blue-300 text-sm">
            <Icon name="image" className="w-10 h-10" /> {t('No photo', 'Pas de photo')}
          </div>
        )}
        {from && from > todayKey() && (
          <span className="absolute top-3 left-3 inline-flex items-center gap-1.5 text-xs font-semibold bg-white text-blue-800 rounded-full px-3 py-1 shadow-sm">
            <Icon name="calendar" className="w-3.5 h-3.5" />
            {t('Available from', 'Disponible à partir du')} {fmtShort(from, { day: 'numeric', month: 'short' }, t.locale)}
          </span>
        )}
      </div>

      <div className="p-4 sm:p-5 flex flex-col flex-1">
        <div className="flex items-start justify-between gap-3">
          <h3 className="display font-bold text-xl leading-snug">{item.title}</h3>
          <span className="shrink-0 text-right">
            <span className="block display font-bold text-xl text-blue-700 whitespace-nowrap">{showPrice(item.price, t.lang)}</span>
            {several && priceValue(item.price) > 0 && <span className="block text-xs text-slate-500">{t('each', 'l’unité')}</span>}
          </span>
        </div>

        {(several || item.condition) && (
          <p className="mt-1 text-sm text-slate-500">
            {several && (
              <span className="font-semibold text-blue-800">
                {left > 1 ? t(`${left} available`, `${left} disponibles`) : t('Last one left', 'Dernier exemplaire')}
              </span>
            )}
            {several && item.condition && ' · '}
            {item.condition && conditionText(item.condition, t.lang)}
          </p>
        )}

        {item.description && (
          <>
            <p ref={descRef} className={`mt-2 text-slate-700 leading-relaxed whitespace-pre-line ${expanded ? '' : 'line-clamp-5'}`}>
              {item.description}
            </p>
            {(clipped || expanded) && (
              <button onClick={() => setExpanded(!expanded)}
                      className="mt-1 self-start text-sm font-semibold text-blue-700 hover:underline">
                {expanded ? t('Show less', 'Voir moins') : t('Read more', 'Lire la suite')}
              </button>
            )}
          </>
        )}

        {links.length > 0 && (
          <p className="mt-3 text-sm text-slate-500 flex flex-wrap items-center gap-x-3 gap-y-1">
            <span>{t('Also on', 'Aussi sur')}</span>
            {links.map((l, i) => (
              <a key={i} href={l.url} target="_blank" rel="noreferrer"
                 className="inline-flex items-center gap-1 text-blue-700 hover:underline">
                {l.label} <Icon name="external" className="w-3.5 h-3.5" />
              </a>
            ))}
          </p>
        )}

        <div className="mt-auto pt-4 space-y-2">
          <button onClick={onBook} className={PRIMARY_BTN}>
            <Icon name="calendar" className="w-5 h-5" /> {t('Book a viewing', 'Réserver une visite')}
          </button>
          <div className="grid grid-cols-2 gap-2">
            {/* En français, des mots courts : les deux boutons tiennent sur une ligne. */}
            <button onClick={onCart} aria-pressed={inCart}
                    aria-label={inCart ? t(`${item.title} is in your cart. Remove it`, `${item.title} est dans votre panier. Le retirer`)
                                       : t(`Add ${item.title} to your cart`, `Ajouter ${item.title} au panier`)}
                    className={SECONDARY_BTN + (inCart
                      ? 'bg-blue-50 border-blue-300 text-blue-800 hover:bg-blue-100'
                      : 'bg-white border-blue-200 text-blue-800 hover:bg-blue-50')}>
              <Icon name={inCart ? 'check' : 'bag'} className="w-4 h-4 shrink-0" />
              {inCart ? t('In your cart', 'Ajouté') : t('Add to cart', 'Au panier')}
            </button>
            <button onClick={onAsk} className={SECONDARY_BTN + 'bg-white border-slate-200 text-slate-700 hover:border-blue-300 hover:text-blue-800'}>
              <Icon name="message" className="w-4 h-4 shrink-0" /> {t('Contact me', 'Me contacter')}
            </button>
          </div>
        </div>
      </div>
    </li>
  );
}

// « −20 % » en français, « −20% » en anglais.
const pctText = (pct, lang) => (lang === 'fr' ? `−${pct} %` : `−${pct}%`);

// Un lot dans la boutique : des cartes empilées (une par meuble, la
// première devant), les photos de ses meubles côte à côte et le prix du
// lot à côté du prix barré. Toucher une photo ouvre celles de ce meuble.
// `preview` : aperçu dans l'espace vendeur, les boutons ne font rien.
function BundleCard({ bundle, lines, onBook, onAsk, onPhoto, preview }) {
  const t = useT();
  const pct = cleanDiscount(bundle.discount);
  const { full, price, saved } = bundlePrices(lines, pct);
  const n = countAll(lines);
  const tiles = lines.slice(0, 4).map((l) => l.item);
  const more = lines.length - tiles.length;
  // Les cartes du dessous montrent les meubles suivants (ou le même, pour
  // « 4 × Chaise »).
  const under = [lines[1] || lines[0], lines[2]].filter(Boolean).map((l) => l.item);
  const title = (bundle.title || '').trim() || autoBundleTitle(lines);

  const cover = (item) => (item.image
    ? <img src={item.image} alt="" className="w-full h-full object-cover" />
    : <span className="w-full h-full flex items-center justify-center text-blue-300"><Icon name="image" className="w-8 h-8" /></span>);

  const tile = (item, i) => {
    const big = tiles.length === 3 && i === 0;
    const line = lines[i];
    return (
      <button key={`${item.id}-${i}`} type="button" onClick={() => item.image && onPhoto(item)}
              disabled={!item.image}
              aria-label={t(`Photos of ${item.title}`, `Photos : ${item.title}`)}
              className={`relative block min-h-0 overflow-hidden bg-blue-50 ${big ? 'row-span-2' : ''}`}>
        {cover(item)}
        {line.count > 1 && (
          <span className="absolute bottom-2 left-2 text-xs font-bold bg-black/60 text-white rounded-full px-2 py-0.5">×{line.count}</span>
        )}
        {more > 0 && i === tiles.length - 1 && (
          <span className="absolute inset-0 bg-black/50 text-white text-2xl font-bold flex items-center justify-center">+{more}</span>
        )}
      </button>
    );
  };
  const grid = tiles.length === 1 ? 'grid-cols-1'
    : tiles.length === 2 ? 'grid-cols-2'
    : 'grid-cols-2 grid-rows-2';

  return (
    <li className="relative">
      {under.map((item, i) => (
        <div key={i} aria-hidden="true"
             className={`absolute inset-0 rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden ${
               i === 0 ? 'rotate-2 translate-x-1' : '-rotate-2 -translate-x-1'}`}>
          <div className="aspect-[4/3] bg-blue-50">{cover(item)}</div>
        </div>
      ))}
      <div className="relative h-full bg-white rounded-2xl border border-slate-200 shadow-md overflow-hidden flex flex-col">
        <div className="relative aspect-[4/3] bg-white">
          <div className={`absolute inset-0 grid gap-0.5 ${grid}`}>{tiles.map(tile)}</div>
          <span className="absolute top-3 left-3 inline-flex items-center gap-1.5 text-xs font-semibold bg-white text-blue-800 rounded-full px-3 py-1 shadow-sm pointer-events-none">
            <Icon name="layers" className="w-3.5 h-3.5" /> {t(`Bundle · ${n} items`, `Lot · ${n} meubles`)}
          </span>
          {pct > 0 && full > 0 && (
            <span className="absolute top-3 right-3 text-sm font-bold bg-amber-400 text-amber-950 rounded-full px-3 py-1 shadow-sm pointer-events-none">
              {pctText(pct, t.lang)}
            </span>
          )}
        </div>

        <div className="p-4 sm:p-5 flex flex-col flex-1">
          <div className="flex items-start justify-between gap-3">
            <h4 className="display font-bold text-xl leading-snug">{title}</h4>
            <span className="shrink-0 text-right">
              <span className="block display font-bold text-xl text-blue-700 whitespace-nowrap">
                {full > 0 ? fmtKr(price) : showPrice('', t.lang)}
              </span>
              {pct > 0 && full > 0 && <s className="block text-sm text-slate-400 whitespace-nowrap">{fmtKr(full)}</s>}
            </span>
          </div>
          {pct > 0 && saved > 0 && (
            <p className="mt-1 text-sm font-semibold text-green-700">
              {t(`You save ${fmtKr(saved)}`, `Vous économisez ${fmtKr(saved)}`)}
            </p>
          )}

          <ul className="mt-3 text-sm divide-y divide-slate-100 border-y border-slate-100">
            {lines.map(({ item, count }) => (
              <li key={item.id} className="flex items-baseline justify-between gap-3 py-1.5">
                <span className="min-w-0">
                  {count > 1 && <span className="font-semibold text-blue-800">{count} × </span>}{item.title}
                  {item.condition && <span className="text-slate-400"> · {conditionText(item.condition, t.lang)}</span>}
                </span>
                <span className="shrink-0 text-slate-500 whitespace-nowrap">{priceFor(item.price, count, t.lang)}</span>
              </li>
            ))}
          </ul>

          <div className="mt-auto pt-4 space-y-2">
            <button type="button" onClick={preview ? undefined : onBook} className={PRIMARY_BTN}>
              <Icon name="calendar" className="w-5 h-5" /> {t('Book the bundle', 'Réserver le lot')}
            </button>
            <button type="button" onClick={preview ? undefined : onAsk}
                    className={SECONDARY_BTN + 'bg-white border-slate-200 text-slate-700 hover:border-blue-300 hover:text-blue-800'}>
              <Icon name="message" className="w-4 h-4 shrink-0" /> {t('Contact me', 'Me contacter')}
            </button>
          </div>
        </div>
      </div>
    </li>
  );
}

// Sous la liste des meubles d'un lot (réservation, question) : son prix.
function BundleSummary({ bundle, lines }) {
  const t = useT();
  const pct = cleanDiscount(bundle.discount);
  const { full, price } = bundlePrices(lines, pct);
  return (
    <p className="mt-3 pt-3 border-t border-slate-100 flex items-baseline justify-between gap-3 font-semibold">
      <span className="inline-flex items-center gap-2">
        {t('Bundle price', 'Prix du lot')}
        {pct > 0 && full > 0 && (
          <span className="text-xs font-bold bg-amber-400 text-amber-950 rounded-full px-2 py-0.5">{pctText(pct, t.lang)}</span>
        )}
      </span>
      <span className="whitespace-nowrap">
        {pct > 0 && full > 0 && <s className="mr-2 text-sm font-normal text-slate-400">{fmtKr(full)}</s>}
        <span className="text-blue-700">{full > 0 ? fmtKr(price) : showPrice('', t.lang)}</span>
      </span>
    </p>
  );
}

// Galerie plein écran : on glisse du doigt d'une photo à l'autre (défilement
// natif aimanté), flèches et clavier sur ordinateur. La couverture s'affiche
// tout de suite, les autres arrivent dès qu'elles sont chargées.
function PhotoViewer({ item, total, onClose, onBook }) {
  const t = useT();
  useOverlay(onClose);
  const [photos, setPhotos] = useState(() =>
    [item.image, ...Array.from({ length: Math.max(0, total - 1) }, () => null)]);
  const [index, setIndex] = useState(0);
  const stripRef = useRef(null);

  useEffect(() => {
    if (total < 2) return;
    let alive = true;
    fetchExtraPhotos(item.id)
      .then((extras) => { if (alive) setPhotos([item.image, ...extras]); })
      .catch(() => { if (alive) setPhotos([item.image]); });
    return () => { alive = false; };
  }, [item.id]);

  const go = (i) => {
    const el = stripRef.current;
    const n = Math.max(0, Math.min(photos.length - 1, i));
    if (el) el.scrollTo({ left: n * el.clientWidth, behavior: 'smooth' });
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight') go(index + 1);
      if (e.key === 'ArrowLeft') go(index - 1);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  const stop = (e) => e.stopPropagation();
  const arrow = 'hidden sm:flex absolute top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 '
    + 'text-white items-center justify-center disabled:opacity-0';

  return (
    <div className="fixed inset-0 z-50 bg-black/90 flex flex-col" onClick={onClose}
         role="dialog" aria-modal="true" aria-label={item.title}>
      <div className="flex items-center justify-between gap-3 px-4 py-3 text-white">
        <p className="font-semibold truncate">{item.title}</p>
        <div className="flex items-center gap-3 shrink-0">
          {photos.length > 1 && <span className="text-sm text-white/70 tabular-nums">{index + 1} / {photos.length}</span>}
          <button onClick={onClose} className="p-2 rounded-full bg-white/10 hover:bg-white/20" aria-label={t('Close', 'Fermer')}>
            <Icon name="x" className="w-6 h-6" />
          </button>
        </div>
      </div>
      <div className="relative flex-1 min-h-0">
        <div ref={stripRef} className="h-full flex overflow-x-auto snap-x snap-mandatory no-scrollbar"
             onScroll={(e) => setIndex(Math.round(e.currentTarget.scrollLeft / e.currentTarget.clientWidth))}>
          {photos.map((src, i) => (
            <div key={i} className="w-full h-full shrink-0 snap-center flex items-center justify-center p-2">
              {src ? (
                <img src={src} alt={`${item.title}, photo ${i + 1}`} onClick={stop}
                     className="max-w-full max-h-full object-contain" />
              ) : (
                <span className="w-10 h-10 rounded-full border-2 border-white/20 border-t-white animate-spin" aria-label={t('Loading', 'Chargement')} />
              )}
            </div>
          ))}
        </div>
        {photos.length > 1 && (
          <>
            <button onClick={(e) => { stop(e); go(index - 1); }} disabled={index === 0}
                    className={`${arrow} left-4`} aria-label={t('Previous photo', 'Photo précédente')}>
              <Icon name="left" className="w-7 h-7" />
            </button>
            <button onClick={(e) => { stop(e); go(index + 1); }} disabled={index >= photos.length - 1}
                    className={`${arrow} right-4`} aria-label={t('Next photo', 'Photo suivante')}>
              <Icon name="right" className="w-7 h-7" />
            </button>
          </>
        )}
      </div>
      {photos.length > 1 && (
        <div className="flex justify-center gap-1 pt-3" onClick={stop}>
          {photos.map((_, i) => (
            <button key={i} onClick={() => go(i)} className="p-1" aria-label={`Photo ${i + 1}`} aria-current={i === index}>
              <span className={`block w-2 h-2 rounded-full ${i === index ? 'bg-white' : 'bg-white/35'}`} />
            </button>
          ))}
        </div>
      )}
      <div className="p-4" onClick={stop}>
        <button onClick={onBook}
                className="w-full max-w-md mx-auto flex items-center justify-center gap-2 font-semibold bg-white text-blue-800 rounded-xl py-3.5">
          <Icon name="calendar" className="w-5 h-5" /> {t('Book a viewing', 'Réserver une visite')} · {showPrice(item.price, t.lang)}
        </button>
      </div>
    </div>
  );
}

function PickupMap({ address }) {
  const t = useT();
  if (!address) return null;
  const q = encodeURIComponent(address);
  return (
    <section id="where" className="mt-12 scroll-mt-4">
      <h2 className="display font-bold text-2xl">{t('Where to pick up', 'Où retirer les meubles')}</h2>
      <p className="mt-1 text-slate-600 inline-flex items-center gap-2">
        <Icon name="pin" className="w-4 h-4 text-blue-700" /> {address}
      </p>
      <div className="mt-4 rounded-2xl overflow-hidden border border-slate-200 bg-blue-50 h-64 sm:h-72">
        <iframe title={t('Pickup location', 'Lieu de retrait')} className="w-full h-full" style={{ border: 0 }} loading="lazy"
                src={`https://maps.google.com/maps?q=${q}&z=15&hl=${t.lang}&output=embed`} />
      </div>
      <a href={`https://www.google.com/maps/dir/?api=1&destination=${q}`} target="_blank" rel="noreferrer"
         className="mt-3 w-full sm:w-auto inline-flex items-center justify-center gap-2 font-semibold bg-white border border-blue-200 text-blue-800 rounded-xl px-5 py-3 hover:bg-blue-50">
        <Icon name="pin" className="w-4 h-4" /> {t('Get directions', 'Itinéraire')}
      </a>

// La liste des pays, par-dessus la fenêtre de réservation. Le Danemark (et
// le pays déjà choisi) en tête, puis tous les pays de A à Z ; on peut
// chercher par début de nom ou par indicatif (« fra », « +33 »).
function CountryPicker({ value, onPick, onClose }) {
  const t = useT();
  const [query, setQuery] = useState('');
  const boxRef = useRef(null);
  const searchRef = useRef(null);

  // Sur ordinateur on peut taper tout de suite ; sur téléphone le clavier
  // cacherait la moitié de la liste, il ne s'ouvre que si on touche la recherche.
  useEffect(() => {
    const mouse = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
    (mouse ? searchRef.current : boxRef.current).focus();
  }, []);

  const q = query.trim();
  const byCode = /^\+?[\d\s]+$/.test(q);
  const all = countriesIn(t.lang);
  const found = !q ? null
    : byCode ? all.filter((c) => c.dial.startsWith(q.replace(/\D/g, '')))
    : all.filter((c) => ` ${c.search}`.includes(` ${fold(q)}`));
  const top = value === 'DK' ? [COUNTRY_BY_ISO.DK] : [COUNTRY_BY_ISO.DK, COUNTRY_BY_ISO[value]].filter(Boolean);

  const row = (c) => {
    const on = c.iso === value;
    return (
      <li key={c.iso}>
        <button type="button" onClick={() => onPick(c.iso)} aria-current={on || undefined}
                className={`w-full flex items-center gap-3 px-5 py-3 text-left ${on ? 'bg-blue-50' : 'hover:bg-slate-50'}`}>
          <span className="text-2xl leading-none w-8 text-center shrink-0" aria-hidden="true">{c.flag}</span>
          <span className={`flex-1 min-w-0 truncate ${on ? 'font-semibold text-blue-800' : ''}`}>{countryName(c, t.lang)}</span>
          <span className="text-slate-500 tabular-nums whitespace-nowrap">+{dialText(c)}</span>
          {on ? <Icon name="check" className="w-5 h-5 text-blue-700 shrink-0" /> : <span className="w-5 shrink-0" />}
        </button>
      </li>
    );
  };

  return (
    <div ref={boxRef} tabIndex={-1} role="dialog" aria-modal="true"
         aria-label={t('Choose your country code', 'Choisissez l’indicatif de votre pays')}
         className="absolute inset-0 z-10 bg-white flex flex-col outline-none"
         onKeyDown={(e) => {
           // Échap ferme la liste, pas toute la réservation.
           if (e.key === 'Escape') { e.stopPropagation(); onClose(); }
         }}>
      <div className="flex items-center gap-2 px-2 py-2 border-b border-slate-200 shrink-0">
        <button type="button" onClick={onClose} className="p-2.5 rounded-lg text-slate-600 hover:bg-slate-100" aria-label={t('Back', 'Retour')}>
          <Icon name="left" className="w-6 h-6" />
        </button>
        <p className="flex-1 text-center font-semibold">{t('Country code', 'Indicatif du pays')}</p>
        <span className="w-11" />
      </div>
      <div className="px-5 pt-4 pb-2 shrink-0">
        <div className="relative">
          <Icon name="search" className="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" />
          <input ref={searchRef} type="search" value={query} onChange={(e) => setQuery(e.target.value)}
                 onKeyDown={(e) => { if (e.key === 'Enter' && found && found.length) onPick(found[0].iso); }}
                 placeholder={t('Search a country or +code', 'Chercher un pays ou +indicatif')}
                 aria-label={t('Search a country or code', 'Chercher un pays ou un indicatif')}
                 autoComplete="off" enterKeyHint="search"
                 className="w-full border border-slate-300 rounded-xl pl-11 pr-4 py-3 text-base bg-white" />
        </div>
      </div>
      <div className="flex-1 overflow-y-auto overscroll-contain pb-4">
        {found ? (
          found.length ? <ul>{found.map(row)}</ul>
                       : <p className="px-5 py-10 text-center text-slate-500">{t('No country found.', 'Aucun pays trouvé.')}</p>
        ) : (
          <>
            <ul>{top.map(row)}</ul>
            <div className="mx-5 my-2 border-t border-slate-200" />
            <ul>{all.map(row)}</ul>
          </>
        )}
      </div>
    </div>
  );
}

// Fenêtre de la boutique : plein écran sur téléphone, centrée sur ordinateur.
// `overlay` se pose par-dessus (liste des pays), `footer` reste en bas.
function Sheet({ label, title, sub, onBack, onClose, overlay, footer, bodyRef, children }) {
  const t = useT();
  return (
    <div className="fixed inset-0 z-40 sm:bg-slate-900/50 sm:flex sm:items-center sm:justify-center sm:p-4"
         onClick={onClose}>
      <div role="dialog" aria-modal="true" aria-label={label}
           className="relative bg-white w-full h-full flex flex-col overflow-hidden sm:h-auto sm:max-h-[90vh] sm:max-w-lg sm:rounded-2xl sm:shadow-xl"
           onClick={(e) => e.stopPropagation()}>
        {overlay}
        <div className="flex items-center gap-2 px-2 py-2 border-b border-slate-200 shrink-0">
          {onBack ? (
            <button onClick={onBack} className="p-2.5 rounded-lg text-slate-600 hover:bg-slate-100" aria-label={t('Back', 'Retour')}>
              <Icon name="left" className="w-6 h-6" />
            </button>
          ) : <span className="w-11" />}
          <div className="flex-1 text-center min-w-0">
            <p className="font-semibold truncate">{title}</p>
            {sub && <p className="text-xs text-slate-500">{sub}</p>}
          </div>
          <button onClick={onClose} className="p-2.5 rounded-lg text-slate-600 hover:bg-slate-100" aria-label={t('Close', 'Fermer')}>
            <Icon name="x" className="w-6 h-6" />

        <div className="border-t border-slate-200 bg-white px-5 py-3 shrink-0">{footer}</div>

  );
}

// Le numéro de l'acheteur : pays (drapeau + indicatif) puis numéro. Sert à
// la réservation et à la demande de contact ; la liste des pays s'ouvre
// par-dessus la fenêtre (CountryPicker, posé par la fenêtre).
function usePhoneField(initial) {
  const [phone, setPhone] = useState((initial && initial.phone) || '');
  // Le pays de l'indicatif, choisi dans la liste à drapeaux.
  const [country, setCountry] = useState((initial && initial.country) || 'DK');
  const [picking, setPicking] = useState(false);
  const phoneRef = useRef(null);
  const codeRef = useRef(null);
  // Le numéro tel qu'il sera enregistré. Le drapeau suit un indicatif
  // tapé à la main (« +33… ») pendant qu'on l'écrit.
  const tel = parsePhone(country, phone);
  const shown = tel.country || COUNTRY_BY_ISO[country];
  return {
    phone, setPhone, country, tel, shown, picking, phoneRef, codeRef,
    open: () => setPicking(true),
    pick: (iso) => {
      setCountry(iso);
      // Un indicatif tapé dans le numéro laisse la place au pays choisi.
      if (tel.typedCode) setPhone(tel.rest);
      setPicking(false);
      if (phoneRef.current) phoneRef.current.focus();
    },
    close: () => {
      setPicking(false);
      if (codeRef.current) codeRef.current.focus();
    },
    // En quittant le champ, un indicatif tapé à la main passe dans le
    // sélecteur : « +33 6 12… » devient France + « 6 12… ».
    tidy: () => {
      if (tel.typedCode && tel.country) {
        setCountry(tel.country.iso);
        setPhone(tel.rest);
      }
    },
    // De quoi préremplir la fenêtre suivante.
    saved: () => ({ country: shown.iso, phone: tel.typedCode ? tel.rest : phone }),
  };
}

    <div className="mt-4">

        <span className="font-semibold">{t('Your phone number', 'Votre numéro de téléphone')}</span>
        {hint && <span className="block text-sm text-slate-500">{hint}</span>}
      </label>
      <div className="mt-1.5 flex items-stretch gap-2">
        <button ref={f.codeRef} type="button" onClick={f.open} aria-haspopup="dialog"
                aria-label={t(`Country code: ${code}. Change`, `Indicatif : ${code}. Changer`)}
                className="shrink-0 flex items-center gap-1.5 border border-slate-300 rounded-xl pl-3 pr-2.5 bg-white hover:border-blue-400">
          <span className="text-xl leading-none" aria-hidden="true">{f.shown.flag}</span>
          <span className="font-medium tabular-nums whitespace-nowrap">+{dialText(f.shown)}</span>

               onChange={(e) => { f.setPhone(e.target.value); onEdit(); }} onBlur={f.tidy}

               className="min-w-0 flex-1 border border-slate-300 rounded-xl px-4 py-3 text-base bg-white"

}

const FIELD = 'mt-1.5 w-full border border-slate-300 rounded-xl px-4 py-3 text-base bg-white';

// Le panier : nombre d'exemplaires, retirer, puis un seul rendez-vous pour
// tout ou une question d'abord.
function CartSheet({ lines, notice, busy, settings, onCount, onRemove, onClose, onBook, onContact }) {
  const t = useT();
  useOverlay(onClose);
  const n = countAll(lines);
  // Un meuble qui n'a plus aucun créneau empêcherait de tout réserver ensemble.
  const taken = new Set(busy.map((b) => `${String(b.day).slice(0, 10)} ${b.slot}`));
  const noTime = (item) => bookableDays(scheduleFor(item, settings), taken).length === 0;
  const stepBtn = 'w-9 h-9 rounded-lg border border-slate-300 bg-white text-xl font-semibold text-slate-700 '
    + 'disabled:border-slate-100 disabled:text-slate-300';
  const several = lines.length > 1;

  const footer = lines.length ? (
    <div className="space-y-2">
      <button onClick={onBook} className={PRIMARY_BTN}>
        <Icon name="calendar" className="w-5 h-5" />
        {several ? t('Book one viewing for all', 'Une seule visite pour tout') : t('Book a viewing', 'Réserver une visite')}
      </button>
      <button onClick={onContact}
              className={SECONDARY_BTN + 'text-base py-3 bg-white border-blue-200 text-blue-800 hover:bg-blue-50'}>
        <Icon name="message" className="w-4 h-4" /> {t('Ask me a question first', 'Me poser une question d’abord')}
      </button>

  ) : (
    <button onClick={onClose} className={PRIMARY_BTN}>{t('Back to the list', 'Retour à la liste')}</button>
  );

  return (
    <Sheet label={t('Your cart', 'Votre panier')} title={t('Your cart', 'Votre panier')}
           sub={n ? t(`${n} item${n > 1 ? 's' : ''}`, `${n} meuble${n > 1 ? 's' : ''}`) : null}
           onClose={onClose} footer={footer}>
      <div className="px-5 py-5">
        {notice && (
          <p role="status" className="mb-4 rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 text-sm text-amber-900">
            {notice}
          </p>
        )}
        {lines.length === 0 ? (
          <div className="py-10 text-center">
            <Icon name="bag" className="w-10 h-10 text-blue-200 mx-auto" />
            <p className="mt-3 font-semibold">{t('Your cart is empty', 'Votre panier est vide')}</p>
            <p className="mt-1 text-sm text-slate-500">
              {t('Tap “Add to cart” under the items you want, then book them all at once.',
                 'Touchez « Au panier » sous les meubles qui vous plaisent, puis réservez-les tous d’un coup.')}
            </p>
          </div>
        ) : (
          <>
            <ul className="divide-y divide-slate-100">
              {lines.map(({ item, count, left }) => (
                <li key={item.id} className="py-3 first:pt-0 flex items-start gap-3">
                  <LineThumb item={item} />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-start justify-between gap-2">
                      <p className="font-semibold leading-snug">{item.title}</p>
                      <button onClick={() => onRemove(item)}
                              aria-label={t(`Remove ${item.title} from your cart`, `Retirer ${item.title} du panier`)}
                              className="-mt-1.5 -mr-2 p-2 shrink-0 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50">
                        <Icon name="trash" className="w-4 h-4" />
                      </button>
                    </div>
                    <div className="mt-1 flex items-center justify-between gap-2">
                      {left > 1 ? (
                        <div className="flex items-center gap-2">
                          <button onClick={() => onCount(item, count - 1)} disabled={count <= 1}
                                  aria-label={t(`One less ${item.title}`, `Un de moins : ${item.title}`)} className={stepBtn}>−</button>
                          <span className="w-6 text-center font-bold tabular-nums" aria-live="polite">{count}</span>
                          <button onClick={() => onCount(item, count + 1)} disabled={count >= left}

                      )}

                ? t('You pick everything up at the same visit and pay on pickup.', 'Vous récupérez tout lors de la même visite et payez au retrait.')
                : t('You pick it up and pay on pickup.', 'Vous le récupérez sur place et payez au retrait.')}
