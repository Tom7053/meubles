        setPhotoState('ready');
      })
      .catch(() => { if (request === photoRequest.current) setPhotoState('failed'); });
  };
  const closeForm = () => {
    photoRequest.current++;
    setOpen(false);
    setForm(emptyForm);
  };

  // Tant que la description n'a pas été retouchée à la main, elle suit les
  // choix du formulaire. Une fois retouchée, on n'y touche plus. Le titre
  // suit le type, la matière et la marque tant qu'on ne l'a pas tapé.
  // Un texte écrit tout seul dans l'autre langue suit aussi : il passe dans
  // la langue de la boutique au prochain changement.
  const change = (nextForm, nextDetails) => {
    const follows = !(form.description || '').trim() || autoTexts(form, details).includes(form.description);
    const titleFollows = nextDetails !== details && (!form.title.trim() || autoTitles(details).includes(form.title));
    const f = titleFollows ? { ...nextForm, title: suggestTitle(nextDetails, shopLang) } : nextForm;
    setForm(follows ? { ...f, description: describeItem(f, nextDetails, shopLang) } : f);
    setDetails(nextDetails);
  };
  const setDetail = (k, v) => change(form, { ...details, [k]: v });
  const toggleTag = (en) => setDetail('tags',
    details.tags.includes(en) ? details.tags.filter((x) => x !== en) : [...details.tags, en]);

  // Une autre tournure à chaque clic, dans la langue de la boutique. Avec
  // peu de choix, un numéro voisin peut donner le même texte : on avance
  // jusqu'à ce qu'il change. Un titre proposé tout seul suit la langue.
  const rewrite = () => {
    let next = details;
    for (let i = 1; i <= 12 && describeItem(form, next, shopLang) === form.description; i++) {
      next = { ...details, version: details.version + i };
    }
    const text = describeItem(form, next, shopLang);
    if (!text) return pushToast(t('First pick the type of item, the condition or a colour.', 'Choisis d’abord le type de meuble, l’état ou une couleur.'));
    if (form.description.trim() && !autoTexts(form, details).includes(form.description)) setBeforeRewrite(form.description);
    const autoTitle = !form.title.trim() || autoTitles(details).includes(form.title);
    const title = autoTitle && suggestTitle(next, shopLang) ? suggestTitle(next, shopLang) : form.title;
    setDetails(next);
    setForm((f) => ({ ...f, title, description: text }));
  };

  const submit = async () => {
    if (!form.title.trim()) return pushToast(t('The listing needs a title.', 'Il manque le titre de l’annonce.'));
    setBusy(true);
    const quantity = Math.min(20, totalQty(form));
    // Nombre baissé sous ce qui est déjà vendu : tout est parti.
    const sold_qty = Math.min(quantity, soldQty(form));
    // La couverture reste dans items.image, les autres vont dans item_photos.
    const [cover, ...extras] = form.photos;
    const payload = {
      title: form.title.trim(),
      price: withKr(form.price),
      condition: form.condition.trim(),
      description: form.description.trim(),
      links: (form.links || []).filter((l) => l.label.trim() && l.url.trim()),
      image: cover || null,
      status: sold_qty >= quantity ? 'sold' : (form.status || 'available'),
      available_from: form.available_from || null,
      available_to: form.available_to || null,
      custom_schedule: !!form.custom_schedule,
      weekdays: form.custom_schedule ? (form.weekdays || DEFAULT_SETTINGS.weekdays) : null,
      slots: form.custom_schedule ? (form.slots || DEFAULT_SETTINGS.slots) : null,
    };
    // Avant migration-quantite.sql ces colonnes n'existent pas : on ne les
    // envoie que si la base les a déjà, ou s'il y a plusieurs exemplaires.
    if (quantity > 1 || items.some((i) => 'quantity' in i)) Object.assign(payload, { quantity, sold_qty });
    // La colonne details arrive avec migration-photos.sql, comme item_photos.
    if (manyPhotos) payload.details = details;
    let res;
    if (form.id) res = await sb.from('items').update(payload).eq('id', form.id).select().single();
    else res = await sb.from('items').insert(payload).select().single();
    // PGRST204 = colonne inconnue de la base.
    if (res.error && res.error.code === 'PGRST204') {
      setBusy(false);
      return pushToast(t('To sell several of the same item, first run migration-quantite.sql in Supabase (SQL Editor).',
                         'Pour vendre plusieurs exemplaires, lance d’abord migration-quantite.sql dans Supabase (SQL Editor).'));
    }
    if (res.error) {
      setBusy(false);
      return pushToast(t('Could not save, try again.', 'Enregistrement impossible, réessaie.'));
    }
    const saved = res.data;
    setItems(form.id ? items.map((i) => (i.id === form.id ? saved : i)) : [saved, ...items]);

    // Les autres photos, seulement si on sait ce qu'il y avait avant : sinon
    // on effacerait celles qui n'ont pas pu être chargées.
    if (manyPhotos && photoState === 'ready' && (extras.length || photoCounts[saved.id])) {
      const { error } = extras.length
        ? await sb.from('item_photos').upsert({ item_id: saved.id, photos: extras })
        : await sb.from('item_photos').delete().eq('item_id', saved.id);
      if (error) {
        setBusy(false);
        // L'annonce existe maintenant : réessayer la met à jour au lieu d'en créer une autre.
        setForm((f) => ({ ...f, id: saved.id }));
        return pushToast(t('Listing saved, but not the other photos. Click “Save” again.',
                           'Annonce enregistrée, mais pas les autres photos. Clique encore sur « Enregistrer ».'));
      }
      extraPhotoCache.set(saved.id, extras);
      setPhotoCounts((c) => ({ ...c, [saved.id]: extras.length }));
    }
    setBusy(false);
    closeForm();
    pushToast(extras.length && !manyPhotos
      ? t('Listing saved with the cover only: run migration-photos.sql to keep several photos.',
          'Annonce enregistrée avec la couverture seulement : lance migration-photos.sql pour garder plusieurs photos.')
      : form.id ? t('Listing updated.', 'Annonce mise à jour.') : t('Listing published.', 'Annonce publiée.'));
  };

  // Les lots dont ce meuble fait partie.
  const bundlesOf = (item) => (bundles || []).filter((b) => bundleEntries(b).some((e) => String(e.id) === String(item.id)));

  const remove = async (item) => {
    const lots = bundlesOf(item).map((b) => t(`“${b.title}”`, `« ${b.title} »`)).join(', ');
    const inLots = lots ? t(` It is in the bundle ${lots}, which will no longer be offered.`, ` Il fait partie du lot ${lots}, qui ne sera plus proposé.`) : '';
    if (!window.confirm(t(`Delete “${item.title}”? This cannot be undone.${inLots}`, `Supprimer « ${item.title} » ? Cette action est définitive.${inLots}`))) return;
    const { error } = await sb.from('items').delete().eq('id', item.id);
    if (error) return pushToast(t('Could not delete.', 'Suppression impossible.'));
    setItems(items.filter((i) => i.id !== item.id));
    pushToast(t('Listing deleted.', 'Annonce supprimée.'));
  };

  // Combien d'exemplaires sont partis, et à quel prix (`salePrice`, en kr)
  // pour celui qui vient de partir. Tout vendu : l'annonce quitte la
  // boutique. `unreserve` : il était réservé hors boutique. Renvoie true
  // si c'est enregistré.
  const setSold = async (item, n, salePrice, unreserve = 0) => {
    const total = totalQty(item);
    const sold_qty = Math.max(0, Math.min(total, n));
    const listed = priceValue(item.price);
    const haggled = salePrice != null && salePrice !== listed;
    const patch = soldPatch(item, sold_qty, haggled ? [salePrice] : [], unreserve);
    if (!patch) {
      pushToast(t('To note a haggled price, first run migration-prix-vente.sql in Supabase (SQL Editor).',
                  'Pour noter un prix négocié, lance d’abord migration-prix-vente.sql dans Supabase (SQL Editor).'));
      return false;
    }
    const { status } = patch;
    const { error } = await sb.from('items').update(patch).eq('id', item.id);
    if (error) {
      pushToast(t('Could not update.', 'Mise à jour impossible.'));
      return false;
    }
    setItems(items.map((i) => (i.id === item.id ? { ...i, ...patch } : i)));
    const at = haggled ? t(` for ${fmtKr(salePrice)} (listed ${fmtKr(listed)})`, ` à ${fmtKr(salePrice)} (affiché ${fmtKr(listed)})`) : '';
    const left = t(`${total - sold_qty} of ${total} left in the shop.`, `Il en reste ${total - sold_qty} sur ${total} dans la boutique.`);
    if (status === 'sold') pushToast(t(`Sold${at}: removed from the shop.`, `Vendu${at} : retiré de la boutique.`));
    else if (sold_qty > soldQty(item)) pushToast(`${t('Sold', 'Vendu')}${at}. ${left}`);
    else if (total > 1) pushToast(left);
    else pushToast(t('Back on sale.', 'Remise en vente.'));
    return true;
  };

  // Réservé hors boutique : quelqu'un a pris rendez-vous sur Marketplace,
  // DBA… Le meuble (ou `n` exemplaires) quitte la boutique jusqu'à
  // « Vendu » ou « Annuler la réservation ». Renvoie true si c'est enregistré.
  const setReserved = async (item, n) => {
    if (!('reserved_qty' in item)) {
      pushToast(t('To mark an item as reserved, first run migration-lots.sql in Supabase (SQL Editor).',
                  'Pour marquer un meuble réservé, lance d’abord migration-lots.sql dans Supabase (SQL Editor).'));
      return false;
    }
    const total = totalQty(item);
    const reserved_qty = Math.max(0, Math.min(leftQty(item), n));
    const { error } = await sb.from('items').update({ reserved_qty }).eq('id', item.id);
    if (error) {
      pushToast(t('Could not update.', 'Mise à jour impossible.'));
      return false;
    }
    setItems(items.map((i) => (i.id === item.id ? { ...i, reserved_qty } : i)));
    if (reserved_qty < reservedQty(item)) {
      pushToast(t(`Reservation cancelled: “${item.title}” is back in the shop.`, `Réservation annulée : « ${item.title} » est de nouveau dans la boutique.`));
    } else if (total > 1) {
      pushToast(t(`${reserved_qty} of ${total} reserved: out of the shop until you mark them sold or cancel.`,
                  `${reserved_qty} sur ${total} réservé${reserved_qty > 1 ? 's' : ''} : retiré${reserved_qty > 1 ? 's' : ''} de la boutique jusqu’à « Vendu » ou « Annuler ».`));
    } else {
      pushToast(t('Reserved: out of the shop until you mark it sold or cancel the reservation.',
                  'Réservé : retiré de la boutique jusqu’à « Vendu » ou « Annuler la réservation ».'));
    }
    return true;
  };

  const cancelReserved = (item) => {
    if (!window.confirm(t(`The buyer pulled out? “${item.title}” goes back in the shop.`,
                          `L’acheteur s’est rétracté ? « ${item.title} » revient dans la boutique.`))) return;
    setReserved(item, reservedQty(item) - 1);
  };

  // Les photos de tous les meubles encore en vente dans un seul .zip, un
  // dossier par meuble. Deux meubles du même nom : chair/, chair-2/.
  const downloadAllPhotos = async () => {
    const forSale = items.filter((i) => i.status !== 'sold' && i.image);
    if (!forSale.length) return pushToast(t('No photos of items for sale to download.', 'Aucune photo de meuble en vente à télécharger.'));
    setZipping(true);
    try {
      const used = new Set();
      const folders = await Promise.all(forSale.map((item) => {
        let name = fileSlug(item.title);
        for (let n = 2; used.has(name); n++) name = `${fileSlug(item.title)}-${n}`;
        used.add(name);
        return itemPhotoFiles(item, manyPhotos, name)
          .then((files) => files.map((file) => ({ path: `${name}/${file.name}`, file })));
      }));
      const files = folders.flat();
      saveFile(await makeZip(files), t('furniture-photos.zip', 'photos-meubles.zip'));
      pushToast(t(`${files.length} photo${files.length > 1 ? 's' : ''}, one folder per item.`,
                  `${files.length} photo${files.length > 1 ? 's' : ''}, un dossier par meuble.`));
    } catch {
      pushToast(t('Could not download the photos, try again.', 'Téléchargement des photos impossible, réessaie.'));
    }
    setZipping(false);
  };

  const kind = KINDS.find((k) => k.en === details.kind);
  const many = items.length > 1;

  return (
    <div>
      <GoalProgress items={items} />

      <div className="flex items-center justify-between gap-2 mb-5">
        <p className="text-slate-500 text-sm">
          {t(`${items.length} item${many ? 's' : ''} saved`, `${items.length} meuble${many ? 's' : ''} enregistré${many ? 's' : ''}`)}
        </p>
        <div className="flex items-center gap-2 shrink-0">
          <button onClick={downloadAllPhotos} disabled={zipping}
                  title={t('Photos of the items for sale, one folder per item (.zip)', 'Photos des meubles en vente, un dossier par meuble (.zip)')}
                  aria-label={t('Download all photos', 'Télécharger toutes les photos')}
                  className="inline-flex items-center gap-2 text-sm text-slate-600 border border-slate-200 rounded-lg px-3 py-2.5 hover:border-blue-400 hover:text-blue-700 disabled:text-slate-400">
            <Icon name="download" className="w-4 h-4" />
            <span className={zipping ? '' : 'hidden sm:inline'}>{zipping ? t('Preparing…', 'Préparation…') : t('All photos', 'Toutes les photos')}</span>
          </button>
          <button onClick={() => openForm(emptyForm)}
                  className="inline-flex items-center gap-2 font-semibold bg-blue-700 hover:bg-blue-800 text-white rounded-lg px-4 py-2.5 text-sm">
            <Icon name="plus" className="w-4 h-4" /> {t('Add an item', 'Ajouter un meuble')}
          </button>
        </div>
      </div>

      {open && (
        <div className="border border-blue-200 rounded-xl bg-blue-50 p-5 mb-8">
          <h2 className="display font-bold text-lg mb-4">{form.id ? t('Edit listing', 'Modifier l’annonce') : t('New listing', 'Nouvelle annonce')}</h2>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <label className="block col-span-2">
              <span className="text-sm text-slate-600">{t('Title', 'Titre')} <span className="text-slate-400">({inShopLang})</span></span>
              <input value={form.title} onChange={(e) => change({ ...form, title: e.target.value }, details)}
                     className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white"
                     placeholder={shopLang === 'fr' ? 'Bureau en chêne' : 'Oak desk'} />
            </label>
            <label className="block">
              <span className="text-sm text-slate-600">{t('Price', 'Prix')}</span>
              <span className="mt-1 flex items-center border border-slate-200 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-400">
                <input value={form.price} onChange={(e) => change({ ...form, price: e.target.value }, details)} inputMode="decimal"
                       className="w-full min-w-0 rounded-lg px-3 py-2 bg-transparent outline-none" placeholder="450" />
                <span className="pr-3 text-slate-500">kr</span>
              </span>
            </label>
            <label className="block">
              <span className="text-sm text-slate-600">{t('Quantity', 'Nombre')}</span>
              <input type="number" min="1" max="20" inputMode="numeric" value={form.quantity}
                     onChange={(e) => set('quantity', e.target.value)}
                     className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" />
            </label>
          </div>
          {totalQty(form) > 1 && (
            <p className="mt-1.5 text-xs text-slate-500">
              {t(`${totalQty(form)} identical ones, price for one: the buyer chooses how many to take.`,
                 `${totalQty(form)} exemplaires identiques, prix pour un : l’acheteur choisit combien il en prend.`)}
              {soldQty(form) > 0 && (leftQty(form) > 0
                ? t(` ${soldQty(form)} already sold, ${leftQty(form)} left.`,
                    ` ${soldQty(form)} déjà vendu${soldQty(form) > 1 ? 's' : ''}, il en reste ${leftQty(form)}.`)
                : t(' All already sold.', ' Tous sont déjà vendus.'))}
            </p>
          )}

          <label className="block mt-3">
            <span className="text-sm text-slate-600">{t('Condition', 'État')}</span>
            <select value={form.condition || ''} onChange={(e) => change({ ...form, condition: e.target.value }, details)}
                    className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white">
              <option value="">{t('Not specified', 'Non précisé')}</option>
              {/* ce qu'on lit, puis ce que voient les acheteurs s'ils lisent une autre langue */}
              {CONDITIONS.map((c) => {
                const mine = t(c.en, c.fr);
                const theirs = shopLang === 'fr' ? c.fr : c.en;
                return (
                  <option key={c.en} value={c.en}>
                    {mine === theirs ? mine : t(`${mine} · “${theirs}”`, `${mine} · « ${theirs} »`)}
                  </option>
                );
              })}
              {/* état tapé à la main avant le menu : on le garde tel quel */}
              {form.condition && !CONDITIONS.some((c) => c.en === form.condition) && (
                <option value={form.condition}>{form.condition}</option>
              )}
            </select>
          </label>

          <PhotosEditor photos={form.photos} onChange={(p) => set('photos', p)} state={photoState}
                        manyPhotos={manyPhotos} pushToast={pushToast} />

          <div className="mt-5 border-t border-blue-200 pt-4">
            <span className="font-semibold text-sm">{t('To write the description', 'Pour écrire la description')}</span>
            <p className="text-xs text-slate-500 mt-0.5">
              {t(`Tick what applies, the description ${inShopLang} writes itself below. The more you fill in, the more precise it gets.`,
                 `Coche ce qui correspond, la description ${inShopLang} s’écrit toute seule en dessous. Plus tu en remplis, plus elle est précise.`)}
            </p>

            <div className="mt-3 grid grid-cols-2 sm:grid-cols-3 gap-3">
              {[['kind', t('Type', 'Type'), KINDS, t('Other (the title)', 'Autre (le titre)')],
                ['material', t('Material', 'Matière'), MATERIALS, '—'],
                ['colour', t('Colour', 'Couleur'), COLOURS, '—']].map(([k, label, options, none]) => (
                <label key={k} className={`block ${k === 'kind' ? 'col-span-2 sm:col-span-1' : ''}`}>
                  <span className="text-sm text-slate-600">{label}</span>
                  <select value={details[k]} onChange={(e) => setDetail(k, e.target.value)}
                          className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white">
                    <option value="">{none}</option>
                    {options.map((o) => <option key={o.en} value={o.en}>{optionLabel(o, t.lang)}</option>)}
                  </select>
                </label>
              ))}
            </div>

            <div className="mt-3 grid grid-cols-2 sm:grid-cols-3 gap-3">
              <label className="block col-span-2 sm:col-span-1">
                <span className="text-sm text-slate-600">{t('Brand / model', 'Marque / modèle')}</span>
                <input value={details.brand} onChange={(e) => setDetail('brand', e.target.value)}
                       className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" placeholder="IKEA Malm" />
              </label>
              <label className="block">
                <span className="text-sm text-slate-600">{t('Bought in', 'Acheté en')}</span>
                <input value={details.year} onChange={(e) => setDetail('year', e.target.value)} inputMode="numeric"
                       maxLength={4} className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" placeholder="2023" />
              </label>
              <label className="block">
                <span className="text-sm text-slate-600">{t('Price paid new', 'Prix payé neuf')}</span>
                <span className="mt-1 flex items-center border border-slate-200 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-400">
                  <input value={details.paid} onChange={(e) => setDetail('paid', e.target.value)} inputMode="decimal"
                         className="w-full min-w-0 rounded-lg px-3 py-2 bg-transparent outline-none" placeholder="1200" />
                  <span className="pr-3 text-slate-500 text-sm">kr</span>
                </span>
              </label>
            </div>

            <div className="mt-3 grid grid-cols-3 gap-3">
              {[['width', t('Width', 'Largeur')],
                ['depth', kind && kind.long ? t('Length', 'Longueur') : t('Depth', 'Profondeur')],
                ['height', t('Height', 'Hauteur')]].map(([k, label]) => (
                <label key={k} className="block">
                  <span className="text-sm text-slate-600">{label}</span>
                  <span className="mt-1 flex items-center border border-slate-200 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-400">
                    <input value={details[k]} onChange={(e) => setDetail(k, e.target.value)} inputMode="decimal"
                           className="w-full min-w-0 rounded-lg px-3 py-2 bg-transparent outline-none" />
                    <span className="pr-3 text-slate-500 text-sm">cm</span>
                  </span>
                </label>
              ))}
            </div>

            {[['features', t('Strong points', 'Atouts'), FEATURES.filter((o) => fitsKind(o, details.kind))],
              ['flaws', t('Flaws to mention', 'Défauts à signaler'), FLAWS],
              ['home', t('Your home', 'Chez toi'), HOME],
              ['pickup', t('Taking it home', 'Pour l’emporter'), PICKUP]].map(([id, label, options]) => (
              <div key={id} className="mt-3">
                <span className="text-sm text-slate-600">{label}</span>
                <div className="mt-1 flex flex-wrap gap-2">
                  {options.map((o) => (
                    <button key={o.en} type="button" onClick={() => toggleTag(o.en)} aria-pressed={details.tags.includes(o.en)}
                            className={`rounded-lg text-sm border px-3 py-1.5 ${
                              details.tags.includes(o.en) ? 'bg-blue-700 border-blue-700 text-white'
                                                          : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}`}>
                      {optionLabel(o, t.lang)}
                    </button>
                  ))}
                </div>
              </div>
            ))}

            <div className="mt-4 flex items-end justify-between gap-3">
              <label htmlFor="item-description" className="text-sm text-slate-600">
                {t(`Description (shown ${inShopLang})`, `Description (affichée ${inShopLang})`)}
              </label>
              <button type="button" onClick={rewrite}
                      className="inline-flex items-center gap-1.5 text-sm font-semibold text-blue-700 hover:text-blue-900 whitespace-nowrap">
                <Icon name="refresh" className="w-4 h-4" /> {t('Rewrite', 'Reformuler')}
              </button>
            </div>
            <textarea id="item-description" value={form.description} onChange={(e) => set('description', e.target.value)}
                      rows={5} className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white"
                      placeholder={shopLang === 'fr'
                        ? 'Bureau blanc en chêne de chez IKEA. Transforme n’importe quel coin en bureau. En très bon état.'
                        : 'A white oak desk from IKEA. Turns any corner into a home office. In very good condition.'} />
            <p className="mt-1 text-xs text-slate-500">
              {t('You can edit the text: it then stops changing by itself. “Rewrite” starts again from your choices with other sentences, at each click.',
                 'Tu peux retoucher le texte : il ne bougera plus tout seul. « Reformuler » repart de tes choix avec d’autres phrases, à chaque clic.')}
              {beforeRewrite != null && (
                <button type="button" onClick={() => { set('description', beforeRewrite); setBeforeRewrite(null); }}
                        className="ml-2 underline hover:text-blue-700">
                  {t('Back to the previous text', 'Revenir au texte d’avant')}
                </button>
              )}
            </p>
          </div>

          <div className="mt-5 border-t border-blue-200 pt-4">
            <span className="font-semibold text-sm">{t('Availability of this item', 'Disponibilité de ce meuble')}</span>
            <p className="text-xs text-slate-500 mt-0.5">
              {t('Leave empty to follow the general schedule. Handy when the TV can go right away but the bed only just before you leave.',
                 'Laisse vide pour suivre le planning général. Utile quand tu peux te séparer de la télé tout de suite mais pas du lit avant ton départ.')}
            </p>

            <div className="mt-3 grid sm:grid-cols-2 gap-3">
              <label className="block">
                <span className="text-sm text-slate-600">{t('Visible from', 'Visible à partir du')}</span>
                <input type="date" value={form.available_from || ''}
                       onChange={(e) => set('available_from', e.target.value)}
                       max={LAST_DAY}
                       className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" />
              </label>
              <label className="block">
                <span className="text-sm text-slate-600">{t('Last possible day', 'Dernier jour possible')}</span>
                <input type="date" value={form.available_to || ''}
                       onChange={(e) => set('available_to', e.target.value)}
                       max={LAST_DAY}
                       className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" />
              </label>
            </div>

            <label className="mt-3 flex items-center gap-2 text-sm text-slate-700">
              <input type="checkbox" checked={!!form.custom_schedule}
                     onChange={(e) => setForm((f) => ({
                       ...f,
                       custom_schedule: e.target.checked,
                       weekdays: f.weekdays || [...DEFAULT_SETTINGS.weekdays],
                       slots: f.slots || [...DEFAULT_SETTINGS.slots],
                     }))}
                     className="w-4 h-4 accent-blue-700" />
              {t('Different days and time slots for this item', 'Jours et créneaux différents pour ce meuble')}
            </label>

            {form.custom_schedule && (
              <div className="mt-3 space-y-4 border border-blue-200 rounded-lg bg-white p-4">
                <div>
                  <span className="text-sm text-slate-600">{t('Days', 'Jours')}</span>
                  <div className="mt-2">
                    <WeekdayPicker compact value={form.weekdays || DEFAULT_SETTINGS.weekdays}
                                   onChange={(w) => set('weekdays', w)} />
                  </div>
                </div>
                <div>
                  <span className="text-sm text-slate-600">{t('Time slots', 'Créneaux')}</span>
                  <div className="mt-2">
                    <SlotEditor compact value={form.slots || DEFAULT_SETTINGS.slots}
                                onChange={(s) => set('slots', s)} pushToast={pushToast} />
                  </div>
                </div>
              </div>
            )}
          </div>

          <div className="mt-4">
            <span className="text-sm text-slate-600">{t('Links to other sites', 'Liens vers les autres sites')}</span>
            <div className="mt-1 space-y-2">
              {(form.links || []).map((l, idx) => (
                <div key={idx} className="flex gap-2">
                  <input value={l.label}
                         onChange={(e) => { const links = [...form.links]; links[idx] = { ...l, label: e.target.value }; set('links', links); }}
                         className="w-44 border border-slate-200 rounded-lg px-3 py-2 bg-white text-sm" placeholder="Facebook Marketplace" />
                  <input value={l.url}
                         onChange={(e) => { const links = [...form.links]; links[idx] = { ...l, url: e.target.value }; set('links', links); }}
                         className="flex-1 border border-slate-200 rounded-lg px-3 py-2 bg-white text-sm" placeholder="https://…" />
                  <button onClick={() => set('links', form.links.filter((_, i) => i !== idx))}
                          className="px-2 text-slate-400 hover:text-red-600" aria-label={t('Remove link', 'Retirer le lien')}>
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
              ))}
            </div>
            <div className="mt-2 flex flex-wrap gap-2">
              {LINK_PRESETS.map((p) => (
                <button key={p} onClick={() => set('links', [...(form.links || []), { label: p, url: '' }])}
                        className="text-xs border border-blue-200 text-blue-800 rounded-full px-3 py-1 hover:bg-white">
                  + {p}
                </button>
              ))}
            </div>
          </div>

          <div className="mt-5 flex gap-2">
            <button onClick={submit} disabled={busy || photoState === 'loading'}
                    className="font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg px-5 py-2.5 text-sm">
              {busy ? t('Saving…', 'Enregistrement…')
                : form.id ? t('Save changes', 'Enregistrer les modifications') : t('Publish listing', 'Publier l’annonce')}
            </button>
            <button onClick={closeForm} className="text-sm text-slate-600 hover:text-slate-900 px-4">
              {t('Cancel', 'Annuler')}
            </button>
          </div>
        </div>
      )}

      {items.length === 0 ? (
        <div className="border border-dashed border-blue-200 rounded-xl px-6 py-12 text-center text-slate-600">
          {t('No items yet. Add your first one to open the shop.', 'Aucun meuble pour l’instant. Ajoute ton premier objet pour ouvrir la boutique.')}
        </div>
      ) : (
        <ul className="divide-y divide-slate-100 border-t border-slate-100">
          {items.map((item) => (
            <li key={item.id} className="py-4">
              <div className="flex flex-wrap sm:flex-nowrap items-center gap-x-4 gap-y-2">
                <div className="w-20 h-16 rounded-lg bg-blue-50 border border-blue-100 overflow-hidden shrink-0 flex items-center justify-center">
                  {item.image ? <img src={item.image} alt="" className="w-full h-full object-cover" />
                              : <Icon name="image" className="w-5 h-5 text-blue-200" />}
                </div>
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className={`font-semibold ${item.status === 'sold' ? 'text-slate-400 line-through' : ''}`}>{item.title}</span>
                    <span className="text-blue-700 text-sm">{withKr(item.price)}</span>
                    {item.status === 'sold' && <span className="text-xs bg-slate-100 text-slate-600 rounded-full px-2 py-0.5">{t('Sold', 'Vendu')}</span>}
                    {item.status !== 'sold' && reservedQty(item) > 0 && (
                      <span className="text-xs bg-amber-100 text-amber-900 rounded-full px-2 py-0.5">
                        {totalQty(item) > 1 ? t(`${reservedQty(item)} reserved`, `${reservedQty(item)} réservé${reservedQty(item) > 1 ? 's' : ''}`) : t('Reserved', 'Réservé')}
                      </span>
                    )}
                  </div>
                  <p className="text-xs text-slate-500 mt-1 truncate">
                    {[
                      soldQty(item) > 0 ? soldNote(item, t) : null,
                      leftQty(item) > 0 ? heldNote(item, bookings, t) : null,
                      item.available_from && String(item.available_from).slice(0, 10) > todayKey()
                        ? `${t('from', 'à partir du')} ${String(item.available_from).slice(8, 10)}/${String(item.available_from).slice(5, 7)}`
                        : null,
                      item.available_to
                        ? `${t('until', 'jusqu’au')} ${String(item.available_to).slice(8, 10)}/${String(item.available_to).slice(5, 7)}`
                        : null,
                      item.custom_schedule ? t('own schedule', 'horaires propres') : null,
                      bundlesOf(item).length > 1 ? t(`in ${bundlesOf(item).length} bundles`, `dans ${bundlesOf(item).length} lots`)
                        : bundlesOf(item).length ? t('in a bundle', 'dans un lot') : null,
                      photoCounts[item.id] ? `${photoCounts[item.id] + 1} photos` : null,
                      Array.isArray(item.links) && item.links.length ? item.links.map((l) => l.label).join(', ') : null,
                    ].filter(Boolean).join(' · ')}
                  </p>
                </div>
                {/* sur téléphone, les boutons passent sous la ligne */}
                <div className="flex flex-wrap items-center justify-end gap-1 shrink-0 w-full sm:w-auto">
                  {item.status !== 'sold' && leftQty(item) - reservedQty(item) - heldQty(item, bookings) > 0 && (
                    <button onClick={() => setReserved(item, reservedQty(item) + 1)}
                            title={t('Someone booked it on another site (Marketplace, DBA…): it leaves the shop',
                                     'Quelqu’un l’a réservé sur un autre site (Marketplace, DBA…) : il quitte la boutique')}
                            className="inline-flex items-center gap-1 text-xs border border-slate-200 rounded-lg px-3 py-1.5 hover:border-amber-400 hover:text-amber-800">
                      <Icon name="bookmark" className="w-3.5 h-3.5" />
                      {totalQty(item) > 1 && reservedQty(item) > 0 ? t('Reserve 1 more', 'Réserver 1 de plus') : t('Mark as reserved', 'Marquer réservé')}
                    </button>
                  )}
                  {totalQty(item) > 1 ? (
                    <span className="inline-flex items-center border border-slate-200 rounded-lg text-xs">
                      <button onClick={() => setSold(item, soldQty(item) - 1)} disabled={soldQty(item) === 0}
                              className="px-2.5 py-1.5 text-base leading-none text-slate-600 hover:text-blue-700 disabled:text-slate-300"
                              aria-label={t('One less sold', 'Un vendu de moins')}>−</button>
                      <span className="px-1 tabular-nums">
                        {t(`${soldQty(item)} sold of ${totalQty(item)}`, `${soldQty(item)} vendu${soldQty(item) > 1 ? 's' : ''} sur ${totalQty(item)}`)}
                      </span>
                      <button onClick={() => setSelling(selling === item.id ? null : item.id)} disabled={leftQty(item) === 0}
                              className="px-2.5 py-1.5 text-base leading-none text-slate-600 hover:text-blue-700 disabled:text-slate-300"
                              aria-label={t('One more sold', 'Un vendu de plus')}>+</button>
                    </span>
                  ) : item.status === 'sold' ? (
                    <button onClick={() => setSold(item, 0)}
                            className="text-xs border border-slate-200 rounded-lg px-3 py-1.5 hover:border-blue-400 hover:text-blue-700">
                      {t('Put back on sale', 'Remettre en vente')}
                    </button>
                  ) : reservedQty(item) > 0 ? null : (
                    <button onClick={() => setSelling(selling === item.id ? null : item.id)} aria-expanded={selling === item.id}
                            className="text-xs border border-slate-200 rounded-lg px-3 py-1.5 hover:border-blue-400 hover:text-blue-700">
                      {t('Mark as sold', 'Marquer vendu')}
                    </button>
                  )}
                  {item.image && (
                    <button onClick={() => setPhotosOf(photosOf === item.id ? null : item.id)} aria-expanded={photosOf === item.id}
                            className="p-2 text-slate-500 hover:text-blue-700 rounded-lg hover:bg-blue-50"
                            aria-label={t('Download photos', 'Télécharger les photos')} title={t('Download photos', 'Télécharger les photos')}>
                      <Icon name="download" className="w-4 h-4" />
                    </button>
                  )}
                  <button onClick={() => openForm(item)}
                          className="p-2 text-slate-500 hover:text-blue-700 rounded-lg hover:bg-blue-50" aria-label={t('Edit', 'Modifier')}>
                    <Icon name="pencil" className="w-4 h-4" />
                  </button>
                  <button onClick={() => remove(item)}
                          className="p-2 text-slate-500 hover:text-red-600 rounded-lg hover:bg-red-50" aria-label={t('Delete', 'Supprimer')}>
                    <Icon name="trash" className="w-4 h-4" />
                  </button>
                </div>
              </div>
              {item.status !== 'sold' && reservedQty(item) > 0 && (
                <div className="mt-3 flex flex-wrap items-center gap-2 border border-amber-200 bg-amber-50 rounded-xl px-4 py-2.5 text-sm">
                  <span className="mr-auto inline-flex items-start gap-1.5 text-amber-900">
                    <Icon name="bookmark" className="w-4 h-4 mt-0.5 shrink-0" />
                    <span>
                      <strong>
                        {totalQty(item) > 1
                          ? t(`${reservedQty(item)} of ${totalQty(item)} reserved elsewhere`, `${reservedQty(item)} sur ${totalQty(item)} réservé${reservedQty(item) > 1 ? 's' : ''} hors boutique`)
                          : t('Reserved elsewhere', 'Réservé hors boutique')}
                      </strong>
                      {' · '}{t('out of the shop until the buyer comes', 'retiré de la boutique en attendant l’acheteur')}
                    </span>
                  </span>
                  <button onClick={() => setSelling(selling === `r${item.id}` ? null : `r${item.id}`)} aria-expanded={selling === `r${item.id}`}
                          className="inline-flex items-center gap-1.5 font-semibold border border-green-600 text-green-700 bg-white rounded-lg px-3 py-1.5 hover:bg-green-50">
                    <Icon name="check" className="w-4 h-4" /> {t('Sold', 'Vendu')}
                  </button>
                  <button onClick={() => cancelReserved(item)}
                          className="inline-flex items-center gap-1.5 border border-slate-200 bg-white text-slate-600 rounded-lg px-3 py-1.5 hover:border-slate-400">
                    <Icon name="x" className="w-4 h-4" /> {t('Cancel the reservation', 'Annuler la réservation')}
                  </button>
                </div>
              )}
              {selling === `r${item.id}` && reservedQty(item) > 0 && (
                <SalePrompt item={item} onConfirm={(price) => setSold(item, soldQty(item) + 1, price, 1)}
                            onCancel={() => setSelling(null)} />
              )}
              {selling === item.id && leftQty(item) > 0 && (
                <SalePrompt item={item} onConfirm={(price) => setSold(item, soldQty(item) + 1, price)}
                            onCancel={() => setSelling(null)} />
              )}
              {photosOf === item.id && (
                <PhotoDownload item={item} manyPhotos={manyPhotos} pushToast={pushToast}
                               onClose={() => setPhotosOf(null)} />
              )}
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

// Onglet Lots : plusieurs meubles déjà en vente, vendus ensemble avec une
// remise (migration-lots.sql). Dans la boutique, un lot s'affiche en cartes
// empilées au-dessus des meubles ; chacun d'eux reste aussi en vente seul.
const DISCOUNT_CHOICES = [0, 10, 15, 20, 25, 30];

function BundlesPanel({ items, bookings, bundles, setBundles, missing, pushToast }) {
  const t = useT();
  // Le titre s'écrit dans la langue des acheteurs.
  const shopLang = useShopLang();
  const inShopLang = shopLang === 'fr' ? t('in French', 'en français') : t('in English', 'en anglais');
  // Le lot ouvert : { id, title, entries: [{ id, count }], discount }, ou null.
  const [form, setForm] = useState(null);
  const [busy, setBusy] = useState(false);

  const findItem = (id) => items.find((i) => String(i.id) === String(id));
  const linesOf = (entries) => entries
    .map((e) => { const item = findItem(e.id); return item && { item, count: e.count }; })
    .filter(Boolean);
  // Exemplaires qu'un lot peut proposer : ni vendus, ni réservés hors
  // boutique, ni retenus par un rendez-vous.
  const freeOf = (item) => (item.status === 'sold' ? 0
    : Math.max(0, leftQty(item) - reservedQty(item) - heldQty(item, bookings)));
  // Pourquoi un meuble empêche le lot d'être dans la boutique, ou null.
  const problem = (e) => {
    const item = findItem(e.id);
    if (!item) return t('an item was deleted', 'un meuble a été supprimé');
    if (item.status === 'sold' || leftQty(item) < e.count) return t(`${item.title} sold`, `${item.title} vendu`);
    if (freeOf(item) >= e.count) return null;
    return reservedQty(item) > 0 ? t(`${item.title} reserved elsewhere`, `${item.title} réservé hors boutique`)
                                 : t(`${item.title} held by a booking`, `${item.title} réservé par un rendez-vous`);
  };

  const openForm = (bundle) => {
    const entries = bundle ? bundleEntries(bundle) : [];
    // Un titre proposé tout seul reste vide : il suit les meubles choisis.
    const title = bundle && bundle.title !== autoBundleTitle(linesOf(entries)) ? bundle.title : '';
    setForm({ id: bundle ? bundle.id : null, title, entries, discount: bundle ? cleanDiscount(bundle.discount) : 20 });
  };
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const isOn = (item) => form.entries.some((e) => String(e.id) === String(item.id));
  const toggle = (item) => setForm((f) => ({
    ...f,
    entries: f.entries.some((e) => String(e.id) === String(item.id))
      ? f.entries.filter((e) => String(e.id) !== String(item.id))
      : [...f.entries, { id: item.id, count: 1 }],
  }));
  const setCount = (item, count) => setForm((f) => ({
    ...f,
    entries: f.entries.map((e) => (String(e.id) === String(item.id) ? { ...e, count } : e)),
  }));

  const save = async () => {
    const lines = linesOf(form.entries);
    if (countAll(lines) < 2) return pushToast(t('Pick at least 2 items for a bundle.', 'Choisis au moins 2 meubles pour faire un lot.'));
    const payload = {
      title: (form.title.trim() || autoBundleTitle(lines)).slice(0, 160),
      items: lines.map((l) => ({ id: l.item.id, count: l.count })),
      discount: cleanDiscount(form.discount),
    };
    setBusy(true);
    const res = form.id
      ? await sb.from('bundles').update(payload).eq('id', form.id).select().single()
      : await sb.from('bundles').insert(payload).select().single();
    setBusy(false);
    if (res.error) {
      console.warn('[meubles] lot :', res.error.message);
      return pushToast(t('Could not save, try again.', 'Enregistrement impossible, réessaie.'));
    }
    setBundles((prev) => (form.id ? prev.map((b) => (b.id === form.id ? res.data : b)) : [res.data, ...prev]));
    pushToast(payload.items.some(problem)
      ? t('Bundle saved. It will show in the shop once all its items are free.',
          'Lot enregistré. Il apparaîtra dans la boutique quand tous ses meubles seront libres.')
      : form.id ? t('Bundle updated.', 'Lot mis à jour.') : t('Bundle published: it is in the shop.', 'Lot publié : il est dans la boutique.'));
    setForm(null);
  };

  const remove = async (bundle) => {
    if (!window.confirm(t(`Delete the bundle “${bundle.title}”? The items stay on sale one by one.`,
                          `Supprimer le lot « ${bundle.title} » ? Les meubles restent en vente un par un.`))) return;
    const { error } = await sb.from('bundles').delete().eq('id', bundle.id);
    if (error) return pushToast(t('Could not delete.', 'Suppression impossible.'));
    setBundles((prev) => prev.filter((b) => b.id !== bundle.id));
    if (form && form.id === bundle.id) setForm(null);
    pushToast(t('Bundle deleted.', 'Lot supprimé.'));
  };

  if (missing) {
    return (
      <div className="border border-dashed border-amber-300 bg-amber-50 rounded-xl px-6 py-10 text-center text-amber-900">
        <p className="font-semibold">{t('Bundles are not turned on yet.', 'Les lots ne sont pas encore activés.')}</p>
        <p className="mt-1 text-sm leading-relaxed">
          {t(<>Run <code className="bg-white px-1.5 py-0.5 rounded">migration-lots.sql</code> once in Supabase
               (SQL Editor → New query → Run), then refresh the page.</>,
             <>Lance <code className="bg-white px-1.5 py-0.5 rounded">migration-lots.sql</code> une fois dans Supabase
               (SQL Editor → New query → Run), puis actualise la page.</>)}
        </p>
      </div>
    );
  }

  const thumb = (item, cls) => (
    <div className={`rounded-lg bg-blue-50 border border-blue-100 overflow-hidden flex items-center justify-center ${cls}`}>
      {item && item.image ? <img src={item.image} alt="" className="w-full h-full object-cover" />
                          : <Icon name="image" className="w-5 h-5 text-blue-200" />}
    </div>
  );

  const editor = form && (() => {
    const lines = linesOf(form.entries);
    const pct = cleanDiscount(form.discount);
    const { full, price, saved } = bundlePrices(lines, pct);
    // Les meubles qu'on peut mettre dans un lot : ceux encore en vente, et
    // ceux déjà dans ce lot.
    const candidates = items.filter((i) => isOn(i) || (i.status !== 'sold' && leftQty(i) > 0));
    const stepBtn = 'w-8 h-8 rounded-lg border border-slate-300 bg-white text-lg font-semibold text-slate-700 '
      + 'disabled:border-slate-100 disabled:text-slate-300';
    return (
      <div className="border border-blue-200 rounded-xl bg-blue-50 p-5 mb-8">
        <h2 className="display font-bold text-lg">{form.id ? t('Edit bundle', 'Modifier le lot') : t('New bundle', 'Nouveau lot')}</h2>
        <p className="text-xs text-slate-500 mt-0.5">
          {t('Tick the items sold together. The first one ticked is the card on top.',
             'Coche les meubles vendus ensemble. Le premier coché est la carte du dessus.')}
        </p>

        {candidates.length === 0 ? (
          <p className="mt-3 text-sm text-slate-600">{t('No items for sale yet: add some in Listings first.', 'Aucun meuble en vente : ajoute-en d’abord dans Annonces.')}</p>
        ) : (
          <ul className="mt-3 grid sm:grid-cols-2 gap-2">
            {candidates.map((item) => {
              const on = isOn(item);
              const entry = form.entries.find((e) => String(e.id) === String(item.id));
              const count = entry ? entry.count : 1;
              const max = Math.max(1, leftQty(item));
              const note = on ? problem({ id: item.id, count }) : null;
              return (
                <li key={item.id}
                    className={`flex items-center gap-3 rounded-lg border px-3 py-2 bg-white ${on ? 'border-blue-500 ring-1 ring-blue-500' : 'border-slate-200'}`}>
                  <input id={`lot-${item.id}`} type="checkbox" checked={on} onChange={() => toggle(item)}
                         className="w-4 h-4 accent-blue-700 shrink-0" />
                  <label htmlFor={`lot-${item.id}`} className="flex items-center gap-3 flex-1 min-w-0 cursor-pointer">
                    {thumb(item, 'w-12 h-10 shrink-0')}
                    <span className="min-w-0 flex-1">
                      <span className="block font-medium truncate">{item.title}</span>
                      <span className="block text-xs text-slate-500">
                        {withKr(item.price) || t('free', 'gratuit')}{totalQty(item) > 1 && priceValue(item.price) > 0 ? t(' each', ' l’unité') : ''}
                      </span>
                      {note && <span className="block text-xs text-amber-700">{note}</span>}
                    </span>
                  </label>
                  {on && max > 1 && (
                    <span className="flex items-center gap-1.5 shrink-0">
                      <button type="button" onClick={() => setCount(item, count - 1)} disabled={count <= 1}
                              aria-label={t(`One less ${item.title}`, `Un de moins : ${item.title}`)} className={stepBtn}>−</button>
                      <span className="w-5 text-center font-bold tabular-nums">{count}</span>
                      <button type="button" onClick={() => setCount(item, count + 1)} disabled={count >= max}
                              aria-label={t(`One more ${item.title}`, `Un de plus : ${item.title}`)} className={stepBtn}>+</button>
                    </span>
                  )}
                </li>
              );
            })}
          </ul>
        )}

        <div className="mt-5">
          <span className="text-sm text-slate-600">{t('Discount on the bundle', 'Remise sur le lot')}</span>
          <div className="mt-1 flex flex-wrap items-center gap-2">
            {DISCOUNT_CHOICES.map((d) => (
              <button key={d} type="button" onClick={() => set('discount', d)} aria-pressed={pct === d}
                      className={`rounded-lg text-sm border px-3 py-1.5 ${
                        pct === d ? 'bg-blue-700 border-blue-700 text-white' : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300'}`}>
                {d ? pctText(d, t.lang) : t('None', 'Aucune')}
              </button>
            ))}
            <label className="flex items-center border border-slate-200 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-400">
              <span className="sr-only">{t('Other discount, in %', 'Autre remise, en %')}</span>
              <span className="pl-3 text-slate-500 text-sm">{t('Other', 'Autre')}</span>
              <input type="number" min="0" max={MAX_DISCOUNT} inputMode="numeric" value={form.discount}
                     onChange={(e) => set('discount', e.target.value)}
                     className="w-16 rounded-lg px-2 py-1.5 bg-transparent outline-none text-right" />
              <span className="pr-3 text-slate-500 text-sm">%</span>
            </label>
          </div>
        </div>

        <label className="block mt-4">
          <span className="text-sm text-slate-600">
            {t('Title', 'Titre')} <span className="text-slate-400">({inShopLang}, {t('optional', 'facultatif')})</span>
          </span>
          <input value={form.title} onChange={(e) => set('title', e.target.value)} maxLength={160}
                 className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white"
                 placeholder={autoBundleTitle(lines) || (shopLang === 'fr' ? 'Lit + matelas' : 'Bed + mattress')} />
          <span className="block mt-1 text-xs text-slate-500">
            {t('Left empty, it lists the items: “Bed + Mattress”.', 'Laissé vide, il reprend les meubles : « Lit + Matelas ».')}
          </span>
        </label>

        {lines.length > 0 && full > 0 && (
          <p className="mt-4 text-sm text-slate-700">
            {t('Separately', 'Séparément')} {pct > 0 ? <s className="text-slate-400">{fmtKr(full)}</s> : fmtKr(full)}
            {pct > 0 && (
              <>
                {' → '}<strong className="text-blue-800 text-base">{fmtKr(price)}</strong>
                {' '}{t(`for the bundle, the buyer saves ${fmtKr(saved)}`, `pour le lot, l’acheteur économise ${fmtKr(saved)}`)}
              </>
            )}
          </p>
        )}

        {countAll(lines) >= 2 && (
          <div className="mt-5">
            <span className="text-sm text-slate-600">{t('Preview in the shop', 'Aperçu dans la boutique')}</span>
            <LangContext.Provider value={shopLang}>
              <ul className="mt-3 max-w-sm px-3 py-2">
                <BundleCard preview bundle={{ title: form.title.trim() || autoBundleTitle(lines), discount: pct }}
                            lines={lines} onPhoto={() => {}} />
              </ul>
            </LangContext.Provider>
          </div>
        )}

        <div className="mt-5 flex gap-2">
          <button onClick={save} disabled={busy}
                  className="font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg px-5 py-2.5 text-sm">
            {busy ? t('Saving…', 'Enregistrement…') : form.id ? t('Save changes', 'Enregistrer les modifications') : t('Publish bundle', 'Publier le lot')}
          </button>
          <button onClick={() => setForm(null)} className="text-sm text-slate-600 hover:text-slate-900 px-4">
            {t('Cancel', 'Annuler')}
          </button>
        </div>
      </div>
    );
  })();

  return (
    <div>
      <div className="flex flex-wrap items-start justify-between gap-3 mb-5">
        <p className="text-sm text-slate-500 max-w-xl leading-relaxed">
          {t('A bundle groups items already for sale, with a discount. In the shop it shows as stacked cards above the items, and each item stays on sale on its own. As soon as one of them is reserved or sold, the bundle leaves the shop.',
             'Un lot regroupe des meubles déjà en vente, avec une remise. Dans la boutique, il s’affiche en cartes empilées au-dessus des meubles, et chaque meuble reste aussi en vente seul. Dès que l’un d’eux est réservé ou vendu, le lot quitte la boutique.')}
        </p>
        {!form && (
          <button onClick={() => openForm(null)}
                  className="shrink-0 inline-flex items-center gap-2 font-semibold bg-blue-700 hover:bg-blue-800 text-white rounded-lg px-4 py-2.5 text-sm">
            <Icon name="plus" className="w-4 h-4" /> {t('Create a bundle', 'Créer un lot')}
          </button>
        )}
      </div>

      {editor}

      {bundles.length === 0 ? (
        !form && (
          <div className="border border-dashed border-blue-200 rounded-xl px-6 py-12 text-center text-slate-600">
            {t('No bundles yet. Example: bed + mattress with 20% off.', 'Aucun lot pour l’instant. Exemple : lit + matelas avec 20 % de remise.')}
          </div>
        )
      ) : (
        <ul className="divide-y divide-slate-100 border-t border-slate-100">
          {bundles.map((bundle) => {
            const entries = bundleEntries(bundle);
            const lines = linesOf(entries);
            const pct = cleanDiscount(bundle.discount);
            const { full, price } = bundlePrices(lines, pct);
            const problems = entries.map(problem).filter(Boolean);
            const shown = problems.length === 0 && countAll(lines) >= 2;
            return (
              <li key={bundle.id} className="py-4 flex flex-wrap sm:flex-nowrap items-center gap-x-4 gap-y-2">
                <div className="relative w-20 h-16 shrink-0" aria-hidden="true">
                  {lines[1] && thumb(lines[1].item, 'absolute inset-0 rotate-6 translate-x-1')}
                  {thumb(lines[0] && lines[0].item, 'absolute inset-0 shadow-sm')}
                </div>
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-semibold">{bundle.title}</span>
                    {pct > 0 && (
                      <span className="text-xs font-bold bg-amber-400 text-amber-950 rounded-full px-2 py-0.5">{pctText(pct, t.lang)}</span>
                    )}
                  </div>
                  <p className="text-sm mt-0.5">
                    <span className="text-blue-700 font-semibold">{full > 0 ? fmtKr(price) : t('Free', 'Gratuit')}</span>
                    {pct > 0 && full > 0 && <s className="ml-2 text-slate-400">{fmtKr(full)}</s>}
                    <span className="text-slate-500"> · {lines.map((l) => `${l.count > 1 ? `${l.count} × ` : ''}${l.item.title}`).join(', ')}</span>
                  </p>
                  <p className={`text-xs mt-1 ${shown ? 'text-green-700' : 'text-amber-700'}`}>
                    {shown ? t('In the shop', 'Dans la boutique')
                      : t(`Not in the shop: ${problems.length ? problems.join(', ') : 'fewer than 2 items'}`,
                          `Pas dans la boutique : ${problems.length ? problems.join(', ') : 'moins de 2 meubles'}`)}
                  </p>
                </div>
                <div className="flex items-center justify-end gap-1 shrink-0 w-full sm:w-auto">
                  <button onClick={() => openForm(bundle)}
                          className="p-2 text-slate-500 hover:text-blue-700 rounded-lg hover:bg-blue-50" aria-label={t('Edit', 'Modifier')}>
                    <Icon name="pencil" className="w-4 h-4" />
                  </button>
                  <button onClick={() => remove(bundle)}
                          className="p-2 text-slate-500 hover:text-red-600 rounded-lg hover:bg-red-50" aria-label={t('Delete', 'Supprimer')}>
                    <Icon name="trash" className="w-4 h-4" />
                  </button>
                </div>
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
}

function BookingsPanel({ bookings, setBookings, items, setItems, pushToast }) {
  const t = useT();
  const [filter, setFilter] = useState('all');
  // Rendez-vous dont on note la vente (encadré « à quel prix ? »).
  const [selling, setSelling] = useState(null);

  // Un rendez-vous pris pour tout un panier, ce sont plusieurs lignes au
  // même cart_id : confirmer, refuser et supprimer valent pour toutes.
  const update = async (rows, status) => {
    const ids = rows.filter((b) => !b.outcome).map((b) => b.id);
    if (!ids.length) return;
    const { error } = await sb.from('bookings').update({ status }).in('id', ids);
    if (error) return pushToast(t('Could not update.', 'Mise à jour impossible.'));
    setBookings((prev) => prev.map((b) => (ids.includes(b.id) ? { ...b, status } : b)));
    pushToast(status === 'confirmed' ? t('Booking confirmed.', 'Rendez-vous confirmé.')
      : rows.length > 1 ? t('Booking declined: the time slot and the items are free again.', 'Rendez-vous refusé : le créneau et les meubles sont libérés.')
      : t('Booking declined: the time slot and the item are free again.', 'Rendez-vous refusé : le créneau et le meuble sont libérés.'));
  };

  const itemOf = (b) => items.find((i) => String(i.id) === String(b.item_id));
  // Exemplaires que ce rendez-vous peut encore vendre : moins s'ils ont
  // déjà été marqués vendus dans Annonces, pour ne pas les compter deux fois.
  const sellable = (b, item) => (item ? Math.min(b.quantity || 1, leftQty(item)) : 0);

  // Ce que le vendeur note après le rendez-vous (migration-reservation.sql).
  const close = async (b, patch) => {
    if (!('outcome' in b)) {
      pushToast(t('To note sold or unsold, first run migration-reservation.sql in Supabase (SQL Editor).',
                  'Pour noter vendu ou invendu, lance d’abord migration-reservation.sql dans Supabase (SQL Editor).'));
      return false;
    }
    const { error } = await sb.from('bookings').update(patch).eq('id', b.id);
    if (error) {
      pushToast(t('Could not update.', 'Mise à jour impossible.'));
      return false;
    }
    setBookings((prev) => prev.map((x) => (x.id === b.id ? { ...x, ...patch } : x)));
    return true;
  };

  // Vendu : la vente compte dans Annonces et dans l'objectif, comme
  // « Marquer vendu », et le meuble reste hors de la boutique. `total` en kr
  // pour les `n` exemplaires partis.
  const sold = async (b, item, n, total) => {
    const patch = n > 0 ? soldPatch(item, soldQty(item) + n, Array(n).fill(total / n)) : null;
    if (n > 0 && !patch) {
      pushToast(t('To note a haggled price, first run migration-prix-vente.sql in Supabase (SQL Editor).',
                  'Pour noter un prix négocié, lance d’abord migration-prix-vente.sql dans Supabase (SQL Editor).'));
      return false;
    }
    // Le rendez-vous d'abord : si sa colonne manque, rien n'a bougé.
    if (!(await close(b, { outcome: 'sold', sale_price: total }))) return false;
    if (patch) {
      const { error } = await sb.from('items').update(patch).eq('id', item.id);
      if (error) {
        // Le rendez-vous redevient « à noter » pour pouvoir réessayer : sinon
        // le meuble reviendrait en boutique sans être compté vendu.
        await close(b, { outcome: null, sale_price: null });
        pushToast(t('Could not update.', 'Mise à jour impossible.'));
        return false;
      }
      setItems((prev) => prev.map((i) => (i.id === item.id ? { ...i, ...patch } : i)));
    }
    pushToast(total ? t(`Sale noted: ${fmtKr(total)}.`, `Vente notée : ${fmtKr(total)}.`) : t('Sale noted.', 'Vente notée.'));
    return true;
  };

  // Invendu : le meuble réapparaît dans la boutique.
  const unsold = async (b) => {
    const item = itemOf(b);
    const back = item && leftQty(item) > 0;
    const ask = back ? t(`Not sold? “${item.title}” goes back in the shop.`, `Pas vendu ? « ${item.title} » réapparaît dans la boutique.`)
                     : t('Mark this booking as unsold?', 'Noter ce rendez-vous comme invendu ?');
    if (!window.confirm(ask)) return;
    if (await close(b, { outcome: 'unsold' })) {
      pushToast(back ? t(`“${item.title}” is on sale again.`, `« ${item.title} » est de nouveau en vente.`) : t('Noted.', 'Noté.'));
    }
  };

  const now = new Date();
  const nowKey = `${todayKey()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const remove = async (rows) => {
    if (!window.confirm(rows.length > 1
      ? t(`Delete this booking (${rows.length} items)?`, `Supprimer ce rendez-vous (${rows.length} meubles) ?`)
      : t('Delete this booking?', 'Supprimer ce rendez-vous ?'))) return;
    const ids = rows.map((b) => b.id);
    const { error } = await sb.from('bookings').delete().in('id', ids);
    if (error) return pushToast(t('Could not delete.', 'Suppression impossible.'));
    setBookings((prev) => prev.filter((b) => !ids.includes(b.id)));
  };

  const markAllSeen = async () => {
    const ids = bookings.filter((b) => b.status === 'new').map((b) => b.id);
    if (!ids.length) return;
    await sb.from('bookings').update({ status: 'seen' }).in('id', ids);
    setBookings(bookings.map((b) => (b.status === 'new' ? { ...b, status: 'seen' } : b)));
  };

  const sorted = [...bookings].sort((a, b) => `${a.day} ${a.slot}`.localeCompare(`${b.day} ${b.slot}`));
  const shown = filter === 'all' ? sorted : sorted.filter((b) => String(b.day).slice(0, 10) >= todayKey());
  const newOnes = bookings.filter((b) => b.status === 'new').length;

  // Les lignes d'un même panier forment un seul rendez-vous.
  const groups = [];
  const carts = {};
  shown.forEach((b) => {
    if (b.cart_id && carts[b.cart_id]) return carts[b.cart_id].push(b);
    const rows = [b];
    if (b.cart_id) carts[b.cart_id] = rows;
    groups.push(rows);
  });

  const labels = {
    new: [t('New', 'Nouveau'), 'bg-blue-700 text-white'],
    seen: [t('Seen', 'Vu'), 'bg-slate-100 text-slate-600'],
    confirmed: [t('Confirmed', 'Confirmé'), 'bg-blue-50 text-blue-800'],
    declined: [t('Declined', 'Refusé'), 'bg-slate-100 text-slate-400'],
  };

  // Sous le rendez-vous, un meuble : vendu, invendu, ou à noter. `titled`
  // quand il y en a plusieurs, pour savoir duquel on parle.
  const outcome = (b, titled) => {
    const item = itemOf(b);
    const n = sellable(b, item);
    const past = `${String(b.day).slice(0, 10)} ${b.slot}` <= nowKey;
    const what = titled && (
      <span className="block font-semibold text-slate-800">
        {b.quantity > 1 ? `${b.quantity} × ` : ''}{b.item_title}
      </span>
    );
    let body = null;
    if (b.outcome === 'sold') {
      body = (
        <div className="mt-3 pt-3 border-t border-slate-200 text-sm">
          {what}
          <p className="font-semibold text-green-700 flex items-center gap-1.5">
            <Icon name="check" className="w-4 h-4" /> {saleNote(b, item, t)}
          </p>
        </div>
      );
    } else if (b.outcome === 'unsold') {
      body = (
        <div className="mt-3 pt-3 border-t border-slate-200 text-sm">
          {what}
          <p className="text-slate-500">{t('Unsold · back on sale', 'Invendu · remis en vente')}</p>
        </div>
      );
    } else if (b.status === 'declined') {
      body = titled && (
        <div className="mt-3 pt-3 border-t border-slate-200 text-sm">
          {what}
          <p className="text-slate-400">{t('Declined', 'Refusé')}</p>
        </div>
      );
    } else {
      body = (
        <div className="mt-3 pt-3 border-t border-slate-200 flex flex-wrap items-center gap-2">
          <span className={`mr-auto text-sm ${past ? 'font-semibold text-amber-700' : 'text-slate-500'}`}>
            {what}
            {past ? (titled ? t('Sold or unsold?', 'Vendu ou invendu ?') : t('Past booking: sold or unsold?', 'Rendez-vous passé : vendu ou invendu ?'))
              : 'outcome' in b ? t('Out of the shop in the meantime.', 'Retiré de la boutique en attendant.')
              : t('After the viewing:', 'Après le rendez-vous :')}
          </span>
          <button onClick={() => (n > 0 ? setSelling(selling === b.id ? null : b.id) : sold(b, item, 0, null))}
                  aria-expanded={selling === b.id}
                  className="inline-flex items-center gap-1.5 text-sm font-semibold border border-green-600 text-green-700 rounded-lg px-3 py-1.5 hover:bg-green-50">
            <Icon name="check" className="w-4 h-4" /> {t('Sold', 'Vendu')}
          </button>
          <button onClick={() => unsold(b)}
                  className="inline-flex items-center gap-1.5 text-sm border border-slate-200 text-slate-600 rounded-lg px-3 py-1.5 hover:border-slate-400">
            <Icon name="x" className="w-4 h-4" /> {t('Unsold', 'Invendu')}
          </button>
        </div>
      );
    }
    return (
      <div key={b.id}>
        {body}
        {selling === b.id && !b.outcome && n > 0 && (
          <SalePrompt item={item} count={n} discount={b.bundle_discount} onConfirm={(total) => sold(b, item, n, total)}
                      onCancel={() => setSelling(null)} />
        )}
      </div>
    );
  };

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div className="flex gap-2">
          {[['all', t('All', 'Tous')], ['upcoming', t('Upcoming', 'À venir')]].map(([id, label]) => (
            <button key={id} onClick={() => setFilter(id)}
                    className={`text-sm rounded-lg px-3 py-1.5 border ${
                      filter === id ? 'border-blue-700 text-blue-800 bg-blue-50' : 'border-slate-200 text-slate-600'}`}>
              {label}
            </button>
          ))}
        </div>
        {newOnes > 0 && (
          <button onClick={markAllSeen} className="text-sm text-blue-700 hover:underline">{t('Mark all as read', 'Marquer tout comme lu')}</button>
        )}
      </div>

      {groups.length === 0 ? (
        <div className="border border-dashed border-blue-200 rounded-xl px-6 py-12 text-center text-slate-600">
          {t('No bookings yet. Requests show up here as soon as a buyer books a time slot.',
             'Aucun rendez-vous pour l’instant. Les demandes arrivent ici dès qu’un acheteur réserve un créneau.')}
        </div>
      ) : (
        <ul className="space-y-3">
          {groups.map((rows) => {
            const b = rows[0];
            const many = rows.length > 1;
            const status = rows.some((r) => r.status === 'new') ? 'new' : b.status;
            const [label, cls] = labels[status] || labels.seen;
            const open = rows.filter((r) => !r.outcome);
            const tel = phoneInfo(b.phone);
            const listed = rows.reduce((sum, r) => {
              const it = itemOf(r);
              return sum + (it ? priceValue(it.price) * (r.quantity || 1) : 0);
            }, 0);
            // Pris pour un lot (migration-lots.sql) : son titre et sa remise.
            const lot = rows.find((r) => r.bundle_title);
            const pct = lot ? cleanDiscount(lot.bundle_discount) : 0;
            return (
              <li key={b.id} className={`border rounded-xl px-4 py-4 ${status === 'new' ? 'border-blue-300 bg-blue-50' : 'border-slate-200'}`}>
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="inline-flex items-center gap-1.5 font-semibold">
                        <Icon name="user" className="w-4 h-4 text-blue-700" /> {b.first_name}
                      </span>
                      <span className={`text-xs rounded-full px-2 py-0.5 ${cls}`}>{label}</span>
                      {lot ? (
                        <span className="inline-flex items-center gap-1 text-xs rounded-full px-2 py-0.5 bg-amber-50 text-amber-900 border border-amber-200">
                          <Icon name="layers" className="w-3.5 h-3.5" /> {t('Bundle', 'Lot')}{pct > 0 ? ` ${pctText(pct, t.lang)}` : ''}
                        </span>
                      ) : many && (
                        <span className="inline-flex items-center gap-1 text-xs rounded-full px-2 py-0.5 bg-blue-50 text-blue-800 border border-blue-100">
                          <Icon name="bag" className="w-3.5 h-3.5" /> {t('Cart', 'Panier')}
                        </span>
                      )}
                    </div>
                    <p className="mt-1.5 text-sm text-slate-600 flex flex-wrap items-center gap-x-4 gap-y-1">
                      <a href={tel.href} className="inline-flex items-center gap-1.5 text-blue-700 hover:underline">
                        <Icon name="phone" className="w-3.5 h-3.5" />
                        {tel.country && <span className="text-base leading-none" title={countryName(tel.country, t.lang)}>{tel.country.flag}</span>}
                        <span className="whitespace-nowrap tabular-nums">{tel.text}</span>
                      </a>
                      <span className="inline-flex items-center gap-1.5">
                        <Icon name="calendar" className="w-3.5 h-3.5" /> {fmtDate(b.day, t.locale)}
                      </span>
                      <span className="inline-flex items-center gap-1.5">
                        <Icon name="clock" className="w-3.5 h-3.5" /> {b.slot}
                      </span>
                      {paymentLabel(b.payment, t.lang) && (
                        <span className="inline-flex items-center gap-1.5">
                          <Icon name="card" className="w-3.5 h-3.5" /> {paymentLabel(b.payment, t.lang)}
                        </span>
                      )}
                    </p>
                    <p className="mt-1 text-sm text-slate-500">
                      {lot ? (
                        <>
                          {t('For the bundle', 'Pour le lot')} <strong className="text-slate-800">{t(`“${lot.bundle_title}”`, `« ${lot.bundle_title} »`)}</strong>
                          {listed > 0 && (pct > 0
                            ? ` · ${fmtKr(afterDiscount(listed, pct))} ${t(`instead of ${fmtKr(listed)}`, `au lieu de ${fmtKr(listed)}`)}`
                            : ` · ${fmtKr(listed)}`)}
                        </>
                      ) : many ? (
                        <>
                          {t('For:', 'Pour :')} <strong className="text-slate-800">{t(`${rows.length} items`, `${rows.length} meubles`)}</strong>
                          {' '}{t('at the same viewing', 'au même rendez-vous')}
                          {listed > 0 && ` · ${fmtKr(listed)} ${t('at listed prices', 'au prix affiché')}`}
                        </>
                      ) : (
                        <>{t('For:', 'Pour :')} {b.quantity > 1 && <strong className="text-slate-800">{b.quantity} × </strong>}{b.item_title}</>
                      )}
                    </p>
                  </div>

                  <div className="flex items-center gap-1">
                    {open.some((r) => r.status !== 'confirmed') && (
                      <button onClick={() => update(rows, 'confirmed')}
                              className="inline-flex items-center gap-1.5 text-sm bg-blue-700 hover:bg-blue-800 text-white rounded-lg px-3 py-1.5">
                        <Icon name="check" className="w-4 h-4" /> {t('Confirm', 'Confirmer')}
                      </button>
                    )}
                    {open.some((r) => r.status !== 'declined') && (
                      <button onClick={() => update(rows, 'declined')}
                              className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 text-slate-600 hover:border-slate-400">
                        {t('Decline', 'Refuser')}
                      </button>
                    )}
                    <button onClick={() => remove(rows)} className="p-2 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50" aria-label={t('Delete', 'Supprimer')}>
                      <Icon name="trash" className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                {rows.map((r) => outcome(r, many || !!lot))}
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
}

// Les demandes de contact laissées dans la boutique (migration-panier.sql) :
// rappeler l'acheteur, puis marquer « traité ».
function MessagesPanel({ messages, setMessages, missing, items, pushToast }) {
  const t = useT();
  const shopLang = useShopLang();
  const [filter, setFilter] = useState('open');

  const setStatus = async (m, status) => {
    const { error } = await sb.from('contact_requests').update({ status }).eq('id', m.id);
    if (error) return pushToast(t('Could not update.', 'Mise à jour impossible.'));
    setMessages((prev) => prev.map((x) => (x.id === m.id ? { ...x, status } : x)));
  };

  const remove = async (m) => {
    if (!window.confirm(t(`Delete the message from ${m.first_name}?`, `Supprimer le message de ${m.first_name} ?`))) return;
    const { error } = await sb.from('contact_requests').delete().eq('id', m.id);
    if (error) return pushToast(t('Could not delete.', 'Suppression impossible.'));
    setMessages((prev) => prev.filter((x) => x.id !== m.id));
  };

  const markAllSeen = async () => {
    const ids = messages.filter((m) => m.status === 'new').map((m) => m.id);
    if (!ids.length) return;
    const { error } = await sb.from('contact_requests').update({ status: 'seen' }).in('id', ids);
    if (error) return pushToast(t('Could not update.', 'Mise à jour impossible.'));
    setMessages((prev) => prev.map((m) => (m.status === 'new' ? { ...m, status: 'seen' } : m)));
  };

  if (missing) {
    return (
      <div className="border border-dashed border-amber-300 bg-amber-50 rounded-xl px-6 py-10 text-center text-amber-900">
        <p className="font-semibold">{t('Messages are not turned on yet.', 'Les messages ne sont pas encore activés.')}</p>
        <p className="mt-1 text-sm leading-relaxed">
          {t(<>Run <code className="bg-white px-1.5 py-0.5 rounded">migration-panier.sql</code> once in Supabase
               (SQL Editor → New query → Run), then refresh the page.</>,
             <>Lance <code className="bg-white px-1.5 py-0.5 rounded">migration-panier.sql</code> une fois dans Supabase
               (SQL Editor → New query → Run), puis actualise la page.</>)}
        </p>
      </div>
    );
  }

  const shown = filter === 'open' ? messages.filter((m) => m.status !== 'done') : messages;
  const newOnes = messages.filter((m) => m.status === 'new').length;
  const labels = {
    new: [t('New', 'Nouveau'), 'bg-blue-700 text-white'],
    seen: [t('To call back', 'À rappeler'), 'bg-amber-50 text-amber-800 border border-amber-200'],
    done: [t('Done', 'Traité'), 'bg-slate-100 text-slate-500'],
  };
  const when = (at) => new Date(at).toLocaleString(t.locale, {
    weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
  });
  // Où en est le meuble aujourd'hui, si ça a changé depuis le message.
  const now = (line) => {
    const item = items.find((i) => String(i.id) === String(line.id));
    if (!item) return t(' (deleted)', ' (supprimé)');
    if (leftQty(item) < 1) return t(' (sold)', ' (vendu)');
    return '';
  };
  // Le bouton tel que les acheteurs le lisent.
  const contactButton = shopLang === 'fr' ? 'Me contacter' : 'Contact me';

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div className="flex gap-2">
          {[['open', t('To do', 'À traiter')], ['all', t('All', 'Tous')]].map(([id, label]) => (
            <button key={id} onClick={() => setFilter(id)}
                    className={`text-sm rounded-lg px-3 py-1.5 border ${
                      filter === id ? 'border-blue-700 text-blue-800 bg-blue-50' : 'border-slate-200 text-slate-600'}`}>
              {label}
            </button>
          ))}
        </div>
        {newOnes > 0 && (
          <button onClick={markAllSeen} className="text-sm text-blue-700 hover:underline">{t('Mark all as read', 'Marquer tout comme lu')}</button>
        )}
      </div>

      {shown.length === 0 ? (
        <div className="border border-dashed border-blue-200 rounded-xl px-6 py-12 text-center text-slate-600">
          {messages.length ? t('All done.', 'Tout est traité.') : t('No messages yet.', 'Aucun message pour l’instant.')}{' '}
          {t(`Buyers leave their number from the shop (“${contactButton}” under an item, in the cart or at the top of the page).`,
             `Les acheteurs laissent leur numéro depuis la boutique (« ${contactButton} » sous un meuble, dans le panier ou en haut de page).`)}
        </div>
      ) : (
        <ul className="space-y-3">
          {shown.map((m) => {
            const [label, cls] = labels[m.status] || labels.seen;
            const tel = phoneInfo(m.phone);
            const lines = Array.isArray(m.items) ? m.items : [];
            // Question posée sur un lot : son titre, sa remise et son prix.
            const lot = lines.find((l) => l && l.bundle);
            const lotPct = lot ? cleanDiscount(lot.discount) : 0;
            const lotFull = lines.reduce((sum, l) => sum + priceValue(l.price) * (l.quantity || 1), 0);
            return (
              <li key={m.id} className={`border rounded-xl px-4 py-4 ${
                m.status === 'new' ? 'border-blue-300 bg-blue-50' : 'border-slate-200'} ${m.status === 'done' ? 'opacity-70' : ''}`}>
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div className="min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="inline-flex items-center gap-1.5 font-semibold">
                        <Icon name="user" className="w-4 h-4 text-blue-700" /> {m.first_name}
                      </span>
                      <span className={`text-xs rounded-full px-2 py-0.5 ${cls}`}>{label}</span>
                    </div>
                    <p className="mt-1.5 text-sm text-slate-600 flex flex-wrap items-center gap-x-4 gap-y-1">
