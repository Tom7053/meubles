  const [photoState, setPhotoState] = useState('ready');
  // Numéro du dernier formulaire ouvert : une réponse qui arrive après
  // qu'on en a ouvert un autre est ignorée.
  const photoRequest = useRef(0);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  // Le champ prix se tape sans « kr », il est rajouté à l'enregistrement.
  const openForm = (item) => {
    const f = { ...emptyForm, ...item, links: item.links || [] };
    setForm({ ...f, price: withKr(f.price).replace(/ kr$/, ''), photos: f.image ? [f.image] : [] });
    setDetails({ ...emptyDetails, version: newVersion(), ...(item.details || {}) });
    setBeforeRewrite(null);
    setOpen(true);
    const request = ++photoRequest.current;
    const loadExtras = f.id && manyPhotos;
    setPhotoState(loadExtras ? 'loading' : 'ready');
    if (!loadExtras) return;
    fetchExtraPhotos(f.id, true)
      .then((extras) => {
        if (request !== photoRequest.current) return;
        setForm((cur) => ({ ...cur, photos: [...cur.photos, ...extras] }));
        setPhotoCounts((c) => ({ ...c, [f.id]: extras.length }));
        setPhotoState('ready');
      })
      .catch(() => { if (request === photoRequest.current) setPhotoState('failed'); });
  };
  const closeForm = () => {
    photoRequest.current++;
    setOpen(false);
    setForm(emptyForm);
  };

  // Tant que la description n'a pas été retouchée à la main, elle suit les
  // choix du formulaire. Une fois retouchée, on n'y touche plus. Le titre
  // suit le type, la matière et la marque tant qu'on ne l'a pas tapé.
  const change = (nextForm, nextDetails) => {
    const follows = !(form.description || '').trim() || form.description === describeItem(form, details);
    const titleFollows = nextDetails !== details && (!form.title.trim() || form.title === suggestTitle(details));
    const f = titleFollows ? { ...nextForm, title: suggestTitle(nextDetails) } : nextForm;
    setForm(follows ? { ...f, description: describeItem(f, nextDetails) } : f);
    setDetails(nextDetails);
  };
  const setDetail = (k, v) => change(form, { ...details, [k]: v });
  const toggleTag = (en) => setDetail('tags',
    details.tags.includes(en) ? details.tags.filter((t) => t !== en) : [...details.tags, en]);

  // Une autre tournure à chaque clic. Avec peu de choix, un numéro voisin
  // peut donner le même texte : on avance jusqu'à ce qu'il change.
  const rewrite = () => {
    let next = details;
    for (let i = 1; i <= 12 && describeItem(form, next) === form.description; i++) {
      next = { ...details, version: details.version + i };
    }
    const text = describeItem(form, next);
    if (!text) return pushToast('Choisis d’abord le type de meuble, l’état ou une couleur.');
    if (form.description.trim() && form.description !== describeItem(form, details)) setBeforeRewrite(form.description);
    setDetails(next);
    set('description', text);
  };

  const submit = async () => {
    if (!form.title.trim()) return pushToast('Il manque le titre de l’annonce.');
    setBusy(true);
    const quantity = Math.min(20, totalQty(form));
    // Nombre baissé sous ce qui est déjà vendu : tout est parti.
    const sold_qty = Math.min(quantity, soldQty(form));
    // La couverture reste dans items.image, les autres vont dans item_photos.
    const [cover, ...extras] = form.photos;
    const payload = {
      title: form.title.trim(),
      price: withKr(form.price),
      condition: form.condition.trim(),
      description: form.description.trim(),
      links: (form.links || []).filter((l) => l.label.trim() && l.url.trim()),
      image: cover || null,
      status: sold_qty >= quantity ? 'sold' : (form.status || 'available'),
      available_from: form.available_from || null,
      available_to: form.available_to || null,
      custom_schedule: !!form.custom_schedule,
      weekdays: form.custom_schedule ? (form.weekdays || DEFAULT_SETTINGS.weekdays) : null,
      slots: form.custom_schedule ? (form.slots || DEFAULT_SETTINGS.slots) : null,
    };
    // Avant migration-quantite.sql ces colonnes n'existent pas : on ne les
    // envoie que si la base les a déjà, ou s'il y a plusieurs exemplaires.
    if (quantity > 1 || items.some((i) => 'quantity' in i)) Object.assign(payload, { quantity, sold_qty });
    // La colonne details arrive avec migration-photos.sql, comme item_photos.
    if (manyPhotos) payload.details = details;
    let res;
    if (form.id) res = await sb.from('items').update(payload).eq('id', form.id).select().single();
    else res = await sb.from('items').insert(payload).select().single();
    // PGRST204 = colonne inconnue de la base.
    if (res.error && res.error.code === 'PGRST204') {
      setBusy(false);
      return pushToast('Pour vendre plusieurs exemplaires, lance d’abord migration-quantite.sql dans Supabase (SQL Editor).');
    }
    if (res.error) {
      setBusy(false);
      return pushToast('Enregistrement impossible, réessaie.');
    }
    const saved = res.data;
    setItems(form.id ? items.map((i) => (i.id === form.id ? saved : i)) : [saved, ...items]);

    // Les autres photos, seulement si on sait ce qu'il y avait avant : sinon
    // on effacerait celles qui n'ont pas pu être chargées.
    if (manyPhotos && photoState === 'ready' && (extras.length || photoCounts[saved.id])) {
      const { error } = extras.length
        ? await sb.from('item_photos').upsert({ item_id: saved.id, photos: extras })
        : await sb.from('item_photos').delete().eq('item_id', saved.id);
      if (error) {
        setBusy(false);
        // L'annonce existe maintenant : réessayer la met à jour au lieu d'en créer une autre.
        setForm((f) => ({ ...f, id: saved.id }));
        return pushToast('Annonce enregistrée, mais pas les autres photos. Clique encore sur « Enregistrer ».');
      }
      extraPhotoCache.set(saved.id, extras);
      setPhotoCounts((c) => ({ ...c, [saved.id]: extras.length }));
    }
    setBusy(false);
    closeForm();
    pushToast(extras.length && !manyPhotos
      ? 'Annonce enregistrée avec la couverture seulement : lance migration-photos.sql pour garder plusieurs photos.'
      : form.id ? 'Annonce mise à jour.' : 'Annonce publiée.');
  };

  const remove = async (item) => {
    if (!window.confirm(`Supprimer « ${item.title} » ? Cette action est définitive.`)) return;
    const { error } = await sb.from('items').delete().eq('id', item.id);
    if (error) return pushToast('Suppression impossible.');
    setItems(items.filter((i) => i.id !== item.id));
    pushToast('Annonce supprimée.');
  };

  // Combien d'exemplaires sont partis, et à quel prix (`salePrice`, en kr)
  // pour celui qui vient de partir. Tout vendu : l'annonce quitte la
  // boutique. Renvoie true si c'est enregistré.
  const setSold = async (item, n, salePrice) => {
    const total = totalQty(item);
    const sold_qty = Math.max(0, Math.min(total, n));
    const listed = priceValue(item.price);
    const haggled = salePrice != null && salePrice !== listed;
    const patch = soldPatch(item, sold_qty, haggled ? [salePrice] : []);
    if (!patch) {
      pushToast('Pour noter un prix négocié, lance d’abord migration-prix-vente.sql dans Supabase (SQL Editor).');
      return false;
    }
    const { status } = patch;
    const { error } = await sb.from('items').update(patch).eq('id', item.id);
    if (error) {
      pushToast('Mise à jour impossible.');
      return false;
    }
    setItems(items.map((i) => (i.id === item.id ? { ...i, ...patch } : i)));
    const at = haggled ? ` à ${fmtKr(salePrice)} (affiché ${fmtKr(listed)})` : '';
    if (status === 'sold') pushToast(`Vendu${at} : retiré de la boutique.`);
    else if (sold_qty > soldQty(item)) pushToast(`Vendu${at}. Il en reste ${total - sold_qty} sur ${total} dans la boutique.`);
    else if (total > 1) pushToast(`Il en reste ${total - sold_qty} sur ${total} dans la boutique.`);
    else pushToast('Remise en vente.');
    return true;
  };

  const kind = KINDS.find((k) => k.en === details.kind);

  return (
    <div>
      <GoalProgress items={items} />

      <div className="flex items-center justify-between mb-5">
        <p className="text-slate-500 text-sm">{items.length} meuble{items.length > 1 ? 's' : ''} enregistré{items.length > 1 ? 's' : ''}</p>
        <button onClick={() => openForm(emptyForm)}
                className="inline-flex items-center gap-2 font-semibold bg-blue-700 hover:bg-blue-800 text-white rounded-lg px-4 py-2.5 text-sm">
          <Icon name="plus" className="w-4 h-4" /> Ajouter un meuble
        </button>
      </div>

      {open && (
        <div className="border border-blue-200 rounded-xl bg-blue-50 p-5 mb-8">
          <h2 className="display font-bold text-lg mb-4">{form.id ? 'Modifier l’annonce' : 'Nouvelle annonce'}</h2>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <label className="block col-span-2">
              <span className="text-sm text-slate-600">Titre <span className="text-slate-400">(en anglais)</span></span>
              <input value={form.title} onChange={(e) => change({ ...form, title: e.target.value }, details)}
                     className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" placeholder="Oak desk" />
            </label>
            <label className="block">
              <span className="text-sm text-slate-600">Prix</span>
              <span className="mt-1 flex items-center border border-slate-200 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-400">
                <input value={form.price} onChange={(e) => change({ ...form, price: e.target.value }, details)} inputMode="decimal"
                       className="w-full min-w-0 rounded-lg px-3 py-2 bg-transparent outline-none" placeholder="450" />
                <span className="pr-3 text-slate-500">kr</span>
              </span>
            </label>
            <label className="block">
              <span className="text-sm text-slate-600">Nombre</span>
              <input type="number" min="1" max="20" inputMode="numeric" value={form.quantity}
                     onChange={(e) => set('quantity', e.target.value)}
                     className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" />
            </label>
          </div>
          {totalQty(form) > 1 && (
            <p className="mt-1.5 text-xs text-slate-500">
              {totalQty(form)} exemplaires identiques, prix pour un : l’acheteur choisit combien il en prend.
              {soldQty(form) > 0 && (leftQty(form) > 0
                ? ` ${soldQty(form)} déjà vendu${soldQty(form) > 1 ? 's' : ''}, il en reste ${leftQty(form)}.`
                : ' Tous sont déjà vendus.')}
            </p>
          )}

          <label className="block mt-3">
            <span className="text-sm text-slate-600">État</span>
            <select value={form.condition || ''} onChange={(e) => change({ ...form, condition: e.target.value }, details)}
                    className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white">
              <option value="">Non précisé</option>
              {CONDITIONS.map((c) => <option key={c.en} value={c.en}>{c.fr} · « {c.en} »</option>)}
              {/* état tapé à la main avant le menu : on le garde tel quel */}
              {form.condition && !CONDITIONS.some((c) => c.en === form.condition) && (
                <option value={form.condition}>{form.condition}</option>
              )}
            </select>
          </label>

          <PhotosEditor photos={form.photos} onChange={(p) => set('photos', p)} state={photoState}
                        manyPhotos={manyPhotos} pushToast={pushToast} />

          <div className="mt-5 border-t border-blue-200 pt-4">
            <span className="font-semibold text-sm">Pour écrire la description</span>
            <p className="text-xs text-slate-500 mt-0.5">
              Coche ce qui correspond, la description en anglais s’écrit toute seule en dessous.
              Plus tu en remplis, plus elle est précise.
            </p>

            <div className="mt-3 grid grid-cols-2 sm:grid-cols-3 gap-3">
              {[['kind', 'Type', KINDS, 'Autre (le titre)'], ['material', 'Matière', MATERIALS, '—'],
                ['colour', 'Couleur', COLOURS, '—']].map(([k, label, options, none]) => (
                <label key={k} className={`block ${k === 'kind' ? 'col-span-2 sm:col-span-1' : ''}`}>
                  <span className="text-sm text-slate-600">{label}</span>
                  <select value={details[k]} onChange={(e) => setDetail(k, e.target.value)}
                          className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white">
                    <option value="">{none}</option>
                    {options.map((o) => <option key={o.en} value={o.en}>{o.fr}</option>)}
                  </select>
                </label>
              ))}
            </div>

            <div className="mt-3 grid grid-cols-2 sm:grid-cols-3 gap-3">
              <label className="block col-span-2 sm:col-span-1">
                <span className="text-sm text-slate-600">Marque / modèle</span>
                <input value={details.brand} onChange={(e) => setDetail('brand', e.target.value)}
                       className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" placeholder="IKEA Malm" />
              </label>
              <label className="block">
                <span className="text-sm text-slate-600">Acheté en</span>
                <input value={details.year} onChange={(e) => setDetail('year', e.target.value)} inputMode="numeric"
                       maxLength={4} className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" placeholder="2023" />
              </label>
              <label className="block">
                <span className="text-sm text-slate-600">Prix payé neuf</span>
                <span className="mt-1 flex items-center border border-slate-200 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-400">
                  <input value={details.paid} onChange={(e) => setDetail('paid', e.target.value)} inputMode="decimal"
                         className="w-full min-w-0 rounded-lg px-3 py-2 bg-transparent outline-none" placeholder="1200" />
                  <span className="pr-3 text-slate-500 text-sm">kr</span>
                </span>
              </label>
            </div>

            <div className="mt-3 grid grid-cols-3 gap-3">
              {[['width', 'Largeur'], ['depth', kind && kind.long ? 'Longueur' : 'Profondeur'], ['height', 'Hauteur']].map(([k, label]) => (
                <label key={k} className="block">
                  <span className="text-sm text-slate-600">{label}</span>
                  <span className="mt-1 flex items-center border border-slate-200 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-400">
                    <input value={details[k]} onChange={(e) => setDetail(k, e.target.value)} inputMode="decimal"
                           className="w-full min-w-0 rounded-lg px-3 py-2 bg-transparent outline-none" />
                    <span className="pr-3 text-slate-500 text-sm">cm</span>
                  </span>
                </label>
              ))}
            </div>

            {[['Atouts', FEATURES.filter((o) => fitsKind(o, details.kind))], ['Défauts à signaler', FLAWS],
              ['Chez toi', HOME], ['Pour l’emporter', PICKUP]].map(([label, options]) => (
              <div key={label} className="mt-3">
                <span className="text-sm text-slate-600">{label}</span>
                <div className="mt-1 flex flex-wrap gap-2">
                  {options.map((o) => (
                    <button key={o.en} type="button" onClick={() => toggleTag(o.en)} aria-pressed={details.tags.includes(o.en)}
                            className={`rounded-lg text-sm border px-3 py-1.5 ${
                              details.tags.includes(o.en) ? 'bg-blue-700 border-blue-700 text-white'
                                                          : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}`}>
                      {o.fr}
                    </button>
                  ))}
                </div>
              </div>
            ))}

            <div className="mt-4 flex items-end justify-between gap-3">
              <label htmlFor="item-description" className="text-sm text-slate-600">Description (affichée en anglais)</label>
              <button type="button" onClick={rewrite}
                      className="inline-flex items-center gap-1.5 text-sm font-semibold text-blue-700 hover:text-blue-900 whitespace-nowrap">
                <Icon name="refresh" className="w-4 h-4" /> Reformuler
              </button>
            </div>
            <textarea id="item-description" value={form.description} onChange={(e) => set('description', e.target.value)}
                      rows={5} className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white"
                      placeholder="A white oak desk from IKEA. Turns any corner into a home office. In very good condition." />
            <p className="mt-1 text-xs text-slate-500">
              Tu peux retoucher le texte : il ne bougera plus tout seul. « Reformuler » repart de tes choix
              avec d’autres phrases, à chaque clic.
              {beforeRewrite != null && (
                <button type="button" onClick={() => { set('description', beforeRewrite); setBeforeRewrite(null); }}
                        className="ml-2 underline hover:text-blue-700">
                  Revenir au texte d’avant
                </button>
              )}
            </p>
          </div>

          <div className="mt-5 border-t border-blue-200 pt-4">
            <span className="font-semibold text-sm">Disponibilité de ce meuble</span>
            <p className="text-xs text-slate-500 mt-0.5">
              Laisse vide pour suivre le planning général. Utile quand tu peux te séparer
              de la télé tout de suite mais pas du lit avant ton départ.
            </p>

            <div className="mt-3 grid sm:grid-cols-2 gap-3">
              <label className="block">
                <span className="text-sm text-slate-600">Visible à partir du</span>
                <input type="date" value={form.available_from || ''}
                       onChange={(e) => set('available_from', e.target.value)}
                       max={LAST_DAY}
                       className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" />
              </label>
              <label className="block">
                <span className="text-sm text-slate-600">Dernier jour possible</span>
                <input type="date" value={form.available_to || ''}
                       onChange={(e) => set('available_to', e.target.value)}
                       max={LAST_DAY}
                       className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" />
              </label>
            </div>

            <label className="mt-3 flex items-center gap-2 text-sm text-slate-700">
              <input type="checkbox" checked={!!form.custom_schedule}
                     onChange={(e) => setForm((f) => ({
                       ...f,
                       custom_schedule: e.target.checked,
                       weekdays: f.weekdays || [...DEFAULT_SETTINGS.weekdays],
                       slots: f.slots || [...DEFAULT_SETTINGS.slots],
                     }))}
                     className="w-4 h-4 accent-blue-700" />
              Jours et créneaux différents pour ce meuble
            </label>

            {form.custom_schedule && (
              <div className="mt-3 space-y-4 border border-blue-200 rounded-lg bg-white p-4">
                <div>
                  <span className="text-sm text-slate-600">Jours</span>
                  <div className="mt-2">
                    <WeekdayPicker compact value={form.weekdays || DEFAULT_SETTINGS.weekdays}
                                   onChange={(w) => set('weekdays', w)} />
                  </div>
                </div>
                <div>
                  <span className="text-sm text-slate-600">Créneaux</span>
                  <div className="mt-2">
                    <SlotEditor compact value={form.slots || DEFAULT_SETTINGS.slots}
                                onChange={(s) => set('slots', s)} pushToast={pushToast} />
                  </div>
                </div>
              </div>
            )}
          </div>

          <div className="mt-4">
            <span className="text-sm text-slate-600">Liens vers les autres sites</span>
            <div className="mt-1 space-y-2">
              {(form.links || []).map((l, idx) => (
                <div key={idx} className="flex gap-2">
                  <input value={l.label}
                         onChange={(e) => { const links = [...form.links]; links[idx] = { ...l, label: e.target.value }; set('links', links); }}
                         className="w-44 border border-slate-200 rounded-lg px-3 py-2 bg-white text-sm" placeholder="Facebook Marketplace" />
                  <input value={l.url}
                         onChange={(e) => { const links = [...form.links]; links[idx] = { ...l, url: e.target.value }; set('links', links); }}
                         className="flex-1 border border-slate-200 rounded-lg px-3 py-2 bg-white text-sm" placeholder="https://…" />
                  <button onClick={() => set('links', form.links.filter((_, i) => i !== idx))}
                          className="px-2 text-slate-400 hover:text-red-600" aria-label="Retirer le lien">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
              ))}
            </div>
            <div className="mt-2 flex flex-wrap gap-2">
              {LINK_PRESETS.map((p) => (
                <button key={p} onClick={() => set('links', [...(form.links || []), { label: p, url: '' }])}
                        className="text-xs border border-blue-200 text-blue-800 rounded-full px-3 py-1 hover:bg-white">
                  + {p}
                </button>
              ))}
            </div>
          </div>

          <div className="mt-5 flex gap-2">
            <button onClick={submit} disabled={busy || photoState === 'loading'}
                    className="font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg px-5 py-2.5 text-sm">
              {busy ? 'Enregistrement…' : form.id ? 'Enregistrer les modifications' : 'Publier l’annonce'}
            </button>
            <button onClick={closeForm} className="text-sm text-slate-600 hover:text-slate-900 px-4">
              Annuler
            </button>
          </div>
        </div>
      )}

      {items.length === 0 ? (
        <div className="border border-dashed border-blue-200 rounded-xl px-6 py-12 text-center text-slate-600">
          Aucun meuble pour l’instant. Ajoute ton premier objet pour ouvrir la boutique.
        </div>
      ) : (
        <ul className="divide-y divide-slate-100 border-t border-slate-100">
          {items.map((item) => (
            <li key={item.id} className="py-4">
              <div className="flex flex-wrap sm:flex-nowrap items-center gap-x-4 gap-y-2">
                <div className="w-20 h-16 rounded-lg bg-blue-50 border border-blue-100 overflow-hidden shrink-0 flex items-center justify-center">
                  {item.image ? <img src={item.image} alt="" className="w-full h-full object-cover" />
                              : <Icon name="image" className="w-5 h-5 text-blue-200" />}
                </div>
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className={`font-semibold ${item.status === 'sold' ? 'text-slate-400 line-through' : ''}`}>{item.title}</span>
                    <span className="text-blue-700 text-sm">{withKr(item.price)}</span>
                    {item.status === 'sold' && <span className="text-xs bg-slate-100 text-slate-600 rounded-full px-2 py-0.5">Vendu</span>}
                  </div>
                  <p className="text-xs text-slate-500 mt-1 truncate">
                    {[
                      soldQty(item) > 0 ? soldNote(item) : null,
                      leftQty(item) > 0 ? heldNote(item, bookings) : null,
                      item.available_from && String(item.available_from).slice(0, 10) > todayKey()
                        ? `à partir du ${String(item.available_from).slice(8, 10)}/${String(item.available_from).slice(5, 7)}`
                        : null,
                      item.available_to ? `jusqu’au ${String(item.available_to).slice(8, 10)}/${String(item.available_to).slice(5, 7)}` : null,
                      item.custom_schedule ? 'horaires propres' : null,
                      photoCounts[item.id] ? `${photoCounts[item.id] + 1} photos` : null,
                      Array.isArray(item.links) && item.links.length ? item.links.map((l) => l.label).join(', ') : null,
                    ].filter(Boolean).join(' · ')}
                  </p>
                </div>
                {/* sur téléphone, les boutons passent sous la ligne */}
                <div className="flex items-center justify-end gap-1 shrink-0 w-full sm:w-auto">
                  {totalQty(item) > 1 ? (
                    <span className="inline-flex items-center border border-slate-200 rounded-lg text-xs">
                      <button onClick={() => setSold(item, soldQty(item) - 1)} disabled={soldQty(item) === 0}
                              className="px-2.5 py-1.5 text-base leading-none text-slate-600 hover:text-blue-700 disabled:text-slate-300"
                              aria-label="Un vendu de moins">−</button>
                      <span className="px-1 tabular-nums">{soldQty(item)} vendu{soldQty(item) > 1 ? 's' : ''} sur {totalQty(item)}</span>
                      <button onClick={() => setSelling(selling === item.id ? null : item.id)} disabled={leftQty(item) === 0}
                              className="px-2.5 py-1.5 text-base leading-none text-slate-600 hover:text-blue-700 disabled:text-slate-300"
                              aria-label="Un vendu de plus">+</button>
                    </span>
                  ) : item.status === 'sold' ? (
                    <button onClick={() => setSold(item, 0)}
                            className="text-xs border border-slate-200 rounded-lg px-3 py-1.5 hover:border-blue-400 hover:text-blue-700">
                      Remettre en vente
                    </button>
                  ) : (
                    <button onClick={() => setSelling(selling === item.id ? null : item.id)} aria-expanded={selling === item.id}
                            className="text-xs border border-slate-200 rounded-lg px-3 py-1.5 hover:border-blue-400 hover:text-blue-700">
                      Marquer vendu
                    </button>
                  )}
                  <button onClick={() => openForm(item)}
                          className="p-2 text-slate-500 hover:text-blue-700 rounded-lg hover:bg-blue-50" aria-label="Modifier">
                    <Icon name="pencil" className="w-4 h-4" />
                  </button>
                  <button onClick={() => remove(item)}
                          className="p-2 text-slate-500 hover:text-red-600 rounded-lg hover:bg-red-50" aria-label="Supprimer">
                    <Icon name="trash" className="w-4 h-4" />
                  </button>
                </div>
              </div>
              {selling === item.id && leftQty(item) > 0 && (
                <SalePrompt item={item} onConfirm={(price) => setSold(item, soldQty(item) + 1, price)}
                            onCancel={() => setSelling(null)} />
              )}
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

function BookingsPanel({ bookings, setBookings, items, setItems, pushToast }) {
  const [filter, setFilter] = useState('all');
  // Rendez-vous dont on note la vente (encadré « à quel prix ? »).
  const [selling, setSelling] = useState(null);

  const update = async (id, status) => {
    const { error } = await sb.from('bookings').update({ status }).eq('id', id);
    if (error) return pushToast('Mise à jour impossible.');
    setBookings(bookings.map((b) => (b.id === id ? { ...b, status } : b)));
    pushToast(status === 'confirmed' ? 'Rendez-vous confirmé.' : 'Rendez-vous refusé : le créneau et le meuble sont libérés.');
  };

  const itemOf = (b) => items.find((i) => String(i.id) === String(b.item_id));
  // Exemplaires que ce rendez-vous peut encore vendre : moins s'ils ont
  // déjà été marqués vendus dans Annonces, pour ne pas les compter deux fois.
  const sellable = (b, item) => (item ? Math.min(b.quantity || 1, leftQty(item)) : 0);

  // Ce que le vendeur note après le rendez-vous (migration-reservation.sql).
  const close = async (b, patch) => {
    if (!('outcome' in b)) {
      pushToast('Pour noter vendu ou invendu, lance d’abord migration-reservation.sql dans Supabase (SQL Editor).');
      return false;
    }
    const { error } = await sb.from('bookings').update(patch).eq('id', b.id);
    if (error) {
      pushToast('Mise à jour impossible.');
      return false;
    }
    setBookings((prev) => prev.map((x) => (x.id === b.id ? { ...x, ...patch } : x)));
    return true;
  };

  // Vendu : la vente compte dans Annonces et dans l'objectif, comme
  // « Marquer vendu », et le meuble reste hors de la boutique. `total` en kr
  // pour les `n` exemplaires partis.
  const sold = async (b, item, n, total) => {
    const patch = n > 0 ? soldPatch(item, soldQty(item) + n, Array(n).fill(total / n)) : null;
    if (n > 0 && !patch) {
      pushToast('Pour noter un prix négocié, lance d’abord migration-prix-vente.sql dans Supabase (SQL Editor).');
      return false;
    }
    // Le rendez-vous d'abord : si sa colonne manque, rien n'a bougé.
    if (!(await close(b, { outcome: 'sold', sale_price: total }))) return false;
    if (patch) {
      const { error } = await sb.from('items').update(patch).eq('id', item.id);
      if (error) {
        // Le rendez-vous redevient « à noter » pour pouvoir réessayer : sinon
        // le meuble reviendrait en boutique sans être compté vendu.
        await close(b, { outcome: null, sale_price: null });
        pushToast('Mise à jour impossible.');
        return false;
      }
      setItems((prev) => prev.map((i) => (i.id === item.id ? { ...i, ...patch } : i)));
    }
    pushToast(total ? `Vente notée : ${fmtKr(total)}.` : 'Vente notée.');
    return true;
  };

  // Invendu : le meuble réapparaît dans la boutique.
  const unsold = async (b) => {
    const item = itemOf(b);
    const back = item && leftQty(item) > 0;
    if (!window.confirm(back ? `Pas vendu ? « ${item.title} » réapparaît dans la boutique.` : 'Noter ce rendez-vous comme invendu ?')) return;
    if (await close(b, { outcome: 'unsold' })) pushToast(back ? `« ${item.title} » est de nouveau en vente.` : 'Noté.');
  };

  const now = new Date();
  const nowKey = `${todayKey()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const remove = async (id) => {
    if (!window.confirm('Supprimer ce rendez-vous ?')) return;
    const { error } = await sb.from('bookings').delete().eq('id', id);
    if (error) return pushToast('Suppression impossible.');
    setBookings(bookings.filter((b) => b.id !== id));
  };

  const markAllSeen = async () => {
    const ids = bookings.filter((b) => b.status === 'new').map((b) => b.id);
    if (!ids.length) return;
    await sb.from('bookings').update({ status: 'seen' }).in('id', ids);
    setBookings(bookings.map((b) => (b.status === 'new' ? { ...b, status: 'seen' } : b)));
  };

  const sorted = [...bookings].sort((a, b) => `${a.day} ${a.slot}`.localeCompare(`${b.day} ${b.slot}`));
  const shown = filter === 'all' ? sorted : sorted.filter((b) => String(b.day).slice(0, 10) >= todayKey());
  const newOnes = bookings.filter((b) => b.status === 'new').length;

  const labels = {
    new: ['Nouveau', 'bg-blue-700 text-white'],
    seen: ['Vu', 'bg-slate-100 text-slate-600'],
    confirmed: ['Confirmé', 'bg-blue-50 text-blue-800'],
    declined: ['Refusé', 'bg-slate-100 text-slate-400'],
  };

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div className="flex gap-2">
          {[['all', 'Tous'], ['upcoming', 'À venir']].map(([id, label]) => (
            <button key={id} onClick={() => setFilter(id)}
                    className={`text-sm rounded-lg px-3 py-1.5 border ${
                      filter === id ? 'border-blue-700 text-blue-800 bg-blue-50' : 'border-slate-200 text-slate-600'}`}>
              {label}
            </button>
          ))}
        </div>
        {newOnes > 0 && (
          <button onClick={markAllSeen} className="text-sm text-blue-700 hover:underline">Marquer tout comme lu</button>
        )}
      </div>

      {shown.length === 0 ? (
        <div className="border border-dashed border-blue-200 rounded-xl px-6 py-12 text-center text-slate-600">
          Aucun rendez-vous pour l’instant. Les demandes arrivent ici dès qu’un acheteur réserve un créneau.
        </div>
      ) : (
        <ul className="space-y-3">
          {shown.map((b) => {
            const [label, cls] = labels[b.status] || labels.seen;
            const item = itemOf(b);
            const n = sellable(b, item);
            const past = `${String(b.day).slice(0, 10)} ${b.slot}` <= nowKey;
            return (
              <li key={b.id} className={`border rounded-xl px-4 py-4 ${b.status === 'new' ? 'border-blue-300 bg-blue-50' : 'border-slate-200'}`}>
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="inline-flex items-center gap-1.5 font-semibold">
                        <Icon name="user" className="w-4 h-4 text-blue-700" /> {b.first_name}
                      </span>
                      <span className={`text-xs rounded-full px-2 py-0.5 ${cls}`}>{label}</span>
                    </div>
                    <p className="mt-1.5 text-sm text-slate-600 flex flex-wrap items-center gap-x-4 gap-y-1">
                      <a href={`tel:${String(b.phone).replace(/\s/g, '')}`} className="inline-flex items-center gap-1.5 text-blue-700 hover:underline">
                        <Icon name="phone" className="w-3.5 h-3.5" /> {b.phone}
                      </a>
                      <span className="inline-flex items-center gap-1.5">
                        <Icon name="calendar" className="w-3.5 h-3.5" /> {fmtDate(b.day, 'fr-FR')}
                      </span>
                      <span className="inline-flex items-center gap-1.5">
                        <Icon name="clock" className="w-3.5 h-3.5" /> {b.slot}
                      </span>
                      {paymentLabel(b.payment, 'fr') && (
                        <span className="inline-flex items-center gap-1.5">
                          <Icon name="card" className="w-3.5 h-3.5" /> {paymentLabel(b.payment, 'fr')}
                        </span>
                      )}
                    </p>
                    <p className="mt-1 text-sm text-slate-500">
                      Pour : {b.quantity > 1 && <strong className="text-slate-800">{b.quantity} × </strong>}{b.item_title}
                    </p>
                  </div>

                  <div className="flex items-center gap-1">
                    {!b.outcome && b.status !== 'confirmed' && (
                      <button onClick={() => update(b.id, 'confirmed')}
                              className="inline-flex items-center gap-1.5 text-sm bg-blue-700 hover:bg-blue-800 text-white rounded-lg px-3 py-1.5">
                        <Icon name="check" className="w-4 h-4" /> Confirmer
                      </button>
                    )}
                    {!b.outcome && b.status !== 'declined' && (
                      <button onClick={() => update(b.id, 'declined')}
                              className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 text-slate-600 hover:border-slate-400">
                        Refuser
                      </button>
                    )}
                    <button onClick={() => remove(b.id)} className="p-2 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50" aria-label="Supprimer">
                      <Icon name="trash" className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                {b.outcome === 'sold' ? (
                  <p className="mt-3 pt-3 border-t border-slate-200 text-sm font-semibold text-green-700 flex items-center gap-1.5">
                    <Icon name="check" className="w-4 h-4" /> {saleNote(b, item)}
                  </p>
                ) : b.outcome === 'unsold' ? (
                  <p className="mt-3 pt-3 border-t border-slate-200 text-sm text-slate-500">Invendu · remis en vente</p>
                ) : b.status !== 'declined' && (
                  <div className="mt-3 pt-3 border-t border-slate-200 flex flex-wrap items-center gap-2">
                    <span className={`mr-auto text-sm ${past ? 'font-semibold text-amber-700' : 'text-slate-500'}`}>
                      {past ? 'Rendez-vous passé : vendu ou invendu ?'
                        : 'outcome' in b ? 'Retiré de la boutique en attendant.' : 'Après le rendez-vous :'}
                    </span>
                    <button onClick={() => (n > 0 ? setSelling(selling === b.id ? null : b.id) : sold(b, item, 0, null))}
                            aria-expanded={selling === b.id}
                            className="inline-flex items-center gap-1.5 text-sm font-semibold border border-green-600 text-green-700 rounded-lg px-3 py-1.5 hover:bg-green-50">
                      <Icon name="check" className="w-4 h-4" /> Vendu
                    </button>
                    <button onClick={() => unsold(b)}
                            className="inline-flex items-center gap-1.5 text-sm border border-slate-200 text-slate-600 rounded-lg px-3 py-1.5 hover:border-slate-400">
                      <Icon name="x" className="w-4 h-4" /> Invendu
                    </button>
                  </div>
                )}
                {selling === b.id && !b.outcome && n > 0 && (
                  <SalePrompt item={item} count={n} onConfirm={(total) => sold(b, item, n, total)}
                              onCancel={() => setSelling(null)} />
                )}
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
}

function PlanningPanel({ settings, setSettings, bookings, pushToast }) {
  const settingsJSON = JSON.stringify({ ...DEFAULT_SETTINGS, ...settings });
  const [draft, setDraft] = useState(JSON.parse(settingsJSON));
  const [saving, setSaving] = useState(false);
  const now = new Date();
  const [cursor, setCursor] = useState({ y: now.getFullYear(), m: now.getMonth() });

  useEffect(() => { setDraft(JSON.parse(settingsJSON)); }, [settingsJSON]);

  const dirty = JSON.stringify(draft) !== settingsJSON;
  const set = (k, v) => setDraft((d) => ({ ...d, [k]: v }));

  const busyDates = new Set(bookings.filter((b) => b.status !== 'declined').map((b) => String(b.day).slice(0, 10)));
  const blocked = new Set(draft.blocked || []);
  const cells = monthDays(cursor.y, cursor.m);
  const tKey = todayKey();

  const toggleClosed = (k) => set('blocked', blocked.has(k) ? draft.blocked.filter((x) => x !== k) : [...draft.blocked, k]);

  const submit = async () => {
    setSaving(true);
    const payload = {
      address: draft.address, payment: draft.payment,
      weekdays: draft.weekdays, slots: draft.slots, blocked: draft.blocked,
    };
    const { error } = await sb.from('settings').update(payload).eq('id', 1);
    setSaving(false);
    if (error) return pushToast('Enregistrement impossible.');
    setSettings({ ...DEFAULT_SETTINGS, ...payload, id: 1 });
    pushToast('Planning enregistré.');
  };

  return (
    <div className="space-y-8 pb-24">
      <div className="border border-blue-100 bg-blue-50 rounded-xl px-4 py-3 text-sm text-blue-900">
        Ce planning s’applique par défaut à tous les meubles. Un meuble peut avoir ses
        propres dates et horaires depuis l’onglet Annonces.
      </div>

      <section>
        <h2 className="display font-bold text-lg">Jours où tu peux recevoir</h2>
        <p className="text-sm text-slate-500 mt-0.5">Les jours décochés n’apparaissent pas dans le calendrier des acheteurs.</p>
        <div className="mt-3">
          <WeekdayPicker value={draft.weekdays} onChange={(w) => set('weekdays', w)} />
        </div>
      </section>

      <section>
        <h2 className="display font-bold text-lg">Créneaux proposés</h2>
        <p className="text-sm text-slate-500 mt-0.5">Un créneau déjà réservé se barre automatiquement chez l’acheteur.</p>
        <div className="mt-3">
          <SlotEditor value={draft.slots} onChange={(s) => set('slots', s)} pushToast={pushToast} />
        </div>
      </section>

      <section>
        <h2 className="display font-bold text-lg">Jours fermés</h2>
        <p className="text-sm text-slate-500 mt-0.5">Clique une date pour la fermer : vacances, examens, journée de déménagement.</p>
        <div className="mt-3 max-w-sm border border-slate-200 rounded-xl p-4">
          <div className="flex items-center justify-between mb-3">
            <button onClick={() => setCursor(({ y, m }) => (m === 0 ? { y: y - 1, m: 11 } : { y, m: m - 1 }))}
                    className="p-1.5 rounded hover:bg-blue-50 text-blue-700" aria-label="Mois précédent">
              <Icon name="left" className="w-5 h-5" />
            </button>
            <span className="font-semibold">
              {new Date(cursor.y, cursor.m, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}
            </span>
            <button onClick={() => setCursor(({ y, m }) => (m === 11 ? { y: y + 1, m: 0 } : { y, m: m + 1 }))}
                    disabled={cursorKey(cursor) >= LAST_MONTH}
                    className="p-1.5 rounded text-blue-700 enabled:hover:bg-blue-50 disabled:text-slate-200 disabled:cursor-not-allowed"
                    aria-label="Mois suivant">
              <Icon name="right" className="w-5 h-5" />
            </button>
          </div>
          <div className="grid grid-cols-7 gap-1 text-center text-xs text-slate-400 mb-1">
            {['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((d, i) => <div key={i} className="py-1">{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const k = toKey(d);
              const past = k < tKey || k > LAST_DAY; // avant aujourd'hui ou après la fin de la vente
              const off = blocked.has(k) || !draft.weekdays[(d.getDay() + 6) % 7];
              const hasRdv = busyDates.has(k);
              return (
                <button key={i} disabled={past} onClick={() => toggleClosed(k)}
                        title={k > LAST_DAY ? 'Après la fin de la vente'
                                            : hasRdv ? 'Un rendez-vous est déjà pris ce jour-là' : undefined}
                        className={`h-10 rounded-lg text-sm relative ${
                          past ? 'text-slate-200 cursor-not-allowed'
                               : off ? 'bg-slate-100 text-slate-400 line-through'
                                     : 'hover:bg-blue-50 text-slate-700'}`}>
                  {d.getDate()}
                  {hasRdv && !past && <span className="absolute bottom-1 left-1/2 -ml-0.5 w-1 h-1 rounded-full bg-blue-700" />}
                </button>
              );
            })}
          </div>
          <p className="mt-3 text-xs text-slate-500 flex items-center gap-1.5">
            <span className="w-1.5 h-1.5 rounded-full bg-blue-700 inline-block" />
            Un point bleu signale un rendez-vous déjà pris.
          </p>
        </div>
      </section>

      <section>
        <h2 className="display font-bold text-lg">Lieu de retrait et paiement</h2>
        <div className="mt-3 grid sm:grid-cols-2 gap-3 max-w-2xl">
          <label className="block">
            <span className="text-sm text-slate-600">Adresse affichée sur la carte</span>
            <input value={draft.address || ''} onChange={(e) => set('address', e.target.value)}
                   className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2" placeholder="Alfavej 510, 13" />
          </label>
          <label className="block">
            <span className="text-sm text-slate-600">Paiement (affiché en anglais)</span>
            <input value={draft.payment || ''} onChange={(e) => set('payment', e.target.value)}
                   className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2" placeholder="Revolut or cash" />
          </label>
        </div>
      </section>

      {dirty && (
        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-5 py-3">
          <div className="max-w-5xl mx-auto flex items-center justify-between gap-4">
            <span className="text-sm text-slate-600 inline-flex items-center gap-2">
              <Icon name="alert" className="w-4 h-4 text-blue-700" /> Modifications non enregistrées
            </span>
            <div className="flex gap-2">
              <button onClick={() => setDraft(JSON.parse(settingsJSON))} className="text-sm text-slate-600 hover:text-slate-900 px-3">
                Annuler
              </button>
              <button onClick={submit} disabled={saving}
                      className="font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg px-5 py-2.5 text-sm">
                {saving ? 'Enregistrement…' : 'Enregistrer le planning'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Totaux calculés dans la base par seller_stats() (migration-stats.sql) :
// visites, scans estimés du QR code, d'où viennent les visiteurs, et pour
// chaque meuble combien l'ont vu et combien s'y sont intéressés.

const SOURCE_LABELS = {
  qr: 'QR code (estimé)',
  phone: 'Téléphone, lien direct ou partagé',
  computer: 'Ordinateur, lien direct',
};

function StatTile({ label, value, note, small }) {

    <div className="border border-slate-200 rounded-xl bg-white px-4 py-4 min-w-0">
      <p className="text-sm text-slate-500">{label}</p>

         title={small ? value : undefined}>

function StatsPanel({ items, bookings }) {
  const [stats, setStats] = useState(null);
  // 'missing' : migration-stats.sql pas lancé, 'failed' : base injoignable
  const [problem, setProblem] = useState(null);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    setLoading(true);
    const { data, error } = await sb.rpc('seller_stats');
    setLoading(false);
    if (error) return setProblem(error.code === 'PGRST202' || /seller_stats/.test(error.message || '') ? 'missing' : 'failed');
    setProblem(null);
    setStats(data);
  }, []);
  useEffect(() => { load(); }, [load]);

  if (problem === 'missing') {
    return (
      <div className="border border-dashed border-blue-200 rounded-xl px-6 py-10 text-center text-slate-600 max-w-xl mx-auto">
        <h2 className="display font-bold text-lg text-slate-900">Les statistiques ne sont pas encore activées</h2>
        <p className="mt-2 leading-relaxed">
          Lance <code className="bg-blue-50 px-1 rounded">migration-stats.sql</code> une fois dans Supabase
          (SQL Editor → Run). Le compteur démarre à ce moment-là.
        </p>
        <button onClick={load} className="mt-4 inline-flex items-center gap-2 text-sm font-semibold text-blue-700 hover:underline">
          <Icon name="refresh" className="w-4 h-4" /> Réessayer
        </button>
      </div>
    );
  }
  if (!stats) {
    return (
      <p className="text-slate-500">
        {problem === 'failed' ? 'Chargement impossible. Vérifie la connexion et actualise.' : 'Chargement…'}
      </p>
    );
  }

  // Chaque meuble avec ses chiffres ; ceux que personne n'a vus restent en
  // bas de la liste (les vendus seulement s'ils ont été vus).
  const counts = new Map(stats.items.map((r) => [String(r.item_id), r]));
  const rdv = (id) => bookings.filter((b) => String(b.item_id) === String(id) && b.status !== 'declined').length;
  const rows = items
    .map((item) => {
      const c = counts.get(String(item.id)) || { seen: 0, interested: 0 };
      return { item, seen: c.seen, interested: c.interested, rdv: rdv(item.id) };
    })
    .filter((r) => r.item.status !== 'sold' || r.seen || r.interested)
    .sort((a, b) => b.seen - a.seen || b.interested - a.interested || b.rdv - a.rdv);
  const maxSeen = Math.max(1, ...rows.map((r) => r.seen));
  const top = rows[0] && (rows[0].seen || rows[0].interested) ? rows[0] : null;

  // facebook.com, l.facebook.com, m.facebook.com… ne font qu'une source.
  const sources = [];
  stats.sources.forEach(({ source, n }) => {
    const name = SOURCE_LABELS[source] || source.replace(/^(l|lm|m|mobile|web)\./, '');

    else sources.push({ name, n });

  const plural = (n, word) => `${n} ${word}${n > 1 ? 's' : ''}`;

  return (
    <div className="space-y-8">

            ? `Compté depuis le ${new Date(stats.since).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })}. Tes visites avec ton compte connecté ne comptent pas.`

      <div className="grid sm:grid-cols-3 gap-3">
        <StatTile label="Visites du site" value={stats.visits.toLocaleString('fr-FR')}
                  note={`+${stats.visits_today} aujourd’hui`} />
        <StatTile label="Scans du QR code" value={stats.qr.toLocaleString('fr-FR')}
                  note={`+${stats.qr_today} aujourd’hui · estimation`} />
        <StatTile label="Meuble le plus regardé" small value={top ? top.item.title : '—'}
                  note={top ? `${plural(top.seen, 'vue')} · ${plural(top.interested, 'intéressé')}` : 'Pas encore de vue'} />
      </div>

      {sources.length > 0 && (
        <section>
          <h2 className="display font-bold text-lg">D’où viennent les visites</h2>
          <ul className="mt-2 flex flex-wrap gap-2">
            {sources.map((s) => (
              <li key={s.name} className="inline-flex items-center gap-2 border border-slate-200 rounded-lg px-3 py-1.5 text-sm">
                {s.name} <span className="font-semibold tabular-nums">{s.n}</span>
              </li>
            ))}

          <p className="mt-2 text-xs text-slate-500 leading-relaxed">
            Le QR code mène à l’adresse simple du site : une arrivée sur téléphone sans lien
            d’origine est comptée comme un scan. Taper l’adresse à la main compte aussi.
          </p>
        </section>
      )}

      <section>
        <h2 className="display font-bold text-lg">Meubles les plus regardés</h2>
        <p className="text-sm text-slate-500 mt-0.5">
          <strong className="font-semibold text-slate-700">Vues</strong> : la fiche est restée une seconde à l’écran.{' '}
          <strong className="font-semibold text-slate-700">Intéressés</strong> : visiteurs qui ont ouvert les photos ou
          commencé une réservation. <strong className="font-semibold text-slate-700">RDV</strong> : rendez-vous pris
          (hors refusés). Les meubles en haut de la boutique sont forcément plus vus : « Intéressés » dit
          mieux lesquels donnent envie.
        </p>
        <table className="mt-3 w-full text-sm">
          <thead>
            <tr className="text-left text-xs text-slate-500 border-b border-slate-200">
              <th className="py-2 pr-3 font-medium">Meuble</th>
              <th className="py-2 px-2 font-medium text-right">Vues</th>
              <th className="py-2 px-2 font-medium text-right">Intéressés</th>
              <th className="py-2 pl-2 font-medium text-right">RDV</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {rows.map(({ item, seen, interested, rdv: n }) => (
              <tr key={item.id}>
                <td className="py-2.5 pr-3 max-w-0 w-full">
                  <span className={`block truncate ${item.status === 'sold' ? 'text-slate-400 line-through' : ''}`}>{item.title}</span>
                </td>
                <td className="py-2.5 px-2">
                  <span className="flex items-center justify-end gap-2">
                    {/* longueur proportionnelle aux vues du meuble le plus vu */}
                    <span className="hidden sm:block w-24 h-1.5 rounded-full bg-blue-100 overflow-hidden" aria-hidden="true">
                      <span className="block h-full rounded-full bg-blue-700" style={{ width: `${(seen / maxSeen) * 100}%` }} />
                    </span>
                    <span className="w-8 text-right tabular-nums font-semibold">{seen}</span>
                  </span>
                </td>
                <td className="py-2.5 px-2 text-right tabular-nums">{interested}</td>
                <td className="py-2.5 pl-2 text-right tabular-nums">{n}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </section>
    </div>
  );
}

/* ------------------------------ affiche ----------------------------- */
// L'affiche A4 à imprimer, générée à partir des annonces : on coche les
// meubles qui y figurent avec leur prix, les autres sont cités en une ligne.
// Elle s'imprime seule sur un A4, ou en deux exemplaires A5 sur la même
// feuille. Le choix, les textes retouchés, les paiements affichés et le
// format restent enregistrés dans ce navigateur.

const POSTER_PICKS_KEY = 'meubles-affiche-choix';
const POSTER_TEXTS_KEY = 'meubles-affiche-textes';
const POSTER_PAY_KEY = 'meubles-affiche-paiements';
const POSTER_TWO_UP_KEY = 'meubles-affiche-deux-par-feuille';
// Paiements en bas de l'affiche, en anglais comme le reste de l'affiche.
const POSTER_PAY_DEFAULT = ['Revolut', 'Cash'];
const POSTER_PAY_PRESETS = ['Revolut', 'Cash', 'MobilePay'];
const A4_PX = { w: 793.7, h: 1122.5 }; // 210 × 297 mm à 96 px par pouce

function readStored(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v == null ? fallback : v;
  } catch { return fallback; }
}

function writeStored(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* navigation privée */ }
}

// QR code en image, dessiné par qrcode.js dans un div jetable.
function useQrCode(text) {
  const [src, setSrc] = useState(null);
  useEffect(() => {
    if (!text || typeof QRCode === 'undefined') { setSrc(null); return; }
    try {
      const box = document.createElement('div');
      new QRCode(box, {
        text, width: 512, height: 512,
        colorDark: '#16307a', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
      const canvas = box.querySelector('canvas');
      setSrc(canvas ? canvas.toDataURL('image/png') : null);
    } catch { setSrc(null); }
  }, [text]);
  return src;
}

// Texte modifiable directement sur l'affiche ; `children` est le texte par
// défaut. La clé change après chaque modification : React recrée l'élément
// au lieu de se battre avec le contentEditable.
function PosterText({ as: Tag, field, texts, onSave, className, children }) {
  const value = texts[field] != null ? texts[field] : children;
  return (
    <Tag key={value} className={`pst-edit ${className || ''}`}
         contentEditable suppressContentEditableWarning spellCheck={false}
         onBlur={(e) => {
           const text = e.currentTarget.innerText.trim();
           onSave(field, text === children ? null : text);
         }}>
      {value}
    </Tag>
  );
}

// Liste des paiements de l'affiche : on retire, on ajoute un nom libre ou
// on remet en un clic un des moyens habituels.
function PosterPayEditor({ value, onChange }) {
  const [draft, setDraft] = useState('');
  const has = (name) => value.some((p) => p.toLowerCase() === name.toLowerCase());
  const add = (label) => {
    const name = label.trim();
    if (!name || has(name)) return setDraft('');
    onChange([...value, name]);
    setDraft('');
  };

  return (
    <section>
      <h2 className="display font-bold text-lg">Paiements sur l’affiche</h2>
      <p className="text-sm text-slate-500 mt-0.5">Écris-les en anglais, comme le reste de l’affiche.</p>
      <div className="mt-3 flex flex-wrap gap-2">
        {value.map((p) => (
          <span key={p} className="inline-flex items-center gap-2 border border-blue-200 bg-blue-50 text-blue-800 rounded-lg text-sm px-3 py-1.5">
            {p}
            <button type="button" onClick={() => onChange(value.filter((x) => x !== p))}
                    className="text-blue-400 hover:text-red-600" aria-label={`Retirer ${p}`}>
              <Icon name="x" className="w-3.5 h-3.5" />
            </button>
          </span>
        ))}
        {value.length === 0 && <span className="text-sm text-slate-400">Aucun : rien ne s’affiche sous l’adresse.</span>}
      </div>
      <form className="mt-3 flex gap-2" onSubmit={(e) => { e.preventDefault(); add(draft); }}>
        <input value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="Autre (ex. Card)"
               className="flex-1 min-w-0 border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white" />
        <button type="submit"
                className="inline-flex items-center gap-1.5 border border-slate-200 bg-white rounded-lg px-3 py-2 text-sm hover:border-blue-400 hover:text-blue-700">
          <Icon name="plus" className="w-4 h-4" /> Ajouter
        </button>
      </form>
      {POSTER_PAY_PRESETS.some((p) => !has(p)) && (
        <div className="mt-2 flex flex-wrap gap-2">
          {POSTER_PAY_PRESETS.filter((p) => !has(p)).map((p) => (
            <button key={p} type="button" onClick={() => add(p)}
                    className="text-xs border border-blue-200 text-blue-800 rounded-full px-3 py-1 hover:bg-blue-50">
              + {p}
            </button>
          ))}
        </div>
      )}
    </section>
  );
}

function PosterPanel({ items, settings }) {
  const available = items.filter((i) => i.status !== 'sold');
  const [picks, setPicks] = useState(() => readStored(POSTER_PICKS_KEY, null));
  const [texts, setTexts] = useState(() => readStored(POSTER_TEXTS_KEY, {}));
  const [pays, setPays] = useState(() => readStored(POSTER_PAY_KEY, POSTER_PAY_DEFAULT));
  const [twoUp, setTwoUp] = useState(() => readStored(POSTER_TWO_UP_KEY, false) === true);
  const [link, setLink] = useState(SITE_URL);
  const [frameWidth, setFrameWidth] = useState(A4_PX.w / 2);
  // Taille du haut de l'affiche (1 = normale), réduite pour que tout tienne.
  const [fit, setFit] = useState(1);
  const [overflow, setOverflow] = useState(false);
  const frameRef = useRef(null);
  const topRef = useRef(null);
  const fitRef = useRef(null);
  const qr = useQrCode(link.trim());

  // Rien d'enregistré encore : tous les meubles en vente sont cochés.
  const picked = new Set(picks || available.map((i) => i.id));
  const onPoster = available.filter((i) => picked.has(i.id));
  const others = available.filter((i) => !picked.has(i.id));
  // Plus il y a de meubles, plus la liste se resserre (puis passe sur deux colonnes).
  const density = onPoster.length > 10 ? 'is-compact is-cols' : onPoster.length > 6 ? 'is-compact' : '';
  // Trop de meubles cochés pour la taille normale : l'affiche a rapetissé
  // (fit < 1), voire déborde encore.
  const tooLong = overflow || fit < 1;
  // Les meubles non cochés sont tous cités, par leur nom. Deux annonces du
  // même nom (deux lampes différentes) n'en font qu'une : « Lamp ×2 ».
  const otherNames = [];
  others.forEach((item) => {
    const title = item.title.trim();
    const same = otherNames.find((o) => o.title.toLowerCase() === title.toLowerCase());
    if (same) same.count += leftQty(item);
    else otherNames.push({ title, count: leftQty(item) });
  });

  const savePicks = (ids) => { setPicks(ids); writeStored(POSTER_PICKS_KEY, ids); };
  const toggle = (id) => savePicks(picked.has(id) ? [...picked].filter((x) => x !== id) : [...picked, id]);
  const saveText = (field, value) => {
    const next = { ...texts };
    if (value == null) delete next[field];
    else next[field] = value;
    setTexts(next);
    writeStored(POSTER_TEXTS_KEY, next);
  };
  const resetTexts = () => { setTexts({}); writeStored(POSTER_TEXTS_KEY, {}); };
  const edit = { texts, onSave: saveText };
  const savePays = (list) => { setPays(list); writeStored(POSTER_PAY_KEY, list); };
  const saveTwoUp = (on) => { setTwoUp(on); writeStored(POSTER_TWO_UP_KEY, on); };

  // L'aperçu est la vraie feuille A4 (en paysage pour 2 par feuille),
  // réduite pour tenir dans l'écran.
  const page = twoUp ? { w: A4_PX.h, h: A4_PX.w } : A4_PX;
  const scale = Math.min(1, frameWidth / page.w);
  useEffect(() => {
    const el = frameRef.current;
    if (!el || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => setFrameWidth(el.clientWidth));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // Tout doit tenir au-dessus du bandeau bleu : on cherche la plus grande
  // taille qui tient, sans descendre sous 60 %. On essaie directement sur
  // la première affiche, avant l'affichage ; si même à 60 % ça ne tient
  // pas, on prévient.
  useLayoutEffect(() => {
    const top = topRef.current;
    const inner = fitRef.current;
    if (!top || !inner) return;
    const fits = () => top.scrollHeight <= top.clientHeight + 1;
    const measure = () => {
      let z = 1;
      inner.style.zoom = z;
      while (!fits() && z > 0.6) {
        z = Math.round((z - 0.02) * 100) / 100;
        inner.style.zoom = z;
      }
      setFit(z);
      setOverflow(!fits());
    };
    measure();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  });

  // Une affiche. En 2 par feuille elle est dessinée deux fois, identiques
  // (un texte retouché sur l'une change aussi l'autre) ; seule la première
  // sert à mesurer la place.
  const sheet = (main) => (
    <div className="pst-sheet">
      <div className="pst-top" ref={main ? topRef : null}>
        <div className="pst-fit" ref={main ? fitRef : null} style={{ zoom: fit }}>
          <p className="pst-eyebrow">
            <PosterText as="span" field="eyebrow" {...edit}>My internship ends on 20 November</PosterText>
          </p>
          <PosterText as="h1" field="title" className="pst-title" {...edit}>{'Everything\nmust go'}</PosterText>
          <PosterText as="p" field="lede" className="pst-lede" {...edit}>
            I am leaving Odense on 20 November and my whole flat is for sale. Everything is in very good shape and the prices are low, because it all has to find a new home before I fly out.
          </PosterText>

          {onPoster.length > 0 && (
            <ul className={`pst-list ${density}`}>
              {onPoster.map((item) => (
                <li key={item.id}>
                  <span className="pst-name">
                    {item.title}{leftQty(item) > 1 && <span className="pst-qty"> ×{leftQty(item)}</span>}
                  </span>
                  <span className="pst-dots" />
                  <span className="pst-price">
                    {showPrice(item.price)}
                    {leftQty(item) > 1 && priceValue(item.price) > 0 && <span className="pst-qty"> each</span>}
                  </span>
                </li>
              ))}
            </ul>
          )}
          {otherNames.length > 0 && (
            <p className="pst-more">
              <PosterText as="span" field="moreLabel" className="pst-more-label" {...edit}>
                {onPoster.length ? 'Also for sale' : 'For sale'}
              </PosterText>
              {otherNames.map((o) => (
                <React.Fragment key={o.title}>
                  <span className="pst-more-item">
                    {o.title}{o.count > 1 && <span className="pst-qty"> ×{o.count}</span>}
                  </span>{' '}
                </React.Fragment>
              ))}
            </p>
          )}
        </div>
      </div>

      <div className="pst-band">
        <div className="pst-qr">
          {qr ? <img src={qr} alt="" />
              : <div className="pst-qr-empty">Mets le lien du site pour générer le QR code</div>}
        </div>
        <div>
          <PosterText as="h2" field="scan" {...edit}>{'Scan to see the full list\nand book a viewing'}</PosterText>
          <PosterText as="p" field="pickup" {...edit}>
            {settings.address ? `Pickup at ${settings.address}` : 'Pickup only'}
          </PosterText>
          <PosterText as="p" field="confirm" {...edit}>I will message you to confirm the time</PosterText>
          {pays.length > 0 && (
            <div className="pst-pay">
              {pays.map((p) => <span key={p}>{p}</span>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );

  return (
    <div className="grid lg:grid-cols-[20rem_1fr] gap-8 items-start print:block">
      <div className="space-y-6 print:hidden">
        <section>
          <h2 className="display font-bold text-lg">Meubles sur l’affiche</h2>
          <p className="text-sm text-slate-500 mt-0.5">
            Coche ceux à afficher avec leur prix. Les autres sont cités en une ligne en dessous.
          </p>

          {available.length === 0 ? (
            <p className="mt-3 border border-dashed border-blue-200 rounded-xl px-4 py-6 text-sm text-center text-slate-600">
              Aucun meuble en vente pour l’instant. Ajoute-les dans l’onglet Annonces.
            </p>
          ) : (
            <>
              <div className="mt-3 flex items-center gap-4 text-sm">
                <button onClick={() => savePicks(available.map((i) => i.id))} className="text-blue-700 hover:underline">
                  Tout cocher
                </button>
                <button onClick={() => savePicks([])} className="text-blue-700 hover:underline">
                  Tout décocher
                </button>
                <span className={`ml-auto ${tooLong ? 'font-semibold text-amber-700' : 'text-slate-500'}`}>
                  {onPoster.length} / {available.length}
                </span>
              </div>
              {tooLong && (
                <div className="mt-2 flex gap-2 border border-amber-200 bg-amber-50 rounded-xl px-3 py-2.5 text-sm text-amber-900" role="status">
                  <Icon name="alert" className="w-4 h-4 mt-0.5 shrink-0" />
                  <span>
                    <strong className="font-semibold">Liste cochée trop longue.</strong>{' '}
                    {overflow
                      ? 'Même réduite au plus petit, l’affiche déborde sous le bandeau bleu.'
                      : `Pour tout faire tenir, le texte de l’affiche est réduit à ${Math.round(fit * 100)} %${
                          twoUp ? ', et encore plus petit en 2 par feuille' : ''}.`}
                    {' '}Décoche quelques meubles : ils restent cités en bas, dans «&nbsp;Also for sale&nbsp;».
                  </span>
                </div>
              )}
              <ul className="mt-2 border border-slate-200 rounded-xl divide-y divide-slate-100 bg-white overflow-hidden">
                {available.map((item) => (
                  <li key={item.id}>
                    <label className="flex items-center gap-3 px-3 py-2.5 cursor-pointer hover:bg-blue-50">
                      <input type="checkbox" checked={picked.has(item.id)} onChange={() => toggle(item.id)}
                             className="w-5 h-5 accent-blue-700 shrink-0" />
                      <span className="w-10 h-10 rounded-lg bg-blue-50 overflow-hidden shrink-0 flex items-center justify-center">
                        {item.image ? <img src={item.image} alt="" className="w-full h-full object-cover" />
                                    : <Icon name="image" className="w-4 h-4 text-blue-200" />}
                      </span>
                      <span className="flex-1 min-w-0 text-sm font-medium truncate">
                        {item.title}{leftQty(item) > 1 && <span className="font-normal text-slate-500"> ×{leftQty(item)}</span>}
                      </span>
                      <span className="text-sm text-blue-700 whitespace-nowrap">{showPrice(item.price)}</span>
                    </label>
                  </li>
                ))}
              </ul>
              <p className="mt-2 text-xs text-slate-500">Les meubles vendus disparaissent tout seuls de l’affiche.</p>
            </>

        </section>

        <PosterPayEditor value={pays} onChange={savePays} />

        <label className="block">
          <span className="text-sm text-slate-600">Lien du QR code</span>
          <input type="url" value={link} onChange={(e) => setLink(e.target.value)}
                 className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
        </label>

        <section>
          <h2 className="display font-bold text-lg">Format</h2>
          <div className="mt-3 grid grid-cols-2 gap-2" role="radiogroup">
            {[[false, '1 par feuille', 'Une affiche A4'], [true, '2 par feuille', 'Deux A5 à découper']].map(([on, label, sub]) => (
              <button key={label} role="radio" aria-checked={twoUp === on} onClick={() => saveTwoUp(on)}
                      className={`flex items-center gap-3 rounded-lg border px-3 py-2.5 text-left ${
                        twoUp === on ? 'border-blue-700 bg-blue-50 ring-1 ring-blue-700'
                                     : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                {/* petit dessin de la feuille */}
                {on ? (
                  <span className="w-8 h-6 shrink-0 rounded-sm border-2 border-blue-700 flex">
                    <span className="w-1/2 border-r-2 border-dashed border-blue-700" />
                  </span>
                ) : (
                  <span className="w-5 h-7 mx-1.5 shrink-0 rounded-sm border-2 border-blue-700" />
                )}
                <span className="min-w-0">
                  <span className="block text-sm font-semibold">{label}</span>
                  <span className="block text-xs text-slate-500">{sub}</span>
                </span>
              </button>
            ))}
          </div>

        {tooLong && (
          <p className="flex gap-1.5 text-xs text-amber-800">
            <Icon name="alert" className="w-3.5 h-3.5 mt-px shrink-0" />
            {overflow ? 'L’affiche déborde : décoche des meubles (voir la liste en haut).'
                      : `Liste cochée trop longue : texte réduit à ${Math.round(fit * 100)} % (voir la liste en haut).`}
          </p>
        )}

        <div>
          <button onClick={() => window.print()} disabled={available.length === 0}
                  className="w-full inline-flex items-center justify-center gap-2 font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg py-3">
            Imprimer / Enregistrer en PDF

          <p className="mt-2 text-xs text-slate-500 leading-relaxed">
            Clique sur un texte de l’affiche pour le modifier. À l’impression : papier A4
            {twoUp && <strong className="font-semibold text-slate-700"> en paysage</strong>},
            « Graphiques d’arrière-plan » coché. La marge blanche est déjà dans l’affiche (l’imprimante
            ne sait pas imprimer jusqu’au bord) : ce que tu vois ici est ce qui sort.
            {twoUp && ' Coupe ensuite la feuille en deux le long des pointillés.'}

          <p className="mt-2 text-xs text-slate-500 leading-relaxed">
            <strong className="font-semibold text-slate-700">Imprimante :</strong> si l’aperçu d’impression
            montre plus de blanc d’un côté, l’imprimante est réglée sur le papier américain Letter.
            L’affiche reste entière, mais choisis A4 dans « Plus de paramètres › Taille du papier »
            (« More settings › Paper size ») pour qu’elle remplisse bien la feuille.
          </p>
          {Object.keys(texts).length > 0 && (
            <button onClick={resetTexts} className="mt-2 text-xs text-slate-500 hover:text-blue-700 underline">
              Remettre les textes d’origine
            </button>
          )}
        </div>
      </div>

      <div ref={frameRef} className="min-w-0">
        {/* Feuille en paysage : le navigateur la propose tout seul à l'impression. */}
        {twoUp && <style>{'@page { size: A4 landscape; margin: 0; }'}</style>}
        <div className="pst-frame mx-auto" style={{ width: page.w * scale, height: page.h * scale }}>
          <div className={`pst-page ${twoUp ? 'is-two' : ''}`} style={{ transform: `scale(${scale})` }}>
            {(twoUp ? [true, false] : [true]).map((main) => (
              <div key={String(main)} className="pst-slot">{sheet(main)}</div>
            ))}
            {twoUp && <span className="pst-cut" />}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
