                      <a href={tel.href} className="inline-flex items-center gap-1.5 text-blue-700 hover:underline">
                        <Icon name="phone" className="w-3.5 h-3.5" />
                        {tel.country && <span className="text-base leading-none" title={countryName(tel.country, t.lang)}>{tel.country.flag}</span>}
                        <span className="whitespace-nowrap tabular-nums">{tel.text}</span>
                      </a>
                      <a href={tel.href.replace(/^tel:/, 'sms:')} className="inline-flex items-center gap-1.5 text-blue-700 hover:underline">
                        <Icon name="message" className="w-3.5 h-3.5" /> SMS
                      </a>
                      <span className="inline-flex items-center gap-1.5">
                        <Icon name="clock" className="w-3.5 h-3.5" /> {when(m.created_at)}
                      </span>
                    </p>
                  </div>

                  <div className="flex items-center gap-1">
                    {m.status !== 'done' ? (
                      <button onClick={() => setStatus(m, 'done')}
                              className="inline-flex items-center gap-1.5 text-sm font-semibold border border-green-600 text-green-700 rounded-lg px-3 py-1.5 hover:bg-green-50">
                        <Icon name="check" className="w-4 h-4" /> {t('Done', 'Traité')}
                      </button>
                    ) : (
                      <button onClick={() => setStatus(m, 'seen')}
                              className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 text-slate-600 hover:border-slate-400">
                        {t('Reopen', 'Rouvrir')}
                      </button>
                    )}
                    <button onClick={() => remove(m)} className="p-2 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50" aria-label={t('Delete', 'Supprimer')}>
                      <Icon name="trash" className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                {lot && (
                  <p className="mt-2 text-sm font-semibold text-amber-900 inline-flex flex-wrap items-center gap-1.5">
                    <Icon name="layers" className="w-3.5 h-3.5" />
                    {t('Bundle', 'Lot')} {t(`“${lot.bundle}”`, `« ${lot.bundle} »`)}
                    {lotFull > 0 && (
                      <span className="font-normal text-slate-500">
                        · {fmtKr(afterDiscount(lotFull, lotPct))}{lotPct > 0 ? ` (${pctText(lotPct, t.lang)}, ${t('instead of', 'au lieu de')} ${fmtKr(lotFull)})` : ''}
                      </span>
                    )}
                  </p>
                )}
                {lines.length > 0 && (
                  <ul className="mt-2 text-sm text-slate-600 space-y-0.5">
                    {lines.map((l, i) => (
                      <li key={i} className="flex items-center gap-1.5">
                        <Icon name="bag" className="w-3.5 h-3.5 text-blue-700 shrink-0" />
                        <span>
                          {l.quantity > 1 && <strong className="text-slate-800">{l.quantity} × </strong>}
                          {l.title}
                          <span className="text-slate-400"> · {l.quantity > 1 && priceValue(l.price) > 0 ? fmtKr(priceValue(l.price) * l.quantity) : withKr(l.price) || t('free', 'gratuit')}{now(l)}</span>
                        </span>
                      </li>
                    ))}
                  </ul>
                )}
                {lines.length === 0 && !m.message && (
                  <p className="mt-2 text-sm text-slate-500">{t('Wants a call back, no message.', 'Veut être rappelé, sans message.')}</p>
                )}
                {m.message && (
                  <p className="mt-3 rounded-lg bg-white border border-slate-200 px-3 py-2 text-sm text-slate-800 whitespace-pre-line break-words">
                    {m.message}
                  </p>
                )}
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
}

  useEffect(() => { setDraft(JSON.parse(settingsJSON)); }, [settingsJSON]);

  const dirty = JSON.stringify(draft) !== settingsJSON;
  const set = (k, v) => setDraft((d) => ({ ...d, [k]: v }));

  const busyDates = new Set(bookings.filter((b) => b.status !== 'declined').map((b) => String(b.day).slice(0, 10)));

const SOURCE_LABELS = {
  qr: ['QR code (estimated)', 'QR code (estimé)'],

function StatsPanel({ items, bookings }) {
  const t = useT();
  const [stats, setStats] = useState(null);
  // 'missing' : migration-stats.sql pas lancé, 'failed' : base injoignable
  const [problem, setProblem] = useState(null);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    setLoading(true);
    const { data, error } = await sb.rpc('seller_stats');
    setLoading(false);
    if (error) return setProblem(error.code === 'PGRST202' || /seller_stats/.test(error.message || '') ? 'missing' : 'failed');
    setProblem(null);
    setStats(data);
  }, []);
  useEffect(() => { load(); }, [load]);

  if (problem === 'missing') {
    return (
      <div className="border border-dashed border-blue-200 rounded-xl px-6 py-10 text-center text-slate-600 max-w-xl mx-auto">
        <h2 className="display font-bold text-lg text-slate-900">{t('Stats are not turned on yet', 'Les statistiques ne sont pas encore activées')}</h2>
        <p className="mt-2 leading-relaxed">
          {t(<>Run <code className="bg-blue-50 px-1 rounded">migration-stats.sql</code> once in Supabase
               (SQL Editor → Run). Counting starts at that moment.</>,
             <>Lance <code className="bg-blue-50 px-1 rounded">migration-stats.sql</code> une fois dans Supabase
               (SQL Editor → Run). Le compteur démarre à ce moment-là.</>)}
        </p>
        <button onClick={load} className="mt-4 inline-flex items-center gap-2 text-sm font-semibold text-blue-700 hover:underline">
          <Icon name="refresh" className="w-4 h-4" /> {t('Try again', 'Réessayer')}
        </button>
      </div>
    );
  }
  if (!stats) {
    return (
      <p className="text-slate-500">
        {problem === 'failed' ? t('Could not load. Check the connection and refresh.', 'Chargement impossible. Vérifie la connexion et actualise.')
                              : t('Loading…', 'Chargement…')}
      </p>
    );
  }

  // Chaque meuble avec ses chiffres ; ceux que personne n'a vus restent en
  // bas de la liste (les vendus seulement s'ils ont été vus).
  const counts = new Map(stats.items.map((r) => [String(r.item_id), r]));
  const rdv = (id) => bookings.filter((b) => String(b.item_id) === String(id) && b.status !== 'declined').length;
  const rows = items
    .map((item) => {
      const c = counts.get(String(item.id)) || { seen: 0, interested: 0 };
      return { item, seen: c.seen, interested: c.interested, rdv: rdv(item.id) };
    })
    .filter((r) => r.item.status !== 'sold' || r.seen || r.interested)
    .sort((a, b) => b.seen - a.seen || b.interested - a.interested || b.rdv - a.rdv);
  const maxSeen = Math.max(1, ...rows.map((r) => r.seen));
  const top = rows[0] && (rows[0].seen || rows[0].interested) ? rows[0] : null;

  // facebook.com, l.facebook.com, m.facebook.com… ne font qu'une source.
  const sources = [];
  stats.sources.forEach(({ source, n }) => {
    const name = SOURCE_LABELS[source] ? t(...SOURCE_LABELS[source]) : source.replace(/^(l|lm|m|mobile|web)\./, '');
    const same = sources.find((s) => s.name === name);
    if (same) same.n += n;
    else sources.push({ name, n });
  });
  sources.sort((a, b) => b.n - a.n);

  const plural = (n, word) => `${n} ${word}${n > 1 ? 's' : ''}`;
  const since = stats.since && new Date(stats.since).toLocaleDateString(t.locale, { day: 'numeric', month: 'long' });
  const today = t('today', 'aujourd’hui');

  return (
    <div className="space-y-8">
      <div className="flex flex-wrap items-baseline justify-between gap-3">
        <p className="text-sm text-slate-500">
          {stats.since
            ? t(`Counted since ${since}. Your own visits while logged in don’t count.`,
                `Compté depuis le ${since}. Tes visites avec ton compte connecté ne comptent pas.`)
            : t('No visits counted yet: counting starts with the next visit to the shop.',
                'Aucune visite comptée pour l’instant : le compteur démarre avec la prochaine visite de la boutique.')}
        </p>
        <button onClick={load} disabled={loading}
                className="inline-flex items-center gap-1.5 text-sm font-semibold text-blue-700 hover:underline disabled:text-slate-400">
          <Icon name="refresh" className={`w-4 h-4 ${loading ? 'animate-spin' : ''}`} /> {t('Refresh', 'Actualiser')}
        </button>
      </div>

      <div className="grid sm:grid-cols-3 gap-3">
        <StatTile label={t('Site visits', 'Visites du site')} value={stats.visits.toLocaleString(t.locale)}
                  note={`+${stats.visits_today} ${today}`} />
        <StatTile label={t('QR code scans', 'Scans du QR code')} value={stats.qr.toLocaleString(t.locale)}
                  note={`+${stats.qr_today} ${today} · ${t('estimate', 'estimation')}`} />
        <StatTile label={t('Most viewed item', 'Meuble le plus regardé')} small value={top ? top.item.title : '—'}
                  note={top
                    ? t(`${plural(top.seen, 'view')} · ${top.interested} interested`, `${plural(top.seen, 'vue')} · ${plural(top.interested, 'intéressé')}`)
                    : t('No views yet', 'Pas encore de vue')} />
      </div>

      {sources.length > 0 && (
        <section>
          <h2 className="display font-bold text-lg">{t('Where visits come from', 'D’où viennent les visites')}</h2>
          <ul className="mt-2 flex flex-wrap gap-2">
            {sources.map((s) => (
              <li key={s.name} className="inline-flex items-center gap-2 border border-slate-200 rounded-lg px-3 py-1.5 text-sm">
                {s.name} <span className="font-semibold tabular-nums">{s.n}</span>
              </li>
            ))}
          </ul>
          <p className="mt-2 text-xs text-slate-500 leading-relaxed">
            {t('The QR code leads to the plain site address: a phone visit with no referring link counts as a scan. Typing the address by hand counts too.',
               'Le QR code mène à l’adresse simple du site : une arrivée sur téléphone sans lien d’origine est comptée comme un scan. Taper l’adresse à la main compte aussi.')}
          </p>
        </section>
      )}

      <section>
        <h2 className="display font-bold text-lg">{t('Most viewed items', 'Meubles les plus regardés')}</h2>
        <p className="text-sm text-slate-500 mt-0.5">
          {t(<><strong className="font-semibold text-slate-700">Views</strong>: the card stayed on screen for a second.{' '}
               <strong className="font-semibold text-slate-700">Interested</strong>: visitors who opened the photos or
               started a booking. <strong className="font-semibold text-slate-700">Bookings</strong>: viewings booked
               (declined ones left out). Items at the top of the shop are naturally seen more: “Interested” tells
               better which ones people want.</>,
             <><strong className="font-semibold text-slate-700">Vues</strong> : la fiche est restée une seconde à l’écran.{' '}
               <strong className="font-semibold text-slate-700">Intéressés</strong> : visiteurs qui ont ouvert les photos ou
               commencé une réservation. <strong className="font-semibold text-slate-700">RDV</strong> : rendez-vous pris
               (hors refusés). Les meubles en haut de la boutique sont forcément plus vus : « Intéressés » dit
               mieux lesquels donnent envie.</>)}
        </p>
        <table className="mt-3 w-full text-sm">
          <thead>
            <tr className="text-left text-xs text-slate-500 border-b border-slate-200">
              <th className="py-2 pr-3 font-medium">{t('Item', 'Meuble')}</th>
              <th className="py-2 px-2 font-medium text-right">{t('Views', 'Vues')}</th>
              <th className="py-2 px-2 font-medium text-right">{t('Interested', 'Intéressés')}</th>
              <th className="py-2 pl-2 font-medium text-right">{t('Bookings', 'RDV')}</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {rows.map(({ item, seen, interested, rdv: n }) => (
              <tr key={item.id}>
                <td className="py-2.5 pr-3 max-w-0 w-full">
                  <span className={`block truncate ${item.status === 'sold' ? 'text-slate-400 line-through' : ''}`}>{item.title}</span>
                </td>
                <td className="py-2.5 px-2">
                  <span className="flex items-center justify-end gap-2">
                    {/* longueur proportionnelle aux vues du meuble le plus vu */}
                    <span className="hidden sm:block w-24 h-1.5 rounded-full bg-blue-100 overflow-hidden" aria-hidden="true">
                      <span className="block h-full rounded-full bg-blue-700" style={{ width: `${(seen / maxSeen) * 100}%` }} />
                    </span>
                    <span className="w-8 text-right tabular-nums font-semibold">{seen}</span>
                  </span>
                </td>
                <td className="py-2.5 px-2 text-right tabular-nums">{interested}</td>
                <td className="py-2.5 pl-2 text-right tabular-nums">{n}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </section>
    </div>
  );
}

// L'affiche A4 à imprimer, générée à partir des annonces : on coche les
// meubles qui y figurent avec leur prix, les autres sont cités en une ligne.
// Elle s'imprime seule sur un A4, ou en deux exemplaires A5 sur la même
// feuille. Le choix, les textes retouchés, les paiements affichés et le
// format restent enregistrés dans ce navigateur.

const POSTER_PICKS_KEY = 'meubles-affiche-choix';
const POSTER_TEXTS_KEY = 'meubles-affiche-textes';
const POSTER_PAY_KEY = 'meubles-affiche-paiements';
const POSTER_TWO_UP_KEY = 'meubles-affiche-deux-par-feuille';
// Paiements en bas de l'affiche, dans la langue de la boutique comme le
// reste de l'affiche. Tant qu'on n'a pas touché à la liste, elle suit la langue.
const posterPayDefault = (lang) => (lang === 'fr' ? ['Revolut', 'Espèces'] : ['Revolut', 'Cash']);
const posterPayPresets = (lang) => (lang === 'fr' ? ['Revolut', 'Espèces', 'MobilePay'] : ['Revolut', 'Cash', 'MobilePay']);
const A4_PX = { w: 793.7, h: 1122.5 }; // 210 × 297 mm à 96 px par pouce

function readStored(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v == null ? fallback : v;
  } catch { return fallback; }
}

function writeStored(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* navigation privée */ }
}

// QR code en image, dessiné par qrcode.js dans un div jetable.
function useQrCode(text) {
  const [src, setSrc] = useState(null);
  useEffect(() => {
    if (!text || typeof QRCode === 'undefined') { setSrc(null); return; }
    try {
      const box = document.createElement('div');
      new QRCode(box, {
        text, width: 512, height: 512,
        colorDark: '#16307a', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
      const canvas = box.querySelector('canvas');
      setSrc(canvas ? canvas.toDataURL('image/png') : null);
    } catch { setSrc(null); }
  }, [text]);
  return src;
}

// Texte modifiable directement sur l'affiche ; `children` est le texte par
// défaut. La clé change après chaque modification : React recrée l'élément
// au lieu de se battre avec le contentEditable.
function PosterText({ as: Tag, field, texts, onSave, className, children }) {
  const value = texts[field] != null ? texts[field] : children;
  return (
    <Tag key={value} className={`pst-edit ${className || ''}`}
         contentEditable suppressContentEditableWarning spellCheck={false}
         onBlur={(e) => {
           const text = e.currentTarget.innerText.trim();
           onSave(field, text === children ? null : text);
         }}>
      {value}
    </Tag>
  );
}

// Liste des paiements de l'affiche : on retire, on ajoute un nom libre ou
// on remet en un clic un des moyens habituels.
function PosterPayEditor({ value, onChange }) {

  return (
    <section>

                           : t('Write them in English, like the rest of the poster.', 'Écris-les en anglais, comme le reste de l’affiche.')}
      </p>
      <div className="mt-3 flex flex-wrap gap-2">
        {value.map((p) => (
          <span key={p} className="inline-flex items-center gap-2 border border-blue-200 bg-blue-50 text-blue-800 rounded-lg text-sm px-3 py-1.5">

                    className="text-blue-400 hover:text-red-600" aria-label={t(`Remove ${p}`, `Retirer ${p}`)}>
              <Icon name="x" className="w-3.5 h-3.5" />
            </button>
          </span>
        ))}
        {value.length === 0 && (
          <span className="text-sm text-slate-400">{t('None: nothing shows under the address.', 'Aucun : rien ne s’affiche sous l’adresse.')}</span>
        )}
      </div>
      <form className="mt-3 flex gap-2" onSubmit={(e) => { e.preventDefault(); add(draft); }}>
        <input value={draft} onChange={(e) => setDraft(e.target.value)}
               placeholder={shopLang === 'fr' ? t('Other (e.g. Carte)', 'Autre (ex. Carte)') : t('Other (e.g. Card)', 'Autre (ex. Card)')}
               className="flex-1 min-w-0 border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white" />
        <button type="submit"
                className="inline-flex items-center gap-1.5 border border-slate-200 bg-white rounded-lg px-3 py-2 text-sm hover:border-blue-400 hover:text-blue-700">
          <Icon name="plus" className="w-4 h-4" /> {t('Add', 'Ajouter')}
        </button>
      </form>
      {presets.some((p) => !has(p)) && (
        <div className="mt-2 flex flex-wrap gap-2">
          {presets.filter((p) => !has(p)).map((p) => (
            <button key={p} type="button" onClick={() => add(p)}
                    className="text-xs border border-blue-200 text-blue-800 rounded-full px-3 py-1 hover:bg-blue-50">
              + {p}
            </button>
          ))}
        </div>
      )}
    </section>
  );
}

function PosterPanel({ items, settings }) {
  const t = useT();
  // L'affiche parle aux acheteurs : dans la langue de la boutique.
  const shopLang = useShopLang();
  const tp = makeT(shopLang);
  const available = items.filter((i) => i.status !== 'sold');
  const [picks, setPicks] = useState(() => readStored(POSTER_PICKS_KEY, null));
  const [texts, setTexts] = useState(() => readStored(POSTER_TEXTS_KEY, {}));
  // null tant qu'on n'y a pas touché : la liste par défaut, dans la langue de la boutique.
  const [savedPays, setPays] = useState(() => readStored(POSTER_PAY_KEY, null));
  const pays = savedPays || posterPayDefault(shopLang);
  const [twoUp, setTwoUp] = useState(() => readStored(POSTER_TWO_UP_KEY, false) === true);
  const [link, setLink] = useState(SITE_URL);
  const [frameWidth, setFrameWidth] = useState(A4_PX.w / 2);
  // Taille du haut de l'affiche (1 = normale), réduite pour que tout tienne.
  const [fit, setFit] = useState(1);
  const [overflow, setOverflow] = useState(false);
  const frameRef = useRef(null);
  const topRef = useRef(null);
  const fitRef = useRef(null);
  const qr = useQrCode(link.trim());

  // Rien d'enregistré encore : tous les meubles en vente sont cochés.
  const picked = new Set(picks || available.map((i) => i.id));
  const onPoster = available.filter((i) => picked.has(i.id));
  const others = available.filter((i) => !picked.has(i.id));
  // Plus il y a de meubles, plus la liste se resserre (puis passe sur deux colonnes).
  const density = onPoster.length > 10 ? 'is-compact is-cols' : onPoster.length > 6 ? 'is-compact' : '';
  // Trop de meubles cochés pour la taille normale : l'affiche a rapetissé
  // (fit < 1), voire déborde encore.
  const tooLong = overflow || fit < 1;
  // Les meubles non cochés sont tous cités, par leur nom. Deux annonces du
  // même nom (deux lampes différentes) n'en font qu'une : « Lamp ×2 ».
  const otherNames = [];
  others.forEach((item) => {
    const title = item.title.trim();
    const same = otherNames.find((o) => o.title.toLowerCase() === title.toLowerCase());
    if (same) same.count += leftQty(item);
    else otherNames.push({ title, count: leftQty(item) });
  });

  const savePicks = (ids) => { setPicks(ids); writeStored(POSTER_PICKS_KEY, ids); };
  const toggle = (id) => savePicks(picked.has(id) ? [...picked].filter((x) => x !== id) : [...picked, id]);
  const saveText = (field, value) => {
    const next = { ...texts };
    if (value == null) delete next[field];
    else next[field] = value;
    setTexts(next);
    writeStored(POSTER_TEXTS_KEY, next);
  };
  const resetTexts = () => { setTexts({}); writeStored(POSTER_TEXTS_KEY, {}); };
  const edit = { texts, onSave: saveText };
  const savePays = (list) => { setPays(list); writeStored(POSTER_PAY_KEY, list); };
  const saveTwoUp = (on) => { setTwoUp(on); writeStored(POSTER_TWO_UP_KEY, on); };

  // L'aperçu est la vraie feuille A4 (en paysage pour 2 par feuille),
  // réduite pour tenir dans l'écran.
  const page = twoUp ? { w: A4_PX.h, h: A4_PX.w } : A4_PX;
  const scale = Math.min(1, frameWidth / page.w);
  useEffect(() => {
    const el = frameRef.current;
    if (!el || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => setFrameWidth(el.clientWidth));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // Tout doit tenir au-dessus du bandeau bleu : on cherche la plus grande
  // taille qui tient, sans descendre sous 60 %. On essaie directement sur
  // la première affiche, avant l'affichage ; si même à 60 % ça ne tient
  // pas, on prévient.
  useLayoutEffect(() => {
    const top = topRef.current;
    const inner = fitRef.current;
    if (!top || !inner) return;
    const fits = () => top.scrollHeight <= top.clientHeight + 1;
    const measure = () => {
      let z = 1;
      inner.style.zoom = z;
      while (!fits() && z > 0.6) {
        z = Math.round((z - 0.02) * 100) / 100;
        inner.style.zoom = z;
      }
      setFit(z);
      setOverflow(!fits());
    };
    measure();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  });

  // Une affiche. En 2 par feuille elle est dessinée deux fois, identiques
  // (un texte retouché sur l'une change aussi l'autre) ; seule la première
  // sert à mesurer la place.
  const sheet = (main) => (
    <div className="pst-sheet">
      <div className="pst-top" ref={main ? topRef : null}>
        <div className="pst-fit" ref={main ? fitRef : null} style={{ zoom: fit }}>
          <p className="pst-eyebrow">
            <PosterText as="span" field="eyebrow" {...edit}>
              {tp('My internship ends on 20 November', 'Mon stage se termine le 20 novembre')}
            </PosterText>
          </p>
          <PosterText as="h1" field="title" className="pst-title" {...edit}>{tp('Everything\nmust go', 'Tout\ndoit partir')}</PosterText>
          <PosterText as="p" field="lede" className="pst-lede" {...edit}>
            {tp('I am leaving Odense on 20 November and my whole flat is for sale. Everything is in very good shape and the prices are low, because it all has to find a new home before I fly out.',
                'Je quitte Odense le 20 novembre et tout mon appartement est à vendre. Tout est en très bon état et les prix sont bas : tout doit trouver un nouveau foyer avant mon départ.')}
          </PosterText>

          {onPoster.length > 0 && (
            <ul className={`pst-list ${density}`}>
              {onPoster.map((item) => (
                <li key={item.id}>
                  <span className="pst-name">
                    {item.title}{leftQty(item) > 1 && <span className="pst-qty"> ×{leftQty(item)}</span>}
                  </span>
                  <span className="pst-dots" />
                  <span className="pst-price">
                    {showPrice(item.price, shopLang)}
                    {leftQty(item) > 1 && priceValue(item.price) > 0 && <span className="pst-qty">{tp(' each', ' l’unité')}</span>}
                  </span>
                </li>
              ))}
            </ul>
          )}
          {otherNames.length > 0 && (
            <p className="pst-more">
              <PosterText as="span" field="moreLabel" className="pst-more-label" {...edit}>
                {onPoster.length ? tp('Also for sale', 'Aussi à vendre') : tp('For sale', 'À vendre')}
              </PosterText>
              {otherNames.map((o) => (
                <React.Fragment key={o.title}>
                  <span className="pst-more-item">
                    {o.title}{o.count > 1 && <span className="pst-qty"> ×{o.count}</span>}
                  </span>{' '}
                </React.Fragment>
              ))}
            </p>
          )}
        </div>
      </div>

      <div className="pst-band">
        <div className="pst-qr">
          {qr ? <img src={qr} alt="" />
              : <div className="pst-qr-empty">{t('Enter the site link to make the QR code', 'Mets le lien du site pour générer le QR code')}</div>}
        </div>
        <div>
          <PosterText as="h2" field="scan" {...edit}>
            {tp('Scan to see the full list\nand book a viewing', 'Scannez pour voir toute la liste\net réserver une visite')}
          </PosterText>
          <PosterText as="p" field="pickup" {...edit}>
            {settings.address ? tp(`Pickup at ${settings.address}`, `Retrait : ${settings.address}`)
                              : tp('Pickup only', 'Retrait sur place uniquement')}
          </PosterText>
          <PosterText as="p" field="confirm" {...edit}>
            {tp('I will message you to confirm the time', 'Je vous écris pour confirmer l’heure')}
          </PosterText>
          {pays.length > 0 && (
            <div className="pst-pay">
              {pays.map((p) => <span key={p}>{p}</span>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );

  return (
    <div className="grid lg:grid-cols-[20rem_1fr] gap-8 items-start print:block">
      <div className="space-y-6 print:hidden">
        <section>
          <h2 className="display font-bold text-lg">{t('Items on the poster', 'Meubles sur l’affiche')}</h2>
          <p className="text-sm text-slate-500 mt-0.5">
            {t('Tick the ones to show with their price. The others are listed in one line below.',
               'Coche ceux à afficher avec leur prix. Les autres sont cités en une ligne en dessous.')}
          </p>

          {available.length === 0 ? (
            <p className="mt-3 border border-dashed border-blue-200 rounded-xl px-4 py-6 text-sm text-center text-slate-600">
              {t('No items for sale yet. Add them in the Listings tab.', 'Aucun meuble en vente pour l’instant. Ajoute-les dans l’onglet Annonces.')}
            </p>
          ) : (
            <>
              <div className="mt-3 flex items-center gap-4 text-sm">
                <button onClick={() => savePicks(available.map((i) => i.id))} className="text-blue-700 hover:underline">
                  {t('Tick all', 'Tout cocher')}
                </button>
                <button onClick={() => savePicks([])} className="text-blue-700 hover:underline">
                  {t('Untick all', 'Tout décocher')}
                </button>
                <span className={`ml-auto ${tooLong ? 'font-semibold text-amber-700' : 'text-slate-500'}`}>
                  {onPoster.length} / {available.length}
                </span>
              </div>
              {tooLong && (
                <div className="mt-2 flex gap-2 border border-amber-200 bg-amber-50 rounded-xl px-3 py-2.5 text-sm text-amber-900" role="status">
                  <Icon name="alert" className="w-4 h-4 mt-0.5 shrink-0" />
                  <span>
                    <strong className="font-semibold">{t('Ticked list too long.', 'Liste cochée trop longue.')}</strong>{' '}
                    {overflow
                      ? t('Even at its smallest, the poster spills under the blue band.',
                          'Même réduite au plus petit, l’affiche déborde sous le bandeau bleu.')
                      : t(`To make everything fit, the poster text is shrunk to ${Math.round(fit * 100)}%${
                            twoUp ? ', and even smaller at 2 per sheet' : ''}.`,
                          `Pour tout faire tenir, le texte de l’affiche est réduit à ${Math.round(fit * 100)} %${
                            twoUp ? ', et encore plus petit en 2 par feuille' : ''}.`)}
                    {' '}{t(`Untick a few items: they stay listed at the bottom, under “${tp('Also for sale', 'Aussi à vendre')}”.`,
                            `Décoche quelques meubles : ils restent cités en bas, dans « ${tp('Also for sale', 'Aussi à vendre')} ».`)}
                  </span>
                </div>
              )}
              <ul className="mt-2 border border-slate-200 rounded-xl divide-y divide-slate-100 bg-white overflow-hidden">
                {available.map((item) => (
                  <li key={item.id}>
                    <label className="flex items-center gap-3 px-3 py-2.5 cursor-pointer hover:bg-blue-50">
                      <input type="checkbox" checked={picked.has(item.id)} onChange={() => toggle(item.id)}
                             className="w-5 h-5 accent-blue-700 shrink-0" />
                      <span className="w-10 h-10 rounded-lg bg-blue-50 overflow-hidden shrink-0 flex items-center justify-center">
                        {item.image ? <img src={item.image} alt="" className="w-full h-full object-cover" />
                                    : <Icon name="image" className="w-4 h-4 text-blue-200" />}
                      </span>
                      <span className="flex-1 min-w-0 text-sm font-medium truncate">
                        {item.title}{leftQty(item) > 1 && <span className="font-normal text-slate-500"> ×{leftQty(item)}</span>}
                      </span>
                      <span className="text-sm text-blue-700 whitespace-nowrap">{showPrice(item.price, t.lang)}</span>
                    </label>
                  </li>
                ))}
              </ul>
              <p className="mt-2 text-xs text-slate-500">
                {t('Sold items disappear from the poster by themselves.', 'Les meubles vendus disparaissent tout seuls de l’affiche.')}
              </p>
            </>
          )}
        </section>

        <PosterPayEditor value={pays} onChange={savePays} />

        <label className="block">
          <span className="text-sm text-slate-600">{t('QR code link', 'Lien du QR code')}</span>
          <input type="url" value={link} onChange={(e) => setLink(e.target.value)}
                 className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
        </label>

        <section>
          <h2 className="display font-bold text-lg">Format</h2>
          <div className="mt-3 grid grid-cols-2 gap-2" role="radiogroup">
            {[[false, t('1 per sheet', '1 par feuille'), t('One A4 poster', 'Une affiche A4')],
              [true, t('2 per sheet', '2 par feuille'), t('Two A5 to cut', 'Deux A5 à découper')]].map(([on, label, sub]) => (
              <button key={label} role="radio" aria-checked={twoUp === on} onClick={() => saveTwoUp(on)}
                      className={`flex items-center gap-3 rounded-lg border px-3 py-2.5 text-left ${
                        twoUp === on ? 'border-blue-700 bg-blue-50 ring-1 ring-blue-700'
                                     : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                {/* petit dessin de la feuille */}
                {on ? (
                  <span className="w-8 h-6 shrink-0 rounded-sm border-2 border-blue-700 flex">
                    <span className="w-1/2 border-r-2 border-dashed border-blue-700" />
                  </span>
                ) : (
                  <span className="w-5 h-7 mx-1.5 shrink-0 rounded-sm border-2 border-blue-700" />
                )}
                <span className="min-w-0">
                  <span className="block text-sm font-semibold">{label}</span>
                  <span className="block text-xs text-slate-500">{sub}</span>
                </span>
              </button>
            ))}
          </div>
        </section>

        {tooLong && (
          <p className="flex gap-1.5 text-xs text-amber-800">
            <Icon name="alert" className="w-3.5 h-3.5 mt-px shrink-0" />
            {overflow ? t('The poster spills over: untick some items (see the list at the top).',
                          'L’affiche déborde : décoche des meubles (voir la liste en haut).')
                      : t(`Ticked list too long: text shrunk to ${Math.round(fit * 100)}% (see the list at the top).`,
                          `Liste cochée trop longue : texte réduit à ${Math.round(fit * 100)} % (voir la liste en haut).`)}
          </p>
        )}

        <div>
          <button onClick={() => window.print()} disabled={available.length === 0}
                  className="w-full inline-flex items-center justify-center gap-2 font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg py-3">
            {t('Print / Save as PDF', 'Imprimer / Enregistrer en PDF')}
          </button>
          <p className="mt-2 text-xs text-slate-500 leading-relaxed">
            {t(<>Click a text on the poster to edit it. When printing: A4 paper
                 {twoUp && <strong className="font-semibold text-slate-700"> in landscape</strong>},
                 “Background graphics” ticked. The white margin is already in the poster (printers
                 can’t print to the edge): what you see here is what comes out.
                 {twoUp && ' Then cut the sheet in half along the dotted line.'}</>,
               <>Clique sur un texte de l’affiche pour le modifier. À l’impression : papier A4
                 {twoUp && <strong className="font-semibold text-slate-700"> en paysage</strong>},
                 « Graphiques d’arrière-plan » coché. La marge blanche est déjà dans l’affiche (l’imprimante
                 ne sait pas imprimer jusqu’au bord) : ce que tu vois ici est ce qui sort.
                 {twoUp && ' Coupe ensuite la feuille en deux le long des pointillés.'}</>)}
          </p>
          <p className="mt-2 text-xs text-slate-500 leading-relaxed">
            {t(<><strong className="font-semibold text-slate-700">Printer:</strong> if the print preview
                 shows more white on one side, the printer is set to US Letter paper. The poster stays
                 whole, but choose A4 in “More settings › Paper size” so it fills the sheet.</>,
               <><strong className="font-semibold text-slate-700">Imprimante :</strong> si l’aperçu d’impression
                 montre plus de blanc d’un côté, l’imprimante est réglée sur le papier américain Letter.
                 L’affiche reste entière, mais choisis A4 dans « Plus de paramètres › Taille du papier »
                 (« More settings › Paper size ») pour qu’elle remplisse bien la feuille.</>)}
          </p>
          {Object.keys(texts).length > 0 && (
            <button onClick={resetTexts} className="mt-2 text-xs text-slate-500 hover:text-blue-700 underline">
              {t('Restore the original texts', 'Remettre les textes d’origine')}
            </button>
          )}
        </div>
      </div>

      <div ref={frameRef} className="min-w-0">
        {/* Feuille en paysage : le navigateur la propose tout seul à l'impression. */}
        {twoUp && <style>{'@page { size: A4 landscape; margin: 0; }'}</style>}
        <div className="pst-frame mx-auto" style={{ width: page.w * scale, height: page.h * scale }}>
          <div className={`pst-page ${twoUp ? 'is-two' : ''}`} style={{ transform: `scale(${scale})` }}>
            {(twoUp ? [true, false] : [true]).map((main) => (
              <div key={String(main)} className="pst-slot">{sheet(main)}</div>
            ))}
            {twoUp && <span className="pst-cut" />}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------ réglages ----------------------------- */
// La langue de la boutique (ce que lisent les acheteurs, l'affiche, et les
// titres et descriptions écrits tout seuls) et celle de l'espace vendeur.
// Les deux vont dans settings (migration-langue.sql) ; celle de l'espace
// vendeur est aussi gardée dans ce navigateur, elle marche donc même avant.

const LANG_CHOICES = [
  { id: 'en', flag: flagOf('GB'), name: 'English' },
  { id: 'fr', flag: flagOf('FR'), name: 'Français' },
];

function LangPicker({ value, onPick, disabled, label }) {
  return (
    <div className="mt-3 grid grid-cols-2 gap-2 max-w-md" role="radiogroup" aria-label={label}>
      {LANG_CHOICES.map((l) => {
        const on = value === l.id;
        return (
          <button key={l.id} type="button" role="radio" aria-checked={on} disabled={disabled}
                  onClick={() => { if (!on) onPick(l.id); }}
                  className={`flex items-center gap-3 rounded-xl border px-4 py-3 text-left disabled:opacity-50 disabled:cursor-not-allowed ${
                    on ? 'border-blue-700 bg-blue-50 ring-1 ring-blue-700' : 'border-slate-200 bg-white enabled:hover:border-slate-300'}`}>
            <span className="text-2xl leading-none" aria-hidden="true">{l.flag}</span>
            <span lang={l.id} className="flex-1 font-semibold">{l.name}</span>
            {on && <Icon name="check" className="w-5 h-5 text-blue-700 shrink-0" />}
          </button>
        );
      })}
    </div>
  );
}

function SettingsPanel({ settings, setSettings, shopLang, adminLang, onAdminLang, pushToast, onShop }) {
  const t = useT();
  // Les colonnes n'existent qu'après migration-langue.sql.
  const shopReady = 'shop_lang' in settings;
  const adminReady = 'admin_lang' in settings;
  const [saving, setSaving] = useState(false);

  const pickShop = async (lang) => {
    setSaving(true);
    const { error } = await sb.from('settings').update({ shop_lang: lang }).eq('id', 1);
    setSaving(false);
    if (error) return pushToast(t('Could not save, try again.', 'Enregistrement impossible, réessaie.'));
    setSettings((s) => ({ ...s, shop_lang: lang }));
    pushToast(lang === 'fr'
      ? t('The shop is now in French.', 'La boutique est maintenant en français.')
      : t('The shop is now in English.', 'La boutique est maintenant en anglais.'));
  };

  // Tout de suite à l'écran ; si la base refuse, on revient en arrière.
  const pickAdmin = async (lang) => {
    const before = adminLang;
    onAdminLang(lang);
    if (!adminReady) return;
    const { error } = await sb.from('settings').update({ admin_lang: lang }).eq('id', 1);
    if (error) {
      onAdminLang(before);
      pushToast(makeT(before)('Could not save, try again.', 'Enregistrement impossible, réessaie.'));
    }
  };

  return (
    <div className="space-y-10 max-w-2xl">
      {!shopReady && (
        <div className="border border-amber-200 bg-amber-50 rounded-xl px-4 py-3 text-sm text-amber-900" role="status">
          <p className="font-semibold">{t('One step before changing the shop language', 'Une étape avant de changer la langue de la boutique')}</p>
          <p className="mt-1 leading-relaxed">
            {t(<>Run <code className="bg-white px-1 rounded">migration-langue.sql</code> once in Supabase
                 (SQL Editor → New query → Run), then refresh the page. The seller space language
                 below already works, on this device.</>,
               <>Lance <code className="bg-white px-1 rounded">migration-langue.sql</code> une fois dans Supabase
                 (SQL Editor → New query → Run), puis actualise la page. La langue de l’espace vendeur,
                 plus bas, marche déjà, sur cet appareil.</>)}
          </p>
        </div>
      )}

      <section>
        <h2 className="display font-bold text-lg">{t('Shop language', 'Langue de la boutique')}</h2>
        <p className="text-sm text-slate-500 mt-0.5 leading-relaxed">
          {t('What buyers read: the furniture list, booking, messages and the poster. Titles and descriptions written for you come out in this language too.',
             'Ce que lisent les acheteurs : la liste des meubles, la réservation, les messages et l’affiche. Les titres et descriptions écrits tout seuls sortent aussi dans cette langue.')}
        </p>
        <LangPicker value={shopLang} onPick={pickShop} disabled={!shopReady || saving} label={t('Shop language', 'Langue de la boutique')} />
        <div className="mt-4 border border-blue-100 bg-blue-50 rounded-xl px-4 py-3 text-sm text-blue-900 leading-relaxed">
          {t(<>Listings you already wrote are <strong className="font-semibold">not translated</strong>: their title and
               description stay as you typed them. To redo one in the shop language, open it in Listings and
               click <strong className="font-semibold">Rewrite</strong> (a title suggested for you follows too).
               The payment text in Schedule and poster texts you edited also stay as they are.</>,
             <>Les annonces déjà écrites <strong className="font-semibold">ne se traduisent pas</strong> : leur titre et leur
               description restent comme tu les as tapés. Pour en refaire une dans la langue de la boutique, ouvre-la
               dans Annonces et clique sur <strong className="font-semibold">Reformuler</strong> (un titre proposé tout
               seul suit aussi). Le texte de paiement du Planning et les textes retouchés de l’affiche restent aussi
               tels quels.</>)}
        </div>
        <button onClick={onShop} className="mt-3 inline-flex items-center gap-1.5 text-sm font-semibold text-blue-700 hover:underline">
          <Icon name="store" className="w-4 h-4" /> {t('See the shop', 'Voir la boutique')}
        </button>
      </section>

      <section>
        <h2 className="display font-bold text-lg">{t('Seller space language', 'Langue de l’espace vendeur')}</h2>
        <p className="text-sm text-slate-500 mt-0.5 leading-relaxed">
          {adminReady
            ? t('The language of these screens, for you only: buyers never see it. It follows you on every device you log in from.',
                'La langue de ces écrans, pour toi seulement : les acheteurs ne la voient jamais. Elle te suit sur tous les appareils où tu te connectes.')
            : t('The language of these screens, for you only: buyers never see it. Kept on this device until migration-langue.sql is run.',
                'La langue de ces écrans, pour toi seulement : les acheteurs ne la voient jamais. Gardée sur cet appareil tant que migration-langue.sql n’est pas lancé.')}
        </p>
        <LangPicker value={adminLang} onPick={pickAdmin} label={t('Seller space language', 'Langue de l’espace vendeur')} />
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
