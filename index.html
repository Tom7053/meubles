// Réservation d'un meuble, de tout le panier ou d'un lot (`bundle`) au même
// rendez-vous. lines : [{ item, count, left }], `left` = exemplaires ni
// vendus ni réservés. Les nombres d'un lot sont fixes.
function BookingSheet({ lines, bundle, busy, settings, buyer, onBuyer, onClose, onTaken, onBooked, onItemTaken, onContact, onCart }) {
  const t = useT();
  const multi = lines.length > 1 || !!bundle;
  const plan = scheduleForAll(lines.map((l) => l.item), settings);
  const taken = new Set(busy.map((b) => `${String(b.day).slice(0, 10)} ${b.slot}`));
  const days = bookableDays(plan, taken);
  // Panier sans créneau commun : les meubles qui n'ont plus aucun créneau
  // à eux seuls, pour dire lequel retirer.
  const stuck = multi && !bundle && days.length === 0
    ? lines.filter((l) => bookableDays(scheduleFor(l.item, settings), taken).length === 0).map((l) => l.item.title)
    : [];

  const [step, setStep] = useState(1);
  // Le premier jour libre est déjà choisi : les heures s'affichent tout de suite.
  const [day, setDay] = useState(() => days[0] || null);
  const [slot, setSlot] = useState(null);
  const [firstName, setFirstName] = useState(buyer.firstName || '');
  const phoneField = usePhoneField(buyer);
  const [payment, setPayment] = useState('');
  // Un seul meuble en plusieurs exemplaires : l'acheteur dit combien il en
  // prend. Pour le panier, les nombres viennent du panier.
  const [count, setCount] = useState(() => (lines[0] ? Math.max(1, Math.min(lines[0].count, lines[0].left)) : 1));
  const [error, setError] = useState('');
  const [sending, setSending] = useState(false);
  // { rows, lines } une fois envoyé : ce qui a été réservé, gardé tel quel.
  const [done, setDone] = useState(null);
  const picked = (multi ? lines.map((l) => ({ ...l, count: Math.min(l.count, l.left) }))
                        : lines.map((l) => ({ ...l, count }))).filter((l) => l.count > 0);
  const only = lines[0] && lines[0].item;
  const left = lines[0] ? lines[0].left : 0;
  // Quelqu'un d'autre vient de réserver le dernier exemplaire (ou tout le
  // panier). Un lot ne se réserve qu'en entier.
  const gone = !done && (picked.length === 0 || (!multi && left < 1)
    || (!!bundle && lines.some((l) => l.left < l.count)));
  const bodyRef = useRef(null);
  const timesRef = useRef(null);
  useOverlay(onClose);

  const times = day ? slotsFor(day, plan, taken) : [];
  const tKey = todayKey();
  const tomorrow = (() => { const d = new Date(); d.setDate(d.getDate() + 1); return toKey(d); })();
  // « Thu 23 Oct at 14:00 », « jeu. 23 oct. à 14:00 »
  const whenText = (k, s) => `${fmtShort(k, null, t.locale)} ${t('at', 'à')} ${s}`;
  const itemsText = (n) => t(`${n} items`, `${n} meubles`);

  // Chaque nouvel écran repart du haut.
  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = 0; }, [step, done]);

  const pickDay = (k) => {
    setDay(k);
    setSlot(null);
    setError('');
    if (timesRef.current) timesRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  const backToTimes = (message) => {
    setSlot(null);
    setStep(1);
    setError(message || '');
  };

  const submit = async () => {
    if (firstName.trim().length < 2) return setError(t('Please enter your first name.', 'Entrez votre prénom.'));
    const phoneError = phoneProblem(phoneField.tel, t);
    if (phoneError) return setError(phoneError);
    if (!payment) return setError(t('Please choose how you will pay.', 'Choisissez comment vous allez payer.'));
    if (taken.has(`${day} ${slot}`)) {
      return backToTimes(t('Sorry, that time was just taken. Please pick another one.',
                           'Désolé, ce créneau vient d’être pris. Choisissez-en un autre.'));
    }
    setError('');
    setSending(true);
    // Une ligne par meuble, toutes au même créneau et reliées par cart_id.
    const cartId = picked.length > 1 ? newCartId() : null;
    const rows = picked.map((l) => ({
      item_id: l.item.id,
      item_title: l.item.title,
      first_name: firstName.trim(),
      phone: fullPhone(phoneField.tel),
      payment,
      day,
      slot,
      status: 'new',
      // Envoyés seulement s'ils servent : réserver un seul meuble marche
      // même si migration-quantite.sql ou migration-panier.sql manquent.
      ...(l.count > 1 ? { quantity: l.count } : {}),
      ...(cartId ? { cart_id: cartId } : {}),
      // Le titre et la remise du lot sont recopiés par la base (migration-lots.sql).
      ...(bundle ? { bundle_id: bundle.id } : {}),
    }));
    // Tout ou rien : si un seul meuble est déjà pris, rien n'est réservé.
    const { error: err } = await sb.from('bookings').insert(rows);
    setSending(false);
    // 23505 = quelqu'un d'autre a réservé ce créneau entre-temps.
    if (err && err.code === '23505') {
      onTaken(rows[0]);
      return backToTimes(t('Sorry, someone just took that time. Please pick another one.',
                           'Désolé, quelqu’un vient de prendre ce créneau. Choisissez-en un autre.'));
    }
    // item_taken = quelqu'un d'autre vient de réserver un de ces meubles
    // (migration-reservation.sql). La liste est relue : ce qui n'est plus
    // libre sort du panier, et la fenêtre le dit s'il ne reste rien.
    if (err && err.message === 'bundle_gone') {
      onItemTaken();
      return setError(t('Sorry, this bundle has just been changed. Close this window and have another look.',
                        'Désolé, ce lot vient d’être modifié. Fermez cette fenêtre et jetez un nouvel œil.'));
    }
    if (err && err.message === 'item_taken') {
      setCount(1);
      onItemTaken();
      if (bundle) {
        return setError(t('Sorry, someone else just booked one of these items: the bundle is no longer available.',
                          'Désolé, quelqu’un d’autre vient de réserver un de ces meubles : le lot n’est plus disponible.'));
      }
      return setError(multi
        ? t('Sorry, someone else just booked one of these items. Your cart is updated: check it and try again.',
            'Désolé, quelqu’un d’autre vient de réserver un de ces meubles. Votre panier est à jour : vérifiez-le et réessayez.')
        : t('Sorry, someone else just booked this item.', 'Désolé, quelqu’un d’autre vient de réserver ce meuble.'));
    }
    if (err) {
      console.warn('[meubles] réservation :', err.message);
      return setError(t('Something went wrong. Please try again.', 'Une erreur est survenue. Réessayez.'));
    }
    onBuyer({ firstName: firstName.trim(), ...phoneField.saved() });
    onBooked(rows);
    setDone({ rows, lines: picked });
  };

  const dayChip = (k) => {
    const on = k === day;
    const sub = on ? 'text-blue-100' : 'text-slate-500';
    return (
      <button key={k} onClick={() => pickDay(k)} aria-pressed={on}
              className={`snap-start shrink-0 w-[4.75rem] rounded-xl border py-2.5 text-center ${
                on ? 'bg-blue-700 border-blue-700 text-white'
                   : 'bg-white border-slate-200 text-slate-800 hover:border-blue-400'}`}>
        <span className={`block text-xs font-medium ${sub}`}>
          {k === tKey ? t('Today', 'Aujourd’hui') : k === tomorrow ? t('Tomorrow', 'Demain') : fmtShort(k, { weekday: 'short' }, t.locale)}
        </span>
        <span className="block text-xl font-bold leading-tight">{keyToDate(k).getDate()}</span>
        <span className={`block text-xs ${sub}`}>{fmtShort(k, { month: 'short' }, t.locale)}</span>
      </button>
    );
  };

  const stepOne = (
    <div>
      <h3 className="font-semibold text-lg">{t('Which day can you come?', 'Quel jour pouvez-vous venir ?')}</h3>
      {multi && days.length > 0 && (
        <p className="text-sm text-slate-500">
          {t(`Only the times when all ${picked.length} items can be picked up.`,
             `Seulement les créneaux où les ${picked.length} meubles peuvent être retirés.`)}
        </p>
      )}
      {days.length === 0 ? (
        <div className="mt-3 rounded-xl bg-slate-50 border border-slate-200 px-4 py-6 text-center text-slate-600">
          <p>
            {!multi ? t('Sorry, there are no free times left for this item.', 'Désolé, il n’y a plus de créneau libre pour ce meuble.')
              : bundle ? t('Sorry, there is no time left when the whole bundle can be picked up.',
                           'Désolé, il n’y a plus de créneau où retirer tout le lot.')
              : stuck.length ? t(`Sorry, there are no free times left for ${stuck.join(' and ')}. Remove ${stuck.length > 1 ? 'them' : 'it'} from your cart to book the rest.`,
                                 `Désolé, il n’y a plus de créneau libre pour ${stuck.join(' et ')}. Retirez-${stuck.length > 1 ? 'les' : 'le'} du panier pour réserver le reste.`)
              : t('Sorry, there is no time when all these items can be picked up together. Try booking them one by one.',
                  'Désolé, aucun créneau ne permet de retirer tous ces meubles ensemble. Essayez de les réserver un par un.')}
          </p>
          <button onClick={onContact}
                  className="mt-4 inline-flex items-center gap-2 font-semibold border border-blue-200 bg-white text-blue-800 rounded-xl px-4 py-2.5 hover:bg-blue-50">
            <Icon name="message" className="w-4 h-4" /> {t('Leave your number, I’ll call you', 'Laissez votre numéro, je vous rappelle')}
          </button>
        </div>
      ) : (
        <>
          <div className="mt-3 -mx-5 px-5 scroll-px-5 flex gap-2 overflow-x-auto snap-x no-scrollbar pb-1 sm:mx-0 sm:px-0 sm:flex-wrap sm:overflow-visible">
            {days.map(dayChip)}
          </div>
          {days.length > 4 && (
            <p className="mt-1.5 text-xs text-slate-400 sm:hidden">{t('Swipe for more days →', 'Glissez pour voir plus de jours →')}</p>
          )}
        </>
      )}

      {day && days.length > 0 && (
        <div ref={timesRef} className="mt-7 scroll-mt-4">
          <h3 className="font-semibold text-lg">{t('What time?', 'À quelle heure ?')}</h3>
          <p className="text-sm text-slate-500">{fmtDate(day, t.locale)}</p>
          <div className="mt-3 grid grid-cols-3 sm:grid-cols-4 gap-2">
            {times.map(({ time, free }) => {
              const on = slot === time;
              return (
                <button key={time} disabled={!free} aria-pressed={on}
                        onClick={() => { setSlot(time); setError(''); }}
                        className={`py-3 rounded-xl border text-base font-semibold ${
                          !free ? 'border-slate-100 text-slate-300 line-through cursor-not-allowed'
                                : on ? 'bg-blue-700 border-blue-700 text-white'
                                     : 'bg-white border-slate-200 text-slate-800 hover:border-blue-400'}`}>
                  {time}
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );

  const stepTwo = (
    <div>
      <button onClick={() => backToTimes()}
              className="w-full text-left rounded-xl bg-blue-50 border border-blue-100 px-4 py-3 flex items-center gap-3">
        <Icon name="calendar" className="w-5 h-5 text-blue-700 shrink-0" />
        <span className="flex-1 min-w-0">
          <span className="block font-semibold">{whenText(day, slot)}</span>
          {settings.address && (
            <span className="block text-sm text-slate-600 truncate">{t('Pickup at', 'Retrait :')} {settings.address}</span>
          )}
        </span>
        <span className="text-sm font-semibold text-blue-700">{t('Change', 'Modifier')}</span>
      </button>

      {!multi && left > 1 && (
        <div className="mt-6">
          <span className="font-semibold">{t('How many do you want?', 'Combien en voulez-vous ?')}</span>
          <span className="block text-sm text-slate-500">
            {t(`${left} available · ${showPrice(only.price, 'en')} each`, `${left} disponibles · ${showPrice(only.price, 'fr')} l’unité`)}
          </span>
          <div className="mt-2 flex items-center gap-3">
            <button type="button" onClick={() => setCount(Math.max(1, count - 1))} disabled={count <= 1}
                    className="w-12 h-12 rounded-xl border border-slate-300 bg-white text-2xl font-semibold text-slate-700 disabled:border-slate-100 disabled:text-slate-300"
                    aria-label={t('One less', 'Un de moins')}>−</button>
            <span className="w-8 text-center text-2xl font-bold tabular-nums" aria-live="polite">{count}</span>
            <button type="button" onClick={() => setCount(Math.min(left, count + 1))} disabled={count >= left}
                    className="w-12 h-12 rounded-xl border border-slate-300 bg-white text-2xl font-semibold text-slate-700 disabled:border-slate-100 disabled:text-slate-300"
                    aria-label={t('One more', 'Un de plus')}>+</button>
            <span className="ml-auto font-semibold text-blue-700">{priceFor(only.price, count, t.lang)}</span>
          </div>
        </div>
      )}

      <label className="block mt-6">
        <span className="font-semibold">{t('Your first name', 'Votre prénom')}</span>
        <input value={firstName} onChange={(e) => setFirstName(e.target.value)}
               autoComplete="given-name" className={FIELD} placeholder="Marie" />
      </label>

      <PhoneField field={phoneField} id="booking-phone"
                  hint={t('I will text you on it to confirm.', 'Je vous enverrai un SMS pour confirmer.')}
                  onEdit={() => setError('')} />

      <fieldset className="mt-6">
        <legend className="font-semibold">{t('How will you pay?', 'Comment allez-vous payer ?')}</legend>
        <span className="block text-sm text-slate-500">
          {t('Nothing to pay now — you pay when you pick it up.', 'Rien à payer maintenant : vous payez au retrait.')}
        </span>
        <div className="mt-2 grid gap-2" role="radiogroup">
          {PAYMENT_METHODS.filter((m) => !m.retired).map((m) => {
            const on = payment === m.id;
            return (
              <button key={m.id} role="radio" aria-checked={on}
                      onClick={() => { setPayment(m.id); setError(''); }}
                      className={`flex items-center gap-3 rounded-xl border px-4 py-3.5 text-left ${
                        on ? 'border-blue-700 bg-blue-50 ring-1 ring-blue-700' : 'border-slate-300 bg-white'}`}>
                <span className={`w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ${
                  on ? 'border-blue-700' : 'border-slate-300'}`}>
                  {on && <span className="w-2.5 h-2.5 rounded-full bg-blue-700" />}
                </span>
                <span className="font-medium">{m[t.lang]}</span>
              </button>
            );
          })}
        </div>
      </fieldset>
    </div>
  );

  // En tête de fenêtre : le meuble, ou tous ceux du panier avec le total,
  // ou ceux du lot avec son prix.
  const summary = bundle ? (
    <div className="pb-5 mb-5 border-b border-slate-100">
      <p className="mb-3 inline-flex items-center gap-1.5 text-sm font-semibold text-blue-800">
        <Icon name="layers" className="w-4 h-4" /> {t('Bundle', 'Lot')} · {itemsText(countAll(picked))} · {t('one visit', 'une visite')}
      </p>
      <LinesList lines={picked} />
      <BundleSummary bundle={bundle} lines={picked} />
    </div>
  ) : multi ? (
    <div className="pb-5 mb-5 border-b border-slate-100">
      <LinesList lines={picked} />
      <p className="mt-3 pt-3 border-t border-slate-100 flex items-baseline justify-between gap-3 font-semibold">
        <span>{itemsText(countAll(picked))} · {t('one visit', 'une visite')}</span>
        <span className="text-blue-700">{showTotal(picked, t.lang)}</span>
      </p>
    </div>
  ) : only && (
    <div className="flex items-center gap-3 pb-5 mb-5 border-b border-slate-100">
      <LineThumb item={only} />
      <div className="min-w-0">
        <p className="font-semibold leading-snug">{only.title}</p>
        <p className="text-blue-700 font-semibold">
          {showPrice(only.price, t.lang)}{left > 1 && priceValue(only.price) > 0 ? t(' each', ' l’unité') : ''}
        </p>
      </div>
    </div>
  );

  const q = encodeURIComponent(settings.address || '');
  const doneView = done && (() => {
    const r = done.rows[0];
    const one = !bundle && done.lines.length === 1 ? done.lines[0] : null;
    const pct = bundle ? cleanDiscount(bundle.discount) : 0;
    return (
      <div className="px-5 py-8">
        <div className="text-center">
          <div className="w-16 h-16 rounded-full bg-green-100 text-green-700 flex items-center justify-center mx-auto">
            <Icon name="check" className="w-8 h-8" />
          </div>
          <h3 className="display font-bold text-2xl mt-4">{t(`Thanks ${r.first_name}!`, `Merci ${r.first_name} !`)}</h3>
          <p className="mt-2 text-slate-600 leading-relaxed">
            {t('Your booking is sent. I will text you on', 'Votre réservation est envoyée. Je vous enverrai un SMS au')}{' '}
            <strong className="text-slate-900 whitespace-nowrap">{r.phone}</strong> {t('to confirm.', 'pour confirmer.')}
          </p>
        </div>

        <ul className="mt-6 rounded-2xl border border-slate-200 divide-y divide-slate-100">
          <li className="flex items-start gap-3 px-4 py-3">
            <Icon name="calendar" className="w-5 h-5 text-blue-700 mt-0.5 shrink-0" />
            <span>
              <span className="block font-semibold">{fmtDate(r.day, t.locale)}</span>
              <span className="block text-sm text-slate-500">
                {t('at', 'à')} {r.slot}{one ? ` · ${one.count > 1 ? `${one.count} × ` : ''}${one.item.title}` : ` · ${itemsText(countAll(done.lines))}`}
              </span>
            </span>
          </li>
          {!one && (
            <li className="px-4 py-3">
              <LinesList lines={done.lines} />
              {bundle && <BundleSummary bundle={bundle} lines={done.lines} />}
            </li>
          )}
          {settings.address && (
            <li className="flex items-start gap-3 px-4 py-3">
              <Icon name="pin" className="w-5 h-5 text-blue-700 mt-0.5 shrink-0" />
              <span>
                <span className="block font-semibold">{settings.address}</span>
                <a href={`https://www.google.com/maps/dir/?api=1&destination=${q}`} target="_blank" rel="noreferrer"
                   className="text-sm text-blue-700 hover:underline">{t('Get directions', 'Itinéraire')}</a>
              </span>
            </li>
          )}
          {paymentLabel(r.payment, t.lang) && (
            <li className="flex items-start gap-3 px-4 py-3">
              <Icon name="card" className="w-5 h-5 text-blue-700 mt-0.5 shrink-0" />
              <span>
                <span className="block font-semibold">
                  {one ? priceFor(one.item.price, one.count, t.lang)
                    : bundle && linesTotal(done.lines) > 0 ? `${fmtKr(bundlePrices(done.lines, pct).price)}${pct ? ` (${pctText(pct, t.lang)})` : ''}`
                    : showTotal(done.lines, t.lang)}
                </span>
                <span className="block text-sm text-slate-500">
                  {t('Pay on pickup by', 'Paiement au retrait :')} {paymentLabel(r.payment, t.lang)}
                </span>
              </span>
            </li>
          )}
        </ul>
        <p className="mt-4 text-center text-sm text-slate-500">
          {t('Tip: take a screenshot to keep the time and address.', 'Astuce : faites une capture d’écran pour garder l’heure et l’adresse.')}
        </p>
      </div>
    );
  })();

  const goneView = (
    <div className="px-5 py-14 text-center">
      <h3 className="display font-bold text-2xl">{t('Just booked by someone else', 'Quelqu’un vient de le réserver')}</h3>
      <p className="mt-2 text-slate-600 leading-relaxed">
        {bundle
          ? t('Sorry, one of the items in this bundle is no longer available, so the bundle is off. The other items can still be booked one by one.',
              'Désolé, un des meubles de ce lot n’est plus disponible, le lot n’est donc plus proposé. Les autres meubles se réservent encore un par un.')
          : multi || !only
          ? t('Sorry, these items are no longer available. Have a look at the other items.',
              'Désolé, ces meubles ne sont plus disponibles. Jetez un œil aux autres meubles.')
          : t(`Sorry, ${only.title} is no longer available. Have a look at the other items.`,
              `Désolé, ${only.title} n’est plus disponible. Jetez un œil aux autres meubles.`)}
      </p>
    </div>
  );

  const footer = (
    <>
      {error && !gone && <p className="mb-2 text-sm text-red-600" role="alert">{error}</p>}
      {done || gone ? (
        <button onClick={onClose} className={PRIMARY_BTN}>{t('Back to the list', 'Retour à la liste')}</button>
      ) : step === 1 ? (
        <button onClick={() => setStep(2)} disabled={!slot} className={PRIMARY_BTN}>
          {slot ? `${t('Continue', 'Continuer')} · ${whenText(day, slot)}`
            : day && days.length ? t('Pick a time', 'Choisissez une heure') : t('Pick a day', 'Choisissez un jour')}
        </button>
      ) : (
        <button onClick={submit} disabled={sending} className={PRIMARY_BTN}>
          {sending ? t('Sending…', 'Envoi…')
            : multi ? t(`Book this time for ${countAll(picked)} items`, `Réserver ce créneau pour ${countAll(picked)} meubles`)
            : t('Book this time', 'Réserver ce créneau')}
        </button>
      )}
    </>
  );

  return (
    <Sheet label={multi ? t(`Book a viewing for ${countAll(picked)} items`, `Réserver une visite pour ${countAll(picked)} meubles`)
                        : t(`Book a viewing: ${only ? only.title : ''}`, `Réserver une visite : ${only ? only.title : ''}`)}
           title={done ? t('Booking sent', 'Réservation envoyée') : t('Book a viewing', 'Réserver une visite')}
           sub={!done && !gone ? t(`Step ${step} of 2`, `Étape ${step} sur 2`) : null}
           onBack={done ? null : step === 2 && !gone ? () => backToTimes() : onCart}
           onClose={onClose}
           overlay={phoneField.picking && !done && !gone && (
             <CountryPicker value={phoneField.country} onPick={(iso) => { phoneField.pick(iso); setError(''); }}
                            onClose={phoneField.close} />
           )}
           footer={footer}
           bodyRef={bodyRef}>
      {done ? doneView : gone ? goneView : (
        <div className="px-5 py-5">
          {summary}
          {step === 1 ? stepOne : stepTwo}
        </div>
      )}
    </Sheet>
  );
}

// « Rappelez-moi » : prénom, numéro et un message, sur un meuble, sur le
// panier ou en général (lines vide). Rien n'est réservé ; la demande arrive
// dans l'onglet Messages de l'espace vendeur (migration-panier.sql).
function ContactSheet({ lines, bundle, buyer, onBuyer, onClose, onBook }) {
  const t = useT();
  // Les meubles tels qu'à l'ouverture : la demande garde sa liste même si
  // l'un d'eux part entre-temps.
  const [list] = useState(() => lines.map(({ item, count }) => ({ item, count })));
  const [firstName, setFirstName] = useState(buyer.firstName || '');
  const phoneField = usePhoneField(buyer);
  const [message, setMessage] = useState('');
  const [error, setError] = useState('');
  const [sending, setSending] = useState(false);
  const [done, setDone] = useState(null);
  const bodyRef = useRef(null);
  useOverlay(onClose);
  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = 0; }, [done]);

  const many = list.length > 1;

  const submit = async () => {
    if (firstName.trim().length < 2) return setError(t('Please enter your first name.', 'Entrez votre prénom.'));
    const phoneError = phoneProblem(phoneField.tel, t);
    if (phoneError) return setError(phoneError);
    setError('');
    setSending(true);
    const row = {
      first_name: firstName.trim(),
      phone: fullPhone(phoneField.tel),
      message: message.trim().slice(0, 1000) || null,
      // Une question sur un lot : chaque meuble porte le titre et la remise
      // du lot, l'onglet Messages affiche son prix.
      items: list.map(({ item, count }) => ({
        id: item.id, title: item.title, price: item.price || null, quantity: count,
        ...(bundle ? { bundle: (bundle.title || '').trim() || autoBundleTitle(list), discount: cleanDiscount(bundle.discount) } : {}),
      })),
    };
    const { error: err } = await sb.from('contact_requests').insert(row);
    setSending(false);
    if (err) {
      console.warn('[meubles] contact :', err.message);
      return setError(t('Something went wrong. Please try again.', 'Une erreur est survenue. Réessayez.'));
    }
    onBuyer({ firstName: row.first_name, ...phoneField.saved() });
    setDone(row);
  };

  const about = list.length > 0 && (
    <div className="rounded-2xl border border-slate-200 px-4 py-3">
      <p className="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-2">
        {bundle ? t('About the bundle', 'Concerne le lot') : t('About', 'Concerne')}
      </p>
      <LinesList lines={list} />
      {bundle && <BundleSummary bundle={bundle} lines={list} />}
    </div>
  );

  const form = (
    <div className="px-5 py-5">
      <p className="text-slate-600 leading-relaxed">
        {t('Leave your number and I will call or text you back.', 'Laissez votre numéro, je vous rappelle ou je vous écris.')}
      </p>
      {about && <div className="mt-4">{about}</div>}

      <label className="block mt-6">
        <span className="font-semibold">{t('Your first name', 'Votre prénom')}</span>
        <input value={firstName} onChange={(e) => { setFirstName(e.target.value); setError(''); }}
               autoComplete="given-name" className={FIELD} placeholder="Marie" />
      </label>

      <PhoneField field={phoneField} id="contact-phone"
                  hint={t('I will call or text you on it.', 'Je vous appelle ou vous écris à ce numéro.')}
                  onEdit={() => setError('')} />

      <label className="block mt-6">
        <span className="font-semibold">{t('Your message', 'Votre message')}</span>
        <span className="text-sm text-slate-500"> {t('(optional)', '(facultatif)')}</span>
        <textarea value={message} onChange={(e) => setMessage(e.target.value)} rows={4} maxLength={1000}
                  className={`${FIELD} resize-y leading-relaxed`}
                  placeholder={list.length
                    ? t('E.g. Can you hold it until Saturday? Can I see it in the evening?',
                        'Ex. : Pouvez-vous le garder jusqu’à samedi ? Puis-je passer le voir le soir ?')
                    : t('E.g. Do you have a desk? Can I come in the evening?',
                        'Ex. : Avez-vous un bureau ? Puis-je passer le soir ?')} />
      </label>

      {list.length > 0 && (
        <p className="mt-4 text-sm text-slate-500 leading-relaxed">
          {t(`This doesn’t reserve anything. To hold ${many ? 'these items' : 'this item'}, book a viewing.`,
             `Cela ne réserve rien. Pour garder ${many ? 'ces meubles' : 'ce meuble'}, réservez une visite.`)}
        </p>
      )}
    </div>
  );

  const doneView = done && (
    <div className="px-5 py-8">
      <div className="text-center">
        <div className="w-16 h-16 rounded-full bg-green-100 text-green-700 flex items-center justify-center mx-auto">
          <Icon name="check" className="w-8 h-8" />
        </div>
        <h3 className="display font-bold text-2xl mt-4">{t(`Thanks ${done.first_name}!`, `Merci ${done.first_name} !`)}</h3>
        <p className="mt-2 text-slate-600 leading-relaxed">
          {t('Message sent. I will call or text you on', 'Message envoyé. Je vous appelle ou vous écris au')}{' '}
          <strong className="text-slate-900 whitespace-nowrap">{done.phone}</strong> {t('as soon as I can.', 'dès que possible.')}
        </p>
      </div>
      {about && <div className="mt-6">{about}</div>}
      {done.message && (
        <blockquote className="mt-4 rounded-2xl bg-slate-50 border border-slate-200 px-4 py-3 text-slate-700 whitespace-pre-line">
          {done.message}
        </blockquote>
      )}
      {list.length > 0 && (
        <p className="mt-4 text-center text-sm text-slate-500">
          {t(`Nothing is reserved yet: book a viewing to hold ${many ? 'them' : 'it'}.`,
             `Rien n’est encore réservé : réservez une visite pour ${many ? 'les' : 'le'} garder.`)}
        </p>
      )}
    </div>
  );

  const footer = (
    <>
      {error && <p className="mb-2 text-sm text-red-600" role="alert">{error}</p>}
      {done ? (
        <div className="space-y-2">
          {onBook && list.length > 0 && (
            <button onClick={onBook} className={PRIMARY_BTN}>
              <Icon name="calendar" className="w-5 h-5" /> {t('Book a viewing now', 'Réserver une visite maintenant')}
            </button>
          )}
          <button onClick={onClose}
                  className={onBook && list.length > 0
                    ? SECONDARY_BTN + 'text-base py-3 bg-white border-blue-200 text-blue-800 hover:bg-blue-50'
                    : PRIMARY_BTN}>
            {t('Back to the list', 'Retour à la liste')}
          </button>
        </div>
      ) : (
        <button onClick={submit} disabled={sending} className={PRIMARY_BTN}>
          <Icon name="message" className="w-5 h-5" /> {sending ? t('Sending…', 'Envoi…') : t('Send', 'Envoyer')}
        </button>
      )}
    </>
  );

  return (
    <Sheet label={t('Contact the seller', 'Contacter le vendeur')} title={done ? t('Message sent', 'Message envoyé') : t('Contact me', 'Me contacter')}
           sub={!done && list.length ? (bundle ? (bundle.title || '').trim() || autoBundleTitle(list)
             : many ? t(`About ${list.length} items`, `À propos de ${list.length} meubles`) : list[0].item.title) : null}
           onClose={onClose}
           overlay={phoneField.picking && !done && (
             <CountryPicker value={phoneField.country} onPick={(iso) => { phoneField.pick(iso); setError(''); }}
                            onClose={phoneField.close} />
           )}
           footer={footer}
           bodyRef={bodyRef}>
      {done ? doneView : form}
    </Sheet>
  );
}

/* ================ ESPACE VENDEUR (en français ou en anglais) ============== */

function Admin({ session, authReady, recovering, linkProblem, onRecovered,
                 items, setItems, bundles, setBundles, bundlesMissing, manyPhotos, photoCounts, setPhotoCounts,
                 bookings, setBookings, messages, setMessages, messagesMissing, settings, setSettings,
                 shopLang, adminLang, onAdminLang, newCount, newMessages, reload, pushToast, onShop }) {
  const t = useT();
  const [tab, setTab] = useState('annonces');

  if (!authReady) {
    return <p className="min-h-screen flex items-center justify-center text-slate-500">{t('Loading…', 'Chargement…')}</p>;
  }
  // Arrivée par le lien « mot de passe oublié » : on choisit le nouveau d'abord.
  if (session && recovering) {
    return <NewPassword email={session.user && session.user.email} onDone={onRecovered} />;
  }
  if (!session) return <Login onShop={onShop} linkProblem={linkProblem} />;

  return (
    <div>
      <header className="border-b border-slate-200 print:hidden">
        <div className="max-w-5xl mx-auto px-4 sm:px-5 py-3 flex items-center justify-between gap-2">
          <h1 className="display font-bold text-lg truncate">{t('Furniture manager', 'Gestion des meubles')}</h1>
          <div className="flex items-center gap-1 shrink-0">
            <button onClick={reload} title={t('Refresh', 'Actualiser')} aria-label={t('Refresh', 'Actualiser')}
                    className="p-2 rounded-lg text-slate-500 hover:bg-blue-50 hover:text-blue-700">
              <Icon name="refresh" className="w-4 h-4" />
            </button>
            <button onClick={onShop} title={t('Shop', 'Boutique')} aria-label={t('Shop', 'Boutique')}
                    className="inline-flex items-center gap-1.5 text-sm text-slate-600 hover:text-blue-700 p-2">
              <Icon name="store" className="w-4 h-4" /> <span className="hidden sm:inline">{t('Shop', 'Boutique')}</span>
            </button>
            <button onClick={() => sb.auth.signOut()} title={t('Log out', 'Déconnexion')} aria-label={t('Log out', 'Déconnexion')}
                    className="inline-flex items-center gap-1.5 text-sm text-slate-600 hover:text-blue-700 p-2">
              <Icon name="logout" className="w-4 h-4" /> <span className="hidden sm:inline">{t('Log out', 'Déconnexion')}</span>
            </button>
          </div>
        </div>
        <div className="max-w-5xl mx-auto px-2 sm:px-5 flex sm:gap-1 overflow-x-auto no-scrollbar">
          {[['annonces', t('Listings', 'Annonces'), items.filter((i) => i.status !== 'sold').length],
            ['lots', t('Bundles', 'Lots'), bundles.length],
            ['rdv', t('Bookings', 'Rendez-vous'), newCount],
            ['messages', t('Messages', 'Messages'), newMessages],
            ['planning', t('Schedule', 'Planning'), 0],
            ['affiche', t('Poster', 'Affiche'), 0],
            ['stats', t('Stats', 'Stats'), 0],
            ['reglages', t('Settings', 'Réglages'), 0]].map(([id, label, count]) => (
            <button key={id} onClick={() => setTab(id)}
                    className={`px-2 sm:px-4 py-3 text-sm font-semibold border-b-2 -mb-px inline-flex items-center gap-1.5 sm:gap-2 whitespace-nowrap ${
                      tab === id ? 'border-blue-700 text-blue-800'
                                 : 'border-transparent text-slate-500 hover:text-slate-800'}`}>
              {label}
              {count > 0 && (
                <span className={`rounded-full px-2 py-0.5 text-xs ${
                  id === 'rdv' || id === 'messages' ? 'bg-blue-700 text-white' : 'bg-blue-50 text-blue-700'}`}>{count}</span>
              )}
            </button>
          ))}
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-4 sm:px-5 py-8 print:p-0 print:max-w-none">
        {tab === 'annonces' && (
          <ItemsPanel items={items} setItems={setItems} bundles={bundles} manyPhotos={manyPhotos} bookings={bookings}
                      photoCounts={photoCounts} setPhotoCounts={setPhotoCounts} pushToast={pushToast} />
        )}
        {tab === 'lots' && (
          <BundlesPanel items={items} bookings={bookings} bundles={bundles} setBundles={setBundles}
                        missing={bundlesMissing} pushToast={pushToast} />
        )}
        {tab === 'rdv' && (
          <BookingsPanel bookings={bookings} setBookings={setBookings}
                         items={items} setItems={setItems} pushToast={pushToast} />
        )}
        {tab === 'messages' && (
          <MessagesPanel messages={messages} setMessages={setMessages} missing={messagesMissing}
                         items={items} pushToast={pushToast} />
        )}
        {tab === 'planning' && <PlanningPanel settings={settings} setSettings={setSettings} bookings={bookings} pushToast={pushToast} />}
        {tab === 'affiche' && <PosterPanel items={items} settings={settings} />}
        {tab === 'stats' && <StatsPanel items={items} bookings={bookings} />}
        {tab === 'reglages' && (
          <SettingsPanel settings={settings} setSettings={setSettings} shopLang={shopLang} adminLang={adminLang}
                         onAdminLang={onAdminLang} pushToast={pushToast} onShop={onShop} />
        )}
      </main>
    </div>
  );
}

function authErrorMessage(err, t) {
  const m = String((err && err.message) || '').toLowerCase();
  if (m.includes('email not confirmed'))
    return t('The account exists but is not confirmed. In Supabase: Authentication > Users, open the user and confirm it, or delete it and create it again with “Auto Confirm User” ticked.',
             'Le compte existe mais n’est pas confirmé. Dans Supabase : Authentication > Users, ouvre l’utilisateur et confirme-le, ou supprime-le et recrée-le en cochant « Auto Confirm User ».');
  if (m.includes('invalid login credentials'))
    return t('Wrong e-mail or password. It is the password of the account created in Authentication > Users, not the database one. Forgot it? Use the link just below.',
             'E-mail ou mot de passe incorrect. C’est le mot de passe du compte créé dans Authentication > Users, pas celui de la base. Oublié ? Utilise le lien juste en dessous.');
  if (m.includes('failed to fetch') || m.includes('networkerror') || m.includes('load failed'))
    return t('Supabase can’t be reached. If the shop shows no furniture either, the project is probably paused: on supabase.com, open the project and click “Restore project”.',
             'Supabase est injoignable. Si la boutique n’affiche plus aucun meuble non plus, le projet est sûrement en pause : sur supabase.com, ouvre le projet et clique sur « Restore project ».');
  if (m.includes('api key') || m.includes('apikey') || m.includes('jwt'))
    return t('Invalid anon key. Copy it again from Project Settings > Data API.',
             'Clé anon invalide. Recopie-la depuis Project Settings > Data API.');
  // Le service d'e-mail intégré de Supabase n'écrit qu'aux membres de l'équipe du projet.
  if (m.includes('not authorized'))
    return t('Supabase refuses to send the e-mail to this address: its free service only writes to members of your Supabase organisation. Change the password with reset-mot-de-passe.sql instead.',
             'Supabase refuse d’envoyer l’e-mail à cette adresse : son service gratuit n’écrit qu’aux membres de ton organisation Supabase. Change plutôt le mot de passe avec reset-mot-de-passe.sql.');
  if (m.includes('email rate limit'))
    return t('Supabase reached its e-mail limit (a few per hour on the free plan). Try again later, or change the password with reset-mot-de-passe.sql.',
             'Supabase a atteint sa limite d’e-mails (quelques-uns par heure en gratuit). Réessaie plus tard, ou change le mot de passe avec reset-mot-de-passe.sql.');
  if (m.includes('security purposes'))
    return t('A link was just sent. Wait a minute before asking for another one.',
             'Un lien vient déjà de partir. Attends une minute avant d’en redemander un.');
  if (m.includes('rate') || m.includes('too many'))
    return t('Too many attempts. Wait a minute before trying again.', 'Trop de tentatives. Attends une minute avant de réessayer.');
  if (m.includes('disabled') || m.includes('not enabled'))
    return t('E-mail login is turned off. Turn it on in Authentication > Sign In / Providers > Email.',
             'La connexion par e-mail est désactivée. Active-la dans Authentication > Sign In / Providers > Email.');
  return t('Could not log in.', 'Connexion impossible.');
}

function passwordErrorMessage(err, t) {
  const m = String((err && err.message) || '').toLowerCase();
  if (m.includes('different from the old'))
    return t('That is already your current password. Choose another one.', 'C’est déjà ton mot de passe actuel. Choisis-en un autre.');
  if (m.includes('at least') || m.includes('weak') || m.includes('short'))
    return t('Password too weak. Use a longer one.', 'Mot de passe trop faible. Mets-en un plus long.');
  if (m.includes('session') || m.includes('expired'))
    return t('The link has expired. Go back to the login and ask for a new link.', 'Le lien a expiré. Reviens à la connexion et redemande un lien.');
  return authErrorMessage(err, t);
}

function Login({ onShop, linkProblem }) {
  const t = useT();
  // 'login' → connexion, 'forgot' → demander un lien, 'sent' → lien envoyé
  const [mode, setMode] = useState(linkProblem ? 'forgot' : 'login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState(linkProblem
    ? t('This link has expired or was already used. Ask for a new link below.',
        'Ce lien a expiré ou a déjà servi. Demande un nouveau lien ci-dessous.') : '');
  const [detail, setDetail] = useState('');
  const [busy, setBusy] = useState(false);

  const cleanEmail = email.trim().toLowerCase();
  const go = (m) => { setMode(m); setError(''); setDetail(''); };
  const fail = (err) => { setError(authErrorMessage(err, t)); setDetail((err && err.message) || ''); };

  const signIn = async (e) => {
    e.preventDefault();
    setError('');
    setDetail('');
    if (!cleanEmail || !password) return setError(t('Enter your e-mail and password.', 'Entre ton e-mail et ton mot de passe.'));
    setBusy(true);
    const { error: err } = await sb.auth.signInWithPassword({ email: cleanEmail, password });
    setBusy(false);
    if (err) fail(err);
  };

  // Supabase envoie un e-mail dont le lien ramène sur SITE_URL, connecté,
  // avec #type=recovery : l'écran NewPassword prend alors le relais.
  const sendLink = async (e) => {
    e.preventDefault();
    setError('');
    setDetail('');
    if (!/^\S+@\S+\.\S+$/.test(cleanEmail)) {
      return setError(t('Enter the seller account’s e-mail address.', 'Entre l’adresse e-mail du compte vendeur.'));
    }
    setBusy(true);
    const { error: err } = await sb.auth.resetPasswordForEmail(cleanEmail, { redirectTo: SITE_URL });
    setBusy(false);
    if (err) return fail(err);
    setMode('sent');
  };

  const footer = (
    <button onClick={onShop} className="mt-6 inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-blue-700">
      <Icon name="store" className="w-4 h-4" /> {t('Back to the shop', 'Retour à la boutique')}
    </button>
  );

  const emailField = (
    <label className="block">
      <span className="text-sm font-medium text-slate-700">E-mail</span>
      <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
             autoComplete="username" autoCapitalize="none" spellCheck={false}
             className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-3" />
    </label>
  );

  if (mode === 'sent') {
    return (
      <AuthCard icon="mail" title={t('Check your e-mails', 'Regarde tes e-mails')} footer={footer}
                text={t(
                  <>If <strong className="text-slate-700">{cleanEmail}</strong> is the seller account’s address,
                    an e-mail was just sent. Open the link inside: it brings you back here to choose
                    a new password.</>,
                  <>Si <strong className="text-slate-700">{cleanEmail}</strong> est l’adresse du compte vendeur,
                    un e-mail vient de partir. Ouvre le lien qu’il contient : il te ramène ici pour choisir
                    un nouveau mot de passe.</>)}>
        <ul className="mt-4 text-sm text-slate-600 space-y-1.5 list-disc pl-5">
          <li>{t('Also check your spam folder.', 'Regarde aussi dans les spams.')}</li>
          <li>{t('The link only works once.', 'Le lien ne marche qu’une seule fois.')}</li>
          <li>{t('Nothing after 5 minutes? Change the password directly in Supabase with',
                 'Rien au bout de 5 minutes ? Change le mot de passe directement dans Supabase avec')}{' '}
              <code className="bg-blue-50 px-1 rounded">reset-mot-de-passe.sql</code>.</li>
        </ul>
        <button onClick={() => go('login')} className={`mt-6 ${PRIMARY_BTN}`}>{t('Back to login', 'Retour à la connexion')}</button>
      </AuthCard>
    );
  }

  if (mode === 'forgot') {
    return (
      <AuthCard icon="key" title={t('Forgot password', 'Mot de passe oublié')} footer={footer}
                text={t('Enter the seller account’s e-mail, you will get a link to choose a new password.',
                        'Entre l’e-mail du compte vendeur, tu vas recevoir un lien pour choisir un nouveau mot de passe.')}>
        <form onSubmit={sendLink} className="mt-6 space-y-4" noValidate>
          {emailField}
          <ErrorBox error={error} detail={detail} />
          <button type="submit" disabled={busy} className={PRIMARY_BTN}>
            {busy ? t('Sending…', 'Envoi…') : t('Send me the link', 'Recevoir le lien')}
          </button>
        </form>
        <button onClick={() => go('login')} className="mt-4 inline-flex items-center gap-1 text-sm font-medium text-blue-700 hover:underline">
          <Icon name="left" className="w-4 h-4" /> {t('I remember it after all', 'Je m’en souviens finalement')}
        </button>
      </AuthCard>
    );
  }

  return (
    <AuthCard icon="lock" title={t('Seller space', 'Espace vendeur')} footer={footer}
              text={t('Log in to manage the listings, bookings and schedule.',
                      'Connecte-toi pour gérer les annonces, les rendez-vous et le planning.')}>
      <form onSubmit={signIn} className="mt-6 space-y-4" noValidate>
        {emailField}
        <PasswordField label={t('Password', 'Mot de passe')} value={password} onChange={setPassword} autoComplete="current-password" />
        <ErrorBox error={error} detail={detail} />
        <button type="submit" disabled={busy} className={PRIMARY_BTN}>
          {busy ? t('Logging in…', 'Connexion…') : t('Log in', 'Se connecter')}
        </button>
      </form>
      <button onClick={() => go('forgot')} className="mt-4 text-sm font-medium text-blue-700 hover:underline">
        {t('Forgot your password?', 'Mot de passe oublié ?')}
      </button>
    </AuthCard>
  );
}

function NewPassword({ email, onDone }) {
  const t = useT();
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [detail, setDetail] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    setDetail('');
    if (password.length < 6) return setError(t('Use at least 6 characters.', 'Choisis au moins 6 caractères.'));
    setBusy(true);
    const { error: err } = await sb.auth.updateUser({ password });
    setBusy(false);
    if (err) {
      setError(passwordErrorMessage(err, t));
      setDetail(err.message || '');
      return;
    }
    onDone();
  };

  return (
    <AuthCard icon="key" title={t('New password', 'Nouveau mot de passe')}
              text={email ? t(<>For the account <strong className="text-slate-700">{email}</strong>.</>,
                              <>Pour le compte <strong className="text-slate-700">{email}</strong>.</>) : null}>
      <form onSubmit={submit} className="mt-6 space-y-4" noValidate>
        {/* aide le gestionnaire de mots de passe du téléphone à l'enregistrer */}
        {email && <input type="email" value={email} autoComplete="username" readOnly hidden />}
        <PasswordField label={t('Choose a new password', 'Choisis un nouveau mot de passe')} value={password} onChange={setPassword}
                       autoComplete="new-password" />
        <ErrorBox error={error} detail={detail} />
        <button type="submit" disabled={busy} className={PRIMARY_BTN}>
          {busy ? t('Saving…', 'Enregistrement…') : t('Save and continue', 'Enregistrer et continuer')}
        </button>
      </form>
    </AuthCard>
  );
}

// Le nom d'un choix dans les menus de l'espace vendeur.
const optionLabel = (o, lang) => (lang === 'fr' ? o.fr : o.enLabel || cap(o.en));

const emptyDetails = {
  kind: '', material: '', colour: '', brand: '', year: '', paid: '',
  width: '', depth: '', height: '', tags: [], version: 0,
};

// Numéro de tournure tiré au hasard pour une nouvelle annonce : deux
// meubles du même type ne reçoivent pas les mêmes phrases.
const newVersion = () => Math.floor(Math.random() * 100000);

// Choisit une des tournures, toujours la même pour un même numéro de
// version et une même place dans le texte (`slot`).
function pick(options, version, slot) {
  let h = Math.imul(version | 0, 0x9e3779b1);
  for (let i = 0; i < slot.length; i++) h = Math.imul(h ^ slot.charCodeAt(i), 0x01000193);
  h ^= h >>> 15;
  return options[(h >>> 0) % options.length];
}

const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const low = (s) => s.charAt(0).toLowerCase() + s.slice(1);
const article = (word) => (/^[aeiou]/i.test(word) ? 'an' : 'a');
// « a », « a and b », « a, b and c » ; « a, b et c » en français
const joinAnd = (list, and = 'and') =>
  list.length < 2 ? list.join('') : `${list.slice(0, -1).join(', ')} ${and} ${list[list.length - 1]}`;
const fitsKind = (option, kind) => !option.for || option.for.includes(kind);

// Titre proposé tant qu'on n'en a pas tapé un, dans la langue de la
// boutique : « IKEA oak desk », « Bureau en chêne IKEA ».
function suggestTitle(d, lang) {
  const kind = KINDS.find((k) => k.en === d.kind);
  if (!kind) return '';
  const material = MATERIALS.find((m) => m.en === d.material);
  if (lang === 'fr') {
    return [kind.fr, material && `en ${low(material.fr)}`, d.brand.trim()].filter(Boolean).join(' ');
  }
  return cap([d.brand.trim(), material && (material.adj || material.en), kind.en].filter(Boolean).join(' '));
}

// Les deux titres et les deux descriptions qu'on aurait écrits tout seuls :
// tant que le texte de l'annonce est l'un d'eux, il suit les choix (même
// après avoir changé la langue de la boutique).
const autoTitles = (d) => LANGS.map((lang) => suggestTitle(d, lang));
const autoTexts = (item, d) => LANGS.map((lang) => describeItem(item, d, lang));

function describeItem(item, d, lang) {
  return lang === 'fr' ? describeItemFr(item, d) : describeItemEn(item, d);
}

// Ex. : « A white oak desk from IKEA. Turns any corner into a home office.
// Size: 120 × 60 × 75 cm (W × D × H). Good to know: it has drawers. I paid
// 1.200 kr for it new, so you save 63%. Well looked after and in very good
// condition. Please note: a small stain. It fits in a normal car. »
function describeItemEn(item, d) {
  const kind = KINDS.find((k) => k.en === d.kind);
  const material = MATERIALS.find((m) => m.en === d.material);
  const brand = d.brand.trim();
  const from = brand ? ` from ${brand}` : '';
  const say = (options, slot) => pick(options, d.version, slot);
  const picked = (list) => list.filter((o) => d.tags.includes(o.en) && fitsKind(o, d.kind)).map((o) => o.en);
  const sentences = [];

  // Ce que c'est.
  const look = [d.colour, material && material.en].filter(Boolean).join(' ');
  if (kind && (look || brand)) {
    const thing = [d.colour, material && (material.adj || material.en), kind.en].filter(Boolean).join(' ');
    const openers = [`${cap(thing)}${from}.`, `${cap(article(thing))} ${thing}${from}.`];
    if (brand) openers.push(`${brand} ${thing}.`);
    if (look) openers.push(`${cap(kind.en)} in ${look}${from}.`);
    sentences.push(say(openers, 'open'));
  } else if (!kind && (item.title || '').trim() && (look || brand)) {
    // Pas de type choisi : on part du titre de l'annonce.
    sentences.push(`${item.title.trim()}${look ? ` in ${look}` : ''}${from}.`);
  }

  // À quoi il sert.
  if (kind) sentences.push(say(kind.uses, 'use'));

  const long = kind && kind.long;
  const sizes = [['wide', 'W', d.width], [long ? 'long' : 'deep', long ? 'L' : 'D', d.depth], ['high', 'H', d.height]]
    .map(([word, letter, v]) => ({ word, letter, v: String(v || '').replace(/[^\d.,]/g, '') }))
    .filter((s) => s.v);
  if (sizes.length) {
    const options = [`It measures ${joinAnd(sizes.map((s) => `${s.v} cm ${s.word}`))}.`];
    if (sizes.length > 1) {
      options.push(`Size: ${sizes.map((s) => s.v).join(' × ')} cm (${sizes.map((s) => s.letter).join(' × ')}).`);
    }
    sentences.push(say(options, 'size'));
  }

  const features = picked(FEATURES);
  if (features.length) {
    const list = joinAnd(features);
    sentences.push(say([`It ${list}.`, `Good to know: it ${list}.`, `Bonus: it ${list}.`], 'features'));
  }

  // L'âge et le prix neuf font voir la bonne affaire.
  const year = parseInt(d.year, 10);
  const thisYear = new Date().getFullYear();
  if (year >= 1950 && year <= thisYear) {
    sentences.push(year === thisYear
      ? say(['Bought this year.', 'I bought it earlier this year.'], 'year')
      : say([`Bought in ${year}.`, `I bought it in ${year}.`], 'year'));
  }
  const paid = priceValue(d.paid);
  const asking = priceValue(item.price);
  if (paid > 0) {
    const off = asking > 0 && asking < paid ? Math.round((1 - asking / paid) * 100) : 0;
    sentences.push(off >= 10
      ? say([`I paid ${fmtKr(paid)} for it new, so you save ${off}%.`,
             `It cost ${fmtKr(paid)} new: you pay ${off}% less.`], 'paid')
      : say([`It cost ${fmtKr(paid)} new.`, `I paid ${fmtKr(paid)} for it new.`], 'paid'));
  }

  const condition = CONDITIONS.find((c) => c.en === item.condition);
  if (condition) sentences.push(say(condition.sentences, 'condition'));

  const flaws = picked(FLAWS);
  if (flaws.length) {
    const list = joinAnd(flaws);
    sentences.push(say([`Please note: ${list}.`, `To be upfront, it has ${list}.`], 'flaws'));
  }

  const home = picked(HOME);
  if (home.length) {
    sentences.push(say([`From a ${home.join(', ')} home.`, `It comes from a ${joinAnd(home)} home.`], 'home'));
  }

  sentences.push(...picked(PICKUP));

  return sentences.join(' ');
}

// La même chose en français. Les mots s'accordent avec le type de meuble :
// « Une table blanche en chêne de chez IKEA. […] Elle est déjà démontée,
// donc facile à transporter. » Sans type choisi, on parle au masculin.
function describeItemFr(item, d) {
  const kind = KINDS.find((k) => k.en === d.kind);
  const material = MATERIALS.find((m) => m.en === d.material);
  const colour = COLOURS.find((c) => c.en === d.colour);
  const fem = !!(kind && kind.f);
  const g = (m, f) => (fem ? f : m);
  const il = g('il', 'elle');
  const brand = d.brand.trim();
  const from = brand ? ` de chez ${brand}` : '';
  const mat = material ? ` en ${low(material.fr)}` : '';
  const say = (options, slot) => pick(options, d.version, slot);
  const picked = (list) => list.filter((o) => d.tags.includes(o.en) && fitsKind(o, d.kind))
    .map((o) => (typeof o.frText === 'function' ? o.frText(g) : o.frText));
  const sentences = [];

  // Ce que c'est.
  if (kind && (colour || material || brand)) {
    const noun = low(kind.fr);
    const col = colour ? ` ${fem ? colour.ff : low(colour.fr)}` : '';
    const thing = `${noun}${col}${mat}`;
    const openers = [`${cap(thing)}${from}.`, `${g('Un', 'Une')} ${thing}${from}.`];
    if (brand) openers.push(`${cap(noun)} ${brand}${col}${mat}.`);
    sentences.push(say(openers, 'open'));
  } else if (!kind && (item.title || '').trim() && (colour || material || brand)) {
    // Pas de type choisi : on part du titre de l'annonce.
    sentences.push(`${item.title.trim()}${colour ? `, coloris ${low(colour.fr)}` : ''}${mat}${from}.`);
  }

  // À quoi il sert.
  if (kind) sentences.push(say(kind.usesFr, 'use'));

  const long = kind && kind.long;
  const sizes = [['largeur', 'l', d.width], [long ? 'longueur' : 'profondeur', long ? 'L' : 'P', d.depth], ['hauteur', 'H', d.height]]
    .map(([word, letter, v]) => ({ word, letter, v: String(v || '').replace(/[^\d.,]/g, '') }))
    .filter((s) => s.v);
  if (sizes.length) {
    const options = [`${cap(il)} mesure ${joinAnd(sizes.map((s) => `${s.v} cm de ${s.word}`), 'et')}.`];
    if (sizes.length > 1) {
      options.push(`Dimensions : ${sizes.map((s) => s.v).join(' × ')} cm (${sizes.map((s) => s.letter).join(' × ')}).`);
    }
    sentences.push(say(options, 'size'));
  }

  const features = picked(FEATURES);
  if (features.length) {
    const list = joinAnd(features, 'et');
    sentences.push(say([`${cap(il)} ${list}.`, `Bon à savoir : ${il} ${list}.`, `En plus, ${il} ${list}.`], 'features'));
  }

  // L'âge et le prix neuf font voir la bonne affaire.
  const year = parseInt(d.year, 10);
  const thisYear = new Date().getFullYear();
  if (year >= 1950 && year <= thisYear) {
    sentences.push(year === thisYear
      ? say([`${g('Acheté', 'Achetée')} cette année.`, `Je l’ai ${g('acheté', 'achetée')} plus tôt cette année.`], 'year')
      : say([`${g('Acheté', 'Achetée')} en ${year}.`, `Je l’ai ${g('acheté', 'achetée')} en ${year}.`], 'year'));
  }
  const paid = priceValue(d.paid);
  const asking = priceValue(item.price);
  if (paid > 0) {
    const off = asking > 0 && asking < paid ? Math.round((1 - asking / paid) * 100) : 0;
    sentences.push(off >= 10
      ? say([`Prix neuf : ${fmtKr(paid)}, vous économisez ${off} %.`,
             `${cap(il)} coûtait ${fmtKr(paid)} ${g('neuf', 'neuve')} : vous payez ${off} % de moins.`], 'paid')
      : say([`Prix neuf : ${fmtKr(paid)}.`, `Je l’ai ${g('payé', 'payée')} ${fmtKr(paid)} ${g('neuf', 'neuve')}.`], 'paid'));
  }

  const condition = CONDITIONS.find((c) => c.en === item.condition);
  if (condition) sentences.push(say(condition.frSentences(g), 'condition'));

  const flaws = picked(FLAWS);
  if (flaws.length) {
    const list = joinAnd(flaws, 'et');
    sentences.push(say([`À noter : ${list}.`, `Pour être honnête, ${il} a ${list}.`], 'flaws'));
  }

  const home = picked(HOME);
  if (home.length) {
    const list = joinAnd(home, 'et');
    sentences.push(say([`Logement ${list}.`, `${cap(il)} vient d’un logement ${list}.`], 'home'));
  }

  sentences.push(...picked(PICKUP));

  return sentences.join(' ');
}

/* --------------------- objectif de vente (3000 kr) ------------------ */

function GoalProgress({ items }) {
  const t = useT();
  // Compté par exemplaire : 2 lits à 450 kr, c'est 900 kr et 2 meubles.
  // Le vendu compte ce qui a été vraiment encaissé (prix négociés compris).
  const sum = (qty) => items.reduce((total, i) => total + priceValue(i.price) * qty(i), 0);
  const units = (qty) => items.reduce((total, i) => total + qty(i), 0);
  const soldCount = units(soldQty);
  const listedCount = units(leftQty);
  const soldTotal = items.reduce((total, i) => total + soldAmount(i), 0);
  const listedTotal = sum(leftQty);
  // Écart avec les prix affichés des meubles vendus : négatif = remises.
  const haggled = soldTotal - sum(soldQty);
  const missing = Math.max(0, SALES_GOAL - soldTotal);
  const pct = (n) => Math.min(100, (n / SALES_GOAL) * 100);
  const reached = soldTotal >= SALES_GOAL;

  const bar = (label, count, total, fill, track, note) => (
    <div>
      <div className="flex items-baseline justify-between gap-3 mb-1.5">
        <span className="text-sm text-slate-600">
          {label} <span className="text-slate-400">· {count} {t(`item${count > 1 ? 's' : ''}`, `meuble${count > 1 ? 's' : ''}`)}</span>
        </span>
        <span className="text-sm font-semibold tabular-nums">{fmtKr(total)}</span>
      </div>
      <div className={`h-3 rounded-full overflow-hidden ${track}`}>
        <div className={`h-full rounded-full ${fill} transition-all duration-500`}
             style={{ width: `${pct(total)}%` }} />
      </div>
      <p className="text-xs text-slate-500 mt-1.5">{note}</p>
    </div>
  );

  return (
    <section className="border border-blue-200 rounded-xl bg-blue-50 px-5 py-5 mb-8">
      <div className="flex items-baseline justify-between gap-3 flex-wrap mb-5">
        <h2 className="display font-bold text-lg">{t('Goal:', 'Objectif :')} {fmtKr(SALES_GOAL)}</h2>
        <span className={`text-sm font-semibold ${reached ? 'text-green-700' : 'text-blue-800'}`}>
          {reached ? t('Goal reached 🎉', 'Objectif atteint 🎉') : t(`${fmtKr(missing)} to go`, `Il manque ${fmtKr(missing)}`)}
        </span>
      </div>

      <div className="space-y-5">
        {bar(t('Sold', 'Vendu'), soldCount, soldTotal, 'bg-blue-700', 'bg-blue-100',
          `${t(`${Math.round(pct(soldTotal))}% of the goal`, `${Math.round(pct(soldTotal))} % de l’objectif`)}${Math.round(haggled)
            ? ` · ${haggled < 0 ? '−' : '+'}${fmtKr(Math.abs(haggled))} ${t('compared with listed prices (haggling)', 'par rapport aux prix affichés (négociations)')}`
            : ''}`)}
        {bar(t('For sale', 'En vente'), listedCount, listedTotal, 'bg-blue-400', 'bg-blue-100',
          listedTotal + soldTotal >= SALES_GOAL
            ? t(`Selling everything would bring ${fmtKr(soldTotal + listedTotal)}, the goal is within reach.`,
                `Tout vendre rapporterait ${fmtKr(soldTotal + listedTotal)}, l’objectif est atteignable.`)
            : t(`Even selling everything (${fmtKr(soldTotal + listedTotal)}), you would still be ${fmtKr(SALES_GOAL - soldTotal - listedTotal)} short.`,
                `Même en vendant tout (${fmtKr(soldTotal + listedTotal)}), il manquerait ${fmtKr(SALES_GOAL - soldTotal - listedTotal)}.`))}
      </div>
    </section>
  );
}

// Photos d'une annonce. La première est la couverture : c'est elle qu'on
// voit dans la liste, sur l'affiche et à la réservation.
function PhotosEditor({ photos, onChange, state, manyPhotos, pushToast }) {
  const t = useT();
  const fileRef = useRef(null);
  const [adding, setAdding] = useState(false);
  const locked = adding || state === 'loading';

  const onFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = ''; // pour pouvoir reprendre la même photo après l'avoir retirée
    if (!files.length) return;
    const room = MAX_PHOTOS - photos.length;
    if (files.length > room) pushToast(t(`${MAX_PHOTOS} photos at most per item.`, `${MAX_PHOTOS} photos maximum par meuble.`));
    setAdding(true);
    const added = [];
    for (const file of files.slice(0, Math.max(0, room))) {
      try { added.push(await resizeImage(file)); }
      catch { pushToast(t(`Unreadable photo: ${file.name}`, `Photo illisible : ${file.name}`)); }
    }
    setAdding(false);
    onChange([...photos, ...added]);
  };
  const toFront = (i) => onChange([photos[i], ...photos.filter((_, j) => j !== i)]);
  const remove = (i) => onChange(photos.filter((_, j) => j !== i));

  return (
    <div className="mt-4">
      <span className="text-sm text-slate-600">Photos</span>
      <span className="text-xs text-slate-500">
        {' · '}{t(`the first one is the cover, ${MAX_PHOTOS} at most`, `la première sert de couverture, ${MAX_PHOTOS} au plus`)}
      </span>
      <div className="mt-1 flex flex-wrap gap-2">
        {photos.map((src, i) => (
          <div key={i} className="relative w-24 h-20 rounded-lg overflow-hidden border border-slate-200 bg-white">
            <img src={src} alt="" className="w-full h-full object-cover" />
            {i === 0 ? (
              <span className="absolute bottom-0 inset-x-0 bg-blue-700/90 text-white text-[11px] font-semibold text-center py-0.5">
                {t('Cover', 'Couverture')}
              </span>
            ) : (
              <button type="button" onClick={() => toFront(i)} disabled={locked}
                      className="absolute bottom-0 inset-x-0 bg-black/55 hover:bg-blue-700/90 text-white text-[11px] font-semibold py-0.5">
                {t('Make 1st', 'Mettre en 1re')}
              </button>
            )}
            <button type="button" onClick={() => remove(i)} disabled={locked} aria-label={t('Remove photo', 'Retirer la photo')}
                    className="absolute top-1 right-1 w-6 h-6 rounded-full bg-white/90 shadow text-slate-600 hover:text-red-600 flex items-center justify-center">
              <Icon name="x" className="w-3.5 h-3.5" />
            </button>
          </div>
        ))}
        {state === 'loading' && (
          <div className="w-24 h-20 rounded-lg bg-white border border-slate-200 animate-pulse flex items-center justify-center text-[11px] text-slate-400">
            {t('Loading…', 'Chargement…')}
          </div>
        )}
        {photos.length < MAX_PHOTOS && (
          <button type="button" onClick={() => fileRef.current && fileRef.current.click()} disabled={locked}
                  className="w-24 h-20 rounded-lg border-2 border-dashed border-blue-200 bg-white text-blue-700 text-xs font-semibold flex flex-col items-center justify-center gap-1 hover:border-blue-400 disabled:opacity-60">
            <Icon name={adding ? 'refresh' : 'plus'} className={`w-5 h-5 ${adding ? 'animate-spin' : ''}`} />
            {adding ? t('Adding…', 'Ajout…') : photos.length ? t('Add', 'Ajouter') : t('Add photos', 'Ajouter des photos')}
          </button>
        )}
      </div>
      <input ref={fileRef} type="file" accept="image/*" multiple onChange={onFiles} className="hidden" />
      {!manyPhotos && photos.length > 1 && (
        <p className="mt-2 text-xs text-amber-900 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
          {t(<>Only the cover will be saved until <code>migration-photos.sql</code> has been
               run in Supabase (SQL Editor) and the page refreshed.</>,
             <>Seule la couverture sera enregistrée tant que <code>migration-photos.sql</code> n’a pas été
               lancé dans Supabase (SQL Editor), puis la page actualisée.</>)}
        </p>
      )}
      {state === 'failed' && (
        <p className="mt-1 text-xs text-slate-500">
          {t('The other photos of this item could not be loaded: they stay as they are.',
             'Les autres photos de ce meuble n’ont pas pu être chargées : elles restent telles quelles.')}
        </p>
      )}
    </div>
  );
}

// Ce qu'il faut écrire dans `items` quand `n` exemplaires sont vendus.
// `prices` : prix en kr de ceux qui viennent de partir, un par exemplaire
// (le prix affiché pour ceux qui manquent). Tout vendu : l'annonce quitte
// la boutique. null si un prix négocié ne peut pas être gardé, faute
// d'avoir lancé migration-prix-vente.sql. `unreserve` : combien de ceux qui
// partent étaient réservés hors boutique (« Vendu » sous la réservation).
function soldPatch(item, n, prices = [], unreserve = 0) {
  const total = totalQty(item);
  const sold_qty = Math.max(0, Math.min(total, n));
  const status = sold_qty >= total ? 'sold' : 'available';
  // Sans migration-quantite.sql, seul le statut existe.
  const patch = 'sold_qty' in item ? { status, sold_qty } : { status };
  // Des exemplaires en plus : leurs prix s'ajoutent ; en moins : les
  // derniers prix notés s'en vont.
  const listed = priceValue(item.price);
  const added = sold_qty - soldQty(item);
  if ('sale_prices' in item) {
    const noted = salePrices(item);
    patch.sale_prices = added > 0
      ? [...noted, ...Array.from({ length: added }, (_, i) => (i < prices.length ? prices[i] : listed))]
      : noted.slice(0, sold_qty);
  } else if (prices.some((p) => p !== listed)) return null;
  // Jamais plus d'exemplaires réservés qu'il n'en reste (migration-lots.sql).
  if ('reserved_qty' in item) {
    patch.reserved_qty = Math.max(0, Math.min(total - sold_qty, reservedQty(item) - unreserve));
  }
  return patch;
}

// Au moment de marquer un meuble (ou un exemplaire) vendu : au prix
// affiché, ou au prix obtenu après négociation. `count` exemplaires
// partent ensemble (rendez-vous pour 2 lits) : le montant est pour tous.
// `onConfirm` reçoit le montant en kr et renvoie true si la vente est
// enregistrée. `discount` : remise du lot en %, pour un meuble vendu en lot.
function SalePrompt({ item, count = 1, discount = 0, onConfirm, onCancel }) {
  const t = useT();
  const pct = cleanDiscount(discount);
  const listed = afterDiscount(priceValue(item.price) * count, pct);
  const detailed = (count > 1 || pct > 0) && listed > 0;
  const canHaggle = 'sale_prices' in item;
  const [other, setOther] = useState(false);
  const [price, setPrice] = useState('');
  const [busy, setBusy] = useState(false);
  const valid = !other || /\d/.test(price);

  const submit = async (e) => {
    e.preventDefault();
    if (!valid) return;
    setBusy(true);
    const done = await onConfirm(other ? priceValue(price) : listed);
    setBusy(false);
    if (done) onCancel();
  };

  return (
    <form onSubmit={submit} className="mt-3 border border-blue-200 bg-blue-50 rounded-xl px-4 py-3 text-sm">
      <p className="font-semibold">
        {count > 1 ? t(`What price did the ${count} sell for?`, `Les ${count} sont vendus à quel prix ?`)
          : totalQty(item) > 1 ? t('What price did this one sell for?', 'Cet exemplaire est vendu à quel prix ?')
          : t('What price did it sell for?', 'Vendu à quel prix ?')}
      </p>
      <label className="mt-2 flex items-center gap-2 cursor-pointer">
        <input type="radio" checked={!other} onChange={() => setOther(false)} className="w-4 h-4 accent-blue-700" />
        <span>
          {pct > 0 ? t('At the bundle price:', 'Au prix du lot :') : t('At the listed price:', 'Au prix affiché :')}{' '}
          <strong>{detailed ? fmtKr(listed) : withKr(item.price) || t('free', 'gratuit')}</strong>
          {detailed && (
            <span className="text-slate-500">
              {' '}({count > 1 ? `${count} × ` : ''}{withKr(item.price)}{pct > 0 ? `, ${pctText(pct, t.lang)}` : ''})
            </span>
          )}
        </span>
      </label>
      <div className={`mt-2 flex flex-wrap items-center gap-2 ${canHaggle ? '' : 'text-slate-400'}`}>
        <label className={`flex items-center gap-2 ${canHaggle ? 'cursor-pointer' : ''}`}>
          <input type="radio" checked={other} disabled={!canHaggle} onChange={() => setOther(true)}
                 className="w-4 h-4 accent-blue-700" />
          {count > 1 ? t('Another amount, in total (haggled)', 'À un autre montant, en tout (négocié)')
                     : t('Another price (haggled)', 'À un autre prix (négocié)')}
        </label>
        <span className="flex items-center border border-slate-200 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-400">
          <input value={price} disabled={!canHaggle} onFocus={() => setOther(true)}
                 onChange={(e) => { setPrice(e.target.value); setOther(true); }}
                 inputMode="decimal" placeholder={listed ? String(Math.round(listed)) : '0'}
                 aria-label={t('Haggled sale price', 'Prix de vente négocié')}
                 className="w-20 rounded-lg px-2 py-1.5 bg-transparent outline-none" />
          <span className="pr-2 text-slate-500">kr</span>
        </span>
      </div>
      {!canHaggle && (
        <p className="mt-1 text-xs text-slate-500">
          {t(<>To note another price, first run <code className="bg-white px-1 rounded">migration-prix-vente.sql</code> in Supabase.</>,
             <>Pour noter un autre prix, lance d’abord <code className="bg-white px-1 rounded">migration-prix-vente.sql</code> dans Supabase.</>)}
        </p>
      )}
      <div className="mt-3 flex gap-2">
        <button type="submit" disabled={busy || !valid}
                className="font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg px-4 py-2">
          {busy ? t('Saving…', 'Enregistrement…') : t('Confirm the sale', 'Confirmer la vente')}
        </button>
        <button type="button" onClick={onCancel} className="text-slate-600 hover:text-slate-900 px-3">{t('Cancel', 'Annuler')}</button>
      </div>
    </form>
  );
}

// Sous une ligne de la liste vendeur : les photos de ce meuble, une par une
// ou toutes d'un coup. Sur téléphone, un .zip ne va pas dans la galerie :
// on passe par le menu de partage (« Enregistrer les images »).
function PhotoDownload({ item, manyPhotos, pushToast, onClose }) {
  const t = useT();
  const [photos, setPhotos] = useState(null); // [{ file, url }], null pendant le chargement
  const [failed, setFailed] = useState(false);
  const [zipping, setZipping] = useState(false);

  useEffect(() => {
    let live = true;
    let urls = [];
    setPhotos(null);
    setFailed(false);
    itemPhotoFiles(item, manyPhotos)
      .then((files) => {
        if (!live) return;
        urls = files.map((file) => URL.createObjectURL(file));
        setPhotos(files.map((file, i) => ({ file, url: urls[i] })));
      })
      .catch(() => { if (live) setFailed(true); });
    return () => { live = false; urls.forEach((u) => URL.revokeObjectURL(u)); };
  }, [item.id, item.image, manyPhotos]);

  const files = photos ? photos.map((p) => p.file) : [];
  const phone = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  const canShare = phone && files.length > 0 && !!navigator.canShare && navigator.canShare({ files });

  const share = () => navigator.share({ files, title: item.title })
    .catch((e) => { if (e.name !== 'AbortError') pushToast(t('Could not share: tap the photos one by one.', 'Partage impossible : touche les photos une par une.')); });

  const downloadAll = async () => {
    if (files.length === 1) return saveFile(files[0], files[0].name);
    setZipping(true);
    try {
      saveFile(await makeZip(files.map((file) => ({ path: file.name, file }))), `${fileSlug(item.title)}.zip`);
    } catch {
      pushToast(t('Download failed, try again.', 'Téléchargement impossible, réessaie.'));
    }
    setZipping(false);
  };

  return (
    <div className="mt-3 border border-blue-200 bg-blue-50 rounded-xl px-4 py-3 text-sm">
      <p className="font-semibold">{t('Photos of this item', 'Photos de ce meuble')}</p>
      {failed ? (
        <p className="mt-1 text-slate-600">{t('The photos could not be loaded. Close and try again.', 'Les photos n’ont pas pu être chargées. Ferme et réessaie.')}</p>
      ) : !photos ? (
        <p className="mt-1 text-slate-500">{t('Loading photos…', 'Chargement des photos…')}</p>
      ) : (
        <>
          <p className="mt-0.5 text-xs text-slate-500">{t('Tap a photo to download just that one.', 'Touche une photo pour la télécharger seule.')}</p>
          <div className="mt-2 flex flex-wrap gap-2">
            {photos.map(({ file, url }, i) => (
              <a key={url} href={url} download={file.name} title={t(`Download ${file.name}`, `Télécharger ${file.name}`)}
                 className="block w-20 h-16 rounded-lg overflow-hidden border border-blue-100 bg-white hover:ring-2 hover:ring-blue-400">
                <img src={url} alt={`Photo ${i + 1}`} className="w-full h-full object-cover" />
              </a>
            ))}
          </div>
        </>
      )}
      <div className="mt-3 flex flex-wrap gap-2">
        {canShare && (
          <button onClick={share}
                  className="font-semibold bg-blue-700 hover:bg-blue-800 text-white rounded-lg px-4 py-2">
            {t('Save to phone', 'Enregistrer sur le téléphone')}
          </button>
        )}
        {photos && photos.length > 0 && (
          <button onClick={downloadAll} disabled={zipping}
                  className={canShare
                    ? 'border border-slate-200 bg-white rounded-lg px-4 py-2 hover:border-blue-400 hover:text-blue-700'
                    : 'font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg px-4 py-2'}>
            {zipping ? t('Preparing…', 'Préparation…')
              : photos.length > 1 ? t('Download all (.zip)', 'Tout télécharger (.zip)') : t('Download', 'Télécharger')}
          </button>
        )}
        <button onClick={onClose} className="text-slate-600 hover:text-slate-900 px-3">{t('Close', 'Fermer')}</button>
      </div>
      {canShare && (
        <p className="mt-2 text-xs text-slate-500">
          {t('Then choose “Save images” to find them in your gallery.',
             'Puis choisis « Enregistrer les images » pour les retrouver dans ta galerie.')}
        </p>
      )}
    </div>
  );
}

// Ligne de la liste vendeur : « vendu 400 kr (affiché 450 kr) », « 2 vendus 900 kr ».
function soldNote(item, t) {
  const n = soldQty(item);
  const got = soldAmount(item);
  const listed = priceValue(item.price) * n;
  if (!got && !listed) return n > 1 ? t(`${n} given away`, `${n} donnés`) : t('given away', 'donné');
  const diff = Math.round(got) !== Math.round(listed) ? ` (${t('listed', 'affiché')} ${fmtKr(listed)})` : '';
  return `${n > 1 ? t(`${n} sold`, `${n} vendus`) : t('sold', 'vendu')} ${fmtKr(got)}${diff}`;
}

// Sous un rendez-vous vendu : « Vendu 400 kr (affiché 450 kr) ».
// Vendu dans un lot : comparé au prix du lot.
function saleNote(b, item, t) {
  if (b.sale_price == null) return t('Sold', 'Vendu');
  const got = Number(b.sale_price);
  const pct = cleanDiscount(b.bundle_discount);
  const listed = item ? afterDiscount(priceValue(item.price) * (b.quantity || 1), pct) : got;
  if (!got && !listed) return t('Given away', 'Donné');
  const ref = pct > 0 ? t('bundle price', 'prix du lot') : t('listed', 'affiché');
  return `${t('Sold', 'Vendu')} ${fmtKr(got)}${Math.round(got) !== Math.round(listed) ? ` (${ref} ${fmtKr(listed)})` : ''}`;
}

// Exemplaires d'un meuble retenus par un rendez-vous de la boutique pas
// encore noté vendu ou invendu.
const heldQty = (item, bookings) => bookings
  .filter((b) => String(b.item_id) === String(item.id) && isPending(b))
  .reduce((n, b) => n + (b.quantity || 1), 0);

// Pourquoi un meuble en vente n'est plus dans la boutique :
// « réservé par Marie, rdv le 02/11 à 14:00 ».
function heldNote(item, bookings, t) {
  const held = bookings.filter((b) => String(b.item_id) === String(item.id) && isPending(b));
  const names = held.map((b) => b.first_name).join(', ');
  if (held.length > 1) return t(`held by ${names}`, `réservé par ${names}`);
  const b = held[0];
  if (!b) return null;
  const d = String(b.day);
  const date = `${d.slice(8, 10)}/${d.slice(5, 7)}`;
  return b.quantity > 1
    ? t(`${b.quantity} held by ${names}, viewing on ${date} at ${b.slot}`, `${b.quantity} réservés par ${names}, rdv le ${date} à ${b.slot}`)
    : t(`held by ${names}, viewing on ${date} at ${b.slot}`, `réservé par ${names}, rdv le ${date} à ${b.slot}`);
}

function ItemsPanel({ items, setItems, bundles, manyPhotos, bookings, photoCounts, setPhotoCounts, pushToast }) {
  const t = useT();
  // Titres et descriptions s'écrivent dans la langue des acheteurs.
  const shopLang = useShopLang();
  const inShopLang = shopLang === 'fr' ? t('in French', 'en français') : t('in English', 'en anglais');
  const [form, setForm] = useState(emptyForm);
  const [open, setOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  // Meuble dont on est en train de noter la vente (encadré « à quel prix ? ») :
  // son id, ou `r` + son id pour « Vendu » sous la réservation.
  const [selling, setSelling] = useState(null);
  // Meuble dont les photos sont ouvertes pour les télécharger.
  const [photosOf, setPhotosOf] = useState(null);
  const [zipping, setZipping] = useState(false);
  // Choix qui servent à écrire la description (type, couleur, défauts…).
  const [details, setDetails] = useState(emptyDetails);
  // Texte remplacé par « Reformuler », pour pouvoir revenir en arrière.
  const [beforeRewrite, setBeforeRewrite] = useState(null);
  // Photos en plus de l'annonce ouverte : 'loading' tant qu'elles arrivent,
  // 'failed' si elles n'ont pas pu être lues (on n'y touche pas alors).
  const [photoState, setPhotoState] = useState('ready');
  // Numéro du dernier formulaire ouvert : une réponse qui arrive après
  // qu'on en a ouvert un autre est ignorée.
  const photoRequest = useRef(0);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  // Le champ prix se tape sans « kr », il est rajouté à l'enregistrement.
  const openForm = (item) => {
    const f = { ...emptyForm, ...item, links: item.links || [] };
    setForm({ ...f, price: withKr(f.price).replace(/ kr$/, ''), photos: f.image ? [f.image] : [] });
    setDetails({ ...emptyDetails, version: newVersion(), ...(item.details || {}) });
    setBeforeRewrite(null);
    setOpen(true);
    const request = ++photoRequest.current;
    const loadExtras = f.id && manyPhotos;
    setPhotoState(loadExtras ? 'loading' : 'ready');
    if (!loadExtras) return;
    fetchExtraPhotos(f.id, true)
      .then((extras) => {
        if (request !== photoRequest.current) return;
        setForm((cur) => ({ ...cur, photos: [...cur.photos, ...extras] }));
        setPhotoCounts((c) => ({ ...c, [f.id]: extras.length }));
