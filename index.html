/* ------------------------------ dates ------------------------------ */
const pad = (n) => String(n).padStart(2, '0');
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => toKey(new Date());

function fmtDate(key, locale) {
  if (!key) return '';
  const [y, m, d] = String(key).slice(0, 10).split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(locale, {
    weekday: 'long', day: 'numeric', month: 'long',
  });
}

function monthDays(year, month) {
  const offset = (new Date(year, month, 1).getDay() + 6) % 7; // lundi = 0
  const total = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= total; d++) cells.push(new Date(year, month, d));
  return cells;
}

/* ------------------------------ image ------------------------------ */
function resizeImage(file, max = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('image'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('file'));
    reader.readAsDataURL(file);
  });
}

function SlotEditor({ value, onChange, pushToast, compact }) {
  const [draft, setDraft] = useState('');
  const slots = value || [];

  const add = () => {
    if (!/^\d{2}:\d{2}$/.test(draft)) return pushToast('Choisis une heure valide.');
    if (slots.includes(draft)) return pushToast('Ce créneau existe déjà.');
    onChange([...slots, draft].sort());
    setDraft('');
  };

  return (
    <div>
      <div className="flex flex-wrap gap-2">
        {slots.map((s) => (
          <span key={s} className={`inline-flex items-center gap-2 border border-blue-200 bg-blue-50 text-blue-800 rounded-lg text-sm ${compact ? 'px-2.5 py-1' : 'px-3 py-1.5'}`}>

            <button type="button" onClick={() => onChange(slots.filter((x) => x !== s))}
                    className="text-blue-400 hover:text-red-600" aria-label={`Retirer ${s}`}>

            </button>

               className="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white" />

/* ---- horaires réellement applicables à un meuble donné ------------- */
function scheduleFor(item, settings) {
  const custom = item.custom_schedule;
  const weekdays = (custom && Array.isArray(item.weekdays) ? item.weekdays : settings.weekdays) || DEFAULT_SETTINGS.weekdays;
  const slots = (custom && Array.isArray(item.slots) && item.slots.length ? item.slots : settings.slots) || FALLBACK_SLOTS;
  const from = item.available_from ? String(item.available_from).slice(0, 10) : null;
  const until = item.available_to ? String(item.available_to).slice(0, 10) : null;
  const start = from && from > todayKey() ? from : todayKey();
  return { weekdays, slots, from, until, start, closed: new Set(settings.blocked || []) };
}

function App() {
  const [route, setRoute] = useState('shop');
  const [session, setSession] = useState(null);
  const [items, setItems] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [busy, setBusy] = useState([]);
  const [bookings, setBookings] = useState([]);
  const [ready, setReady] = useState(false);
  const [toasts, setToasts] = useState([]);

  const pushToast = useCallback((text, tone) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, text, tone }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 6000);
  }, []);

  /* ---- session ---- */
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);

  /* ---- données publiques ---- */
  const loadPublic = useCallback(async () => {
    if (!sb) return setReady(true);
    const [it, st, bs] = await Promise.all([
      sb.from('items').select('*').order('created_at', { ascending: false }),
      sb.from('settings').select('*').eq('id', 1).maybeSingle(),
      sb.from('busy_slots').select('day, slot'),
    ]);
    if (it.data) setItems(it.data);
    if (st.data) setSettings({ ...DEFAULT_SETTINGS, ...st.data });
    if (bs.data) setBusy(bs.data);
    setReady(true);
  }, []);

  const loadBookings = useCallback(async () => {
    if (!sb || !session) return;
    const { data } = await sb.from('bookings').select('*').order('day').order('slot');
    if (data) setBookings(data);
  }, [session]);

  useEffect(() => { loadPublic(); }, [loadPublic]);
  useEffect(() => { loadBookings(); }, [loadBookings]);

  /* ---- alerte temps réel sur les nouveaux rendez-vous ---- */
  useEffect(() => {
    if (!sb || !session) return;
    const channel = sb
      .channel('bookings-feed')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bookings' }, (payload) => {
        const b = payload.new;
        setBookings((prev) => (prev.some((x) => x.id === b.id) ? prev : [...prev, b]));
        setBusy((prev) => [...prev, { day: b.day, slot: b.slot }]);
        pushToast(`Nouveau rendez-vous — ${b.first_name}, ${fmtDate(b.day, 'fr-FR')} à ${b.slot}`, 'new');
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [session, pushToast]);

  const newCount = bookings.filter((b) => b.status === 'new').length;

  if (!configured) {
    return (
      <div className="max-w-xl mx-auto px-5 py-24">
        <h1 className="display text-2xl font-bold">Configuration à terminer</h1>
        <p className="mt-3 text-slate-600 leading-relaxed">
          Ouvre <code className="bg-blue-50 px-1.5 py-0.5 rounded">index.html</code> et remplace
          les deux valeurs de <code className="bg-blue-50 px-1.5 py-0.5 rounded">window.CONFIG</code>{' '}
          par l’URL et la clé anon de ton projet Supabase, puis recharge la page.
        </p>
      </div>
    );
  }

  return (
    <div className="min-h-screen">
      {route === 'shop' ? (
        <Shop
          items={items}
          settings={settings}
          busy={busy}
          ready={ready}
          onAdmin={() => setRoute('admin')}
          onBooked={(row) => setBusy((prev) => [...prev, { day: row.day, slot: row.slot }])}
        />
      ) : (
        <Admin
          session={session}
          items={items}
          setItems={setItems}
          bookings={bookings}
          setBookings={setBookings}
          settings={settings}
          setSettings={setSettings}
          newCount={newCount}
          reload={() => { loadPublic(); loadBookings(); }}
          pushToast={pushToast}
          onShop={() => setRoute('shop')}
        />
      )}

      <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 w-80 max-w-[calc(100vw-2rem)]">
        {toasts.map((t) => (
          <div key={t.id}
               className={`rounded-lg px-4 py-3 text-sm shadow-lg border flex items-start gap-2 ${
                 t.tone === 'new' ? 'bg-blue-700 text-white border-blue-800'
                                  : 'bg-white text-slate-800 border-slate-200'}`}>
            <Icon name="bell" className="w-4 h-4 mt-0.5 shrink-0" />
            <span>{t.text}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

  const isOpen = (d, k) =>
    plan.weekdays[(d.getDay() + 6) % 7] &&
    !plan.closed.has(k) &&
    k >= plan.start &&
    (!plan.until || k <= plan.until);

  const submit = async () => {
    if (!day || !slot) return setError('Pick a day and a time first.');
    if (firstName.trim().length < 2) return setError('Please enter your first name.');
    if (phone.replace(/\D/g, '').length < 6) return setError('Please enter a valid phone number.');
    if (taken.has(`${day} ${slot}`)) return setError('That slot was just taken, please pick another one.');
    setError('');
    setSending(true);
    const row = {
      item_id: item.id,
      item_title: item.title,
      first_name: firstName.trim(),
      phone: phone.trim(),
      day,
      slot,
      status: 'new',
    };
    const { error: err } = await sb.from('bookings').insert(row);
    setSending(false);
    if (err) return setError('Something went wrong. Please try again.');
    onConfirm(row);
    setDone(row);
  };

  return (
    <div className="fixed inset-0 z-40 bg-slate-900 bg-opacity-50 flex items-start sm:items-center justify-center p-4 overflow-y-auto"
         onClick={onClose}>
      <div className="bg-white rounded-xl w-full max-w-lg my-auto shadow-xl" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-start justify-between px-6 pt-6 pb-4 border-b border-slate-100">
          <div>
            <h3 className="display font-bold text-xl">{done ? 'You’re booked' : 'Book a viewing'}</h3>
            <p className="text-sm text-slate-500 mt-0.5">{item.title}</p>
            {!done && (plan.from > todayKey() || plan.until) && (
              <p className="text-sm text-blue-700 mt-1">
                {plan.from > todayKey() && `Available from ${fmtDate(plan.from, 'en-GB')}`}
                {plan.from > todayKey() && plan.until && ' — '}
                {plan.until && `last day ${fmtDate(plan.until, 'en-GB')}`}
              </p>
            )}
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-700 p-1" aria-label="Close">
            <Icon name="x" className="w-5 h-5" />
          </button>
        </div>

        {done ? (
          <div className="px-6 py-8 text-center">
            <div className="w-12 h-12 rounded-full bg-blue-50 text-blue-700 flex items-center justify-center mx-auto mb-4">
              <Icon name="check" className="w-6 h-6" />
            </div>
            <p className="text-slate-800 leading-relaxed">
              Thanks {done.first_name} — I will send you a message to confirm your visit on{' '}
              <strong>{fmtDate(done.day, 'en-GB')}</strong> at <strong>{done.slot}</strong>.
            </p>
            <p className="text-sm text-slate-500 mt-2">I will write to you on {done.phone}.</p>
            <button onClick={onClose} className="mt-6 font-semibold bg-blue-700 hover:bg-blue-800 text-white rounded-lg px-5 py-2.5">
              Back to the list
            </button>
          </div>
        ) : (
          <div className="px-6 py-5">
            <div className="flex items-center justify-between mb-3">
              <button onClick={() => setCursor(({ y, m }) => (m === 0 ? { y: y - 1, m: 11 } : { y, m: m - 1 }))}
                      className="p-1.5 rounded hover:bg-blue-50 text-blue-700" aria-label="Previous month">
                <Icon name="left" className="w-5 h-5" />
              </button>
              <span className="font-semibold">
                {new Date(cursor.y, cursor.m, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}
              </span>
              <button onClick={() => setCursor(({ y, m }) => (m === 11 ? { y: y + 1, m: 0 } : { y, m: m + 1 }))}
                      className="p-1.5 rounded hover:bg-blue-50 text-blue-700" aria-label="Next month">
                <Icon name="right" className="w-5 h-5" />
              </button>
            </div>

            <div className="grid grid-cols-7 gap-1 text-center text-xs text-slate-400 mb-1">
              {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => <div key={d} className="py-1">{d}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-1">
              {cells.map((d, i) => {
                if (!d) return <div key={i} />;
                const k = toKey(d);
                const off = !isOpen(d, k);
                const on = k === day;
                return (
                  <button key={i} disabled={off}
                          onClick={() => { setDay(k); setSlot(null); }}
                          className={`h-10 rounded-lg text-sm ${
                            off ? 'text-slate-300 cursor-not-allowed'
                                : on ? 'bg-blue-700 text-white font-semibold'
                                     : 'hover:bg-blue-50 text-slate-700'}`}>
                    {d.getDate()}
                  </button>
                );
              })}
            </div>

            {day && (
              <div className="mt-5">
                <p className="text-sm text-slate-500 mb-2">Times on {fmtDate(day, 'en-GB')}</p>
                <div className="flex flex-wrap gap-2">
                  {slots.map((s) => {
                    const full = taken.has(`${day} ${s}`);
                    const on = slot === s;
                    return (
                      <button key={s} disabled={full} onClick={() => setSlot(s)}
                              className={`px-3 py-2 rounded-lg text-sm border ${
                                full ? 'border-slate-100 text-slate-300 line-through cursor-not-allowed'
                                     : on ? 'bg-blue-700 border-blue-700 text-white'
                                          : 'border-blue-200 text-blue-800 hover:bg-blue-50'}`}>
                        {s}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            <div className="mt-5 grid sm:grid-cols-2 gap-3">
              <label className="block">
                <span className="text-sm text-slate-600">First name</span>
                <input value={firstName} onChange={(e) => setFirstName(e.target.value)}
                       className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2" placeholder="Marie" />
              </label>
              <label className="block">
                <span className="text-sm text-slate-600">Phone number</span>
                <input value={phone} onChange={(e) => setPhone(e.target.value)} inputMode="tel"
                       className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2" placeholder="+45 12 34 56 78" />
              </label>
            </div>

            {error && <p className="mt-3 text-sm text-red-600">{error}</p>}

            <button onClick={submit} disabled={sending}
                    className="mt-5 w-full font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg py-3">
              {sending ? 'Booking…' : 'Confirm booking'}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function authErrorMessage(err) {
  const m = String((err && err.message) || '').toLowerCase();
  if (m.includes('email not confirmed'))
    return 'Le compte existe mais n’est pas confirmé. Dans Supabase : Authentication > Users, ouvre l’utilisateur et confirme-le, ou supprime-le et recrée-le en cochant « Auto Confirm User ».';
  if (m.includes('invalid login credentials'))
    return 'E-mail ou mot de passe incorrect. Attention : ce n’est pas le mot de passe de la base de données, mais celui du compte créé dans Authentication > Users.';
  if (m.includes('failed to fetch') || m.includes('networkerror') || m.includes('load failed'))
    return 'Supabase est injoignable. Vérifie l’URL du projet dans index.html.';
  if (m.includes('api key') || m.includes('apikey') || m.includes('jwt'))
    return 'Clé anon invalide. Recopie-la depuis Project Settings > Data API.';
  if (m.includes('rate') || m.includes('too many'))
    return 'Trop de tentatives. Attends une minute avant de réessayer.';
  if (m.includes('disabled') || m.includes('not enabled'))
    return 'La connexion par e-mail est désactivée. Active-la dans Authentication > Sign In / Providers > Email.';
  return 'Connexion impossible.';
}

function Login({ onShop }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [detail, setDetail] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setError('');
    setDetail('');
    setBusy(true);
    const { error: err } = await sb.auth.signInWithPassword({
      email: email.trim().toLowerCase(),
      password,
    });
    setBusy(false);
    if (err) {
      setError(authErrorMessage(err));
      setDetail(err.message || '');
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-5">
      <div className="w-full max-w-sm">
        <h1 className="display font-bold text-2xl mb-1">Espace vendeur</h1>
        <p className="text-slate-500 text-sm mb-6">
          Connecte-toi pour gérer les annonces, les rendez-vous et le planning.
        </p>
        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
               autoComplete="username"
               className="w-full border border-slate-200 rounded-lg px-3 py-2.5" placeholder="Adresse e-mail" />
        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)}
               onKeyDown={(e) => e.key === 'Enter' && submit()} autoComplete="current-password"
               className="mt-3 w-full border border-slate-200 rounded-lg px-3 py-2.5" placeholder="Mot de passe" />
        {error && (
          <div className="mt-3 border border-red-200 bg-red-50 rounded-lg px-3 py-2.5">
            <p className="text-sm text-red-700 leading-relaxed">{error}</p>
            {detail && <p className="mt-1 text-xs text-red-400 break-words">Message technique : {detail}</p>}
          </div>
        )}
        <button onClick={submit} disabled={busy}
                className="mt-4 w-full font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg py-2.5">
          {busy ? 'Connexion…' : 'Se connecter'}
        </button>
        <button onClick={onShop} className="mt-4 w-full text-sm text-slate-500 hover:text-blue-700">
          Retour à la boutique
        </button>
      </div>
    </div>
  );
}

const emptyForm = {
  id: null, title: '', price: '', condition: '', description: '',
  links: [], image: null, status: 'available',
  available_from: '', available_to: '', custom_schedule: false, weekdays: null, slots: null,
};

function ItemsPanel({ items, setItems, pushToast }) {
  const [form, setForm] = useState(emptyForm);
  const [open, setOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const submit = async () => {
    if (!form.title.trim()) return pushToast('Il manque le titre de l’annonce.');
    setBusy(true);
    const payload = {
      title: form.title.trim(),
      price: form.price.trim(),
      condition: form.condition.trim(),
      description: form.description.trim(),
      links: (form.links || []).filter((l) => l.label.trim() && l.url.trim()),
      image: form.image,
      status: form.status || 'available',
      available_from: form.available_from || null,
      available_to: form.available_to || null,
      custom_schedule: !!form.custom_schedule,
      weekdays: form.custom_schedule ? (form.weekdays || DEFAULT_SETTINGS.weekdays) : null,
      slots: form.custom_schedule ? (form.slots || DEFAULT_SETTINGS.slots) : null,
    };
    let res;
    if (form.id) res = await sb.from('items').update(payload).eq('id', form.id).select().single();
    else res = await sb.from('items').insert(payload).select().single();
    setBusy(false);
    if (res.error) return pushToast('Enregistrement impossible, réessaie.');
    setItems(form.id ? items.map((i) => (i.id === form.id ? res.data : i)) : [res.data, ...items]);
    setOpen(false);
    setForm(emptyForm);
    pushToast(form.id ? 'Annonce mise à jour.' : 'Annonce publiée.');
  };

  const remove = async (item) => {
    if (!window.confirm(`Supprimer « ${item.title} » ? Cette action est définitive.`)) return;
    const { error } = await sb.from('items').delete().eq('id', item.id);
    if (error) return pushToast('Suppression impossible.');
    setItems(items.filter((i) => i.id !== item.id));
    pushToast('Annonce supprimée.');
  };

  const toggleSold = async (item) => {
    const status = item.status === 'sold' ? 'available' : 'sold';
    const { error } = await sb.from('items').update({ status }).eq('id', item.id);
    if (error) return pushToast('Mise à jour impossible.');
    setItems(items.map((i) => (i.id === item.id ? { ...i, status } : i)));
    pushToast(status === 'sold' ? 'Marquée comme vendue : retirée de la boutique.' : 'Remise en vente.');
  };

  const onFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try { set('image', await resizeImage(file)); }
    catch { pushToast('Photo illisible, essaie une autre image.'); }
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <p className="text-slate-500 text-sm">{items.length} meuble{items.length > 1 ? 's' : ''} enregistré{items.length > 1 ? 's' : ''}</p>
        <button onClick={() => { setForm(emptyForm); setOpen(true); }}
                className="inline-flex items-center gap-2 font-semibold bg-blue-700 hover:bg-blue-800 text-white rounded-lg px-4 py-2.5 text-sm">
          <Icon name="plus" className="w-4 h-4" /> Ajouter un meuble
        </button>
      </div>

      {open && (
        <div className="border border-blue-200 rounded-xl bg-blue-50 p-5 mb-8">
          <h2 className="display font-bold text-lg mb-4">{form.id ? 'Modifier l’annonce' : 'Nouvelle annonce'}</h2>

          <div className="grid sm:grid-cols-3 gap-3">
            <label className="block sm:col-span-2">
              <span className="text-sm text-slate-600">Titre</span>
              <input value={form.title} onChange={(e) => set('title', e.target.value)}
                     className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" placeholder="Bureau en chêne" />
            </label>
            <label className="block">
              <span className="text-sm text-slate-600">Prix</span>
              <input value={form.price} onChange={(e) => set('price', e.target.value)}
                     className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" placeholder="450 kr" />
            </label>
          </div>

          <label className="block mt-3">
            <span className="text-sm text-slate-600">État (affiché en anglais)</span>
            <input value={form.condition} onChange={(e) => set('condition', e.target.value)}
                   className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white" placeholder="Very good" />
          </label>

          <label className="block mt-3">
            <span className="text-sm text-slate-600">Description (affichée en anglais)</span>
            <textarea value={form.description} onChange={(e) => set('description', e.target.value)} rows={3}
                      className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 bg-white"
                      placeholder="Solid oak desk, 120 × 60 cm. Two drawers, one small scratch on the left side." />
          </label>

          <div className="mt-4">
            <span className="text-sm text-slate-600">Photo</span>
            <div className="mt-1 flex items-center gap-3">
              <button onClick={() => fileRef.current && fileRef.current.click()}
                      className="inline-flex items-center gap-2 border border-slate-200 bg-white rounded-lg px-3 py-2 text-sm hover:border-blue-400">
                <Icon name="image" className="w-4 h-4 text-blue-700" /> Choisir une image
              </button>
              <input ref={fileRef} type="file" accept="image/*" onChange={onFile} className="hidden" />
              {form.image && (
                <div className="flex items-center gap-2">

                </div>

            </div>
          </div>

          <div className="mt-5 border-t border-blue-200 pt-4">

              </label>
              <label className="block">
                <span className="text-sm text-slate-600">Dernier jour possible</span>
                <input type="date" value={form.available_to || ''}

            </div>

            <label className="mt-3 flex items-center gap-2 text-sm text-slate-700">
              <input type="checkbox" checked={!!form.custom_schedule}

                       slots: f.slots || [...DEFAULT_SETTINGS.slots],
                     }))}
                     className="w-4 h-4 accent-blue-700" />
              Jours et créneaux différents pour ce meuble
            </label>

            {form.custom_schedule && (
              <div className="mt-3 space-y-4 border border-blue-200 rounded-lg bg-white p-4">
                <div>
                  <span className="text-sm text-slate-600">Jours</span>
                  <div className="mt-2">
                    <WeekdayPicker compact value={form.weekdays || DEFAULT_SETTINGS.weekdays}
                                   onChange={(w) => set('weekdays', w)} />
                  </div>
                </div>
                <div>
                  <span className="text-sm text-slate-600">Créneaux</span>
                  <div className="mt-2">
                    <SlotEditor compact value={form.slots || DEFAULT_SETTINGS.slots}
                                onChange={(s) => set('slots', s)} pushToast={pushToast} />
                  </div>
                </div>
              </div>
            )}
          </div>

          <div className="mt-4">
            <span className="text-sm text-slate-600">Liens vers les autres sites</span>
            <div className="mt-1 space-y-2">
              {(form.links || []).map((l, idx) => (
                <div key={idx} className="flex gap-2">
                  <input value={l.label}
                         onChange={(e) => { const links = [...form.links]; links[idx] = { ...l, label: e.target.value }; set('links', links); }}
                         className="w-44 border border-slate-200 rounded-lg px-3 py-2 bg-white text-sm" placeholder="Facebook Marketplace" />
                  <input value={l.url}
                         onChange={(e) => { const links = [...form.links]; links[idx] = { ...l, url: e.target.value }; set('links', links); }}
                         className="flex-1 border border-slate-200 rounded-lg px-3 py-2 bg-white text-sm" placeholder="https://…" />
                  <button onClick={() => set('links', form.links.filter((_, i) => i !== idx))}
                          className="px-2 text-slate-400 hover:text-red-600" aria-label="Retirer le lien">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
              ))}
            </div>
            <div className="mt-2 flex flex-wrap gap-2">
              {LINK_PRESETS.map((p) => (
                <button key={p} onClick={() => set('links', [...(form.links || []), { label: p, url: '' }])}
                        className="text-xs border border-blue-200 text-blue-800 rounded-full px-3 py-1 hover:bg-white">
                  + {p}
                </button>
              ))}
            </div>
          </div>

          <div className="mt-5 flex gap-2">
            <button onClick={submit} disabled={busy}
                    className="font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg px-5 py-2.5 text-sm">
              {busy ? 'Enregistrement…' : form.id ? 'Enregistrer les modifications' : 'Publier l’annonce'}
            </button>
            <button onClick={() => { setOpen(false); setForm(emptyForm); }} className="text-sm text-slate-600 hover:text-slate-900 px-4">
              Annuler
            </button>
          </div>
        </div>
      )}

      {items.length === 0 ? (
        <div className="border border-dashed border-blue-200 rounded-xl px-6 py-12 text-center text-slate-600">
          Aucun meuble pour l’instant. Ajoute ton premier objet pour ouvrir la boutique.
        </div>
      ) : (
        <ul className="divide-y divide-slate-100 border-t border-slate-100">
          {items.map((item) => (
            <li key={item.id} className="py-4 flex items-center gap-4">
              <div className="w-20 h-16 rounded-lg bg-blue-50 border border-blue-100 overflow-hidden shrink-0 flex items-center justify-center">
                {item.image ? <img src={item.image} alt="" className="w-full h-full object-cover" />
                            : <Icon name="image" className="w-5 h-5 text-blue-200" />}
              </div>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className={`font-semibold ${item.status === 'sold' ? 'text-slate-400 line-through' : ''}`}>{item.title}</span>
                  <span className="text-blue-700 text-sm">{item.price}</span>
                  {item.status === 'sold' && <span className="text-xs bg-slate-100 text-slate-600 rounded-full px-2 py-0.5">Vendu</span>}
                </div>
                <p className="text-xs text-slate-500 mt-1 truncate">
                  {[
                    item.available_from && String(item.available_from).slice(0, 10) > todayKey()
                      ? `à partir du ${String(item.available_from).slice(8, 10)}/${String(item.available_from).slice(5, 7)}`
                      : null,
                    item.available_to ? `jusqu’au ${String(item.available_to).slice(8, 10)}/${String(item.available_to).slice(5, 7)}` : null,
                    item.custom_schedule ? 'horaires propres' : null,
                    Array.isArray(item.links) && item.links.length ? item.links.map((l) => l.label).join(', ') : null,
                  ].filter(Boolean).join(' · ')}
                </p>
              </div>
              <div className="flex items-center gap-1 shrink-0">
                <button onClick={() => toggleSold(item)}
                        className="text-xs border border-slate-200 rounded-lg px-3 py-1.5 hover:border-blue-400 hover:text-blue-700">
                  {item.status === 'sold' ? 'Remettre en vente' : 'Vendu ailleurs'}
                </button>
                <button onClick={() => { setForm({ ...emptyForm, ...item, links: item.links || [] }); setOpen(true); }}
                        className="p-2 text-slate-500 hover:text-blue-700 rounded-lg hover:bg-blue-50" aria-label="Modifier">
                  <Icon name="pencil" className="w-4 h-4" />
                </button>
                <button onClick={() => remove(item)}
                        className="p-2 text-slate-500 hover:text-red-600 rounded-lg hover:bg-red-50" aria-label="Supprimer">
                  <Icon name="trash" className="w-4 h-4" />
                </button>
              </div>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

function BookingsPanel({ bookings, setBookings, pushToast }) {
  const [filter, setFilter] = useState('all');

  const update = async (id, status) => {
    const { error } = await sb.from('bookings').update({ status }).eq('id', id);
    if (error) return pushToast('Mise à jour impossible.');
    setBookings(bookings.map((b) => (b.id === id ? { ...b, status } : b)));
    pushToast(status === 'confirmed' ? 'Rendez-vous confirmé.' : 'Rendez-vous refusé, le créneau est libéré.');
  };

  const remove = async (id) => {
    if (!window.confirm('Supprimer ce rendez-vous ?')) return;
    const { error } = await sb.from('bookings').delete().eq('id', id);
    if (error) return pushToast('Suppression impossible.');
    setBookings(bookings.filter((b) => b.id !== id));
  };

  const markAllSeen = async () => {
    const ids = bookings.filter((b) => b.status === 'new').map((b) => b.id);
    if (!ids.length) return;
    await sb.from('bookings').update({ status: 'seen' }).in('id', ids);
    setBookings(bookings.map((b) => (b.status === 'new' ? { ...b, status: 'seen' } : b)));
  };

  const sorted = [...bookings].sort((a, b) => `${a.day} ${a.slot}`.localeCompare(`${b.day} ${b.slot}`));
  const shown = filter === 'all' ? sorted : sorted.filter((b) => String(b.day).slice(0, 10) >= todayKey());
  const newOnes = bookings.filter((b) => b.status === 'new').length;

  const labels = {
    new: ['Nouveau', 'bg-blue-700 text-white'],
    seen: ['Vu', 'bg-slate-100 text-slate-600'],
    confirmed: ['Confirmé', 'bg-blue-50 text-blue-800'],
    declined: ['Refusé', 'bg-slate-100 text-slate-400'],
  };

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div className="flex gap-2">
          {[['all', 'Tous'], ['upcoming', 'À venir']].map(([id, label]) => (
            <button key={id} onClick={() => setFilter(id)}
                    className={`text-sm rounded-lg px-3 py-1.5 border ${
                      filter === id ? 'border-blue-700 text-blue-800 bg-blue-50' : 'border-slate-200 text-slate-600'}`}>
              {label}
            </button>
          ))}
        </div>
        {newOnes > 0 && (
          <button onClick={markAllSeen} className="text-sm text-blue-700 hover:underline">Marquer tout comme lu</button>
        )}
      </div>

      {shown.length === 0 ? (
        <div className="border border-dashed border-blue-200 rounded-xl px-6 py-12 text-center text-slate-600">
          Aucun rendez-vous pour l’instant. Les demandes arrivent ici dès qu’un acheteur réserve un créneau.
        </div>
      ) : (
        <ul className="space-y-3">
          {shown.map((b) => {
            const [label, cls] = labels[b.status] || labels.seen;
            return (
              <li key={b.id} className={`border rounded-xl px-4 py-4 ${b.status === 'new' ? 'border-blue-300 bg-blue-50' : 'border-slate-200'}`}>
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="inline-flex items-center gap-1.5 font-semibold">
                        <Icon name="user" className="w-4 h-4 text-blue-700" /> {b.first_name}
                      </span>
                      <span className={`text-xs rounded-full px-2 py-0.5 ${cls}`}>{label}</span>
                    </div>
                    <p className="mt-1.5 text-sm text-slate-600 flex flex-wrap items-center gap-x-4 gap-y-1">
                      <a href={`tel:${String(b.phone).replace(/\s/g, '')}`} className="inline-flex items-center gap-1.5 text-blue-700 hover:underline">
                        <Icon name="phone" className="w-3.5 h-3.5" /> {b.phone}
                      </a>
                      <span className="inline-flex items-center gap-1.5">
                        <Icon name="calendar" className="w-3.5 h-3.5" /> {fmtDate(b.day, 'fr-FR')}
                      </span>
                      <span className="inline-flex items-center gap-1.5">
                        <Icon name="clock" className="w-3.5 h-3.5" /> {b.slot}
                      </span>
                    </p>
                    <p className="mt-1 text-sm text-slate-500">Pour : {b.item_title}</p>
                  </div>

                  <div className="flex items-center gap-1">
                    {b.status !== 'confirmed' && (
                      <button onClick={() => update(b.id, 'confirmed')}
                              className="inline-flex items-center gap-1.5 text-sm bg-blue-700 hover:bg-blue-800 text-white rounded-lg px-3 py-1.5">
                        <Icon name="check" className="w-4 h-4" /> Confirmer
                      </button>
                    )}
                    {b.status !== 'declined' && (
                      <button onClick={() => update(b.id, 'declined')}
                              className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 text-slate-600 hover:border-slate-400">
                        Refuser
                      </button>
                    )}
                    <button onClick={() => remove(b.id)} className="p-2 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50" aria-label="Supprimer">
                      <Icon name="trash" className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
}

function PlanningPanel({ settings, setSettings, bookings, pushToast }) {
  const settingsJSON = JSON.stringify({ ...DEFAULT_SETTINGS, ...settings });
  const [draft, setDraft] = useState(JSON.parse(settingsJSON));
  const [saving, setSaving] = useState(false);
  const now = new Date();
  const [cursor, setCursor] = useState({ y: now.getFullYear(), m: now.getMonth() });

  useEffect(() => { setDraft(JSON.parse(settingsJSON)); }, [settingsJSON]);

  const dirty = JSON.stringify(draft) !== settingsJSON;
  const set = (k, v) => setDraft((d) => ({ ...d, [k]: v }));

  const busyDates = new Set(bookings.filter((b) => b.status !== 'declined').map((b) => String(b.day).slice(0, 10)));
  const blocked = new Set(draft.blocked || []);
  const cells = monthDays(cursor.y, cursor.m);
  const tKey = todayKey();

  const toggleClosed = (k) => set('blocked', blocked.has(k) ? draft.blocked.filter((x) => x !== k) : [...draft.blocked, k]);

  const submit = async () => {
    setSaving(true);
    const payload = {
      address: draft.address, payment: draft.payment,
      weekdays: draft.weekdays, slots: draft.slots, blocked: draft.blocked,
    };
    const { error } = await sb.from('settings').update(payload).eq('id', 1);
    setSaving(false);
    if (error) return pushToast('Enregistrement impossible.');
    setSettings({ ...DEFAULT_SETTINGS, ...payload, id: 1 });
    pushToast('Planning enregistré.');
  };

  return (
    <div className="space-y-8 pb-24">
      <div className="border border-blue-100 bg-blue-50 rounded-xl px-4 py-3 text-sm text-blue-900">
        Ce planning s’applique par défaut à tous les meubles. Un meuble peut avoir ses
        propres dates et horaires depuis l’onglet Annonces.
      </div>

      <section>
        <h2 className="display font-bold text-lg">Jours où tu peux recevoir</h2>
        <p className="text-sm text-slate-500 mt-0.5">Les jours décochés n’apparaissent pas dans le calendrier des acheteurs.</p>
        <div className="mt-3">
          <WeekdayPicker value={draft.weekdays} onChange={(w) => set('weekdays', w)} />
        </div>
      </section>

      <section>
        <h2 className="display font-bold text-lg">Créneaux proposés</h2>
        <p className="text-sm text-slate-500 mt-0.5">Un créneau déjà réservé se barre automatiquement chez l’acheteur.</p>
        <div className="mt-3">
          <SlotEditor value={draft.slots} onChange={(s) => set('slots', s)} pushToast={pushToast} />
        </div>
      </section>

      <section>
        <h2 className="display font-bold text-lg">Jours fermés</h2>
        <p className="text-sm text-slate-500 mt-0.5">Clique une date pour la fermer : vacances, examens, journée de déménagement.</p>
        <div className="mt-3 max-w-sm border border-slate-200 rounded-xl p-4">
          <div className="flex items-center justify-between mb-3">
            <button onClick={() => setCursor(({ y, m }) => (m === 0 ? { y: y - 1, m: 11 } : { y, m: m - 1 }))}
                    className="p-1.5 rounded hover:bg-blue-50 text-blue-700" aria-label="Mois précédent">
              <Icon name="left" className="w-5 h-5" />
            </button>
            <span className="font-semibold">
              {new Date(cursor.y, cursor.m, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}
            </span>
            <button onClick={() => setCursor(({ y, m }) => (m === 11 ? { y: y + 1, m: 0 } : { y, m: m + 1 }))}
                    className="p-1.5 rounded hover:bg-blue-50 text-blue-700" aria-label="Mois suivant">
              <Icon name="right" className="w-5 h-5" />
            </button>
          </div>
          <div className="grid grid-cols-7 gap-1 text-center text-xs text-slate-400 mb-1">
            {['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((d, i) => <div key={i} className="py-1">{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const k = toKey(d);
              const past = k < tKey;
              const off = blocked.has(k) || !draft.weekdays[(d.getDay() + 6) % 7];
              const hasRdv = busyDates.has(k);
              return (
                <button key={i} disabled={past} onClick={() => toggleClosed(k)}
                        title={hasRdv ? 'Un rendez-vous est déjà pris ce jour-là' : undefined}
                        className={`h-10 rounded-lg text-sm relative ${
                          past ? 'text-slate-200 cursor-not-allowed'
                               : off ? 'bg-slate-100 text-slate-400 line-through'
                                     : 'hover:bg-blue-50 text-slate-700'}`}>
                  {d.getDate()}
                  {hasRdv && !past && <span className="absolute bottom-1 left-1/2 -ml-0.5 w-1 h-1 rounded-full bg-blue-700" />}
                </button>
              );
            })}
          </div>
          <p className="mt-3 text-xs text-slate-500 flex items-center gap-1.5">
            <span className="w-1.5 h-1.5 rounded-full bg-blue-700 inline-block" />
            Un point bleu signale un rendez-vous déjà pris.
          </p>
        </div>
      </section>

      <section>
        <h2 className="display font-bold text-lg">Lieu de retrait et paiement</h2>
        <div className="mt-3 grid sm:grid-cols-2 gap-3 max-w-2xl">
          <label className="block">
            <span className="text-sm text-slate-600">Adresse affichée sur la carte</span>
            <input value={draft.address || ''} onChange={(e) => set('address', e.target.value)}
                   className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2" placeholder="Alfavej 510, 13" />
          </label>
          <label className="block">
            <span className="text-sm text-slate-600">Paiement (affiché en anglais)</span>
            <input value={draft.payment || ''} onChange={(e) => set('payment', e.target.value)}
                   className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2" placeholder="Revolut transfer or MobilePay" />
          </label>
        </div>
      </section>

      {dirty && (
        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-5 py-3">
          <div className="max-w-5xl mx-auto flex items-center justify-between gap-4">
            <span className="text-sm text-slate-600 inline-flex items-center gap-2">
              <Icon name="alert" className="w-4 h-4 text-blue-700" /> Modifications non enregistrées
            </span>
            <div className="flex gap-2">
              <button onClick={() => setDraft(JSON.parse(settingsJSON))} className="text-sm text-slate-600 hover:text-slate-900 px-3">
                Annuler
              </button>
              <button onClick={submit} disabled={saving}
                      className="font-semibold bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white rounded-lg px-5 py-2.5 text-sm">
                {saving ? 'Enregistrement…' : 'Enregistrer le planning'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
